    function openShareImage() {
      var stats = shareCardStats(state.votes && state.votes.votes);
      var record = {
        stats: stats, dataUrl: '', blob: null, file: null,
        mode: 'fallback', error: null, status: 'ready',
        width: SHARE_CARD_W, height: SHARE_CARD_H
      };
      state.shareImage = record;
      var canvas;
      try {
        canvas = drawShareCard(stats);
        record.dataUrl = canvas.toDataURL('image/png');
        record.width = canvas.width;
        record.height = canvas.height;
      } catch (err) {
        record.error = (err && err.message) || 'render failed';
        console.warn('Share-as-image render failed:', record.error);
        renderShareImagePanel();
        return;
      }
      if (!canvas.toBlob) {
        record.error = 'toBlob unavailable';
        console.warn('Share-as-image render failed:', record.error);
        renderShareImagePanel();
        return;
      }
      canvas.toBlob(function (blob) {
        if (!blob) {
          record.error = 'canvas produced no image';
          console.warn('Share-as-image render failed:', record.error);
          renderShareImagePanel();
          return;
        }
        record.blob = blob;
        try {
          record.file = new File([blob], SHARE_CARD_FILE, { type: 'image/png' });
        } catch (err) {
          record.error = (err && err.message) || 'could not build file';
          console.warn('Share-as-image render failed:', record.error);
          renderShareImagePanel();
          return;
        }
        record.mode = resolveShareImageMode(record.file);
        renderShareImagePanel();
        if (record.mode === 'sheet') startShareImageSheet();
      }, 'image/png');
    }

    // Native share sheet, called inside the tap's user activation. The demo
    // ?shareimg=sheet pin marks the sheet state even where navigator.share
    // is absent (headless checks), the way ?share=copy fakes its confirm.
    function startShareImageSheet() {
      var record = state.shareImage;
      if (!record || !record.file) return;
      record.status = 'sheet';
      renderShareImagePanel();
      if (typeof navigator.share !== 'function') return;
      navigator.share({ files: [record.file], title: 'My votes on Vote Inbox' })
        .catch(function (err) {
          // Dismissing the sheet is the user's choice: say nothing.
          if (err && err.name === 'AbortError') return;
          record.mode = 'fallback';
          record.status = 'ready';
          renderShareImagePanel();
        });
    }

    function downloadShareImage() {
      var record = state.shareImage;
      if (!record || !record.blob) return;
      var url = URL.createObjectURL(record.blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = SHARE_CARD_FILE;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 0);
      record.status = 'downloaded';
      renderShareImagePanel();
    }

    // Staging demo hook: ?tap-shareimg=1|share|download|copy taps the
    // Share-as-image button once the votes tab has rendered, then that panel
    // action once the preview has rendered — the real controls, through the
    // real delegated click handler. Demo only; one-shot.
    var tapShareImgDone = false;
    function maybeTapShareImage() {
      if (!DEMO || !TAP_SHAREIMG || tapShareImgDone) return;
      if (!state.votes) return;
      tapShareImgDone = true;
      var openBtn = document.querySelector('[data-shareimg-open]');
      if (!openBtn) return;
      openBtn.click();
      if (TAP_SHAREIMG === '1') return;
      waitFor('[data-share-card] [data-shareimg-' + TAP_SHAREIMG + ']', function (btn) {
        btn.click();
      });
    }

    // ------------------------------------------------------------------
    // Weekly digest. Worked out in the browser from the same loaded vote
    // history the list below shows (state.votes.votes), so the numbers can
    // never disagree with the list and follow the viewer's own time zone.
    // A week is the calendar week starting Monday; last week is the one
    // before. The streak counts consecutive weeks with at least one vote
    // ending with this one, so it is zero (and left out of the card) until
    // you vote this week.
    // ------------------------------------------------------------------

    var DIGEST_DAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var DIGEST_TILE = 'rounded-xl bg-zinc-100 px-2.5 py-2 text-xs text-zinc-600 dark:bg-zinc-800/60 dark:text-zinc-300';
    var DIGEST_NUM = 'text-lg font-bold leading-none text-zinc-900 dark:text-zinc-100';

    // Local midnight of the Monday of the week the date falls in.
    function weekStart(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)).getTime();
    }

    function isThisWeek(iso, now) {
      if (!iso) return false;
      var t = Date.parse(iso);
      if (isNaN(t)) return false;
      return weekStart(new Date(t)) === weekStart(now || new Date());
    }

    // One pass over the history rows: this week's votes, how many of them
    // are on proposals that have since merged (the same status rule the
    // summary line uses), last week's count, the streak, the per-day counts
    // for the chart and the top apps. Rows without a usable timestamp are
    // ignored — the digest never invents a week for them.
    function weeklyDigest(rows, now) {
      var WEEK = 7 * 24 * 3600 * 1000;
      var ws = weekStart(now);
      var week = [];
      var lastWeek = 0;
      var weeks = {};
      var byDay = [0, 0, 0, 0, 0, 0, 0];
      var byApp = {};
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        if (!r || !r.created_at) continue;
        var t = Date.parse(r.created_at);
        if (isNaN(t)) continue;
        var d = new Date(t);
        var k = weekStart(d);
        weeks[k] = true;
        if (k === ws) {
          week.push(r);
          byDay[(d.getDay() + 6) % 7]++;
          var slug = r.app_slug || '';
          if (slug) {
            if (!byApp[slug]) byApp[slug] = { slug: slug, name: r.app_name || slug, count: 0 };
            byApp[slug].count++;
          }
        } else if (k === ws - WEEK) {
          lastWeek++;
        }
      }
      var merged = 0;
      for (i = 0; i < week.length; i++) {
        if (week[i].status === 'merged') merged++;
      }
      var streak = 0;
      if (week.length) {
        streak = 1;
        var k2 = ws - WEEK;
        while (weeks[k2]) { streak++; k2 -= WEEK; }
      }
      var apps = [];
      for (var s in byApp) {
        if (Object.prototype.hasOwnProperty.call(byApp, s)) apps.push(byApp[s]);
      }
      apps.sort(function (a, b) {
        return b.count - a.count || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
      });
      return {
        week: week.length,
        merged: merged,
        lastWeek: lastWeek,
        streak: streak,
        apps: apps.slice(0, 3),
        days: byDay,
      };
    }

    function renderDigest() {
      var el = document.getElementById('votes-digest');
      if (!el) return;
      var votes = state.votes && state.votes.votes;
      var show = state.tab === 'votes' && !state.membersView && !state.errorVotes
        && votes && votes.length;
      if (!show) {
        el.hidden = true;
        el.innerHTML = '';
        return;
      }
      var d = weeklyDigest(votes, new Date());
      var compare = d.week > d.lastWeek ? 'Up from ' + d.lastWeek + ' last week'
        : d.week < d.lastWeek ? 'Down from ' + d.lastWeek + ' last week'
        : 'Same as last week';
      var html = '<section data-weekly-digest class="' + CARD_CLASS + '">'
        + '<div class="flex items-baseline justify-between gap-2">'
        + '<h2 class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">Weekly digest</h2>'
        + '<span class="text-xs text-zinc-500 dark:text-zinc-400">This week</span>'
        + '</div>'
        + '<div class="grid grid-cols-3 gap-2">'
        + '<div data-digest-week-count="' + d.week + '" class="' + DIGEST_TILE + '">'
        + '<span class="' + DIGEST_NUM + '">' + d.week + '</span> '
        + (d.week === 1 ? 'vote this week' : 'votes this week') + '</div>'
        + '<div data-digest-merged="' + d.merged + '" class="' + DIGEST_TILE + '">'
        + (d.merged
           ? '<span class="' + DIGEST_NUM + '">' + d.merged + '</span> merged'
           : 'None merged yet') + '</div>';
      // A zero streak is left out entirely: there is no streak to show.
      if (d.streak) {
        html += '<div data-digest-streak="' + d.streak + '" class="' + DIGEST_TILE + '">'
          + '<span class="' + DIGEST_NUM + '">' + d.streak + '</span>-week streak</div>';
      }
      html += '</div>';
      if (d.apps.length) {
        html += '<div class="flex flex-wrap items-center gap-1.5">'
          + '<span class="text-xs text-zinc-500 dark:text-zinc-400">Top apps</span>'
          + '<div data-digest-apps class="flex flex-wrap items-center gap-1.5">';
        for (var i = 0; i < d.apps.length; i++) {
          var a = d.apps[i];
          html += '<span data-digest-app="' + esc(a.slug) + '" class="' + TAG_CHIP + '">'
            + esc(a.name)
            + ' <span class="' + TAG_CHIP_COUNT + '" data-digest-app-count="' + a.count + '">(' + a.count + ')</span>'
            + '</span>';
        }
        html += '</div></div>';
      } else {
        html += '<p data-digest-apps-empty class="text-xs text-zinc-500 dark:text-zinc-400">No votes yet this week.</p>';
      }
      html += '<p data-digest-compare class="text-xs text-zinc-600 dark:text-zinc-300">' + esc(compare) + '</p>';
      html += '<button type="button" data-digest-toggle aria-expanded="'
        + (state.digestOpen ? 'true' : 'false') + '" class="' + IMPACT_TOGGLE_CLASS + ' self-start">'
        + (state.digestOpen ? 'Hide details' : 'View details') + '</button>';
      if (state.digestOpen) {
        var max = 0;
        for (i = 0; i < d.days.length; i++) {
          if (d.days[i] > max) max = d.days[i];
        }
        var todayIdx = (new Date().getDay() + 6) % 7;
        html += '<div data-digest-chart class="grid grid-cols-7 items-end gap-1.5 border-t border-zinc-200 pt-2 dark:border-zinc-800">';
        for (i = 0; i < 7; i++) {
          var n = d.days[i];
          var h = n > 0 && max > 0 ? Math.max(4, Math.round(64 * n / max)) : 0;
          var label = DIGEST_DAY_LABELS[i] + ': ' + n + (n === 1 ? ' vote' : ' votes');
          html += '<div data-digest-day="' + i + '"' + (i === todayIdx ? ' data-today' : '')
            + ' aria-label="' + esc(label) + '"'
            + ' class="flex flex-col items-center justify-end gap-1">'
            + '<div data-digest-bar data-count="' + n + '"'
            + ' class="w-full max-w-6 rounded-t bg-violet-600 dark:bg-violet-500"'
            + ' style="height:' + (n ? h : 0) + 'px"></div>'
            + '<div class="w-full max-w-6 border-b border-zinc-300 dark:border-zinc-600"></div>'
            + '<span class="text-xs text-zinc-500 dark:text-zinc-400">' + DIGEST_DAY_LABELS[i] + '</span>'
            + '</div>';
        }
        html += '</div>';
      }
      html += '</section>';
      el.className = 'pt-3';
      el.hidden = false;
      el.innerHTML = html;
    }

    // One-line summary under the header on the Watchlist tab, computed from
    // the loaded rows (no extra request): how many are starred and how many
    // show a change badge since the last look.
    function renderWatchlistSummary() {
      var el = document.getElementById('watchlist-summary');
      if (!el) return;
      var rows = state.watchlist && state.watchlist.rows;
      var total = rows ? rows.length : 0;
      // Same zero rule as the inbox and votes summaries.
      if (state.tab !== 'watchlist' || state.membersView || state.errorWatchlist
        || !state.watchlist) {
        el.hidden = true;
        return;
      }
      var updated = 0;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].changed) updated++;
      }
      el.textContent = total + ' starred, ' + updated + ' updated';
      el.hidden = false;
    }

    // One-line summary under the header on the Following tab, computed from
    // the loaded inbox (no extra request): the followed apps' open
    // proposals, and how many of them still need this person's vote. The
    // data-following-needed / data-following-apps attributes carry the
    // numbers for the declared checks.
    function renderFollowingSummary() {
      var el = document.getElementById('following-summary');
      if (!el) return;
      var proposals = state.inbox && state.inbox.proposals;
      var open = 0;
      var needed = 0;
      var apps = {};
      if (proposals) {
        for (var i = 0; i < proposals.length; i++) {
          var p = proposals[i];
          if (p.status === 'merged' || !isFollowing(p.appSlug)) continue;
          open++;
          if (!isVoted(p)) needed++;
          apps[p.appSlug] = true;
        }
      }
      if (state.tab !== 'following' || state.membersView || state.errorInbox
        || !state.follows.length || !proposals) {
        el.hidden = true;
        return;
      }
      el.textContent = open + ' open, ' + needed
        + (needed === 1 ? ' vote needed' : ' votes needed');
      el.setAttribute('data-following-needed', String(needed));
      el.setAttribute('data-following-apps', Object.keys(apps).sort().join(','));
      el.hidden = false;
    }

    // One-line summary under the header on the Saved tab, from the loaded
    // rows (no extra request): how many are bookmarked and how many are
    // already merged or closed (worth revisiting or clearing).
    function renderSavedSummary() {
      var el = document.getElementById('saved-summary');
      if (!el) return;
      var rows = state.saved && state.saved.rows;
      var total = rows ? rows.length : 0;
      // Same zero rule as the inbox and votes summaries.
      if (state.tab !== 'saved' || state.membersView || state.errorSaved
        || !state.saved) {
        el.hidden = true;
        return;
      }
      var settled = 0;
      var seen = {};
      if (state.inbox && state.inbox.proposals) {
        for (var i = 0; i < state.inbox.proposals.length; i++) {
          seen[state.inbox.proposals[i].sessionId] = state.inbox.proposals[i].status;
        }
      }
      for (var j = 0; j < rows.length; j++) {
        // Rows carry a status when the server knows one; the loaded inbox
        // fills in the rest (no extra platform calls).
        var st = rows[j].status || seen[rows[j].sessionId];
        if (st === 'merged' || st === 'closed') settled++;
      }
      el.textContent = total + ' saved, ' + settled + ' settled';
      el.hidden = false;
    }

    // One-line summary under the header while the Members directory is open,
    // computed from the loaded roster (no extra request). Without a search
    // it reads "N members · M active this week"; with one it narrows to
    // "X of N members" so the filtering is visible in the count itself.
    // Active-this-week is roster-wide, so it stays out of a filtered view.
    function renderMembersSummary() {
      var el = document.getElementById('members-summary');
      if (!el) return;
      var data = state.members && state.members.members ? state.members : null;
      if (!state.membersView || state.errorMembers || !data) {
        el.hidden = true;
        return;
      }
      var members = data.members;
      var q = state.memberQuery.trim();
      if (q) {
        var filtered = filterMembers(members, q);
        el.textContent = filtered.length + ' of ' + members.length
          + (members.length === 1 ? ' member' : ' members');
      } else {
        var active = data.activeThisWeek != null ? data.activeThisWeek : 0;
        el.textContent = members.length + (members.length === 1 ? ' member' : ' members')
          + ' · ' + active + ' active this week';
      }
      el.hidden = false;
    }

    // "Updated X ago" under the header, stamped on every successful inbox
    // load so it always reflects the most recent data fetch. Uses the same
    // relative-time wording as the proposal age chips.
    function renderUpdated() {
      var el = document.getElementById('inbox-updated');
      if (!el) return;
      if (state.tab !== 'inbox' || state.membersView || !state.inboxLoadedAt || state.compareView) {
        el.hidden = true;
        return;
      }
      el.textContent = 'Updated ' + relTime(state.inboxLoadedAt);
      el.hidden = false;
    }

    // Top-level rows that belong to the two-tab list screens only. The
    // compose screen hides them (it has its own header row and controls)
    // and the main render shows them again.
    var MAIN_CHROME_IDS = ['list-controls', 'sort-row', 'votes-order-row',
      'inbox-updated', 'inbox-summary', 'votes-summary', 'demo-banner'];

    function renderCompose() {
      for (var i = 0; i < MAIN_CHROME_IDS.length; i++) {
        var el = document.getElementById(MAIN_CHROME_IDS[i]);
        if (el) el.classList.add('hidden');
      }
      document.getElementById('view').innerHTML = composeHtml();
      if (!state.compose.sentLoaded) loadSent();
      runComposeFixtures();
    }

    function render() {
      if (state.screen === 'compose') { renderCompose(); return; }
      for (var ci = 0; ci < MAIN_CHROME_IDS.length; ci++) {
        var chrome = document.getElementById(MAIN_CHROME_IDS[ci]);
        if (chrome) chrome.classList.remove('hidden');
      }
      syncFilter();
      syncTagFilter();
      syncOneAway();
      syncSnoozedChip();
      syncSelectMode();
      renderSelectBar();
      renderTabs();
      renderViews();
      renderSavedSearches();
      renderSort();
      renderVotesOrder();
      renderLbRange();
      renderDemoBanner();
      renderRefreshButton();
      renderSummary();
      renderUnread();
      renderUpdated();
      renderVotesSummary();
      renderShareImagePanel();
      renderDigest();
      renderWatchlistSummary();
      renderFollowingSummary();
      renderSavedSummary();
      renderMembersSummary();
      var viewHtml;
      if (state.membersView) {
        viewHtml = renderMembers();
      } else if (state.tab === 'inbox' && state.compareView
          && state.compare.length === 2
          && findProposal(state.compare[0]) && findProposal(state.compare[1])) {
        viewHtml = renderCompare();
      } else if (state.tab === 'inbox') {
        viewHtml = state.detail && findProposal(state.detail) ? renderDetail() : renderInbox();
        // The compare bar sits over the list while a selection is open; it
        // yields to the compare view itself once that is on screen.
        if (state.compare.length && !state.compareView) {
          viewHtml = compareBarHtml() + viewHtml;
        }
        // Celebration cards ride above the list (and its empty states), on
        // the plain inbox list only — not the Snoozed view, the detail or
        // the compare view.
        if (!state.snoozeView && !state.detail && !state.compareView) {
          viewHtml = celebrationCardsHtml() + viewHtml;
        }
      } else if (state.tab === 'following') {
        // A proposal opened from the Following tab shows the same detail the
        // inbox would; with no proposal open, the tab's own list.
        viewHtml = state.detail && findProposal(state.detail) ? renderDetail() : renderFollowing();
      } else if (state.tab === 'votes') {
        viewHtml = renderVotes();
      } else if (state.tab === 'saved') {
        viewHtml = renderSaved();
      } else if (state.tab === 'leaderboard') {
        viewHtml = renderLeaderboard();
      } else {
        viewHtml = renderWatchlist();
      }
      document.getElementById('view').innerHTML = viewHtml;
      // The tour leads the inbox in its own slot above #view (never the
      // detail or compare views, and never another tab): it is not an
      // overlay, so the first card's vote buttons stay tappable underneath
      // it the whole time. Kept out of #view so the list's own structure
      // (first card, group containers) is untouched.
      var tourSlot = document.getElementById('tour-slot');
      if (tourSlot) {
        tourSlot.innerHTML = state.tab === 'inbox' && !state.membersView
          && !state.compareView && !(state.detail && findProposal(state.detail))
          && tourVisible()
          ? tourHtml()
          : '';
      }
      enhanceTitles();
      updateLbPin();
      if (DEMO) stampDensityBasic();
    }

    // ------------------------------------------------------------------
    // Compose data + actions
    // ------------------------------------------------------------------

    // The Sent list fills on the compose screen's first render and updates
    // its own container only (a full re-render here would reset the
    // caret in whatever field the user is typing in).
    var sentRequested = false;

    function loadSent() {
      if (sentRequested) return;
      sentRequested = true;
      api('/api/proposals').then(function (data) {
        state.compose.sent = (data && data.proposals) || [];
        state.compose.sentLoaded = true;
        state.compose.sentError = false;
        var list = document.getElementById('sent-list');
        if (list) list.innerHTML = sentListHtml();
      }).catch(function () {
        state.compose.sentLoaded = true;
        state.compose.sentError = true;
        var list = document.getElementById('sent-list');
        if (list) list.innerHTML = sentListHtml();
      });
    }

    function openCompose() {
      state.screen = 'compose';
      state.compose.error = null;
      render();
      window.scrollTo(0, 0);
    }

    // ------------------------------------------------------------------
    // Detail navigation and thread data.
    // ------------------------------------------------------------------

    function detailThreadKey() {
      var p = findProposal(state.detail);
      return p ? p.appSlug + '|' + p.sessionId : '';
    }

    function loadDetailComments() {
      var p = findProposal(state.detail);
      if (!p) return;
      var key = p.appSlug + '|' + p.sessionId;
      if (state.commentsKey === key && !state.commentsError) return;
      state.commentsKey = key;
      state.detailComments = [];
      state.commentsLoading = true;
      state.commentsError = null;
      render();
      var query = '?appSlug=' + encodeURIComponent(p.appSlug)
        + '&sessionId=' + encodeURIComponent(p.sessionId)
        + (DEMO ? '&demo=1' : '');
      api('/api/comments' + query)
        .then(function (data) {
          // The user may have navigated away while the fetch ran.
          if (detailThreadKey() !== key) return;
          state.detailComments = (data && data.comments) || [];
          state.commentsLoading = false;
          state.commentsError = null;
          render();
        })
        .catch(function (err) {
          if (detailThreadKey() !== key) return;
          state.commentsLoading = false;
          state.commentsError = err.message || 'Could not load the discussion.';
          render();
        });
    }

    function openDetail(sessionId) {
      if (!findProposal(sessionId)) return;
      // Remember where the inbox was scrolled, so Back can return to the
      // same place instead of dropping the reader at the top.
      state.detailScroll = window.scrollY || 0;
      state.detail = sessionId;
      state.replyForm = null;
      markRead(findProposal(sessionId));
      render();
      window.scrollTo(0, 0);
      loadDetailComments();
    }

    function closeDetail() {
      state.detail = '';
      state.replyForm = null;
      render();
      // Back returns to the inbox where the reader left it, not the top.
      var restored = state.detailScroll || 0;
      window.scrollTo(0, restored);
      // Carry the offset Back actually restored on <body> so checks (and
      // debugging) can read it.
      document.body.setAttribute('data-inbox-scroll', String(Math.round(window.scrollY || 0)));
    }

    // ------------------------------------------------------------------
    // Read tracking. Opening a proposal (its Discuss button, or a deep
    // link straight to it) marks it read for the signed-in account: the
    // card re-renders optimistically (dot gone, data-read set) and the row
    // is written to the per-user table so it survives reloads. Only
    // opening marks read: scrolling past, voting and starring never do.
    // A failed POST is silent — the card stays read for this session and
    // shows unread again on the next load.
    // ------------------------------------------------------------------

    function markRead(p) {
      if (!p || isRead(p)) return Promise.resolve();
      p.read = true;
      render();
      var post = api('/api/reads', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({
          sessionId: p.sessionId,
          appSlug: p.appSlug,
          demo: !!(state.inbox && state.inbox.demo),
        }),
      });
      var settled = post.catch(function () { /* silent: see above */ });
      state.readPosts[p.sessionId] = settled;
      return settled;
    }

    // Mark every loaded inbox proposal read at once — snoozed ones too,
    // since they sit in the loaded payload even though the unread count
    // leaves them out. Optimistic like markRead; a failed POST reverts
    // exactly the batch this call set, so the dots come back and the toast
    // explains what happened.
    function markAllRead() {
      var proposals = state.inbox && state.inbox.proposals;
      if (!proposals) return Promise.resolve();
      var targets = [];
      for (var i = 0; i < proposals.length; i++) {
        if (!isRead(proposals[i])) targets.push(proposals[i]);
      }
      if (!targets.length) return Promise.resolve();
      for (var j = 0; j < targets.length; j++) targets[j].read = true;
      render();
      var sessionIds = targets.map(function (p) { return p.sessionId; });
      var post = api('/api/reads/all', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({
          sessionIds: sessionIds,
          demo: !!(state.inbox && state.inbox.demo),
        }),
      });
      var settled = post.catch(function () {
        for (var k = 0; k < targets.length; k++) targets[k].read = false;
        render();
        toast('Could not mark all read. Try again.');
      });
      state.readAllPost = settled;
      return settled;
    }

    function backToMain() {
      state.screen = 'main';
      state.compose.error = null;
      render();
      window.scrollTo(0, 0);
      // A compose deep link skipped the boot fetch (nothing of the list
      // was showing), so the tab the user is now looking at loads now.
      if (state.tab === 'votes') {
        if (!state.votes && !state.loadingVotes) loadVotes(true);
      } else if (state.tab === 'watchlist') {
        if (!state.watchlist) loadWatchlist(true);
      } else if (!state.inbox && !state.loadingInbox) {
        loadInbox(true);
      }
    }

    // Picking a template refills both fields with its prefill. Switching
    // replaces whatever is there: the prefill is a starting point the user
    // edits, not something to merge.
    function pickTemplate(id) {
      var tpl = null;
      for (var i = 0; i < TEMPLATES.length; i++) {
        if (TEMPLATES[i].id === id) tpl = TEMPLATES[i];
      }
      if (!tpl) return;
      state.compose.template = tpl.id;
      state.compose.title = tpl.title;
      state.compose.body = tpl.body;
      state.compose.error = null;
      render();
    }

    function resetComposeForm() {
      state.compose.template = null;
      state.compose.title = '';
      state.compose.body = '';
      state.compose.sending = false;
      state.compose.error = null;
      state.compose.sentTitle = null;
      render();
    }

    // Keep the Send pill's disabled state in step without a re-render
    // (which would steal focus from the field being typed in).
    function updateSendPill() {
      var btn = document.querySelector('[data-send-proposal]');
      if (!btn) return;
      var c = state.compose;
      var ok = !!c.title.trim() && !!c.body.trim() && !c.sending && c.sentTitle == null;
      btn.disabled = !ok;
    }

    // Send records the composed proposal (the platform's app-facing API is
    // read-only, so the app keeps what its users compose here). Client side
    // first: both fields must be non-empty, mirroring the server.
    function sendProposal() {
      var c = state.compose;
      if (c.sending) return;
      var title = c.title.trim();
      var body = c.body.trim();
      if (!title || !body) {
        c.error = !title ? 'A title is required' : 'A description is required';
        render();
        return;
      }
      c.sending = true;
      c.error = null;
      render();
      api('/api/proposals', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ template: c.template || 'blank', title: title, body: body }),
      }).then(function (data) {
        c.sending = false;
        var row = data && data.proposal;
        c.sent = [{
          id: row ? row.id : null,
          template: row ? row.template : (c.template || 'blank'),
          title: title,
          created_at: row ? row.created_at : null,
        }].concat(c.sent || []);
        c.sentLoaded = true;
        c.sentError = false;
        c.sentTitle = title;
        render();
      }).catch(function (err) {
        c.sending = false;
        c.error = err && err.message ? err.message : 'Sending failed. Try again.';
        render();
      });
    }

    // Post a comment (parentId null) or a reply (parentId = the top-level
    // comment's id, as a string in the markup). The busy state disables the
    // submit button in place: a re-render here would wipe the form's text.
    function postThreadComment(parentId) {
      var p = findProposal(state.detail);
      if (!p || state.commentBusy) return;
      var field = document.querySelector(parentId == null ? '[data-comment-input]' : '[data-reply-input]');
      var btn = document.querySelector(parentId == null ? '[data-comment-post]' : '[data-reply-submit]');
      if (!field) return;
      var text = field.value.trim();
      if (!text) return;
      state.commentBusy = true;
      if (btn) btn.disabled = true;
      api('/api/comments', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({
          appSlug: p.appSlug,
          sessionId: p.sessionId,
          body: text,
          parentId: parentId == null ? null : Number(parentId),
          demo: !!(state.inbox && state.inbox.demo),
        }),
      }).then(function (res) {
        if (res && res.comment) state.detailComments.push(res.comment);
        state.replyForm = null;
        state.commentBusy = false;
        render();
      }).catch(function (err) {
        state.commentBusy = false;
        if (btn && document.contains(btn)) btn.disabled = false;
        toast('Could not post the comment: ' + (err.message || 'try again'));
      });
    }

    // ------------------------------------------------------------------
    // Compose check fixtures: replay one user path through the real
    // controls, the way ?tap-no=1 votes through the real vote button.
    // Demo only; runs once, at the first compose render.
    // ------------------------------------------------------------------

    var composeFixturesRan = false;

    function tapTemplateChip(id) {
      var chip = document.querySelector(
        '[data-template-option][data-template-id="' + id + '"]');
      if (!chip) return;
      chip.click(); // the real chip, through the real delegated handler
    }

    // Type into a field the way typing would: set the value, then fire the
    // input event the real keyboard produces, so state and the derived
    // bits (value mirror, counter, Send pill) update through the real path.
    function typeIntoField(el, value) {
      if (!el) return;
      el.value = value;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function runComposeFixtures() {
      if (composeFixturesRan) return;
      composeFixturesRan = true;
      if (state.screen !== 'compose' || state.compose.sentTitle != null) return;
      // Switching fixture: land on Bugfix first so there is a prefill to
      // switch away from.
      if (COMPOSE_SWITCH) tapTemplateChip('bugfix');
      if (COMPOSE_TEMPLATE) tapTemplateChip(COMPOSE_TEMPLATE);
      if (COMPOSE_TITLE) typeIntoField(document.getElementById('compose-title'), COMPOSE_TITLE);
      if (COMPOSE_BODY) typeIntoField(document.getElementById('compose-body'), COMPOSE_BODY);
      if (COMPOSE_SWITCH) tapTemplateChip(COMPOSE_SWITCH);
      if (COMPOSE_SEND) {
        var sendBtn = document.querySelector('[data-send-proposal]');
        // An empty form leaves Send disabled and does nothing here; the
        // checks use that to pin the disabled state.
        if (sendBtn && !sendBtn.disabled) sendBtn.click();
      }
      if (COMPOSE_BACK) {
        var backBtn = document.querySelector('[data-compose-back]');
        if (backBtn) backBtn.click();
      }
    }

    // ------------------------------------------------------------------
    // Data
    // ------------------------------------------------------------------

    // ------------------------------------------------------------------
    // App filter: trigger + searchable dropdown list.
    // ------------------------------------------------------------------

    var filterTrigger = document.getElementById('app-filter-trigger');
    var filterPanelEl = document.getElementById('app-filter-panel');
    var openFilter = null; // { dismiss } from the native kit, or a plain fallback
    // The open dropdown's list renderer, kept so a data reload can refresh
    // the per-app counts in place (see maybeRerenderFilter). Null while the
    // dropdown is closed.
    var activeFilterRender = null;
    // The last good app list, so an open dropdown can hold its rows (with
    // grey placeholder stats) while a refresh loads, instead of collapsing
    // to nothing. Empty until the first successful load.
    var lastFilterApps = [];

    function filterApps() {
      return (state.inbox && state.inbox.apps) || [];
    }

    // True when the proposal merged within the last seven calendar days
    // (today plus the six before it, in the viewer's own local time — the
    // same span the age groups call "This week"). Needs a usable merged
    // timestamp; a merged proposal without one counts nowhere.
    function mergedThisWeek(p) {
      if (p.status !== 'merged') return false;
      var t = p.mergedAt ? Date.parse(p.mergedAt) : NaN;
      if (isNaN(t)) return false;
      var now = new Date();
      var d = new Date(t);
      var startOfDay = function (x) {
        return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      };
      var daysBack = Math.floor((startOfDay(now) - startOfDay(d)) / (24 * 3600 * 1000));
      return daysBack >= 0 && daysBack <= 6;
    }

    // Local calendar days between today and a proposal's merge (the same
    // start-of-day arithmetic mergedThisWeek uses), or null when the
    // proposal did not merge or its merge time is unusable or in the
    // future. mergedThisWeek stays as it is.
    function mergedDaysBack(p) {
      if (p.status !== 'merged') return null;
      var t = p.mergedAt ? Date.parse(p.mergedAt) : NaN;
      if (isNaN(t)) return null;
      var now = new Date();
      var d = new Date(t);
      var startOfDay = function (x) {
        return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      };
      var daysBack = Math.floor((startOfDay(now) - startOfDay(d)) / (24 * 3600 * 1000));
      return daysBack >= 0 ? daysBack : null;
    }

    // Median time from opened to merged, as "2d" / "5h" / "<1h", or the
    // dash when there is nothing to measure (no merges in the window).
    function fmtMergeTime(ms) {
      if (ms == null) return '–';
      var H = 3600 * 1000;
      var D = 24 * H;
      if (ms >= D) return Math.round(ms / D) + 'd';
      if (ms >= H) return Math.max(1, Math.round(ms / H)) + 'h';
      return '<1h';
    }

    // Per-app stats for the filter list, tallied from the loaded inbox
    // proposals (no extra request), regardless of the current filter or the
    // Hide switches. Per app: waiting (not merged and not closed — the old
    // bracketed open count), merged this week (unchanged), a four-bucket
    // weekly merge sparkline (oldest first, so the last bucket is this
    // week and equals merged), and the median opened→merged time over the
    // proposals that merged in the trailing 30 calendar days (a merge
    // whose open time is missing or after its merge counts in the chart
    // and merged, but not in the median). Nothing to measure → null
    // median; no merges at all in the last 28 days → an empty sparkline.
    function filterStats() {
      var out = {};
      var proposals = (state.inbox && state.inbox.proposals) || [];
      for (var i = 0; i < proposals.length; i++) {
        var p = proposals[i];
        var slug = p.appSlug;
        var s = out[slug];
        if (!s) {
          s = out[slug] = { waiting: 0, merged: 0, spark: [0, 0, 0, 0], durations: [] };
        }
        if (p.status !== 'merged' && p.status !== 'closed') s.waiting++;
        if (p.status !== 'merged') continue;
        if (mergedThisWeek(p)) s.merged++;
        var daysBack = mergedDaysBack(p);
        if (daysBack == null) continue;
        if (daysBack <= 27) s.spark[3 - Math.floor(daysBack / 7)]++;
        if (daysBack > 29) continue;
        var mt = Date.parse(p.mergedAt);
        var pt = p.proposedAt ? Date.parse(p.proposedAt) : NaN;
        if (!isNaN(pt) && mt >= pt) s.durations.push(mt - pt);
      }
      for (var key in out) {
        var s2 = out[key];
        s2.durations.sort(function (a, b) { return a - b; });
        var n = s2.durations.length;
        s2.medianN = n;
        s2.median = n
          ? (n % 2
            ? s2.durations[(n - 1) / 2]
            : (s2.durations[n / 2 - 1] + s2.durations[n / 2]) / 2)
          : null;
        s2.sparkTotal = s2.spark[0] + s2.spark[1] + s2.spark[2] + s2.spark[3];
      }
      return out;
    }

    function findFilterApp(slug) {
      var apps = filterApps();
      for (var i = 0; i < apps.length; i++) {
        if (apps[i].slug === slug) return apps[i];
      }
      return null;
    }

    // Keep the trigger label in step with state.filter; drop a filter whose
    // app is no longer in the inbox (the old select did the same on fill).
    // Validation waits for inbox data: mid-refresh (state.inbox null) the
    // chosen filter survives, as it did before.
    function syncFilter() {
      var app = state.filter ? findFilterApp(state.filter) : null;
      if (state.filter && state.inbox && !app) {
        state.filter = '';
        state.filterName = '';
      } else if (state.filter && !app) {
        app = { name: state.filterName || state.filter };
      }
      document.getElementById('app-filter-label').textContent = app ? app.name : 'All apps';
      filterTrigger.className = app ? FILTER_TRIGGER_ACTIVE : FILTER_TRIGGER_IDLE;
      filterTrigger.setAttribute('aria-expanded', openFilter ? 'true' : 'false');
    }

    // Keep the chip's look in step with state.oneAway: same idle/active
    // colours as the app filter trigger, plus aria-pressed for the toggle.
    var oneAwayChip = document.getElementById('one-away-chip');

    function syncOneAway() {
      if (!oneAwayChip) return;
      oneAwayChip.className = state.oneAway ? ONE_AWAY_ACTIVE : ONE_AWAY_IDLE;
      oneAwayChip.setAttribute('aria-pressed', state.oneAway ? 'true' : 'false');
    }

    // The Snoozed chip toggles the Snoozed filter view. Same idle/active
    // colours as the other chips; aria-pressed is what the checks read.
    var snoozedChip = document.getElementById('snoozed-chip');

    function syncSnoozedChip() {
      if (!snoozedChip) return;
      snoozedChip.className = state.snoozeView ? ONE_AWAY_ACTIVE : ONE_AWAY_IDLE;
      snoozedChip.setAttribute('aria-pressed', state.snoozeView ? 'true' : 'false');
    }

    // Keep the Select chip and the bulk bar in step with select mode. The
    // counter counts every ticked card still in the loaded inbox, including
    // ones the current filter is hiding — selection survives filtering, so
    // the number must not move just because cards left the screen.
    var selectModeBtn = document.getElementById('select-mode-btn');

    function syncSelectMode() {
      if (!selectModeBtn) return;
      selectModeBtn.className = state.selectMode ? ONE_AWAY_ACTIVE : ONE_AWAY_IDLE;
      selectModeBtn.setAttribute('aria-pressed', state.selectMode ? 'true' : 'false');
    }

    function selectedCount() {
      var n = 0;
      for (var id in state.selected) {
        if (findProposal(id)) n++;
      }
      return n;
    }

    function renderSelectBar() {
      var bar = document.getElementById('select-bar');
      if (!bar) return;
      bar.hidden = !(state.tab === 'inbox' && state.selectMode);
      var n = selectedCount();
      var countEl = bar.querySelector('[data-select-count]');
      if (countEl) countEl.textContent = n + ' selected';
      var actable = n > 0 && !state.bulkBusy;
      var approveBtn = bar.querySelector('[data-bulk-approve]');
      var hideBtn = bar.querySelector('[data-bulk-hide]');
      var clearBtn = bar.querySelector('[data-bulk-clear]');
      if (approveBtn) approveBtn.disabled = !actable;
      if (hideBtn) hideBtn.disabled = !actable;
      if (clearBtn) clearBtn.disabled = n === 0 || state.bulkBusy;
    }

    // Followed apps. A real toggle button lives inside each app row of the
    // filter list (a <button> cannot nest inside the row's own <button>, so
    // app rows are divs with the option role and the row stays the pick
    // target). The star mirrors the card star's amber active treatment;
    // aria-pressed carries the state for screen readers.
    var FOLLOW_STAR_IDLE_CLASS = 'inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-zinc-300 transition-colors hover:text-zinc-500 dark:text-zinc-600 dark:hover:text-zinc-400';
    var FOLLOW_STAR_ACTIVE_CLASS = 'inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-amber-500 transition-colors hover:text-amber-600 dark:text-amber-300 dark:hover:text-amber-200';

    function isFollowing(slug) {
      return state.follows.indexOf(slug) !== -1;
    }

    function followStarHtml(slug) {
      var active = isFollowing(slug);
      return '<button type="button" data-follow-toggle data-app="' + esc(slug) + '"'
        + ' aria-pressed="' + (active ? 'true' : 'false') + '"'
        + ' aria-label="' + (active ? 'Unfollow ' + esc(slug) : 'Follow ' + esc(slug)) + '"'
        + ' class="' + (active ? FOLLOW_STAR_ACTIVE_CLASS : FOLLOW_STAR_IDLE_CLASS) + '">'
        + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="' + (active ? 'currentColor' : 'none') + '"'
        + ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M11.48 3.5a.56.56 0 0 1 1.04 0l2.13 4.46 4.9.62c.5.06.7.68.33 1.02l-3.6 3.32.92 4.85a.56.56 0 0 1-.8.6L12 16.06l-4.4 2.31a.56.56 0 0 1-.8-.6l.92-4.85-3.6-3.32a.56.56 0 0 1 .33-1.02l4.9-.62z"/></svg></button>';
    }

    // Follow / unfollow one app: updates the stored set, repaints the open
    // filter list (so the star flips in place) and re-renders (tab badges,
    // the Following tab). A slug the inbox no longer lists keeps its stored
    // entry — the set is a preference, not derived data.
    function toggleFollow(slug) {
      var list = state.follows.slice();
      var at = list.indexOf(slug);
      if (at === -1) list.push(slug);
      else list.splice(at, 1);
      state.follows = list;
      saveFollows(list);
      if (openFilter && activeFilterRender) activeFilterRender();
      render();
    }

    // The Following tab's headline count: open proposals of followed apps
    // that still need this person's vote. Null until the inbox has loaded,
    // so the tab badge stays hidden rather than reading 0 too early.
    function followingNeededCount() {
      if (!state.follows.length) return 0;
      var proposals = state.inbox && state.inbox.proposals;
      if (!proposals) return null;
      var n = 0;
      for (var i = 0; i < proposals.length; i++) {
        var p = proposals[i];
        if (p.status === 'merged') continue;
        if (!isFollowing(p.appSlug)) continue;
        if (!isVoted(p)) n++;
      }
      return n;
    }

    // Followed apps with at least one open proposal, in filter-list order.
    // Apps with nothing open are skipped here, so the Following tab never
    // renders a group for them.
    function followingAppRows() {
      var proposals = state.inbox && state.inbox.proposals;
      if (!proposals) return [];
      var apps = filterApps();
      var rows = [];
      for (var a = 0; a < apps.length; a++) {
        var app = apps[a];
        if (!isFollowing(app.slug)) continue;
        var items = [];
        for (var i = 0; i < proposals.length; i++) {
          var p = proposals[i];
          if (p.appSlug !== app.slug || p.status === 'merged') continue;
          items.push(p);
        }
        if (items.length) rows.push({ app: app, items: items });
      }
      return rows;
    }

    // One app-filter row. The "All apps" row keeps its single line; an app
    // row shows three fixed-height lines so the row's size never depends on
    // the values (the layout stays stable while the stats load): the name
    // with a tiny weekly merge sparkline beside it, the waiting / merged-
    // this-week pair, and the median time to merge over the last 30 days.
    // While the inbox reloads (loading) every value slot is a grey
    // placeholder block instead, and no stat values are emitted.
    function filterRowEl(app, selected, stats, loading) {
      var btn = app
        // App rows carry a follow star, which is a real <button> — it cannot
        // nest inside the row's own <button>, so app rows are divs with the
        // option role and the click delegation below treats them the same.
        ? document.createElement('div')
        : document.createElement('button');
      if (!app) btn.type = 'button';
      btn.setAttribute('role', 'option');
      if (!app) btn.tabIndex = 0;
      btn.setAttribute('aria-selected', selected ? 'true' : 'false');
      btn.setAttribute('data-app-option', app ? app.slug : '');
      btn.className = 'flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-sm '
        + (selected
          ? 'bg-violet-600/10 font-semibold text-violet-700 dark:bg-violet-500/20 dark:text-violet-300'
          : 'text-zinc-700 hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800');
      if (app) {
        var s = (!loading && stats && stats[app.slug]) || null;
        var waiting = s ? s.waiting : 0;
        var merged = s ? s.merged : 0;
        var placeholder = ' data-stat-placeholder class="inline-block h-4 rounded bg-zinc-200 animate-pulse dark:bg-zinc-800"';
        // Sparkline: four bars, oldest first, this week on the right (so it
        // matches the merged-this-week count). A zero week is a thin flat
        // stub; with no merges in the last four weeks the same-size box
        // holds the dash. Borrowed from the digest chart: the app's violet
        // and grey, no new colours.
        var sparkHtml;
        if (loading) {
          sparkHtml = '<span' + placeholder + ' style="width:20px"></span>';
        } else if (s && s.sparkTotal > 0) {
          var bars = '';
          var max = Math.max(s.spark[0], s.spark[1], s.spark[2], s.spark[3]);
          for (var i = 0; i < 4; i++) {
            bars += s.spark[i] > 0
              ? '<span data-spark-bar class="w-1 rounded-sm bg-violet-500" style="height:'
                + Math.round(s.spark[i] / max * 100) + '%"></span>'
              : '<span data-spark-bar class="h-px w-1 bg-zinc-300 dark:bg-zinc-700"></span>';
          }
          sparkHtml = '<span data-app-spark="' + s.spark.join(',') + '"'
            + ' title="Merges per week, last 4 weeks"'
            + ' class="inline-flex h-3 w-5 shrink-0 items-end gap-px">' + bars + '</span>';
        } else {
          sparkHtml = '<span data-app-spark="none"'
            + ' class="inline-flex h-3 w-5 shrink-0 items-center justify-center text-xs font-normal tabular-nums text-zinc-500 dark:text-zinc-400">–</span>';
        }
        // Muted numbers tallied from the loaded inbox. font-normal and the
        // zinc colour keep them quiet on the selected (semibold, violet)
        // row; data-app-count / data-app-merged / data-app-median carry the
        // values for the declared checks (data-app-count keeps its old name
        // so the existing count selectors keep working).
        var waitingHtml = loading
          ? '<span' + placeholder + ' style="width:150px"></span>'
          : '<span data-app-count="' + waiting + '" data-app-waiting="' + waiting + '">'
            + waiting + ' waiting</span> · '
            + '<span data-app-merged="' + merged + '" title="Merged in the last 7 days">'
            + merged + ' merged this week</span>';
        var median = s ? s.median : null;
        var medianHtml = loading
          ? '<span' + placeholder + ' style="width:130px"></span>'
          : '<span data-app-median="' + (median == null ? 'none' : fmtMergeTime(median)) + '"'
            + ' data-app-merged30="' + (s ? s.medianN : 0) + '"'
            + ' title="Median time from opened to merged, last 30 days">Median to merge (30 days): '
            + fmtMergeTime(median) + '</span>';
        btn.innerHTML = appAvatar({ appSlug: app.slug, appName: app.name, icon: app.icon })
          + '<div class="flex min-w-0 flex-1 flex-col gap-0.5">'
          + '<div data-app-stat-line class="flex h-4 items-center gap-1.5 whitespace-nowrap leading-4">'
          + '<span class="min-w-0 flex-1 truncate">' + esc(app.name) + '</span>'
          + sparkHtml
          + followStarHtml(app.slug) + '</div>'
          + '<div data-app-stat-line class="flex h-4 items-center whitespace-nowrap text-xs font-normal leading-4 tabular-nums text-zinc-500 dark:text-zinc-400">'
          + waitingHtml + '</div>'
          + '<div data-app-stat-line class="flex h-4 items-center whitespace-nowrap text-xs font-normal leading-4 tabular-nums text-zinc-500 dark:text-zinc-400">'
          + medianHtml + '</div>'
          + '</div>'
          + (selected ? FILTER_CHECK : '');
      } else {
        btn.innerHTML = FILTER_ALL_ICON
          + '<span class="min-w-0 flex-1 truncate">All apps</span>'
          + (selected ? FILTER_CHECK : '');
      }
      return btn;
    }

    // The dropdown body: a small search box on top, then the app list. The
    // search narrows the list by case-insensitive substring on the app name;
    // empty input shows the full list, "All apps" first.
    function buildFilterContent() {
      var content = document.createElement('div');
      content.setAttribute('data-app-filter-panel', '');
      content.className = 'flex flex-col';

      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Search apps';
      input.setAttribute('aria-label', 'Search apps');
      input.autocomplete = 'off';
      input.className = 'w-full border-b border-zinc-200 bg-transparent px-3 py-2.5 text-sm text-zinc-800 placeholder:text-zinc-400 focus:outline-none dark:border-zinc-700 dark:text-zinc-100 dark:placeholder:text-zinc-500';
      content.appendChild(input);

      var list = document.createElement('div');
      list.setAttribute('role', 'listbox');
      list.setAttribute('aria-label', 'Apps');
      list.className = 'max-h-60 overflow-y-auto p-1';
      content.appendChild(list);

      function renderList() {
        var query = input.value.trim().toLowerCase();
        // While a (forced) refresh is in flight the list holds the last good
        // apps with placeholder stats, so its size never jumps; the flag on
        // the panel tells checks (and the layout check) that the values are
        // placeholders right now.
        var loading = !state.inbox && state.loadingInbox;
        var apps = filterApps();
        if (loading && lastFilterApps.length) apps = lastFilterApps;
        else if (!loading) lastFilterApps = apps;
        var stats = loading ? null : filterStats();
        if (loading) content.setAttribute('data-stats-loading', '1');
        else content.removeAttribute('data-stats-loading');
        list.innerHTML = '';
        var shown = 0;
        if (!query) list.appendChild(filterRowEl(null, state.filter === '', stats, loading));
        for (var i = 0; i < apps.length; i++) {
          if (query && apps[i].name.toLowerCase().indexOf(query) === -1) continue;
          list.appendChild(filterRowEl(apps[i], apps[i].slug === state.filter, stats, loading));
          shown++;
        }
        if (query && !shown) {
          var empty = document.createElement('div');
          empty.className = 'px-3 py-4 text-center text-xs text-zinc-500 dark:text-zinc-400';
          empty.textContent = 'No apps match';
          list.appendChild(empty);
        }

      content.addEventListener('click', function (event) {
        // The follow star is its own control: it must win over the row pick
        // (the star sits inside the row, so closest() would find the row
        // first otherwise).
        var star = event.target.closest ? event.target.closest('[data-follow-toggle]') : null;
        if (star) {
          toggleFollow(star.getAttribute('data-app'));
          return;
        }
        var btn = event.target.closest ? event.target.closest('[data-app-option]') : null;
        if (!btn) return;
        var slug = btn.getAttribute('data-app-option');
        pickFilter(slug ? findFilterApp(slug) : null);
      });
      // App rows are divs with the option role (their star is a nested
      // button), so Enter and Space pick the app when the row itself is
      // focused. Focus on the star keeps the button's own click handling.
      content.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        var target = event.target;
        if (!target || target.closest('[data-follow-toggle]')) return;
        var row = target.closest ? target.closest('[data-app-option]') : null;
        if (!row || row.tagName !== 'DIV') return;
        event.preventDefault();
        var slug = row.getAttribute('data-app-option');
        pickFilter(slug ? findFilterApp(slug) : null);
      });

      renderList();
      activeFilterRender = renderList;
      return content;
    }

    function onDocClickClose(event) {
      if (!openFilter) return;
      if (filterPanelEl.contains(event.target) || filterTrigger.contains(event.target)) return;

    }

    function onFilterKeydown(event) {
      if (event.key === 'Escape') closeFilter();

    function closeFilter() {

        document.removeEventListener('click', onDocClickClose);
        document.removeEventListener('keydown', onFilterKeydown);
      }
    }

    function openAppFilter() {

      // Width is set before presentation: the kit measures the content to
      // place and size the popover.
      content.className = 'flex w-72 max-w-full flex-col';
      if (window.unNative && unNative.popover) {
        var handle = null;
        try {
          handle = unNative.popover({
            anchorEl: filterTrigger,
            contentEl: content,
            placement: 'bottom-start',
            onDismiss: function () { openFilter = null; activeFilterRender = null; syncFilter(); },

      // trigger with the same content.

      filterPanelEl.appendChild(content);
      filterPanelEl.className = 'absolute left-0 right-0 top-full z-30 mt-2 overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-lg dark:border-zinc-800 dark:bg-zinc-900';
      openFilter = { fallback: true };
      filterTrigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', onDocClickClose);
      document.addEventListener('keydown', onFilterKeydown);

    function pickFilter(app) {
      state.filter = app ? app.slug : '';
      state.filterName = app ? app.name : '';
      saveFilter(app ? { slug: state.filter, name: state.filterName } : null);
      closeFilter();
      render();

    var appFilterOpened = false; // ?app-filter=open fires once per page load
    // ------------------------------------------------------------------
    // Tag filter dropdown: the same machinery as the app filter above —
    // trigger, kit popover with a plain-panel fallback, click-outside and
    // Escape dismissal, re-render in place when the inbox reloads under an
    // open dropdown — kept parallel rather than shared so the app filter
    // code stays untouched. The options are the fixed list plus "All tags";
    // each shows the tag's open count (see tagCounts).
    // ------------------------------------------------------------------

    var tagTrigger = document.getElementById('tag-filter-trigger');
    var tagPanelEl = document.getElementById('tag-filter-panel');
    var openTag = null; // { dismiss } from the native kit, or a plain fallback
    var activeTagRender = null;

    // Tag counts tallied from the loaded inbox, the same way filterStats
    // works for the app filter: how many OPEN proposals carry each tag, so
    // "open proposals with this tag" is what the number means. Hidden
    // proposals are ignored — a proposal the user already voted on
    // (approved or hidden) or that has merged is no longer waiting on
    // anyone, so it does not count — deliberately regardless of the Hide
    // voted / Hide merged toggles, matching how the app filter's own counts
    // stay stable under those toggles. No extra platform call: tallied from
    // the cards already loaded and re-tallied whenever the inbox reloads.
    function tagCounts() {
      var counts = {};
      var proposals = (state.inbox && state.inbox.proposals) || [];
      for (var i = 0; i < proposals.length; i++) {
        var p = proposals[i];
        if (p.status === 'merged' || p.status === 'closed') continue;
        if (isVoted(p)) continue;
        var tags = Array.isArray(p.tags) ? p.tags : [];
        for (var j = 0; j < tags.length; j++) {
          var t = tags[j];
          if (TAG_VALUES.indexOf(t) === -1) continue;
          counts[t] = (counts[t] || 0) + 1;
        }
      }
      return counts;
    }

    function tagRowEl(tag, selected, count) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('role', 'option');
      btn.setAttribute('aria-selected', selected ? 'true' : 'false');
      // The "all" row carries a value too (an empty-string attribute selector
      // is awkward for the tap hook); pickTag maps anything outside the
      // fixed list, "all" included, back to no tag.
      btn.setAttribute('data-tag-option', tag || 'all');
      btn.className = 'flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-sm '
        + (selected
          ? 'bg-violet-600/10 font-semibold text-violet-700 dark:bg-violet-500/20 dark:text-violet-300'
          : 'text-zinc-700 hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800');
      btn.innerHTML = '<span class="min-w-0 flex-1 truncate">' + (tag ? esc(tag) : 'All tags') + '</span>'
        // Muted number tallied from the loaded inbox: the tag's open count,
        // the same number the card chips show. font-normal and the zinc
        // colour keep it quiet on the selected (semibold, violet) row;
        // data-tag-count carries the value for the declared checks.
        + (tag
          ? '<span data-tag-count="' + count + '" title="Open proposals with this tag"'
          + ' class="shrink-0 text-xs font-normal tabular-nums text-zinc-500 dark:text-zinc-400">('
          + count + ')</span>'
          : '')
        + (selected ? FILTER_CHECK : '');
      return btn;
    }

    // The dropdown body: "All tags" first, then the fixed list, each real
    // tag with its open count. No search box — four options do not need one.
    function buildTagContent() {
      var content = document.createElement('div');
      content.setAttribute('data-tag-filter-panel', '');
      content.className = 'flex flex-col';

      var list = document.createElement('div');
      list.setAttribute('role', 'listbox');
      list.setAttribute('aria-label', 'Tags');
      list.className = 'max-h-60 overflow-y-auto p-1';
      content.appendChild(list);

      function renderList() {
        var counts = tagCounts();
        list.innerHTML = '';
        list.appendChild(tagRowEl('', state.tagFilter === '', 0));
        for (var i = 0; i < TAG_VALUES.length; i++) {
          var tag = TAG_VALUES[i];
          list.appendChild(tagRowEl(tag, state.tagFilter === tag, counts[tag] || 0));
        }
      }

      content.addEventListener('click', function (event) {
        var btn = event.target.closest ? event.target.closest('[data-tag-option]') : null;
        if (!btn) return;
        pickTag(btn.getAttribute('data-tag-option'));
      });
      renderList();
      activeTagRender = renderList;
      return content;
    }

    function onTagDocClickClose(event) {
      if (!openTag) return;
      if (tagPanelEl.contains(event.target) || tagTrigger.contains(event.target)) return;
      closeTagFilter();
    }

    function onTagKeydown(event) {
      if (event.key === 'Escape') closeTagFilter();

    function closeTagFilter() {
      if (!openTag) return;
      var f = openTag;
      openTag = null;
      activeTagRender = null;
      tagTrigger.setAttribute('aria-expanded', 'false');

        try { f.dismiss(); } catch (e) { /* already gone */ }
      } else {
        tagPanelEl.className = 'hidden';
        tagPanelEl.innerHTML = '';
        document.removeEventListener('click', onTagDocClickClose);
        document.removeEventListener('keydown', onTagKeydown);

    function openTagFilterDropdown() {
      if (openTag) return;
      var content = buildTagContent();
      // Width is set before presentation: the kit measures the content to
      // place and size the popover. Narrower than the app filter — four
      // short words.
      content.className = 'flex w-56 max-w-full flex-col';
      if (window.unNative && unNative.popover) {
        var handle = null;
        try {
          handle = unNative.popover({
            anchorEl: tagTrigger,
            contentEl: content,
            placement: 'bottom-end',
            onDismiss: function () { openTag = null; activeTagRender = null; syncTagFilter(); },
          });
        } catch (e) { handle = null; }
        if (handle) {
          openTag = handle;
          tagTrigger.setAttribute('aria-expanded', 'true');
          return;
        }
      }

      // trigger with the same content.
      content.className = 'flex w-full flex-col';
      tagPanelEl.innerHTML = '';
      tagPanelEl.appendChild(content);
      tagPanelEl.className = 'absolute right-0 top-full z-30 mt-2 overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-lg dark:border-zinc-800 dark:bg-zinc-900';
      openTag = { fallback: true };
      tagTrigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', onTagDocClickClose);
      document.addEventListener('keydown', onTagKeydown);
    }

    function pickTag(tag) {
      state.tagFilter = TAG_VALUES.indexOf(tag) !== -1 ? tag : '';
      saveTagFilter(state.tagFilter || null);
      closeTagFilter();
      render();
    }

    function syncTagFilter() {
      tagTrigger.className = state.tagFilter ? TAG_TRIGGER_ACTIVE : TAG_TRIGGER_IDLE;
      document.getElementById('tag-filter-label').textContent = state.tagFilter || 'All tags';
      tagTrigger.setAttribute('aria-expanded', openTag ? 'true' : 'false');
