    function renderDemoBanner() {
      var demo = (state.inbox && state.inbox.demo) || (state.votes && state.votes.demo)
        || (state.members && state.members.demo)
        || (state.leaderboard && state.leaderboard.demo)
        || (state.saved && state.saved.demo);
      document.getElementById('demo-banner').className = demo
        ? 'mb-3 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-1.5 text-xs font-medium text-amber-700 dark:text-amber-300'
        : 'hidden';
    }

    // Controversy order: the closest yes/no split first, so a tight race is
    // seen ahead of a landslide. A proposal with no votes on one side
    // (unanimous, or untouched) has no contest to measure, so every such
    // card sinks below the contested ones. Equal gaps break by title, then
    // session id, so repeated renders match. A copy is sorted: the loaded
    // array's order stays canonical for the default sort and the server's
    // caches.
    function splitContested(p) {
      return (p.yes || 0) > 0 && (p.no || 0) > 0;
    }

    function splitGap(p) {
      return Math.abs((p.yes || 0) - (p.no || 0));
    }

    function controversyCompare(a, b) {
      var ca = splitContested(a);
      var cb = splitContested(b);
      if (ca !== cb) return ca ? -1 : 1;
      var ga = splitGap(a);
      var gb = splitGap(b);
      if (ga !== gb) return ga - gb;
      var t = String(a.title || '').localeCompare(String(b.title || ''));
      if (t !== 0) return t;
      return String(a.sessionId || '').localeCompare(String(b.sessionId || ''));
    }

    function renderInbox() {
      if (state.errorInbox) return errorHtml(state.errorInbox);
      if (!state.inbox || state.loadingInbox && !state.inbox.proposals) return skeletons();
      var proposals = state.inbox.proposals || [];
      // Split snoozed cards off before every other filter: a snoozed
      // proposal leaves the main inbox until its wake date. The summary
      // counts still read the whole loaded list, so snoozing never moves
      // the header totals.
      var snoozed = [];
      var visible = [];
      for (var sp = 0; sp < proposals.length; sp++) {
        (wakeActive(proposals[sp]) ? snoozed : visible).push(proposals[sp]);
      }
      // The Snoozed filter: its own view over just the snoozed cards, one
      // flat list (each row already carries its wake date and Unsnooze).
      if (state.snoozeView) {
        if (!snoozed.length) {
          return emptyHtml(
            'Nothing snoozed',
            'Snoozed proposals wait here until their wake date, then return to the inbox.',
            BACK_TO_INBOX_CTA);
        }
        var snoozedHtml = '';
        for (var sv = 0; sv < snoozed.length; sv++) snoozedHtml += proposalCard(snoozed[sv]);
        return snoozedHtml;
      }
      var filtered = state.filter
        ? visible.filter(function (p) { return p.appSlug === state.filter; })
        : visible;
      // Tag filter over the loaded cards, alongside the app filter (a card
      // must satisfy both): keep proposals carrying the chosen tag. No
      // refetch — the server already normalized every card's tags.
      if (state.tagFilter) {
        filtered = filtered.filter(function (p) {
          return Array.isArray(p.tags) && p.tags.indexOf(state.tagFilter) !== -1;
        });
      }
      if (state.hideVoted) {
        filtered = filtered.filter(function (p) { return !isVoted(p); });
      }
      // Hide merged filters the loaded list too, no refetch. Runs after the
      // app and hide-voted filters, alongside them.
      if (state.hideMerged) {
        filtered = filtered.filter(function (p) { return p.status !== 'merged'; });
      }
      // Hide read filters the loaded list the same way: opened proposals
      // (this account's own read set) drop out until the switch goes back
      // off. Runs after the other hide toggles.
      if (state.hideRead) {
        filtered = filtered.filter(function (p) { return !isRead(p); });
      }
      // Title search over the loaded cards only: case-insensitive substring,
      // no refetch. Filters run after the app and hide-voted ones, so the
      // search narrows whatever is already on screen.
      var query = state.search.trim().toLowerCase();
      if (query) {
        filtered = filtered.filter(function (p) {
          return String(p.title || '').toLowerCase().indexOf(query) !== -1;
        });
      }
      if (state.sort === 'newest') {
        // Newest proposed first; a proposal without a usable timestamp keeps
        // its loaded order at the end (stable sort). A copy: the loaded
        // array's order stays canonical for the default sort and the
        // server's caches.
        filtered = filtered.slice().sort(function (a, b) {
          var ta = a.proposedAt ? Date.parse(a.proposedAt) : NaN;
          var tb = b.proposedAt ? Date.parse(b.proposedAt) : NaN;
          if (isNaN(ta) && isNaN(tb)) return 0;
          if (isNaN(ta)) return 1;
          if (isNaN(tb)) return -1;
          return tb - ta;
        });
      } else if (state.sort === 'controversy') {
        // Closest yes/no split first over the already-filtered set; the
        // app, hide-voted, hide-merged and search filters above have all
        // run, so the ranking only orders what survived them.
        filtered = filtered.slice().sort(controversyCompare);
      }
      // One-vote-away chip: keep only proposals exactly one yes short of
      // their threshold (the same number the "1 vote needed" pill shows).
      // Unknown thresholds and "Count met" proposals drop out.
      if (state.oneAway) {
        filtered = filtered.filter(function (p) { return p.needed === 1; });
      }
      if (!filtered.length) {
        // Everything the inbox loaded is asleep: point at the Snoozed
        // filter rather than a caught-up message that hides where the
        // cards went.
        if (proposals.length && snoozed.length === proposals.length) {
          return emptyHtml(
            'Everything here is snoozed',
            'Snoozed proposals wait until their wake date, then return to the inbox.',
            SHOW_SNOOZED_CTA);
        }
        // The chip is the most specific filter, so its empty state wins over
        // the others when it is on.
        if (proposals.length && state.oneAway) {
          return emptyHtml(
            'Nothing is one vote away',
            'No open proposal needs exactly one more yes vote right now.',
            CLEAR_ONE_AWAY_CTA);
        }
        if (proposals.length && query) {
          return emptyHtml(
            'No proposals match',
            'No loaded proposal title contains "' + esc(state.search.trim()) + '". Clear the search to see everything.',
            CLEAR_SEARCH_CTA);
        }
        if (proposals.length && state.hideVoted) {
          return emptyHtml(
            'Nothing left to vote on',
            'You already voted on every open proposal here. Show voted proposals to see them again.',
            SHOW_VOTED_CTA);
        }
        if (proposals.length && state.hideMerged) {
          return emptyHtml(
            'Merged proposals hidden',
            'Every proposal here has already merged. Show merged proposals to see them again.',
            SHOW_MERGED_CTA);
        }
        if (proposals.length && state.hideRead) {
          return emptyHtml(
            'Nothing unread',
            'You have opened every proposal here. Show read proposals to see them again.',
            SHOW_READ_CTA);
        }
        if (proposals.length && state.tagFilter) {
          return emptyHtml(
            'No proposals with this tag',
            'No open proposal carries the "' + esc(state.tagFilter) + '" tag right now. Clear the tag filter to see everything.',
            CLEAR_TAG_CTA);
        }
        if (proposals.length) {
          return emptyHtml(
            'Nothing from this app',
            'No open proposals for this app right now.',
            CLEAR_FILTER_CTA);
        }
        // The genuinely empty inbox: zero loaded proposals, no filter in
        // the way. It explains the next action (browse the apps the inbox
        // knows about) instead of just offering a refresh, and the header
        // summary above it keeps counting at zero.
        return emptyInboxHtml();
      }
      // Controversy ranks the whole loaded inbox, tightest race first, so
      // it renders one flat list: the age-group headers would cut the
      // ranking into day buckets and bury a tight older race under a
      // lopsided one from today. Same cards, same spacing (#view is
      // already a gap-3 column); no proposals added or dropped.
      if (state.sort === 'controversy') {
        var flat = '';
        for (var c = 0; c < filtered.length; c++) flat += proposalCard(filtered[c]);
        return flat;
      }
      // Age groups: small section headers over the same filtered, sorted
      // cards. Bucketed on the proposal's proposed date in the viewer's own
      // calendar days (Today, the six before it, then Older); a proposal the
      // platform sent no usable timestamp for lands in Older. Cards keep the
      // existing sort order inside each group.
      return groupedInboxHtml(filtered);
    }

    var AGE_GROUPS = [
      { key: 'today', label: 'Today' },
      { key: 'week', label: 'This week' },
      { key: 'older', label: 'Older' },
    ];

    // Which group a proposal belongs to: whole calendar days back from
    // today, in the viewer's local time. 0 = Today, 1..6 = This week,
    // anything further (or an unreadable/missing timestamp) = Older. A
    // future timestamp (clock skew) reads as Today.
    function ageBucket(p) {
      var t = p.proposedAt ? Date.parse(p.proposedAt) : NaN;
      if (isNaN(t)) return 'older';
      var now = new Date();
      var d = new Date(t);
      var startOfDay = function (x) {
        return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      };
      var daysBack = Math.floor((startOfDay(now) - startOfDay(d)) / (24 * 3600 * 1000));
      if (daysBack <= 0) return 'today';
      if (daysBack <= 6) return 'week';
      return 'older';
    }

    // The grouped list: one section per non-empty age group, the group's
    // header followed by its cards in a plain flex column (the same spacing
    // the flat list had). Cards stay direct children of a card container so
    // the first card in a group is still that container's :first-child.
    function groupedInboxHtml(filtered) {
      var buckets = { today: [], week: [], older: [] };
      for (var i = 0; i < filtered.length; i++) buckets[ageBucket(filtered[i])].push(filtered[i]);
      var html = '';
      for (var g = 0; g < AGE_GROUPS.length; g++) {
        var group = AGE_GROUPS[g];
        var items = buckets[group.key];
        if (!items.length) continue;
        html += '<section data-age-group="' + group.key + '" class="flex flex-col gap-3">'
          + '<h2 data-age-header class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">' + group.label + '</h2>'
          + '<div data-age-cards class="flex flex-col gap-3">';
        for (var j = 0; j < items.length; j++) html += proposalCard(items[j]);
        html += '</div></section>';
      }
      return html;
    }

    function renderFollowing() {
      if (state.errorInbox) return errorHtml(state.errorInbox);
      if (!state.inbox || state.loadingInbox && !state.inbox.proposals) return skeletons();
      if (!state.follows.length) {
        return emptyHtml(
          'No followed apps yet',
          'Star an app in the app filter above the Inbox and its open proposals will show up here.',
          BROWSE_CTA);
      }
      var rows = followingAppRows();
      if (!rows.length) {
        return emptyHtml(
          'Nothing open from your apps',
          'Every followed app is caught up right now. New proposals from them will show up here.',
          REFRESH_CTA);
      }
      // One section per followed app that has an open proposal, the app's
      // name as the header and its cards below. A followed app with nothing
      // open gets no section at all, so the list only names apps with
      // something to look at.
      var html = '';
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        html += '<section data-following-group="' + esc(row.app.slug) + '" class="flex flex-col gap-3">'
          + '<h2 class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">' + esc(row.app.name) + '</h2>'
          + '<div data-following-cards class="flex flex-col gap-3">';
        for (var j = 0; j < row.items.length; j++) html += proposalCard(row.items[j]);
        html += '</div></section>';
      }
      return html;
    }

    function renderVotes() {
      if (state.errorVotes) return errorHtml(state.errorVotes);
      if (!state.votes || state.loadingVotes && !state.votes.votes) return skeletons();
      var votes = state.votes.votes || [];
      if (!votes.length) {
        return emptyHtml(
          'No votes yet',
          'Votes you cast in the Inbox show up here with their outcome.',
          BROWSE_CTA);
      }
      // Oldest first reorders the already-loaded rows by their Voted
      // date: ascending, rows without a usable timestamp kept at the end,
      // ties and missing pairs in loaded order (stable). Newest first is
      // the loaded order, which /api/my-votes already returns DESC.
      if (state.votesOrder === 'oldest') {
        votes = votes.slice().sort(function (a, b) {
          var ta = a && a.created_at ? Date.parse(a.created_at) : NaN;
          var tb = b && b.created_at ? Date.parse(b.created_at) : NaN;
          if (isNaN(ta) && isNaN(tb)) return 0;
          if (isNaN(ta)) return 1;
          if (isNaN(tb)) return -1;
          return ta - tb;
        });
      }
      // The "Merged this week" filter, the screen the celebration card's
      // See what merged link opens (and ?votes-merged=1 deep-links to):
      // keep rows whose proposal merged within the last seven calendar
      // days, the same span the cards celebrate. Uses the row's recorded
      // merged_at, falling back to updated_at (the refresh that first saw
      // the merge), the same stand-in the merged date pill uses.
      if (state.votesMergedWeek) {
        votes = votes.filter(voteMergedThisWeek);
        if (!votes.length) {
          return emptyHtml(
            'No merges this week',
            'No proposal you voted on merged in the last seven days. Show all votes to see everything.',
            SHOW_ALL_VOTES_CTA);
        }
      }
      var html = '';
      for (var i = 0; i < votes.length; i++) html += voteRow(votes[i]);
      return html;
    }

    // The seven-calendar-day span, in the viewer's own days, shared with
    // the inbox's mergedThisWeek helper: 0 = today, 1..6 = the week.
    function voteMergedThisWeek(v) {
      if (!v || v.status !== 'merged') return false;
      var stamp = v.merged_at || v.updated_at;
      var t = stamp ? Date.parse(stamp) : NaN;
      if (isNaN(t)) return false;
      var now = new Date();
      var d = new Date(t);
      var startOfDay = function (x) {
        return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      };
      var daysBack = Math.floor((startOfDay(now) - startOfDay(d)) / (24 * 3600 * 1000));
      return daysBack >= 0 && daysBack <= 6;
    }

    // The chip toggle and the filtered empty state's link back: the filter
    // follows the URL (?votes-merged=1), so a reload keeps what is on
    // screen and the deep link works.
    function setVotesMergedWeek(on) {
      state.votesMergedWeek = on;
      var url = new URL(location.href);
      if (on) url.searchParams.set('votes-merged', '1');
      else url.searchParams.delete('votes-merged');
      history.replaceState(null, '', url.pathname + url.search + url.hash);
      render();
    }

    function renderWatchlist() {
      if (state.errorWatchlist) return errorHtml(state.errorWatchlist);
      if (!state.watchlist || state.loadingWatchlist && !state.watchlist.rows) return skeletons();
      var rows = state.watchlist.rows || [];
      if (!rows.length) {
        return emptyHtml(
          'No starred proposals',
          'Star proposals in the Inbox to keep an eye on them here.',
          BROWSE_CTA);
      }
      var html = '';
      for (var i = 0; i < rows.length; i++) html += watchRow(rows[i]);
      return html;
    }

    // The Saved tab: this user's bookmarked proposals, newest save first.
    // Same states as the Watchlist: error, skeletons, and a friendly empty
    // state pointing back at the Inbox.
    function renderSaved() {
      if (state.errorSaved) return errorHtml(state.errorSaved);
      if (!state.saved || state.loadingSaved && !state.saved.rows) return skeletons();
      var rows = state.saved.rows || [];
      if (!rows.length) {
        return emptyHtml(
          'Nothing saved yet',
          'Bookmark proposals in the Inbox to find them here.',
          BROWSE_CTA);
      }
      var html = '';
      for (var i = 0; i < rows.length; i++) html += savedRow(rows[i]);
      return html;
    }

    // ------------------------------------------------------------------
    // Members directory. One card per project member: letter avatar
    // (tinted from the username, the same palette the voter chips use),
    // handle, role chip, joined date, votes cast through this app and
    // accepted-proposal count, the whole row linking to the member's
    // author profile on the platform. Fields the server could not fill
    // stay off the row — the same optional-field contract the change
    // summary uses — so nothing is invented to fill a slot.
    // ------------------------------------------------------------------

    var MEMBER_ROW_CLASS = 'flex items-center gap-3 rounded-2xl border border-zinc-200 bg-white p-3.5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900/70';
    var MEMBER_AVATAR_CLASS = 'flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-bold ';
    var OWNER_CHIP_CLASS = 'whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-semibold bg-violet-600/15 text-violet-700 dark:text-violet-300';
    var MEMBER_CHIP_CLASS = 'whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-semibold bg-zinc-200 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300';
    var NO_MATCH_HTML = '<div data-members-empty class="flex flex-col items-center gap-2 rounded-2xl border border-dashed border-zinc-300 bg-white/60 px-6 py-10 text-center dark:border-zinc-700 dark:bg-zinc-900/40">'
      + '<svg viewBox="0 0 24 24" class="h-10 w-10 text-zinc-300 dark:text-zinc-600" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'
      + '<p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">No members match</p>'
      + '<p class="text-xs text-zinc-500 dark:text-zinc-400">Try a different handle.</p>'
      + '</div>';

    function filterMembers(members, query) {
      var q = String(query || '').trim().toLowerCase();
      if (!q) return members;
      var filtered = [];
      for (var i = 0; i < members.length; i++) {
        var m = members[i];
        // Match with or without the @ the row renders in front of the handle.
        var handle = ('@' + String(m.username || '')).toLowerCase();
        if (handle.indexOf(q) !== -1 || String(m.username || '').toLowerCase().indexOf(q) !== -1) {
          filtered.push(m);
        }
      }
      return filtered;
    }

    function memberDate(iso) {
      var d = new Date(iso);
      if (!isFinite(d.getTime())) return '';
      var opts = { month: 'short', day: 'numeric' };
      if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
      return d.toLocaleDateString(undefined, opts);
    }

    function memberRow(m) {
      var owner = m.role === 'owner';
      var handle = '@' + m.username;
      var stats = [];
      if (m.joinedAt && memberDate(m.joinedAt)) {
        stats.push('<span data-member-joined>Joined ' + esc(memberDate(m.joinedAt)) + '</span>');
      }
      if (m.votesCast != null) {
        stats.push('<span data-member-votes>' + Number(m.votesCast)
          + (Number(m.votesCast) === 1 ? ' vote' : ' votes') + '</span>');
      }
      if (m.proposalsAccepted != null) {
        stats.push('<span data-member-accepted>' + Number(m.proposalsAccepted) + ' accepted</span>');
      }
      var avatar = '<span data-member-avatar aria-hidden="true" class="' + MEMBER_AVATAR_CLASS
        + avatarClass(m.username) + '">' + esc((m.username.trim().charAt(0) || '?').toUpperCase()) + '</span>';
      var body = '<span class="min-w-0 flex-1">'
        + '<span class="flex items-center gap-2">'
        + '<span data-member-handle="' + esc(handle) + '" class="truncate text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + esc(handle) + '</span>'
        + '<span data-member-role="' + (owner ? 'owner' : 'member') + '" class="' + (owner ? OWNER_CHIP_CLASS : MEMBER_CHIP_CLASS) + '">'
        + (owner ? 'Owner' : 'Member') + '</span>'
        + '</span>'
        + (stats.length
          ? '<span class="mt-0.5 block truncate text-xs text-zinc-500 dark:text-zinc-400">' + stats.join(' · ') + '</span>'
          : '')
        + '</span>';
      var chevron = '<svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4 shrink-0 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';
      if (m.profileUrl) {
        return '<a data-member-link data-member-row href="' + esc(m.profileUrl) + '"'
          + ' target="_blank" rel="noopener" class="' + MEMBER_ROW_CLASS + '">'
          + avatar + body + chevron + '</a>';
      }
      // No platform origin at runtime: the row keeps its content but is not
      // presented as a link off the app.
      return '<div data-member-row class="' + MEMBER_ROW_CLASS + '">' + avatar + body + '</div>';
    }

    // ------------------------------------------------------------------
    // Voters leaderboard. One ranked row per member who has voted through
    // this app: rank, letter avatar (the same tinted palette the directory
    // and voter chips use), handle, votes cast in the current range and how
    // many of them ended up merged. Rows come loaded with both ranges'
    // counts, so the This week / All time pill re-ranks the board in place.
    // The caller's own row is highlighted and, when it is scrolled out of
    // view, its position stays pinned to the bottom of the screen.
    // ------------------------------------------------------------------

    var LB_ROW_CLASS = 'flex items-center gap-3 rounded-2xl border border-zinc-200 bg-white p-3.5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900/70';
    var LB_ME_CLASS = ' border-violet-400/70 bg-violet-600/5 dark:border-violet-500/50 dark:bg-violet-500/10';
    var LB_MAX_ROWS = 50;
    var LB_EMPTY_HTML = '<div data-lb-empty class="flex flex-col items-center gap-2 rounded-2xl border border-dashed border-zinc-300 bg-white/60 px-6 py-10 text-center dark:border-zinc-700 dark:bg-zinc-900/40">'
      + '<p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">No votes this week</p>'
      + '<p class="text-xs text-zinc-500 dark:text-zinc-400">Votes cast in the last 7 days will rank here.</p>'
      + '</div>';
    var LB_EMPTY_ALL_HTML = '<div data-lb-empty class="flex flex-col items-center gap-2 rounded-2xl border border-dashed border-zinc-300 bg-white/60 px-6 py-10 text-center dark:border-zinc-700 dark:bg-zinc-900/40">'
      + '<p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">No votes yet</p>'
      + '<p class="text-xs text-zinc-500 dark:text-zinc-400">Votes cast in the Inbox will rank here.</p>'
      + '</div>';

    function lbStats(r) {
      var all = state.lbRange === 'all';
      return {
        votes: all ? r.allVotes : r.weekVotes,
        merged: all ? r.allMerged : r.weekMerged,
      };
    }

    // Rank the loaded rows for the current range: most votes first, ties
    // broken by merged votes, then by handle so equal pairs stay put.
    // Members with no votes in the range are left off the board.
    function lbRanked(rows, range) {
      range = range || state.lbRange;
      var key = range === 'all' ? 'allVotes' : 'weekVotes';
      var mergedKey = range === 'all' ? 'allMerged' : 'weekMerged';
      var withVotes = [];
      for (var i = 0; i < rows.length; i++) {
        if (rows[i][key] > 0) withVotes.push(rows[i]);
      }
      withVotes.sort(function (a, b) {
        if (b[key] !== a[key]) return b[key] - a[key];
        if (b[mergedKey] !== a[mergedKey]) return b[mergedKey] - a[mergedKey];
        return String(a.username) < String(b.username) ? -1 : 1;
      });
      return withVotes;
    }

    function lbRow(r, rank) {
      var me = !!r.you;
      var s = lbStats(r);
      var rankHtml = '<span class="w-5 shrink-0 text-right text-xs font-bold text-zinc-400 dark:text-zinc-500">' + rank + '</span>';
      var avatar = '<span data-lb-avatar aria-hidden="true" class="' + MEMBER_AVATAR_CLASS
        + avatarClass(r.username) + '">' + esc((r.username.trim().charAt(0) || '?').toUpperCase()) + '</span>';
      var handle = '<span data-lb-handle="@' + esc(r.username) + '" class="min-w-0 flex-1 truncate text-sm font-semibold '
        + (me ? 'text-violet-700 dark:text-violet-300' : 'text-zinc-900 dark:text-zinc-100')
        + '">@' + esc(r.username) + '</span>';
      var you = me
        ? '<span data-lb-you class="' + OWNER_CHIP_CLASS + '">You</span>' : '';
      var stats = '<span class="shrink-0 whitespace-nowrap text-xs text-zinc-500 dark:text-zinc-400">'
        + '<span data-lb-votes class="font-semibold text-zinc-800 dark:text-zinc-100">'
        + s.votes + (s.votes === 1 ? ' vote' : ' votes') + '</span>'
        + ' · <span data-lb-merged>' + s.merged + ' merged</span></span>';
      // The rank rides on the row element (the visual number is the span
      // above), so checks can pin an assertion to one ranked row.
      return '<div data-lb-row data-lb-rank="' + rank + '"' + (me ? ' data-lb-me="1"' : '') + ' class="'
        + LB_ROW_CLASS + (me ? LB_ME_CLASS : '') + '">'
        + rankHtml + avatar + handle + you + stats + '</div>';
    }

    // The pinned chip: the caller's own position, shown fixed to the bottom
    // of the screen while their row is scrolled out of view (and forced
    // visible by ?lb-pin=1 for the checks). Rendered with the board; its
    // visibility is updated on scroll by updateLbPin.
    function lbPinHtml(meRow, rank) {
      var s = lbStats(meRow);
      return '<div id="lb-pin" data-lb-pin hidden class="fixed bottom-4 left-4 right-4 z-30 mx-auto max-w-md">'
        + '<div class="flex items-center justify-between gap-3 rounded-full border border-violet-500/40 bg-violet-600 px-4 py-2.5 shadow-lg">'
        + '<span data-lb-pin-label class="truncate text-sm font-semibold text-white">You · #' + rank + '</span>'
        + '<span data-lb-pin-votes class="shrink-0 text-xs font-semibold text-violet-100">'
        + s.votes + (s.votes === 1 ? ' vote' : ' votes') + '</span>'
        + '</div></div>';
    }

    function renderLeaderboard() {
      if (state.errorLeaderboard) return errorHtml(state.errorLeaderboard);
      if (!state.leaderboard || state.loadingLeaderboard && !state.leaderboard.rows) return skeletons();
      var data = state.leaderboard;
      if (data.notMember) {
        return emptyHtml(
          'Leaderboard unavailable',
          'Only members of this project can see the leaderboard.',
          '');
      }
      var ranked = lbRanked(data.rows || []);
      var html = '';
      if (!ranked.length) {
        html += state.lbRange === 'all' ? LB_EMPTY_ALL_HTML : LB_EMPTY_HTML;
      } else {
        var shown = ranked.slice(0, LB_MAX_ROWS);
        for (var i = 0; i < shown.length; i++) html += lbRow(shown[i], i + 1);
        if (ranked.length > shown.length) {
          html += '<p data-lb-cap class="pt-1 text-center text-xs text-zinc-500 dark:text-zinc-400">Showing the top '
            + shown.length + ' of ' + ranked.length + ' voters</p>';
        }
        // The own row's position is always computable: it comes from the
        // full ranked list, so it stays right even when the row itself is
        // beyond the 50 shown.
        for (var j = 0; j < ranked.length; j++) {
          if (ranked[j].you) { html += lbPinHtml(ranked[j], j + 1); break; }
        }
      }
      var members = data.totalMembers != null ? data.totalMembers : 0;
      var voters = data.voters != null ? data.voters : 0;
      html += '<p data-lb-voters class="pt-1 text-center text-xs text-zinc-500 dark:text-zinc-400">'
        + voters + ' of ' + members
        + (members === 1 ? ' member has' : ' members have') + ' voted</p>';
      return html;
    }

    // Show the pinned chip only while the own row is out of view (above or
    // below the fold); ?lb-pin=1 forces it on for the checks. Runs after
    // every render and on scroll; a no-op whenever no board is up.
    function updateLbPin() {
      var pin = document.getElementById('lb-pin');
      if (!pin) return;
      var show = false;
      if (state.tab === 'leaderboard' && !state.membersView && !state.errorLeaderboard
          && state.leaderboard && state.leaderboard.rows) {
        if (LB_PIN_FORCE) {
          show = true;
        } else {
          var row = document.querySelector('[data-lb-me]');
          if (row) {
            var rect = row.getBoundingClientRect();
            show = rect.bottom <= 0 || rect.top >= window.innerHeight;
          }
        }
      }
      pin.hidden = !show;
    }

    function setLbRange(range) {
      if (range !== 'week' && range !== 'all') return;
      if (range === state.lbRange) return;
      state.lbRange = range;
      render();
    }

    function renderMembers() {
      if (state.errorMembers) return errorHtml(state.errorMembers);
      if (!state.members || state.loadingMembers && !state.members.members) return skeletons();
      var data = state.members;
      var members = data.members || [];
      if (data.notMember) {
        return emptyHtml(
          'Members list unavailable',
          'Only members of this project can see the member roster.',
          '');
      }
      if (!members.length) {
        return emptyHtml(
          'No members yet',
          'Members of this project will appear here.',
          '');
      }
      var filtered = filterMembers(members, state.memberQuery);
      if (!filtered.length) return NO_MATCH_HTML;
      var html = '';
      for (var i = 0; i < filtered.length; i++) html += memberRow(filtered[i]);
      return html;
    }

    // Stat cards under the header on the Inbox tab: a compact row of four
    // tiles and one motivational line. Open and votes needed come from the
    // loaded inbox list (proposals without a known threshold contribute
    // nothing to the needed count); votes this week and the day streak come
    // from the caller's vote history; the rank is their place on the
    // Leaderboard's This week board (the same lbRanked order the tab uses).
    // "This week" is the rolling seven days the Leaderboard counts.
    // ------------------------------------------------------------------

    var STAT_TILE = 'min-w-0 rounded-xl bg-zinc-100 px-2 py-2 dark:bg-zinc-800/60';
    var STAT_LABEL = 'truncate text-xs text-zinc-500 dark:text-zinc-400';
    var STAT_NUM = 'truncate text-lg font-bold leading-tight text-zinc-900 dark:text-zinc-100';
    var STAT_PENDING = '<span aria-hidden="true" class="inline-block h-4 w-6 animate-pulse rounded bg-zinc-200 align-middle dark:bg-zinc-700"></span>';
    var DAY_MS = 24 * 3600 * 1000;

    function localDayKey(t) {
      var d = new Date(t);
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    // Votes in the last seven days, and the run of consecutive local days
    // with at least one vote. The run ends today, or yesterday when nothing
    // was cast yet today (a streak stays alive until a whole day is missed;
    // votedToday says which).
    function voteStreakStats(rows, nowMs) {
      var days = {};
      var week = 0;
      for (var i = 0; i < rows.length; i++) {
        var t = Date.parse(rows[i] && rows[i].created_at);
        if (isNaN(t) || t > nowMs) continue;
        if (t >= nowMs - 7 * DAY_MS) week++;
        days[localDayKey(t)] = true;
      }
      var today = localDayKey(nowMs);
      var votedToday = !!days[today];
      var day = votedToday ? today : localDayKey(today - DAY_MS / 2);
      var streak = 0;
      // Step back one calendar day at a time; going through noon keeps
      // daylight-saving days (23 or 25 hours) from skipping a date.
      while (days[day]) {
        streak++;
        day = localDayKey(day - DAY_MS / 2);
      }
      return { week: week, streak: streak, votedToday: votedToday };
    }

    // The caller's place on the This week board, or why there is none.
    function inboxRankStats(lb) {
      if (!lb) return { state: 'unavailable' };
      if (lb.notMember) return { state: 'members' };
      var ranked = lbRanked(lb.rows || [], 'week');
      for (var i = 0; i < ranked.length; i++) {
        if (ranked[i].you) return { state: 'ranked', rank: i + 1, of: ranked.length };
      }
      return { state: 'unranked', of: ranked.length };
    }

    function statTile(key, label, value, sub, attrs) {
      return '<div data-stat="' + key + '"' + (attrs || '') + ' class="' + STAT_TILE + '">'
        + '<p class="' + STAT_LABEL + '">' + label + '</p>'
        + '<p data-stat-value class="' + STAT_NUM + '">' + value + '</p>'
        + '<p data-stat-sub class="' + STAT_LABEL + '">' + sub + '</p>'
        + '</div>';
    }

    function inboxMotivation(open, votes, rank) {
      if (votes.streak >= 2 && !votes.votedToday) {
        return 'Vote today to keep your ' + votes.streak + '-day streak going.';
      }
      if (rank.state === 'ranked' && rank.rank === 1) {
        return 'You lead the Leaderboard this week. Nice work!';
      }
      if (votes.week === 0) {
        return open > 0
          ? 'No votes yet this week. ' + open + (open === 1 ? ' proposal is' : ' proposals are') + ' waiting for you.'
          : 'No votes yet this week. New proposals will show up here.';
      }
      if (votes.streak >= 2) {
        return votes.streak + ' days in a row. Keep it up!';
      }
      if (rank.state === 'ranked') {
        return 'You voted ' + votes.week + (votes.week === 1 ? ' time' : ' times')
          + ' this week and sit at #' + rank.rank + '.';
      }
      return 'You voted ' + votes.week + (votes.week === 1 ? ' time' : ' times') + ' this week.';
    }

    function renderSummary() {
      var el = document.getElementById('inbox-summary');
      if (!el) return;
      var proposals = state.inbox && state.inbox.proposals;
      var open = proposals ? proposals.length : 0;
      // The cards show as soon as the inbox has loaded, including at zero:
      // an empty inbox is a real state (see the empty-inbox empty state),
      // and "0 open" is the header keeping count of it rather than
      // pretending the cards do not apply.
      if (state.tab !== 'inbox' || state.membersView || state.errorInbox
        || !state.inbox || state.compareView) {
        el.hidden = true;
        return;
      }
      var needed = 0;
      for (var i = 0; i < proposals.length; i++) {
        var n = proposals[i].needed;
        if (n != null && n > 0) needed += n;
      }
      var openLabel = open + ' open, ' + needed + (needed === 1 ? ' vote needed' : ' votes needed');
      var html = statTile('open', 'Open', String(open), needed + ' needed',
        ' role="group" aria-label="' + openLabel + '" title="' + openLabel + '"');

      var st = state.inboxStats;
      var votes = st && st.votes ? voteStreakStats(st.votes, Date.now()) : null;
      var rank = st ? inboxRankStats(st.lb) : null;
      var pending = !st;
      var line = '';
      if (pending) {
        html += statTile('week', 'This week', STAT_PENDING, 'votes', ' data-stat-loading="1"')
          + statTile('streak', 'Streak', STAT_PENDING, 'days', ' data-stat-loading="1"')
          + statTile('rank', 'Rank', STAT_PENDING, 'this week', ' data-stat-loading="1"');
      } else {
        html += votes
          ? statTile('week', 'This week', String(votes.week), votes.week === 1 ? 'vote' : 'votes',
            ' data-week="' + votes.week + '"')
          : statTile('week', 'This week', '—', 'no data', ' data-stat-error="1"');
        html += votes
          ? statTile('streak', 'Streak', String(votes.streak), votes.streak === 1 ? 'day' : 'days',
            ' data-streak="' + votes.streak + '"')
          : statTile('streak', 'Streak', '—', 'no data', ' data-stat-error="1"');
        if (rank.state === 'ranked') {
          html += statTile('rank', 'Rank', '#' + rank.rank, 'of ' + rank.of,
            ' data-rank="' + rank.rank + '" data-rank-of="' + rank.of + '"');
        } else if (rank.state === 'unranked') {
          html += statTile('rank', 'Rank', '—', 'no rank', ' data-rank="none"');
        } else if (rank.state === 'members') {
          html += statTile('rank', 'Rank', '—', 'members', ' data-rank="members"');
        } else {
          html += statTile('rank', 'Rank', '—', 'no data', ' data-stat-error="1"');
        }
        line = votes ? inboxMotivation(open, votes, rank)
          : 'Your vote stats could not load. Refresh to try again.';
      }
      el.innerHTML = '<div class="grid grid-cols-4 gap-2">' + html + '</div>'
        + (line ? '<p data-stat-line class="mt-2 text-xs text-zinc-600 dark:text-zinc-300">' + esc(line) + '</p>' : '');
      el.hidden = false;
    }

    // One-line unread summary under the open/votes-needed line, computed
    // from the loaded inbox (no extra request): how many loaded proposals
    // this account has not opened yet. Snoozed proposals are out of the
    // inbox until they wake, so they are not counted. The filters (app,
    // tag, search, the hide toggles) never change the count — it mirrors
    // the header totals, not whatever the visible list currently shows.
    function renderUnread() {
      var el = document.getElementById('inbox-unread');
      if (!el) return;
      var proposals = state.inbox && state.inbox.proposals;
      var open = proposals ? proposals.length : 0;
      if (state.tab !== 'inbox' || state.membersView || state.errorInbox || !open || state.compareView) {
        el.hidden = true;
        return;
      }
      var unread = 0;
      for (var i = 0; i < proposals.length; i++) {
        if (!isRead(proposals[i]) && !wakeActive(proposals[i])) unread++;
      }
      el.setAttribute('data-unread-count', String(unread));
      var text = el.querySelector('[data-unread-text]');
      if (text) {
        text.textContent = unread === 0 ? 'No unread proposals'
          : unread === 1 ? '1 unread' : unread + ' unread';
      }
      var btn = el.querySelector('[data-mark-all-read]');
      if (btn) btn.hidden = unread === 0;
      el.hidden = false;
    }

    // One-line summary under the header on the My Votes tab, computed from
    // the loaded history (no extra request): how many votes are recorded
    // and how many of their proposals ended up merged.
    function renderVotesSummary() {
      var el = document.getElementById('votes-summary');
      if (!el) return;
      var votes = state.votes && state.votes.votes;
      var total = votes ? votes.length : 0;
      // Same zero rule as the inbox summary: once the history has loaded,
      // "0 voted, 0 merged" is shown, not hidden (see emptyHtml's My Votes
      // empty state next to it).
      if (state.tab !== 'votes' || state.membersView || state.errorVotes
        || !state.votes) {
        el.hidden = true;
        return;
      }
      var merged = 0;
      for (var i = 0; i < votes.length; i++) {
        if (votes[i].status === 'merged') merged++;
      }
      el.textContent = total + ' voted, ' + merged + ' merged';
      el.hidden = false;
    }

    // ------------------------------------------------------------------
    // Share as image. Draws a fixed-size summary card (handle, votes this
    // week, merged count, top apps) onto a canvas from the already-loaded
    // My Votes rows, shows a preview above the list, and hands the PNG to
    // the native share sheet when the Web Share API can take files, with
    // Download and Copy link as the fallback. Nothing is persisted.
    // ------------------------------------------------------------------

    var SHARE_CARD_W = 1200;
    var SHARE_CARD_H = 630;
    var SHARE_CARD_FILE = 'vote-inbox-my-votes.png';
    var SHAREIMG_ERROR_TEXT = 'Could not make the image. Please try again.';

    // Stats from the loaded rows: votes cast in the last seven days (rows
    // without a parseable date don't count toward the week but still count
    // toward merged and top apps), merged count by the status each row was
    // last seen in, and up to three apps ranked by vote count (ties by name).
    function shareCardStats(votes) {
      votes = votes || (state.votes && state.votes.votes) || [];
      var cutoff = Date.now() - 7 * 86400000;
      var week = 0;
      var merged = 0;
      var byApp = {};
      for (var i = 0; i < votes.length; i++) {
        var v = votes[i] || {};
        var at = Date.parse(v.created_at);
        if (!isNaN(at) && at >= cutoff) week++;
        if (v.status === 'merged') merged++;
        var app = v.app_name || v.app_slug;
        if (app) byApp[app] = (byApp[app] || 0) + 1;
      }
      var apps = Object.keys(byApp).map(function (name) {
        return { name: name, count: byApp[name] };
      }).sort(function (a, b) {
        return b.count - a.count || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
      }).slice(0, 3);
      return {
        handle: (state.votes && state.votes.username) || '',
        week: week,
        merged: merged,
        apps: apps
      };
    }

    // Theme colours read at draw time, so the card follows light and dark.
    // Tile surface and border come from a hidden probe carrying the same
    // card classes the app renders with.
    function shareCardColors() {
      var bodyStyle = getComputedStyle(document.body);
      var summary = document.getElementById('votes-summary');
      var probe = document.createElement('div');
      probe.className = CARD_CLASS;
      probe.style.position = 'fixed';
      probe.style.visibility = 'hidden';
      probe.style.pointerEvents = 'none';
      document.body.appendChild(probe);
      var probeStyle = getComputedStyle(probe);
      var colors = {
        bg: bodyStyle.backgroundColor,
        text: bodyStyle.color,
        muted: summary ? getComputedStyle(summary).color : bodyStyle.color,
        tileBg: probeStyle.backgroundColor,
        tileBorder: probeStyle.borderColor,
        accent: '#7c3aed'
      };
      document.body.removeChild(probe);
      return colors;
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function ellipsizeText(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return text;
      while (text.length > 1 && ctx.measureText(text + '…').width > maxWidth) {
        text = text.slice(0, -1);
      }
      return text + '…';
    }

    // The draw itself. Throws on any failure (the demo ?shareimg=error hook
    // throws here on purpose, through the real error path); openShareImage
    // catches and shows the friendly message.
    function drawShareCard(stats) {
      if (SHAREIMG_MODE === 'error') {
        throw new Error('shareimg demo: forced render failure');
      }
      var canvas = document.createElement('canvas');
      canvas.width = SHARE_CARD_W;
      canvas.height = SHARE_CARD_H;
      var ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('canvas 2d context unavailable');
      var col = shareCardColors();
      var pad = 72;
      var innerW = SHARE_CARD_W - pad * 2;
      ctx.fillStyle = col.bg;
      ctx.fillRect(0, 0, SHARE_CARD_W, SHARE_CARD_H);
      ctx.textBaseline = 'alphabetic';
      // Violet mark + wordmark, top left.
      roundRectPath(ctx, pad, 64, 48, 48, 12);
      ctx.fillStyle = col.accent;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(pad + 13, 88 + 1);
      ctx.lineTo(pad + 22, 97);
      ctx.lineTo(pad + 35, 79);
      ctx.stroke();
      ctx.fillStyle = col.accent;
      ctx.font = '700 30px system-ui, sans-serif';
      ctx.fillText('Vote Inbox', pad + 66, 97);
      // Handle, large; ellipsised to the content width.
      ctx.fillStyle = col.text;
      ctx.font = '700 72px system-ui, sans-serif';
      if (stats.handle) {
        ctx.fillText(ellipsizeText(ctx, '@' + stats.handle, innerW), pad, 214);
      }
      // Two stat tiles: votes this week and merged.
      var tileW = (innerW - 24) / 2;
      var tileY = 250;
      var tileH = 140;
      ctx.font = '700 96px system-ui, sans-serif';
      var numW = Math.min(ctx.measureText(String(stats.week)).width + 56, tileW);
      var numW2 = Math.min(ctx.measureText(String(stats.merged)).width + 56, tileW);
      roundRectPath(ctx, pad, tileY, tileW, tileH, 16);
      ctx.fillStyle = col.tileBg;
      ctx.fill();
      ctx.strokeStyle = col.tileBorder;
      ctx.lineWidth = 2;
      ctx.stroke();
      roundRectPath(ctx, pad + tileW + 24, tileY, tileW, tileH, 16);
      ctx.fillStyle = col.tileBg;
      ctx.fill();
      ctx.strokeStyle = col.tileBorder;
      ctx.stroke();
      ctx.fillStyle = col.text;
      ctx.fillText(String(stats.week), pad + 28, tileY + 86);
      ctx.fillText(String(stats.merged), pad + tileW + 52, tileY + 86);
      ctx.fillStyle = col.muted;
      ctx.font = '500 26px system-ui, sans-serif';
      ctx.fillText('Votes this week', pad + 28, tileY + 122);
      ctx.fillText('Merged', pad + tileW + 52, tileY + 122);
      // Top apps: up to three lines, only when there are votes at all.
      if (stats.apps.length) {
        ctx.fillStyle = col.text;
        ctx.font = '700 28px system-ui, sans-serif';
        ctx.fillText('Top apps', pad, 462);
        ctx.fillStyle = col.muted;
        ctx.font = '400 26px system-ui, sans-serif';
        for (var i = 0; i < stats.apps.length; i++) {
          var line = stats.apps[i].name + ' · ' + stats.apps[i].count
            + (stats.apps[i].count === 1 ? ' vote' : ' votes');
          ctx.fillText(ellipsizeText(ctx, line, innerW), pad, 496 + i * 32);
        }
      }
      ctx.fillStyle = col.muted;
      ctx.font = '400 24px system-ui, sans-serif';
      ctx.fillText('My Votes on Homeroom', pad, SHARE_CARD_H - 40);
      return canvas;
    }

    // Sheet when the Web Share API can take this file; the demo ?shareimg=
    // param wins so the checks can pin either path. Keys off the API, never
    // device sniffing, the way resolveShareMode does.
    function resolveShareImageMode(file) {
      if (SHAREIMG_MODE && SHAREIMG_MODE !== 'error') return SHAREIMG_MODE;
      if (typeof navigator.share !== 'function') return 'fallback';
      if (typeof navigator.canShare === 'function'
        && !navigator.canShare({ files: [file] })) return 'fallback';
      return 'sheet';
    }

    function shareImageUrl() {
      return location.origin + location.pathname + '?tab=votes';
    }

    function shareCardCaption(stats) {
      var parts = [];
      if (stats.handle) parts.push('@' + stats.handle);
      parts.push(stats.week + (stats.week === 1 ? ' vote' : ' votes') + ' this week');
      parts.push(stats.merged + ' merged');
      if (stats.apps.length) {
        parts.push('Top apps: ' + stats.apps.map(function (a) { return a.name; }).join(', '));
      }
      return parts.join(' · ');
    }

    function renderShareImagePanel() {
      var panel = document.getElementById('shareimg-panel');
      if (!panel) return;
      var record = state.shareImage;
      var show = record && state.tab === 'votes' && !state.membersView;
      panel.hidden = !show;
      if (!show) { panel.innerHTML = ''; return; }
      if (record.error) {
        panel.innerHTML = '<p data-shareimg-error class="text-sm font-medium text-red-700 dark:text-red-300">'
          + esc(SHAREIMG_ERROR_TEXT) + '</p>';
        return;
      }
      var stats = record.stats;
      var caption = shareCardCaption(stats);
      var actions;
      if (record.mode === 'sheet') {
        actions = '<button data-shareimg-share type="button"'
          + ' class="min-h-10 flex-1 rounded-xl bg-violet-600 py-2 text-sm font-semibold text-white shadow-sm transition-transform hover:bg-violet-500 active:scale-95">Share</button>';
      } else {
        actions = '<button data-shareimg-download type="button"'
          + ' class="min-h-10 flex-1 rounded-xl bg-violet-600 py-2 text-sm font-semibold text-white shadow-sm transition-transform hover:bg-violet-500 active:scale-95">Download</button>'
          + '<button data-shareimg-copy type="button" data-url="' + esc(shareImageUrl()) + '"'

          + COPY_IDLE_HTML + '</button>';

        + ' data-week="' + stats.week + '" data-merged="' + stats.merged + '"'
        + ' data-theme="' + (document.documentElement.classList.contains('dark') ? 'dark' : 'light') + '"'
        + ' data-width="' + record.width + '" data-height="' + record.height + '"'
        + (stats.apps.length ? ' data-apps="' + esc(stats.apps.map(function (a) { return a.name; }).join(',')) + '"' : '')
        + ' class="' + CARD_CLASS + '">'

        + '<h2 class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">Share as image</h2>'
        + '<button data-shareimg-close type="button" class="rounded-full px-2 py-0.5 text-xs font-semibold text-zinc-500 transition-colors hover:text-zinc-700 dark:text-zinc-400 dark:hover:text-zinc-200">Close</button>'
        + '</div>'
        + '<img data-shareimg-preview src="' + record.dataUrl + '" alt="' + esc(caption) + '"'
        + ' class="w-full rounded-xl border border-zinc-200 dark:border-zinc-800">'
