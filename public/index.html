    tagTrigger.addEventListener('click', function () {
      if (openTag) closeTagFilter();
      else openTagFilterDropdown();
    });


    // Demo fixtures carry an anchor hint (days back from today; for day 0 how
    // many hours ago, plus a floor in minutes past local midnight). Recompute
    // proposedAt against the viewer's own calendar so "Today" and "This week"
    // hold no matter what hour the page is opened at: a sub-day fixture served
    // just after local midnight would otherwise land on yesterday's calendar
    // day and vanish from the Today group. Day-N rows are pinned to hour 12
    // local so their "Xd ago" reading stays exactly N days.
    function reanchorDemo(data) {
      if (!data || !data.demo) return;
      var now = new Date();
      var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      (data.proposals || []).forEach(function (p) {
        var a = p.demoAnchor;
        if (a) {
          var t;
          if (a.days === 0) {
            t = now.getTime() - (a.hoursAgo || 0) * 3600000;
            if (a.clampMin && t < midnight + a.clampMin * 60000) {
              t = midnight + a.clampMin * 60000;
            }
          } else {
            t = new Date(now.getFullYear(), now.getMonth(), now.getDate() - a.days, 12).getTime();
          }
          p.proposedAt = new Date(t).toISOString();
        }
        // Merge anchors stamp mergedAt the same way (local noon N days
        // back), so a fixture's opened→merged duration is whole days at any
        // hour — the app filter's median-to-merge reads whole days.
        var m = p.demoMergedAnchor;
        if (m) {
          var tm;
          if (m.days === 0) {
            tm = now.getTime() - (m.hoursAgo || 0) * 3600000;
          } else {
            tm = new Date(now.getFullYear(), now.getMonth(), now.getDate() - m.days, 12).getTime();
          }
          p.mergedAt = new Date(tm).toISOString();
        }
      });
    }

    // Digest demo rows carry demo_anchor { weeksAgo, weekday }; re-stamp
    // created_at to local noon of that weekday that many weeks back, so the
    // digest's week buckets hold no matter when the check runs (the same
    // idea as reanchorDemo above). weeksAgo 0 clamps the weekday to today's
    // and today's stamp to no later than now minus one minute (never before
    // 00:01), so nothing lands in the future. Merged rows get merged_at
    // equal to their new created_at, then rows are re-sorted created_at
    // desc, the order /api/my-votes serves.
    function reanchorDigestDemo(data) {
      if (!data || !data.demo) return;
      var now = new Date();
      var todayIdx = (now.getDay() + 6) % 7;
      var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var rows = data.votes || [];
      rows.forEach(function (r) {
        var a = r && r.demo_anchor;
        if (!a) return;
        var t;
        if (a.weeksAgo === 0) {
          var day = Math.min(Math.max(a.weekday, 0), todayIdx);
          t = midnight + day * 24 * 3600 * 1000 + 12 * 3600000;
          var max = now.getTime() - 60000;
          var min = midnight + 60000;
          if (t > max) t = max;
          if (t < min) t = min;
        } else {
          t = midnight - a.weeksAgo * 7 * 24 * 3600 * 1000
            + Math.min(Math.max(a.weekday, 0), 6) * 24 * 3600 * 1000 + 12 * 3600000;
        }
        r.created_at = new Date(t).toISOString();
        r.updated_at = r.created_at;
        if (r.status === 'merged') r.merged_at = r.created_at;
      });
      rows.sort(function (a, b) {
        return Date.parse(b.created_at) - Date.parse(a.created_at);
      });
    }

    // Inbox stat cards' data: the caller's vote history and the ranked
    // board, fetched together beside every inbox load. The cards keep their
    // last numbers while a refetch runs (no flash back to the loading
    // tiles), and a newer fetch always wins over an older one still in
    // flight. Either half failing leaves that half null; the cards say so.
    var inboxStatsSeq = 0;

    // The page is on its way out: a check hook (or anything else) called
    // location.replace/reload. beforeunload fires synchronously inside
    // those calls, so a hook that reloads during the inbox's completion
    // handlers is seen before the stat cards would start their fetches.
    var pageLeaving = false;
    window.addEventListener('beforeunload', function () { pageLeaving = true; });
    window.addEventListener('pagehide', function () { pageLeaving = true; });

    // The stat cards never compete with the inbox itself: their fetches
    // start only once the inbox load has settled and its hooks have run
    // (on the next tick), and not at all on a page that is reloading.
    function scheduleInboxStats() {
      if (pageLeaving) return;
      setTimeout(function () {
        if (!pageLeaving) loadInboxStats();
      }, 0);
    }

    function loadInboxStats() {
      if (pageLeaving) return Promise.resolve();
      var seq = ++inboxStatsSeq;
      state.loadingInboxStats = true;
      var votesQuery = '';
      var lbQuery = '';
      if (DEMO) {
        // Demo: the fixed My Votes fixture, and the demo board with the
        // caller ranked by that same fixture (?lb-me=1), so the two agree.
        // The empty-history knobs ride along to both.
        var extra = (NO_VOTES ? '&no-votes=1' : '')
          + (params.get('votes-empty') === '1' ? '&votes-empty=1' : '');
        votesQuery = '?demo=1' + extra;
        lbQuery = '?demo=1&lb-me=1' + extra;
      }
      var fail = function () { return null; };
      var votesReq = STATS_FAIL ? Promise.resolve(null)
        : api('/api/my-votes' + votesQuery).then(function (d) { return d.votes || []; }, fail);
      var lbReq = STATS_FAIL ? Promise.resolve(null)
        : api('/api/leaderboard' + lbQuery).then(function (d) { return d; }, fail);
      return Promise.all([votesReq, lbReq]).then(function (r) {
        if (seq !== inboxStatsSeq) return;
        state.inboxStats = { votes: r[0], lb: r[1] };
        state.loadingInboxStats = false;
        renderSummary();
      });
    }

    // A recorded or undone vote moves the week count, the streak and the
    // rank: refetch the stat cards once things settle (a bulk approve casts
    // several votes in a row, so the refetch is debounced).
    var inboxStatsTimer = null;
    function refreshInboxStatsSoon() {
      if (!state.inboxStats) return;
      clearTimeout(inboxStatsTimer);
      inboxStatsTimer = setTimeout(scheduleInboxStats, 800);
    }

    // One-shot fetch delay used by the ?stats-layout=1 check hook (see
    // maybeStatsLayout): loadInbox consumes and clears it per call.
    var inboxHoldMs = 0;

    function loadInbox(force) {
      if (state.loadingInbox) {
        // A pull or Refresh tap while a load is still in flight must still
        // end in a fresh fetch, not a silent no-op: queue one behind it.
        if (force) state.queuedInbox = true;
        return Promise.resolve();
      }
      state.loadingInbox = true;
      state.errorInbox = null;
      if (force) state.inbox = null;
      render();
      // An open app filter holds its rows with placeholder stats while the
      // refresh loads (see renderList), so it must re-render right away.
      if (activeFilterRender) activeFilterRender();
      var query = [];
      if (DEMO) query.push('demo=1');
      if (ALL_VOTED) query.push('allvoted=1');
      // ?empty=1 (demo only) asks the demo inbox for zero proposals — the
      // genuinely empty inbox behind the new empty state and its zero
      // header counts. Never sent without demo data.
      if (DEMO && params.get('empty') === '1' && !alertsArrived) query.push('empty=1');
      if (DEMO && params.get('estimate')) query.push('estimate=' + encodeURIComponent(params.get('estimate')));
      if (ALL_MERGED) query.push('allmerged=1');
      // Check-fixture variant on the hook's reload; see TURNOUT_REFRESH.
      if (turnoutAltNext) query.push('turnoutalt=1');
      if (PRESET_STAR) query.push('preset-star=' + encodeURIComponent(PRESET_STAR));
      if (SPLITS) query.push('splits=' + encodeURIComponent(SPLITS));
      if (DEMO) {
        for (var qi = 0; qi < QUEUE_PARAMS.length; qi++) {
          var qv = params.get(QUEUE_PARAMS[qi]);
          if (qv) query.push(QUEUE_PARAMS[qi] + '=' + encodeURIComponent(qv));
        }
        // Snooze fixture knobs, plus the snooze-set marker page: that one
        // forwards ?snooze=1 so the reload reads the persisted state back.
        for (var si = 0; si < SNOOZE_PARAMS.length; si++) {
          var sv = params.get(SNOOZE_PARAMS[si]);
          if (sv) query.push(SNOOZE_PARAMS[si] + '=' + encodeURIComponent(sv));
        }
        if (SNOOZE_SET) query.push('snooze=1');
        // Read fixture knobs, plus the read-set marker page: that one
        // forwards ?read=1 so the reload reads the persisted rows back.
        for (var ri = 0; ri < READ_PARAMS.length; ri++) {
          var rv = params.get(READ_PARAMS[ri]);
          if (rv) query.push(READ_PARAMS[ri] + '=' + encodeURIComponent(rv));
        }
        if (READ_SET) query.push('read=1');
        // Celebration fixture knobs (the ?celeb=1 opt-in marker itself
        // plus its ?celebvote= / ?celeb-clear=1 knobs), so the server runs
        // the real detection pass on those loads and returns the caller's
        // pending celebration cards. Never sent without demo data.
        if (CELEB) query.push('celeb=1');
        if (CELEBVOTE) query.push('celebvote=' + encodeURIComponent(CELEBVOTE));
        if (CELEB_CLEAR) query.push('celeb-clear=1');
        // Merge-stats fixture variant (?mergestats=1, staging demo only):
        // extra merged fixtures so the app filter's time-to-merge stats
        // have history to read. Never sent without demo data.
        if (params.get('mergestats') === '1') query.push('mergestats=1');
        // Bookmark fixture knobs: the display-only preset, the per-user
        // fixture and the saved-set marker page (that one has nothing to
        // forward itself, but its ?saved-mine= reader lives on the Saved
        // tab, not here). Never sent without demo data.
        if (PRESET_BOOKMARK) query.push('preset-bookmark=' + encodeURIComponent(PRESET_BOOKMARK));
        if (DEMO && params.get('saved-other') === '1') query.push('saved-other=1');
      }
      // One-shot delay (the ?stats-layout=1 hook): hold the fetch back so
      // the open dropdown is observable showing its placeholders mid-refresh.
      var holdMs = inboxHoldMs;
      inboxHoldMs = 0;
      function doFetch() {
        return api('/api/inbox' + (query.length ? '?' + query.join('&') : ''));
      }
      return (holdMs > 0
        ? new Promise(function (resolve) { setTimeout(resolve, holdMs); }).then(doFetch)
        : doFetch())
        .then(function (data) {
          state.inbox = data;
          // Pending celebration cards the server recorded (only sent on a
          // ?celeb=1 demo load, or always in production). A payload without
          // the field just means "none" — the same optional-field contract
          // the change summary uses.
          state.celebrations = Array.isArray(data.celebrations) ? data.celebrations : [];
          if (data.demo) reanchorDemo(data);
          applyNewSince(data);
          resolveCompareSelection();
          state.inboxLoadedAt = new Date().toISOString();
          reapplyRetryQueue();
          pruneSelection();
          maybeAutoCast();
          maybeDigestVote();
          maybeAutoExpand();
          maybePresetSummary();
          if (alertsPolling) announceNewProposals();
          else if (state.alertsOn) rememberInboxIds();
        })
        .catch(function (err) {
          // A background alerts poll that fails keeps the screen as it was;
          // the next poll tries again.
          if (alertsPolling) return;
          state.errorInbox = err.message || 'Could not load proposals.';
        })
        .then(function () {
          state.loadingInbox = false;
          alertsPolling = false;
          render();
          scheduleInboxStats();
          maybeRerenderFilter();
          maybeEmptyInboxHooks();
          maybeAutoOpenFilter();
          maybeTapAppOption();
          maybeStatsLayout();
          maybeFilterPhone();
          if (APP_FILTER_OPEN && !appFilterOpened && state.inbox
            && state.tab === 'inbox' && !state.errorInbox) {
            appFilterOpened = true;
            openAppFilter();
          }
          maybeTurnoutRefresh();
          maybeTapNo();
          maybeTapShare();
          maybeApplyBulkHooks();
          maybeRerenderTagFilter();
          maybeAutoOpenTagFilter();
          maybeTapTag();
          maybeTapStar();
          maybeTapFollow();
          maybeTapBookmark();
          maybeTapUnbookmark();
          maybeTapSnooze();
          maybeSetSnooze();
          maybeTapUnsnooze();
          maybeTapOpen();
          maybeSetRead();
          maybeMarkAllRead();
          maybeOpenMerged();
          maybeTapHideRead();
          maybeTapMenu();
          maybeTapDensity();
          maybeDensityFit();
          markCelebrationsShown();
          announceCelebrations();
          maybeCelebrationReload();
          maybeCelebrationDismiss();
          maybeCelebrationSeeMerged();
          maybeTapSummary();
          maybeTapSearch();
          maybeTapImpactToggle();
          maybeTapCard();
          maybeTapBack();
          maybeScrollDetail();
          maybeAutoComment();
          maybeAutoReply();
          // A ?proposal= deep link lands on the inbox first; once the list
          // holds the proposal, the detail view can load its thread.
          // A ?proposal= deep link lands on the inbox first; once the list holds the
          // proposal, the detail view can load its thread — and opening it
          // that way marks the proposal read, same as the Discuss button.
          if (state.detail && findProposal(state.detail)) {
            markRead(findProposal(state.detail));
            loadDetailComments();
          }
          maybeCompareHooks();
          if (state.queuedInbox) {
            state.queuedInbox = false;
            loadInbox(true);
          }
        });
    }

    function loadVotes(force) {
      if (state.loadingVotes) {
        // Same as loadInbox: a pull while the tab-switch fetch is still
        // running queues one fresh refetch instead of doing nothing.
        if (force) state.queuedVotes = true;
        return Promise.resolve();
      }
      state.loadingVotes = true;
      state.errorVotes = null;
      if (force) state.votes = null;
      render();
      // ?votes-empty=1 (demo only) asks the demo route for an empty
      // history, so the tab's empty state and its zero summary are
      // reachable by checks. Never sent without demo data.
      return api('/api/my-votes' + (DEMO ? '?demo=1'
        + (NO_VOTES ? '&no-votes=1' : '')
        + (params.get('votes-empty') === '1' ? '&votes-empty=1' : '')
        + (DIGEST ? '&digest=' + encodeURIComponent(DIGEST) : '') : ''))
        .then(function (data) {
          state.votes = data;
          if (data.demo) reanchorDigestDemo(data);
        })
        .catch(function (err) {
          state.errorVotes = err.message || 'Could not load your votes.';
        })
        .then(function () {
          state.loadingVotes = false;
          render();
          maybeTapShareImage();
          maybeTapDigestDetails();
          maybeDigestVote();
          if (state.queuedVotes) {
            state.queuedVotes = false;
            loadVotes(true);
          }
        });
    }

    function refreshCurrent() {
      if (state.membersView) return loadMembers(true);
      // The Following tab reads the same inbox data the Inbox loads.
      return state.tab === 'inbox' || state.tab === 'following' ? loadInbox(true)
        : state.tab === 'votes' ? loadVotes(true)
        : state.tab === 'saved' ? loadSaved(true)
        : state.tab === 'leaderboard' ? loadLeaderboard(true)
        : loadWatchlist(true);
    }

    // ------------------------------------------------------------------
    // Members directory: data and open/close. The header Members button
    // toggles the directory over the current tab; ?members=1 deep-links
    // straight into it. Closing returns to the tab the user came from and
    // fetches its list if it was never loaded (the boot went to the
    // directory instead).
    // ------------------------------------------------------------------

    function loadMembers(force) {
      if (state.loadingMembers) {
        // Same queued-refetch contract as the tabs: a pull or Refresh tap
        // while a load is in flight queues one fresh fetch.
        if (force) state.queuedMembers = true;
        return Promise.resolve();
      }
      state.loadingMembers = true;
      state.errorMembers = null;
      if (force) state.members = null;
      render();
      return api('/api/members' + (DEMO ? '?demo=1' : ''))
        .then(function (data) { state.members = data; })
        .catch(function (err) {
          state.errorMembers = err.message || 'Could not load members.';
        })
        .then(function () {
          state.loadingMembers = false;
          render();
          if (state.queuedMembers) {
            state.queuedMembers = false;
            loadMembers(true);
          }
        });
    }

    function syncMembersUrl() {
      var url = new URL(location.href);
      if (state.membersView) url.searchParams.set('members', '1');
      else url.searchParams.delete('members');
      history.replaceState(null, '', url.pathname + url.search + url.hash);
    }

    function openMembers() {
      state.membersView = true;
      syncMembersUrl();
      render();
      window.scrollTo(0, 0);
      loadMembers(!state.members);
    }

    function closeMembers() {
      state.membersView = false;
      syncMembersUrl();
      render();
      window.scrollTo(0, 0);
      if (state.tab === 'votes') loadVotes(!state.votes);
      else if (state.tab === 'saved') loadSaved(!state.saved);
      else if (state.tab === 'watchlist') loadWatchlist(!state.watchlist);
      else if (state.tab === 'leaderboard') loadLeaderboard(!state.leaderboard);
      else loadInbox(!state.inbox);
    }

    // ------------------------------------------------------------------
    // Voters leaderboard: data and loading. Same contract as the other
    // tabs: one fetch per visit (a force reload clears what is on screen),
    // a queued refetch when a pull or Refresh lands mid-load, and the
    // caller's own row carried on the payload so the highlight and pin
    // never guess who is signed in.
    // ------------------------------------------------------------------

    function loadLeaderboard(force) {
      if (state.loadingLeaderboard) {
        if (force) state.queuedLeaderboard = true;
        return Promise.resolve();
      }
      state.loadingLeaderboard = true;
      state.errorLeaderboard = null;
      if (force) state.leaderboard = null;
      render();
      var query = [];
      if (DEMO) {
        query.push('demo=1');
        // Demo knobs: overlay the caller's real aggregated row on the
        // fixture (?lb=1), after clearing their demo-cast rows first
        // (?lb-clear=1) so shared-database check runs start from a known
        // count. The server ignores both outside demo data.
        if (LB_OVERLAY) query.push('lb=1');
        // lb-clear is one-shot: it must run on the FIRST board fetch (before
        // the ?cast= hook can fire) so a shared-database check run starts
        // from a known count, but not on the refetch a fresh cast triggers,
        // which would delete the vote it is about to show.
        if (LB_CLEAR) { query.push('lb-clear=1'); LB_CLEAR = false; }
        // Fixture variants for the checks (?lb-many=1, ?lb-tie=1,
        // ?lb-empty=1) are server-side fixtures: forward them so the
        // response carries the variant the page URL asked for.
        if (LB_MANY) query.push('lb-many=1');
        if (LB_TIE) query.push('lb-tie=1');
        if (LB_EMPTY) query.push('lb-empty=1');
      }
      return api('/api/leaderboard' + (query.length ? '?' + query.join('&') : ''))
        .then(function (data) { state.leaderboard = data; })
        .catch(function (err) {
          state.errorLeaderboard = err.message || 'Could not load the leaderboard.';
        })
        .then(function () {
          state.loadingLeaderboard = false;
          render();
          if (state.queuedLeaderboard) {
            state.queuedLeaderboard = false;
            loadLeaderboard(true);
          }
        });
    }

    function loadWatchlist(force) {
      if (state.loadingWatchlist) {
        // Same queued-refetch contract as the other two tabs: a pull or
        // Refresh tap while a load is in flight queues one fresh fetch.
        if (force) state.queuedWatchlist = true;
        return Promise.resolve();
      }
      state.loadingWatchlist = true;
      state.errorWatchlist = null;
      if (force) state.watchlist = null;
      render();
      var query = [];
      if (DEMO) query.push('demo=1');
      if (WATCH_MINE) query.push('watch-mine=1');
      if (WATCH_EMPTY) query.push('watch-empty=1');
      if (WATCH_SEEN) query.push('watch-seen=1');
      return api('/api/watchlist' + (query.length ? '?' + query.join('&') : ''))
        .then(function (data) {
          state.watchlist = data;
          markWatchlistSeen(data);
        })
        .catch(function (err) {
          state.errorWatchlist = err.message || 'Could not load your watchlist.';
        })
        .then(function () {
          state.loadingWatchlist = false;
          render();
          maybeTapStar();
          if (state.queuedWatchlist) {
            state.queuedWatchlist = false;
            loadWatchlist(true);
          }
        });
    }

    // The Saved tab's data: this user's bookmarked rows. Same queued-refetch
    // contract as the other tabs. Demo forwards the ?saved-mine= and
    // ?saved-empty= knobs to the demo route; production ignores them.
    function loadSaved(force) {
      if (state.loadingSaved) {
        if (force) state.queuedSaved = true;
        return Promise.resolve();
      }
      state.loadingSaved = true;
      state.errorSaved = null;
      if (force) state.saved = null;
      render();
      var query = [];
      if (DEMO) query.push('demo=1');
      if (SAVED_MINE) query.push('saved-mine=' + encodeURIComponent(SAVED_MINE));
      if (SAVED_EMPTY) query.push('saved-empty=1');
      return api('/api/bookmarks' + (query.length ? '?' + query.join('&') : ''))
        .then(function (data) {
          state.saved = data;
        })
        .catch(function (err) {
          state.errorSaved = err.message || 'Could not load your saved proposals.';
        })
        .then(function () {
          state.loadingSaved = false;
          render();
          maybeTapBookmark();
          maybeTapUnbookmark();
          if (state.queuedSaved) {
            state.queuedSaved = false;
            loadSaved(true);
          }
        });
    }

    // Once per load of watchlist data: record the status each row showed at
    // this view, so the next visit only badges what changed since. Demo
    // fixtures are static, so there is nothing to record there.
    function markWatchlistSeen(data) {
      if (state.watchSeenMarked) return;
      if (!data || data.demo || !data.rows || !data.rows.length) return;
      var statuses = [];
      for (var i = 0; i < data.rows.length; i++) {
        if (data.rows[i].status) {
          statuses.push({ sessionId: data.rows[i].sessionId, status: data.rows[i].status });
        }
      }
      if (!statuses.length) return;
      state.watchSeenMarked = true;
      api('/api/watchlist/seen', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ statuses: statuses }),
      }).catch(function () { /* best effort; badges just re-show next time */ });
    }

    // ------------------------------------------------------------------
    // Voting
    // ------------------------------------------------------------------

    function findProposal(sessionId) {
      var proposals = (state.inbox && state.inbox.proposals) || [];
      for (var i = 0; i < proposals.length; i++) {
        if (proposals[i].sessionId === sessionId) return proposals[i];
      }
      return null;
    }

    // ------------------------------------------------------------------
    // Bulk triage. Select mode puts a checkbox on every card a bulk action
    // could still act on (unvoted, not merged/closed); the bar casts Yes or
    // No over the whole selection, one card at a time through the same
    // castVote the one-tap buttons use, so per-card optimistic marks,
    // offline retry queuing and rollbacks all behave exactly as before.
    // ------------------------------------------------------------------

    function toggleSelect(sessionId) {
      var p = findProposal(sessionId);
      if (!p || isVoted(p) || p.status === 'merged' || p.status === 'closed') return;
      if (state.selected[sessionId]) delete state.selected[sessionId];
      else state.selected[sessionId] = true;
      render();
    }

    function setSelectMode(on) {
      state.selectMode = !!on;
      if (!state.selectMode) state.selected = {};
      render();
    }

    // Drop selections whose proposal is no longer in the loaded inbox (a
    // refresh replaced the list); everything else survives filter, search
    // and sort changes untouched.
    function pruneSelection() {
      for (var id in state.selected) {
        if (!findProposal(id)) delete state.selected[id];
      }
    }

    // Cast one vote per selected card, sequentially so the cards' pending
    // states render one after another and the platform sees an ordinary
    // vote each. Cards voted meanwhile are skipped. Afterwards the selection
    // drops what is now voted (their checkboxes are gone) so the counter
    // reflects what is still actionable, and one toast names the outcome.
    function bulkApply(choice) {
      var ids = [];
      for (var id in state.selected) {
        var p = findProposal(id);
        if (p && !isVoted(p) && p.status !== 'merged' && p.status !== 'closed') ids.push(id);
      }
      if (!ids.length || state.bulkBusy) return;
      state.bulkBusy = true;
      render();
      var seq = Promise.resolve();
      ids.forEach(function (sessionId) {
        seq = seq.then(function () { return castVote(sessionId, choice); });
      });
      return seq.then(function () {
        state.bulkBusy = false;
        for (var i = 0; i < ids.length; i++) {
          var p = findProposal(ids[i]);
          if (!p || isVoted(p)) delete state.selected[ids[i]];
        }
        render();
        toast((choice === 'yes' ? 'Approved ' : 'Hid ') + ids.length
          + (ids.length === 1 ? ' proposal' : ' proposals'), { duration: 5000 });
      });
    }

    // Classify a failed vote request. "Offline" means the request never got
    // an HTTP answer: the browser reports the device offline, or the fetch
    // itself rejected (an error carrying no HTTP .status — airplane mode,
    // no connection, the request never leaving the page). A refusal the
    // server DID send (4xx/5xx) is not an offline failure and rolls back
    // exactly as before.
    function isOfflineFailure(err) {
      if (navigator.onLine === false) return true;
      return !err || typeof err.status !== 'number';
    }

    // ?failvote=1 simulation: reject exactly the way a fetch does when the
    // device is offline — no HTTP status at all.
    function simulatedOfflineError() {
      var err = new Error('Failed to fetch');
      err.name = 'TypeError';
      return err;
    }

    function votePayload(sessionId, choice, p, snapshot) {
      return {
        sessionId: sessionId,
        choice: choice,
        appSlug: p.appSlug,
        appName: p.appName,
        title: p.title,
        proposalId: p.proposalId,
        yes: snapshot.yes,
        no: snapshot.no,
        required: p.required,
        demo: !!(state.inbox && state.inbox.demo),
      };
    }

    // Keep the in-memory history in step after a successful vote so the My
    // Votes list, its summary line, the tab count and the weekly digest all
    // update together without a refetch. The next tab switch still refetches
    // (server truth replaces the local row), and when the history was never
    // loaded there is nothing to update: the next load fetches it as today.
    function upsertLocalVote(payload) {
      if (!state.votes || !state.votes.votes) return;
      var now = new Date().toISOString();
      var votes = state.votes.votes.filter(function (v) {
        return v.session_id !== payload.sessionId;
      });
      votes.unshift({
        id: 'local-' + payload.sessionId,
        app_slug: payload.appSlug,
        app_name: payload.appName,
        session_id: payload.sessionId,
        proposal_id: payload.proposalId,
        title: payload.title,
        choice: payload.choice,
        status: 'voting',
        votes_for: payload.yes,
        votes_against: payload.no,
        votes_required: payload.required,
        created_at: now,
        updated_at: now,
        merged_at: null,
      });
      state.votes.votes = votes;
    }

    function removeLocalVote(sessionId) {
      if (!state.votes || !state.votes.votes) return;
      state.votes.votes = state.votes.votes.filter(function (v) {
        return v.session_id !== sessionId;
      });
    }

    function castVote(sessionId, choice) {
      var p = findProposal(sessionId);
      if (!p || state.pending[sessionId]) return;
      var snapshot = { myVote: p.myVote, yes: p.yes, no: p.no };
      state.pending[sessionId] = true;
      // Optimistic: show the vote immediately, roll back on failure.
      p.myVote = choice;
      if (choice === 'yes') p.yes += 1; else p.no += 1;
      render();
      var payload = votePayload(sessionId, choice, p, snapshot);
      var request;
      if (FAILVOTE && state.inbox && state.inbox.demo) {
        // Demo fixture only: one simulated offline failure per load.
        FAILVOTE = false;
        request = Promise.reject(simulatedOfflineError());
      } else {
        request = api('/api/vote', {
          method: 'POST',
          headers: headers({ 'content-type': 'application/json' }),
          body: JSON.stringify(payload),
        });
      }
      // The full chain resolves whether the vote recorded, was refused by
      // the server or went to the retry queue (the catch below swallows the
      // error either way), so the bulk pass can await it cast by cast.
      return request.then(function () {
        upsertLocalVote(payload); // history updates in place; refetched next tab open
        refreshInboxStatsSoon();
        // The leaderboard ranks by votes cast, so a fresh vote moves it;
        // refetch now when the board is up, or drop the cache so the next
        // visit to the tab reloads it.
        state.leaderboard = null;
        if (state.tab === 'leaderboard') loadLeaderboard(true);
        toast('Vote recorded', {
          duration: 5000,
          action: {
            label: 'Undo',
            handler: function () { undoVote(sessionId, choice, snapshot); },
          },
        });
      }).catch(function (err) {
        if (isOfflineFailure(err)) {
          // Offline: keep the card marked and queue an in-memory retry.
          // The vote never reached the platform, so My Votes stays without
          // it until a retry succeeds.
          state.retryQueue[sessionId] = { choice: choice, payload: payload, snapshot: snapshot };
          toast('Vote not sent: you seem offline. Tap Retry on the card.');
        } else {
          p.myVote = snapshot.myVote;
          p.yes = snapshot.yes;
          p.no = snapshot.no;
          toast('Vote failed: ' + (err.message || 'try again'));
        }
      }).then(function () {
        delete state.pending[sessionId];
        render();
      });
    }

    // Retry a vote that failed offline: resend the exact same request. On
    // success the card's optimistic state is now the platform's truth, the
    // pill goes away and My Votes refetches. Still offline: the card stays
    // marked and queued. A server refusal (the platform answered and said
    // no) rolls the card back like any other failed vote.
    function retryVote(sessionId) {
      var entry = state.retryQueue[sessionId];
      var p = findProposal(sessionId);
      if (!entry || !p || state.pending[sessionId]) return;
      state.pending[sessionId] = true;
      render();
      api('/api/vote', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify(entry.payload),
      }).then(function () {
        delete state.retryQueue[sessionId];
        upsertLocalVote(entry.payload); // history updates in place; refetched next tab open
        refreshInboxStatsSoon();
        state.leaderboard = null; // same as castVote: the board re-ranks
        if (state.tab === 'leaderboard') loadLeaderboard(true);
        toast('Vote recorded', {
          duration: 5000,
          action: {
            label: 'Undo',
            handler: function () { undoVote(sessionId, entry.choice, entry.snapshot); },
          },
        });
      }).catch(function (err) {
        if (isOfflineFailure(err)) {
          toast('Still offline. Your vote stays on the card to retry.');
        } else {
          delete state.retryQueue[sessionId];
          p.myVote = entry.snapshot.myVote;
          p.yes = entry.snapshot.yes;
          p.no = entry.snapshot.no;
          toast('Vote failed: ' + (err.message || 'try again'));
        }
      }).then(function () {
        delete state.pending[sessionId];
        render();
      });
    }

    // Reapply the in-memory retry queue to a freshly loaded inbox: a card
    // whose vote never reached the platform stays marked voted, with its
    // optimistic count restored, until a retry succeeds. Entries whose
    // proposal is no longer listed are dropped: there is no card left to
    // retry them on.
    function reapplyRetryQueue() {
      for (var sessionId in state.retryQueue) {
        var entry = state.retryQueue[sessionId];
        var p = findProposal(sessionId);
        if (!p) { delete state.retryQueue[sessionId]; continue; }
        p.myVote = entry.choice;
        if (entry.choice === 'yes') p.yes += 1; else p.no += 1;
      }
    }

    // Undo a just-cast vote: drop this app's record of it and roll the card
    // back to its pre-vote counts so the user can vote again. The platform's
    // own tally stays authoritative and is refetched on the next inbox load.
    function undoVote(sessionId, choice, snapshot) {
      var p = findProposal(sessionId);
      api('/api/unvote', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ sessionId: sessionId }),
      }).then(function () {
        if (p && p.myVote === choice) {
          p.myVote = snapshot.myVote;
          p.yes = snapshot.yes;
          p.no = snapshot.no;
        }
        removeLocalVote(sessionId); // history updates in place; refetched next tab open
        refreshInboxStatsSoon();
        state.leaderboard = null; // the undone vote leaves the board too
        if (state.tab === 'leaderboard') loadLeaderboard(true);
        toast('Vote undone');
      }).catch(function (err) {
        toast('Undo failed: ' + (err.message || 'try again'));
      }).then(render);
    }

    // Star / unstar from wherever the button sits: an inbox card or a
    // Watchlist row. Optimistic in both directions, rolled back on failure;
    // the star request carries the card's own fields so the server can
    // store the row without a second lookup.
    function toggleStar(sessionId) {
      var p = findProposal(sessionId);
      var r = null;
      if (!p && state.watchlist && state.watchlist.rows) {
        var rows = state.watchlist.rows;
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].sessionId === sessionId) { r = rows[i]; break; }
        }
      }
      if (!p && !r) return;
      var pendingKey = 'star:' + sessionId;
      if (state.starPending[pendingKey]) return;
      var wasStarred, payload, rowIdx = -1;
      if (p) {
        wasStarred = !!p.myStar;
        payload = {
          sessionId: sessionId,
          appSlug: p.appSlug,
          appName: p.appName,
          title: p.title,
          proposalId: p.proposalId,
          status: p.status === 'proposed' ? 'voting' : (p.status || 'voting'),
          demo: !!(state.inbox && state.inbox.demo),
        };
      } else {
        wasStarred = true;
        rowIdx = state.watchlist.rows.indexOf(r);
        payload = {
          sessionId: sessionId,
          appSlug: r.appSlug,
          appName: r.appName,
          title: r.title,
          proposalId: r.proposalId,
          status: r.status === 'proposed' ? 'voting' : (r.status || 'voting'),
          demo: !!(state.watchlist && state.watchlist.demo),
        };
      }
      state.starPending[pendingKey] = true;
      if (p) p.myStar = !wasStarred;
      if (r) state.watchlist.rows.splice(rowIdx, 1);
      render();
      var request = wasStarred
        ? api('/api/watchlist/unstar', {
            method: 'POST',
            headers: headers({ 'content-type': 'application/json' }),
            body: JSON.stringify({ sessionId: sessionId, demo: payload.demo }),
          })
        : api('/api/watchlist/star', {
            method: 'POST',
            headers: headers({ 'content-type': 'application/json' }),
            body: JSON.stringify(payload),
          });
      request.then(function () {
        toast(wasStarred ? 'Removed from Watchlist' : 'Added to Watchlist');
      }).catch(function (err) {
        // Roll the optimistic state back so the card/row shows the truth.
        if (p) p.myStar = wasStarred;
        if (r && rowIdx >= 0) state.watchlist.rows.splice(rowIdx, 0, r);
        toast('Could not update the watchlist: ' + (err.message || 'try again'));
      }).then(function () {
        delete state.starPending[pendingKey];
        render();
      });
    }

    // Bookmark / unbookmark from wherever the button sits: an inbox card or
    // the detail's action bar. Optimistic in both directions, rolled back on
    // failure; the save request carries the card's own fields so the server
    // can store the row without a second lookup. Unbookmarking a Saved-row
    // drops the row at once (the immediate-removal rule).
    function toggleBookmark(sessionId) {
      var r = null;
      if (state.saved && state.saved.rows) {
        var rows = state.saved.rows;
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].sessionId === sessionId) { r = rows[i]; break; }
        }
      }
      var p = findProposal(sessionId);
      if (!p && !r) return;
      var pendingKey = 'bookmark:' + sessionId;
      if (state.savedPending[pendingKey]) return;
      // A row on the Saved tab is a bookmark by definition, even when the
      // inbox card under it has not been stamped (demo fixture rows carry
      // no stamp). Otherwise the card's own state decides.
      var wasBookmarked = r ? true : !!p.myBookmark;
      var from = p || r;
      var rowIdx = r ? state.saved.rows.indexOf(r) : -1;
      var payload = {
        sessionId: sessionId,
        appSlug: from.appSlug,
        appName: from.appName,
        title: from.title,
        proposalId: from.proposalId,
        demo: !!((p && state.inbox && state.inbox.demo)
          || (state.saved && state.saved.demo)),
      };
      state.savedPending[pendingKey] = true;
      var original = p ? !!p.myBookmark : null;
      if (p) p.myBookmark = !wasBookmarked;
      if (r) state.saved.rows.splice(rowIdx, 1);
      render();
      var request = wasBookmarked
        ? api('/api/bookmarks/unsave', {
            method: 'POST',
            headers: headers({ 'content-type': 'application/json' }),
            body: JSON.stringify({ sessionId: sessionId, demo: payload.demo }),
          })
        : api('/api/bookmarks/save', {
            method: 'POST',
            headers: headers({ 'content-type': 'application/json' }),
            body: JSON.stringify(payload),
          });
      request.then(function () {
        toast(wasBookmarked ? 'Removed from Saved' : 'Saved to your list');
      }).catch(function (err) {
        // Roll the optimistic state back so the card/row shows the truth.
        if (p) p.myBookmark = original === null ? wasBookmarked : original;
        if (r && rowIdx >= 0) state.saved.rows.splice(rowIdx, 0, r);
        toast('Could not update your saved list: ' + (err.message || 'try again'));
      }).then(function () {
        delete state.savedPending[pendingKey];
        render();
      });
    }

    // ------------------------------------------------------------------
    // Snooze: tuck a proposal away until a wake date. The wake stamp is per
    // user and purely a view concern — it never touches the vote or the
    // merge state, so a snoozed card stays votable and the header summary
    // keeps counting it. An expired wake no longer holds the card, so
    // snoozed proposals reappear on their own; the frontend also ignores any
    // stale wake stamp it is handed, in case a row outlived its cleanup.
    // ------------------------------------------------------------------

    // "Mon, Oct 20" label for a wake time (or any timestamp).
    function wakeDateLabel(t) {
      var d = new Date(t);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    // Is this proposal actively snoozed? A wake time still ahead holds it.
    function wakeActive(p) {
      var t = p && p.mySnooze ? Date.parse(p.mySnooze) : NaN;
      return !isNaN(t) && t > Date.now();
    }

    function anySnoozed(exceptSessionId) {
      var list = (state.inbox && state.inbox.proposals) || [];
      for (var i = 0; i < list.length; i++) {
        var q = list[i];
        if (q.sessionId !== exceptSessionId && wakeActive(q)) return true;
      }
      return false;
    }

    function snoozePayload(sessionId, days, p) {
      return {
        sessionId: sessionId,
        days: days,
        appSlug: p.appSlug || '',
        appName: p.appName || '',
        proposalId: p.proposalId || null,
        title: p.title || 'Untitled proposal',
        demo: !!(state.inbox && state.inbox.demo),
      };
    }

    function snoozeProposal(sessionId, days) {
      var p = findProposal(sessionId);
      if (!p || state.pending['snooze:' + sessionId]) return;
      state.pending['snooze:' + sessionId] = true;
      api('/api/snooze', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify(snoozePayload(sessionId, days, p)),
      }).then(function () {
        p.mySnooze = new Date(Date.now() + days * 86400000).toISOString();
        state.snoozeMenu = null;
        toast('Snoozed until ' + wakeDateLabel(p.mySnooze));
      }).catch(function (err) {
        toast('Could not snooze: ' + (err.message || 'try again'));
      }).then(function () {
        delete state.pending['snooze:' + sessionId];
        render();
      });
    }

    function unsnoozeProposal(sessionId) {
      var p = findProposal(sessionId);
      if (!p || state.pending['snooze:' + sessionId]) return;
      state.pending['snooze:' + sessionId] = true;
      api('/api/unsnooze', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ sessionId: sessionId }),
      }).then(function () {
        p.mySnooze = null;
        state.snoozeMenu = null;
        // Unsnoozing the last snoozed proposal empties the Snoozed filter;
        // return to the main inbox so the proposal that just came back is
        // what the user sees. With rows left, stay in the filter.
        if (state.snoozeView && !anySnoozed(sessionId)) state.snoozeView = false;
        toast('Snooze removed');
      }).catch(function (err) {
        toast('Could not unsnooze: ' + (err.message || 'try again'));
      }).then(function () {
        delete state.pending['snooze:' + sessionId];
        render();
      });
    }

    // Confirm before a No vote: rejecting is the direction worth a second
    // look (it can sink a proposal), so the card's "No" button opens a small
    // confirm first; "Yes" stays one-tap. The native kit's alert carries the
    // dialog where it is available (native styling, keyboard avoidance);
    // standalone or kit-less loads get a plain in-app dialog with the same
    // two answers. The kit both invokes the button's handler and resolves
    // its promise, so confirmNo guards against casting twice.
    function openNoConfirm(sessionId) {
      var p = findProposal(sessionId);
      if (!p) return;
      var title = 'Reject this proposal?';
      var message = 'Your No vote on "' + p.title + '" will be recorded right away.';
      var confirmed = false;
      var confirmNo = function () {
        if (confirmed) return;
        confirmed = true;
        castVote(sessionId, 'no');
      };
      if (window.unNative && unNative.alert) {
        try {
          var answered = unNative.alert({
            title: title,
            message: message,
            buttons: [
              { label: 'No, reject', style: 'destructive', handler: confirmNo },
              { label: 'Cancel', style: 'cancel' },
            ],
          });
          if (answered && typeof answered.then === 'function') {
            answered.then(function (res) {
              var label = res && res.button;
              if (label && typeof label === 'object') label = label.label;
              if (label === 'No, reject') confirmNo();
            }).catch(function () { /* dismissed; nothing to cast */ });
          }
          return;
        } catch (e) { /* fall through to the plain dialog */ }
      }
      fallbackNoConfirm(title, message, confirmNo);
    }

    // Plain in-app confirm for loads without the native kit. Same two
    // answers, same wording; the backdrop tap and Cancel both dismiss.
    function fallbackNoConfirm(title, message, confirmNo) {
      var overlay = document.createElement('div');
      overlay.setAttribute('data-no-confirm', '');
      overlay.setAttribute('role', 'alertdialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', title);
      overlay.className = 'fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-6';
      overlay.innerHTML = '<div class="w-64 rounded-2xl bg-white p-4 text-center shadow-xl dark:bg-zinc-900">'
        + '<p class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + esc(title) + '</p>'
        + '<p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">' + esc(message) + '</p>'
        + '<div class="mt-3 flex flex-col gap-2">'
        + '<button data-no-confirm-reject class="min-h-9 rounded-xl bg-red-600 py-2 text-sm font-semibold text-white active:scale-95">No, reject</button>'
        + '<button data-no-confirm-cancel class="min-h-9 rounded-xl bg-zinc-100 py-2 text-sm font-semibold text-zinc-700 active:scale-95 dark:bg-zinc-800 dark:text-zinc-200">Cancel</button>'
        + '</div></div>';
      var close = function () {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      };
      overlay.addEventListener('click', function (event) {
        if (event.target.closest('[data-no-confirm-reject]')) { close(); confirmNo(); }
        else if (event.target.closest('[data-no-confirm-cancel]') || event.target === overlay) close();
      });
      document.body.appendChild(overlay);
    }

    // First button whose visible text matches exactly, whatever surface
    // rendered it (kit alert or fallback dialog). Used by the staging tap
    // hook below to press the dialog's answer.
    function findButtonByText(text) {
      var buttons = document.querySelectorAll('button');
      for (var i = 0; i < buttons.length; i++) {
        if (buttons[i].textContent.trim() === text) return buttons[i];
      }
      return null;
    }

    // Staging demo hook: ?demo=1&tap-share=<sessionId> clicks that card's
    // share button once the demo inbox has rendered — the real button,
    // through the real delegated click handler — so the copy confirmation
    // is reachable by a check (pair it with &share=copy so the copy path
    // is deterministic in the check browser). Demo only; one-shot.
    var tapShareDone = false;
    function maybeTapShare() {
      if (!DEMO || !TAP_SHARE || tapShareDone) return;
      tapShareDone = true;
      var btn = document.querySelector(
        '[data-proposal-card][data-session-id="' + TAP_SHARE + '"] [data-share-link]');
      if (!btn) return;
      btn.click();
    }

    // Staging demo hook: ?demo=1&tap-star=<sessionId> clicks that card's
    // star button once its list has rendered — the real button, through the
    // real delegated click handler. Pair it with ?preset-star=<same id> to
    // exercise unstarring. Works on the Inbox and the Watchlist tab alike.
    // Demo only; one-shot.
    var tapStarDone = false;
    function maybeTapStar() {
      if (!DEMO || !TAP_STAR || tapStarDone) return;
      var btn = document.querySelector(
        '[data-star-toggle][data-session="' + TAP_STAR + '"]');
      if (!btn) return;
      tapStarDone = true;
      btn.click();
    }

    // Staging demo hook: ?demo=1&tap-bookmark=<sessionId> clicks that card's
    // bookmark button once its list has rendered — the real button, through
    // the real delegated click handler. Works on the Inbox and the Saved tab
    // alike. Demo only; one-shot.
    var tapBookmarkDone = false;
    function maybeTapBookmark() {
      if (!DEMO || !TAP_BOOKMARK || tapBookmarkDone) return;
      var btn = document.querySelector(
        '[data-bookmark-toggle][data-session="' + TAP_BOOKMARK + '"]');
      if (!btn) return;
      tapBookmarkDone = true;
      btn.click();
    }

    // Staging demo hook: ?tap-unbookmark=<sessionId> with ?preset-bookmark=
    // <same id> renders the card bookmarked and then taps its button, so the
    // unsave direction runs through the real tap path with no stored row.
    // Demo only; one-shot.
    var tapUnbookmarkDone = false;
    function maybeTapUnbookmark() {
      if (!DEMO || !TAP_UNBOOKMARK || tapUnbookmarkDone) return;
      var btn = document.querySelector(
        '[data-bookmark-toggle][data-session="' + TAP_UNBOOKMARK + '"]');
      if (!btn) return;
      tapUnbookmarkDone = true;
      btn.click();
    }

    // Staging demo hook: ?demo=1&tap-summary=<sessionId> clicks that card's
    // summary line once the demo inbox has rendered — the real button,
    // through the real delegated click handler — so expansion (and, paired
    // with ?expand-summary=<same id>, collapsing) runs through the real tap
    // path. Demo only; one-shot.
    // Staging demo hook: ?demo=1&tap-follow=<slug> / ?tap-unfollow=<slug>
    // click that app row's follow star once the app filter has rendered —
    // the real button, through the filter content's own delegated click
    // handler. The boot hook adjusted the stored set first, so the tap
    // always starts from the intended direction. Pair with ?openfilter=1.
    // Demo only; one-shot.
    var tapFollowDone = false;
    function maybeTapFollow() {
      if (!DEMO || tapFollowDone) return;
      var slug = params.get('tap-follow') || params.get('tap-unfollow');
      if (!slug) return;
      var btn = document.querySelector(
        '[data-follow-toggle][data-app="' + slug + '"]');
      if (!btn) return;
      tapFollowDone = true;
      btn.click();
    }

    var tapSummaryDone = false;
    function maybeTapSummary() {
      if (!DEMO || !TAP_SUMMARY || tapSummaryDone) return;
      var btn = document.querySelector(
        '[data-proposal-card][data-session-id="' + TAP_SUMMARY + '"] [data-summary-toggle]');
      if (!btn) return;
      tapSummaryDone = true;
      btn.click();
    }

    // Staging demo hook: ?demo=1&tap-impact-toggle=1 clicks the open
    // proposal detail's impact-panel toggle once it has rendered — the real
    // button, through the real delegated click handler — so expansion (and,
    // paired with ?impact-mobile=1 keeping the panel collapsed, the toggle
    // itself) runs through the real tap path. Demo only; one-shot.
    var tapImpactDone = false;
    function maybeTapImpactToggle() {
      if (!DEMO || !TAP_IMPACT_TOGGLE || tapImpactDone) return;
      var btn = document.querySelector(
        '[data-proposal-detail] [data-impact-toggle]');
      if (!btn) return;
      tapImpactDone = true;
      btn.click();
    }

    // Staging demo hook: ?demo=1&tap-card=1 taps the demo-2 card's body —
    // its title, which is not one of the card's controls — so the
    // tap-card-to-open-detail path runs through the real delegated click
    // handler. Demo only; one-shot.
    var tapCardDone = false;
    function maybeTapCard() {
      if (!DEMO || !TAP_CARD || tapCardDone) return;
      var card = document.querySelector('[data-proposal-card][data-session-id="demo-2"]');
      var title = card ? card.querySelector('[data-proposal-title]') : null;
      if (!title) return;
      tapCardDone = true;
      title.click();
    }

    // Staging demo hook: ?demo=1&tap-back=1 scrolls the demo inbox down,
    // opens demo-2's detail through its real Discuss button, then taps the
    // detail's real Back button, so Back's scroll restoration runs end to
    // end; closeDetail stamps the offset it restored on <body> for the
    // check to read. The scroll target clamps to the page's real max so a
    // short page cannot over-scroll. Demo only; one-shot.
    var tapBackDone = false;
    function maybeTapBack() {
      if (!DEMO || !TAP_BACK || tapBackDone) return;
      var card = document.querySelector('[data-proposal-card][data-session-id="demo-2"]');
      if (!card || !card.querySelector('[data-open-detail]')) return;
      tapBackDone = true;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, Math.min(400, Math.max(0, max)));
      card.querySelector('[data-open-detail]').click();
      var back = document.querySelector('[data-proposal-detail] [data-action="close-detail"]');
      if (back) back.click();
    }

    // Staging demo hook: ?demo=1&proposal=<id>&scroll-detail=1 verifies the
    // detail's sticky action bar the way a reader experiences it: the bar
    // must be on screen when the detail opens (pinned above the fold) and
    // still on screen at the bottom of the page. Only when both hold does
    // the observation flip the flag whose marker the bar re-emits on every
    // re-render, so a check that reads the marker fails if the bar stops
    // following the scroll, and the async loads that run after this hook
    // cannot wipe it. Demo only; one-shot.
    var scrollDetailDone = false;
    function maybeScrollDetail() {
      if (!DEMO || !SCROLL_DETAIL || scrollDetailDone) return;
      var bar = document.querySelector('[data-detail-actions]');
      if (!bar) return;
      scrollDetailDone = true;
      var top = bar.getBoundingClientRect().bottom <= window.innerHeight + 1;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, Math.max(0, max));
      var bottom = bar.getBoundingClientRect().bottom <= window.innerHeight + 1
        && bar.getBoundingClientRect().top < window.innerHeight;
      if (top && bottom) {
        detailStickyObserved = true;
        render();
      }
    }

    // Staging demo hook: ?demo=1&tap-no=1 clicks the demo-4 card's "No"
    // button once the demo inbox has rendered — the real button, through the
    // real delegated click handler — so the confirm-before-No dialog is
    // reachable by a check. ?confirm-no=1 then presses "No, reject" in the
    // dialog that opens, casting the vote for real through the demo-mode
    // POST. Any earlier demo vote on demo-4 is cleared first so repeated
    // check runs always reach the dialog. Demo only.
    var TAP_NO_SESSION = 'demo-4';
    var tapNoDone = false;
    function maybeTapNo() {
      if (!DEMO || !TAP_NO || tapNoDone) return;
      tapNoDone = true;
      var p = findProposal(TAP_NO_SESSION);
      if (!p) return;
      api('/api/unvote', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ sessionId: TAP_NO_SESSION }),
      }).catch(function () {}).then(function () {
        p.myVote = null;
        render();
        var buttons = document.querySelectorAll('[data-vote="no"]');
        for (var i = 0; i < buttons.length; i++) {
          if (buttons[i].getAttribute('data-session') === TAP_NO_SESSION) {
            buttons[i].click();
            break;
          }
        }
        if (!CONFIRM_NO) return;
        var tries = 0;
        var timer = setInterval(function () {
          var confirmBtn = findButtonByText('No, reject');
          if (confirmBtn) {
            clearInterval(timer);
            confirmBtn.click();
          } else if (++tries > 40) {
            clearInterval(timer);
          }
        }, 100);
      });
    }

    // Staging demo hook: ?demo=1&cast=<sessionId>:<choice> casts one vote
    // automatically once the demo inbox is loaded, giving checks and
    // reviewers a stable URL for the vote → toast → Undo flow. Demo only.
    // Any earlier demo vote on that session is cleared first so repeated
    // loads (and repeated check runs) always reach the toast.
    function maybeAutoCast() {
      if (!DEMO) return;
      var m = (params.get('cast') || '').match(/^(.+):(yes|no)$/);
      if (!m) return;
      var p = findProposal(m[1]);
      if (!p) return;
      // Wait out the boot board load first (when there is one): its
      // ?lb-clear=1 DELETE runs server-side before that response returns,
      // so chaining here keeps the clear strictly before the cast.
      var settle = bootBoardLoad || Promise.resolve();
      bootBoardLoad = null;
      settle.catch(function () {}).then(function () {
        api('/api/unvote', {
          method: 'POST',
          headers: headers({ 'content-type': 'application/json' }),
          body: JSON.stringify({ sessionId: m[1] }),
        }).catch(function () {})
          .then(function () {
            p.myVote = null;
            castVote(m[1], m[2]);
          });
      });
    }

    // Weekly-digest demo hooks (see DIGEST above). ?digest-details=1 clicks
    // the card's View details toggle once My Votes has rendered, through the
    // real click handler. ?digest-vote=<sessionId>:<yes|no> unvotes that
    // proposal first (the way ?cast= does) and then casts through the real
    // castVote, while the tab stays on My Votes, so the digest card's
    // in-place update is observable without a reload. The votes tab never
    // loads the inbox on its own, so the hook fetches it once when the vote
    // target is not on screen and runs again from the inbox load's
    // callbacks. Demo only; one-shot each.
    var digestDetailsDone = false;
    function maybeTapDigestDetails() {
      if (!DEMO || !DIGEST_DETAILS || digestDetailsDone) return;
      if (!state.votes || !state.votes.votes || state.errorVotes) return;
      digestDetailsDone = true;
      waitFor('[data-digest-toggle]', function (btn) { btn.click(); });
    }

    var digestVoteDone = false;
    function maybeDigestVote() {
      if (!DEMO || !DIGEST_VOTE || digestVoteDone) return;
      if (!state.votes || !state.votes.votes || state.errorVotes) return;
      var m = DIGEST_VOTE.match(/^(.+):(yes|no)$/);
      if (!m) { digestVoteDone = true; return; }
      var p = findProposal(m[1]);
      if (!p) {
        if (!state.inbox && !state.loadingInbox) loadInbox();
        return;
      }
      digestVoteDone = true;
      api('/api/unvote', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ sessionId: m[1] }),
      }).catch(function () {})
        .then(function () {
          p.myVote = null;
          castVote(m[1], m[2]);
        });
    }

    // Staging check fixture: ?demo=1&openfilter=1 opens the app filter
    // dropdown automatically once the demo inbox has loaded, so a check can
    // assert on the app list (and its counts) without clicking. Demo only;
    // one-shot, and only when the inbox loaded without error.
    var openFilterSet = OPEN_FILTER;
    function maybeAutoOpenFilter() {
      if (!openFilterSet) return;
      if (!DEMO || !OPEN_FILTER || state.errorInbox || !state.inbox) return;
      openFilterSet = false;
      openAppFilter();
    }

    // The dropdown is open while the underlying data reloads: re-render its
    // list in place so the per-app open and merged-this-week counts show the
    // fresh numbers. Runs after every inbox load; a no-op when the dropdown
    // is closed or the load failed (then there is nothing new to tally).
    // The list rebuild leaves the popover and its search input untouched.
    function maybeRerenderFilter() {
      if (!openFilter || !activeFilterRender || !state.inbox) return;
      activeFilterRender();
    }

    // Tag dropdown: the same two hooks as the app filter's, plus a tap hook.
    // ?opentagfilter=1 opens the dropdown once the inbox has loaded (demo
    // only, one-shot, only on a successful load). Runs after every inbox
    // load, mirroring maybeAutoOpenFilter.
    var openTagFilterSet = OPEN_TAG_FILTER;
    function maybeAutoOpenTagFilter() {
      if (!openTagFilterSet) return;
      if (!DEMO || state.errorInbox || !state.inbox) return;

    // Staging check hook: ?stats-layout=1 verifies the open dropdown's rows

    // (placeholders must be up), and after the fresh values land. It drives
    // the refresh through the real loadInbox with a one-shot fetch hold so
    // the placeholder state is observable, and stamps data-layout-stable on
    // the panel. Demo only; one-shot.
    var statsLayoutDone = false;
    function maybeStatsLayout() {
      if (!STATS_LAYOUT || statsLayoutDone) return;
      if (state.errorInbox || !state.inbox) return;
      if (!openFilter || !activeFilterRender) return;
      statsLayoutDone = true;
      var panel = document.querySelector('[data-app-filter-panel]');
      if (!panel) return;
      function measure() {
        var rows = Array.prototype.slice.call(panel.querySelectorAll('[data-app-option]'));
        var list = panel.querySelector('[role="listbox"]') || panel;
        return {
          rows: rows.map(function (r) { return r.offsetHeight; }),
          list: list.offsetHeight,
        };
      }
      var before = measure();
      inboxHoldMs = 800;
      loadInbox(true);
      setTimeout(function () {
        // Mid-hold: the placeholders must be up and the rows unchanged.
        var during = measure();
        var loadingOk = panel.getAttribute('data-stats-loading') === '1'
          && !!panel.querySelector('[data-stat-placeholder]');
        var tries = 0;
        (function poll() {
          tries++;
          var settled = !state.loadingInbox
            && panel.getAttribute('data-stats-loading') !== '1';
          if (!settled && tries < 100) return setTimeout(poll, 100);
          var after = measure();
          var same = function (a, b) {
            return a.rows.length === b.rows.length
              && a.rows.every(function (h, i) { return h === b.rows[i]; })
              && a.list === b.list;
          };
          panel.setAttribute('data-layout-stable',
            loadingOk && same(before, during) && same(before, after) ? '1' : '0');
        })();
      }, 400);
    }

    var bulkHooksDone = false;

        .filter(function (s) { return s; });

      if (!DEMO || !BULK_HOOKS || bulkHooksDone) return;

      var deselectIds = csvIds(params.get('deselect'));
      var bulkParam = params.get('bulk');

        selectIds.forEach(function (id) {

        if (params.get('clearsel') === '1') state.selected = {};

    // ?density-fit=1 (demo only): with a compact load rendered, measure the

    function maybeDensityFit() {
      if (!DEMO || !DENSITY_FIT || densityFitDone) return;
      if (state.errorInbox || !state.inbox) return;
      var card = document.querySelector('#view [data-proposal-card]');
      if (!card) return;
      densityFitDone = true;
      var compactH = card.offsetHeight;
      var compactPad = parseFloat(getComputedStyle(card).paddingTop) || 0;
      var proposal = findProposal(card.getAttribute('data-session-id'));
      if (!proposal) return;
      // The same card at Comfortable, built into a hidden probe box, so
      // both numbers come from one run.
      var prev = state.density;
      state.density = 'comfortable';
      var probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:390px;visibility:hidden;pointer-events:none;';
      probe.innerHTML = proposalCard(proposal);
      document.body.appendChild(probe);
      var comfortableCard = probe.querySelector('[data-proposal-card]');

      var comfortablePad = comfortableCard

      document.body.removeChild(probe);

      document.body.setAttribute('data-density-card-h', String(compactH));
