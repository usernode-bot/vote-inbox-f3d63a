  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name || 'Error') + ': ' + v.message);
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (typeof val === 'object' && val !== null && val instanceof Error) return val.stack || (val.name || 'Error') + ': ' + val.message;
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);

  })();
  </script>
  <title>Vote Inbox</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c3aed'/><path d='M28 52l14 14 30-30' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css on every image build, so the stylesheet is
       regenerated from THIS commit's markup and can never drift behind the
       code. Class names must be written as whole literals (including ones
       inside JS strings) for the compiler to see them. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Not conditional on calling a bridge API: it is also how the app
       ANSWERS the shell, and how the shell learns this document's ground
       colour so the platform bar above the app takes the app's tone. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- The platform's light/dark choice, applied before first paint.
       usernode.theme is set synchronously when the bridge loads; the OS
       preference is the fallback when the app is opened standalone. -->
  <script>
  (function () {
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() {
      var theme = (window.usernode && window.usernode.theme)
        || (media.matches ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.style.colorScheme = theme;
    }
    applyTheme();
    window.addEventListener('usernode:theme-changed', applyTheme);
    if (media.addEventListener) media.addEventListener('change', applyTheme);
  })();
  </script>
  <!-- The native UI kit: pressed states, pull-to-refresh and toasts for the
       inbox list. Centrally hosted, relative path, never vendored. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>

<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  <main class="mx-auto max-w-md px-4 pb-20">
    <header class="flex items-center justify-between gap-2 pb-3 pt-5">
      <div class="flex min-w-0 items-center gap-2.5">
        <span aria-hidden="true" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-violet-600 shadow-sm">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        </span>
        <div class="min-w-0">
          <h1 data-app-title class="truncate text-lg font-bold tracking-tight">Vote Inbox</h1>
          <p class="truncate text-xs text-zinc-500 dark:text-zinc-400">Open proposals across Homeroom</p>
        </div>
      </div>
      <button id="new-proposal-btn" data-new-proposal aria-label="New proposal" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-zinc-300 bg-white text-zinc-500 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-400">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
      <button id="members-btn" data-members-link type="button" aria-label="Members"
        class="flex h-9 shrink-0 items-center gap-1.5 rounded-full border border-zinc-300 bg-white px-3 text-sm font-semibold text-zinc-600 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Members</span>
      </button>
      <button id="menu-btn" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" type="button"
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-zinc-300 bg-white text-zinc-500 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-400">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
      <button id="refresh-btn" aria-label="Refresh" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-zinc-300 bg-white text-zinc-500 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-400">
        <svg id="refresh-icon" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </header>
    <div id="menu-panel" hidden class="fixed z-40 min-w-40 rounded-xl border border-zinc-200 bg-white p-1 shadow-lg dark:border-zinc-800 dark:bg-zinc-900"></div>
    <p id="inbox-updated" class="-mt-1.5 pb-1 text-xs text-zinc-500 dark:text-zinc-400" hidden></p>
    <div id="inbox-summary" data-inbox-stats class="-mt-1.5 pb-2.5" hidden></div>
    <p id="inbox-unread" data-unread-count="0" class="-mt-1.5 flex items-center gap-2 pb-2.5 text-xs text-zinc-500 dark:text-zinc-400" hidden>
      <span data-unread-text></span>
      <button data-mark-all-read type="button" class="shrink-0 rounded-full py-1.5 font-semibold text-violet-600 transition-colors hover:text-violet-500 dark:text-violet-400 dark:hover:text-violet-300">Mark all read</button>
    </p>
    <p id="votes-summary" class="-mt-1.5 pb-2.5 text-xs text-zinc-500 dark:text-zinc-400" hidden></p>
    <p id="watchlist-summary" class="-mt-1.5 pb-2.5 text-xs text-zinc-500 dark:text-zinc-400" hidden></p>
    <p id="following-summary" class="-mt-1.5 pb-2.5 text-xs text-zinc-500 dark:text-zinc-400" hidden></p>
    <p id="saved-summary" class="-mt-1.5 pb-2.5 text-xs text-zinc-500 dark:text-zinc-400" hidden></p>
    <p id="members-summary" data-members-summary class="-mt-1.5 pb-2.5 text-xs text-zinc-500 dark:text-zinc-400" hidden></p>
    <div id="demo-banner" class="mb-3 hidden rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-1.5 text-xs font-medium text-amber-700 dark:text-amber-300">Staging demo data, not real proposals</div>

    <div id="list-controls" class="sticky top-0 z-20 -mx-4 bg-zinc-50/95 px-4 pb-3 pt-1 backdrop-blur dark:bg-zinc-950/95">
      <div class="flex rounded-full border border-zinc-200 bg-zinc-100 p-1 dark:border-zinc-800 dark:bg-zinc-900" role="tablist" aria-label="Sections">
        <button data-tab="inbox" class="tab-btn flex-1 rounded-full py-1.5 text-sm font-semibold transition-colors">Inbox<span class="tab-badge"></span></button>
        <button data-tab="following" class="tab-btn flex-1 rounded-full py-1.5 text-sm font-semibold transition-colors">Following<span class="tab-badge"></span></button>
        <button data-tab="saved" class="tab-btn flex-1 rounded-full py-1.5 text-sm font-semibold transition-colors">Saved<span class="tab-badge"></span></button>
        <button data-tab="watchlist" class="tab-btn flex-1 rounded-full py-1.5 text-sm font-semibold transition-colors">Watchlist<span class="tab-badge"></span></button>
        <button data-tab="votes" class="tab-btn flex-1 rounded-full py-1.5 text-sm font-semibold transition-colors">My Votes<span data-tab-count></span><span class="tab-badge"></span></button>
        <button data-tab="leaderboard" class="tab-btn flex-1 rounded-full py-1.5 text-sm font-semibold transition-colors">Leaderboard<span class="tab-badge"></span></button>
      </div>
      <div id="views-row" data-views-row data-hidden="0" class="mt-2 flex items-center gap-2">
        <div id="views-chips" class="flex min-w-0 flex-1 items-center gap-1.5 overflow-x-auto py-0.5" role="group" aria-label="Saved views"></div>
        <button id="save-view-btn" type="button" class="flex shrink-0 items-center gap-1 rounded-full py-1.5 pl-2 pr-3 text-xs font-semibold text-violet-600 transition-colors hover:text-violet-500 dark:text-violet-400 dark:hover:text-violet-300">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          <span>Save view</span>
        </button>
      </div>
      <div id="filter-row" class="mt-2">
        <div class="flex items-center gap-3">
          <label for="app-filter-trigger" class="sr-only">Filter by app</label>
          <div class="relative min-w-0 flex-1">
            <button id="app-filter-trigger" data-app-filter-trigger type="button" aria-haspopup="listbox" aria-expanded="false"
              class="flex w-full items-center justify-between gap-2 rounded-xl border border-zinc-300 bg-white py-2 pl-3 pr-3 text-left text-sm font-medium text-zinc-700 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200">
              <span id="app-filter-label" class="truncate">All apps</span>
              <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4 shrink-0 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="app-filter-panel" class="hidden"></div>
          </div>
          <label for="tag-filter-trigger" class="sr-only">Filter by tag</label>
          <div class="relative shrink-0">
            <button id="tag-filter-trigger" data-tag-filter-trigger type="button" aria-haspopup="listbox" aria-expanded="false"
              class="flex shrink-0 items-center justify-between gap-2 whitespace-nowrap rounded-xl border border-zinc-300 bg-white py-2 pl-3 pr-3 text-sm font-medium text-zinc-700 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200">
              <span id="tag-filter-label" data-tag-filter-label class="truncate">All tags</span>
              <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4 shrink-0 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="tag-filter-panel" class="hidden"></div>
          </div>
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-2">
          <button id="select-mode-btn" data-select-mode-toggle type="button" aria-pressed="false"
            class="shrink-0 whitespace-nowrap rounded-xl border border-zinc-300 bg-white py-2 pl-3 pr-3 text-sm font-medium text-zinc-700 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200">Select</button>
          <button id="one-away-chip" data-one-away-chip type="button" aria-pressed="false"
            class="shrink-0 whitespace-nowrap rounded-xl border border-zinc-300 bg-white py-2 pl-3 pr-3 text-sm font-medium text-zinc-700 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200">One vote away</button>
          <button id="snoozed-chip" data-snoozed-chip type="button" aria-pressed="false"
            class="shrink-0 whitespace-nowrap rounded-xl border border-zinc-300 bg-white py-2 pl-3 pr-3 text-sm font-medium text-zinc-700 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200">Snoozed</button>
          <label for="hide-voted" class="flex shrink-0 select-none items-center gap-2 text-sm font-medium text-zinc-700 dark:text-zinc-200">
            <span>Hide voted</span>
            <input id="hide-voted" type="checkbox" class="un-switch">
          </label>
          <label for="hide-merged" class="flex shrink-0 select-none items-center gap-2 text-sm font-medium text-zinc-700 dark:text-zinc-200">
            <span>Hide merged</span>
            <input id="hide-merged" type="checkbox" class="un-switch">
          </label>
          <label for="hide-read" class="flex shrink-0 select-none items-center gap-2 text-sm font-medium text-zinc-700 dark:text-zinc-200">
            <span>Hide read</span>
            <input id="hide-read" type="checkbox" class="un-switch">
          </label>
        </div>
      </div>
      <div id="search-row" data-search-row class="mt-2">
        <label for="inbox-search" class="sr-only">Search proposals</label>
        <input id="inbox-search" type="text" placeholder="Search titles" autocomplete="off"
          class="w-full rounded-xl border border-zinc-300 bg-white py-2 pl-3 pr-3 text-sm text-zinc-800 placeholder:text-zinc-400 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder:text-zinc-500">
      </div>
      <!-- Saved searches bar: one chip per saved search, sitting directly
           under the search box and shown exactly where the search box is.
           A chip re-runs its search; the small × deletes it. -->
      <div id="saved-searches-row" data-saved-searches-row data-hidden="0" class="mt-2 flex items-center gap-2">
        <div id="saved-searches-chips" data-saved-searches-chips role="group" aria-label="Saved searches" class="flex min-w-0 flex-1 items-center gap-1.5 overflow-x-auto py-0.5"></div>
        <button id="save-search-btn" data-save-search-btn type="button" class="flex shrink-0 items-center gap-1 rounded-full py-1.5 pl-2 pr-3 text-xs font-semibold text-violet-600 transition-colors hover:text-violet-500 dark:text-violet-400 dark:hover:text-violet-300">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          <span>Save search</span>
        </button>
      </div>
      <div id="members-row" class="mt-2 hidden">
        <label for="members-search" class="sr-only">Search members</label>
        <input id="members-search" type="text" placeholder="Search members" autocomplete="off"
          class="w-full rounded-xl border border-zinc-300 bg-white py-2 pl-3 pr-3 text-sm text-zinc-800 placeholder:text-zinc-400 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder:text-zinc-500">
      </div>
    </div>

    <div id="sort-row" class="flex items-center gap-2 pt-1">
      <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Sort</span>
      <div class="flex rounded-full border border-zinc-200 bg-zinc-100 p-0.5 dark:border-zinc-800 dark:bg-zinc-900" role="radiogroup" aria-label="Sort order">
        <button data-sort="needed" type="button" role="radio" aria-checked="true"
          class="rounded-full px-3 py-1 text-xs font-semibold transition-colors">Votes needed</button>
        <button data-sort="newest" type="button" role="radio" aria-checked="false"
          class="rounded-full px-3 py-1 text-xs font-semibold transition-colors">Newest</button>
        <button data-sort="controversy" type="button" role="radio" aria-checked="false"
          class="rounded-full px-3 py-1 text-xs font-semibold transition-colors">Controversy</button>
      </div>
    </div>

    <!-- Weekly digest: rendered above the My Votes sort row. Lives outside
         #view so the existing row-position checks keep passing. -->
    <section id="votes-digest" hidden></section>

    <div id="votes-order-row" class="hidden flex items-center gap-2 pt-1">
      <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Sort</span>
      <div class="flex rounded-full border border-zinc-200 bg-zinc-100 p-0.5 dark:border-zinc-800 dark:bg-zinc-900" role="radiogroup" aria-label="Vote order">
        <button data-votes-order="newest" type="button" role="radio" aria-checked="true"
          class="rounded-full px-3 py-1 text-xs font-semibold transition-colors">Newest first</button>
        <button data-votes-order="oldest" type="button" role="radio" aria-checked="false"
          class="rounded-full px-3 py-1 text-xs font-semibold transition-colors">Oldest first</button>
      </div>
      <!-- Merged-this-week filter: the chip the celebration card's
           "See what merged" link turns on; ?votes-merged=1 deep links to it. -->
      <button data-votes-merged-chip type="button" aria-pressed="false"
        class="rounded-full px-3 py-1 text-xs font-semibold transition-colors">Merged this week</button>
      <button data-shareimg-open type="button"
        class="ml-auto inline-flex items-center gap-1 rounded-full border border-violet-500/40 bg-white px-2.5 py-1 text-xs font-semibold text-violet-600 dark:bg-zinc-900 dark:text-violet-400">Share as image</button>
    </div>

    <!-- Leaderboard range pill: shown only on the Leaderboard tab, the same
         segmented control the other tabs use for their order options. -->
    <div id="lb-range-row" class="hidden flex items-center gap-2 pt-1">
      <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Range</span>
      <div class="flex rounded-full border border-zinc-200 bg-zinc-100 p-0.5 dark:border-zinc-800 dark:bg-zinc-900" role="radiogroup" aria-label="Leaderboard range">
        <button data-lb-range="week" type="button" role="radio" aria-checked="true"
          class="rounded-full px-3 py-1 text-xs font-semibold transition-colors">This week</button>
        <button data-lb-range="all" type="button" role="radio" aria-checked="false"
          class="rounded-full px-3 py-1 text-xs font-semibold transition-colors">All time</button>
      </div>
    </div>

    <!-- Share-as-image preview: a card drawn by openShareImage() from the
         loaded My Votes rows, shown above the vote list on the votes tab
         only. Filled and hidden by renderShareImagePanel(); nothing here is
         persisted and the drawn picture reads the current theme colours. -->
    <div id="shareimg-panel" hidden></div>

    <!-- Bulk triage bar: shown only in select mode on the Inbox tab. The
         counter counts every ticked card, including ones a filter is
         currently hiding, and Clear empties the selection without leaving
         select mode. Approve casts a Yes vote on each selected card, Hide
         casts a No. -->
    <div id="select-bar" data-select-bar hidden class="mt-3 rounded-2xl border border-violet-500/40 bg-violet-600/10 p-3">
      <div class="flex items-center justify-between gap-2">
        <span data-select-count class="text-sm font-semibold text-violet-700 dark:text-violet-300">0 selected</span>
        <button id="select-exit" type="button"
          class="rounded-full px-3 py-1.5 text-sm font-semibold text-violet-600 transition-colors hover:text-violet-500 dark:text-violet-400">Done</button>
      </div>
      <div class="mt-2 flex gap-2">
        <button data-bulk="approve" data-bulk-approve type="button" disabled
          class="min-h-11 flex-1 rounded-xl bg-violet-600 py-2.5 text-sm font-semibold text-white shadow-sm transition-transform hover:bg-violet-500 active:scale-95 disabled:opacity-50">Approve</button>
        <button data-bulk="hide" data-bulk-hide type="button" disabled
          class="min-h-11 flex-1 rounded-xl border border-red-500/40 bg-white py-2.5 text-sm font-semibold text-red-700 transition-transform active:scale-95 disabled:opacity-50 dark:bg-zinc-900 dark:text-red-300">Hide</button>
        <button data-bulk="clear" data-bulk-clear type="button"
          class="min-h-11 rounded-xl border border-zinc-300 bg-white px-4 py-2.5 text-sm font-semibold text-zinc-700 transition-transform active:scale-95 disabled:opacity-50 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200">Clear</button>
      </div>
    </div>

    <div id="tour-slot"></div>

    <div id="view" class="flex flex-col gap-3 pt-3" aria-live="polite"></div>

    <!-- Polite announcement for merge celebration cards: filled once per

  <script>
  (function () {
    'use strict';

    var CONFIRM_NO = params.get('confirm-no') === '1';

    // way an offline device does: the request never leaves the page, the
    // card keeps its vote mark and a Retry pill appears. Gives checks and
    // reviewers a deterministic URL for the offline-retry state; production

    var FAILVOTE = DEMO && params.get('failvote') === '1';

    var SHARE_MODE = DEMO && (params.get('share') === 'copy' || params.get('share') === 'sheet')

    var TAP_SHARE = DEMO ? (params.get('tap-share') || '') : '';

    // (template, switch-template, set-title, set-body, send) replay one
    // user path through the real controls, the way ?tap-no=1 does. Demo
    // gated like the other check fixtures.
    var COMPOSE = params.get('compose') === '1';
    var COMPOSE_TEMPLATE = DEMO ? (params.get('template') || '') : '';

    // Change-summary hooks (demo only): ?expand-summary=<sessionId> presets

    var EXPAND_SUMMARY = DEMO ? (params.get('expand-summary') || '') : '';

    var TAP_CARD = DEMO && params.get('tap-card') === '1';

    var BULK_HOOKS = DEMO && (params.get('selectmode') === '1'
      || params.get('select') || params.get('deselect')
      || params.get('clearsel') === '1' || params.get('exitsel') === '1'
      || params.get('filter') || params.get('bulk'));
    // Staging-check fixture: ?turnout-refresh=1 (demo only) reloads the
    // inbox through the real refresh path once the app filter dropdown has

    // serves the variant fixture: two proposals merged since the first
    // load. The open dropdown's per-app open and merged-this-week counts
    // must then update in place, which is what the turnout checks assert.
    // Never sent without demo data.
    var TURNOUT_REFRESH = DEMO && params.get('turnout-refresh') === '1';
    // Set just before the hook's reload, so that one fetch gets the variant.
    var turnoutAltNext = false;
    // ?tap-star=<sessionId> (demo only) taps that card's star button once its
    // list has rendered — the real button, through the real delegated click
    // handler — so starring (and, with ?preset-star=, unstarring) is

    var TAP_STAR = DEMO ? (params.get('tap-star') || '') : '';
    // ?preset-star=<sessionId,...> (demo only) is forwarded to the demo inbox

    var PRESET_STAR = DEMO ? (params.get('preset-star') || '') : '';

    // check. ?set-tag=<tag> writes the tag preference and reloads, the same
    // pattern as ?set-filter=.
    var OPEN_TAG_FILTER = params.get('opentagfilter') === '1';
    var TAP_TAG = DEMO ? (params.get('tap-tag') || '') : '';
    // App-filter stat hooks, all demo only. ?tap-app-option=<slug> taps that

    var TAP_APP = DEMO ? (params.get('tap-app-option') || '') : '';
    var STATS_LAYOUT = DEMO && params.get('stats-layout') === '1';
    var FILTER_PHONE = DEMO && params.get('filter-phone') === '1';

    // own real starred rows (recorded via ?set-star=) into the fixture, so a
    // check can observe star → reload → still listed from actual storage.

    var WATCH_EMPTY = DEMO && params.get('watch-empty') === '1';
    var WATCH_SEEN = DEMO && params.get('watch-seen') === '1';

    // ?preset-bookmark=<id,...> is forwarded to the demo inbox so those cards

    // ?saved-mine=<ids> asks the demo Saved tab to merge the caller's own

    var TAP_BOOKMARK = DEMO ? (params.get('tap-bookmark') || '') : '';

    var TAP_UNBOOKMARK = DEMO ? (params.get('tap-unbookmark') || '') : '';

    var SAVED_EMPTY = DEMO && params.get('saved-empty') === '1';

    // ?digest-details=1 clicks the card's View details toggle once My Votes

    var DIGEST = DEMO ? (params.get('digest') || '') : '';

    // controls once they have rendered (see maybeCompareHooks). Production
    // never honours any of these.
    var COMPARE_PARAM = DEMO ? (params.get('compare') || '') : '';
    var PICK_PARAM = DEMO ? (params.get('pick') || '') : '';
    var TAP_COMPARE = DEMO && params.get('tap-compare') === '1';
    var TAP_CLEAR = DEMO && params.get('tap-clear') === '1';
    var TAP_COMPARE_ADD = DEMO ? (params.get('tap-compare-add') || '') : '';
    var TAP_NO_COMPARE = DEMO ? (params.get('tap-no-compare') || '') : '';

    //                                 landing on ?snooze-set=<id> — what the
    //                                 check sees is therefore the persisted
    //                                 state, which is what survives a reload

    var SNOOZED_VIEW = params.get('snoozed') === '1';
    var TAP_SNOOZE = DEMO ? (params.get('tap-snooze') || '') : '';
    var SET_SNOOZE = DEMO ? (params.get('set-snooze') || '') : '';
    var SET_SNOOZE_DAYS = DEMO ? (params.get('snooze-days') || '1') : '';
    // The reloaded ?snooze-set= page must ask the demo inbox for the caller's

    var TAP_UNSNOOZE = DEMO ? (params.get('tap-unsnooze') || '') : '';

    //                       No reload: the card re-renders with the dot gone.

    //                       read-set marker URL (other params such as

    //                       for its POST, then reloads at read-set=all.
    //   ?open-merged=1      opens the merged fixture (demo-5) exactly as a
    //                       ?proposal= deep link does, so the deep-link path
    //                       marks it read, then reloads at read-set=demo-5.

    // ?votes-merged=1 is not a fixture: it is the My Votes "merged this

    var TAP_TOUR_NEXT = DEMO ? (parseInt(params.get('tap-tour-next') || '0', 10) || 0) : 0;
