      if (voted) {
        return '<div class="flex items-center justify-center gap-1.5 rounded-xl border border-violet-500/40 bg-violet-600/10 py-2.5 text-sm font-semibold text-violet-700 dark:text-violet-300">'
          + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>'
          + 'You voted ' + p.myVote + '</div>'
          + retryRow(p.sessionId);
      }
      var busy = state.pending[p.sessionId];
      return '<div class="' + (stacked ? 'flex flex-col gap-2' : 'flex gap-2') + '">'
        + '<button data-vote="yes" data-session="' + esc(p.sessionId) + '"'
        + ' class="' + (stacked ? VOTE_YES_STACK : VOTE_YES_ROW) + '"'
        + (busy ? ' disabled' : '') + '>Yes</button>'
        + '<button data-vote="no" data-session="' + esc(p.sessionId) + '"'
        + ' class="' + (stacked ? VOTE_NO_STACK : VOTE_NO_ROW) + '"'
        + (busy ? ' disabled' : '') + '>No</button>'
        + '</div>';
    }

    // The voting block on the inbox card (the detail screen has its own sticky
    // action bar in detailActionBar, with the same button classes).
    function proposalActions(p) {
      return voteActions(p, false);
    }

    // Discussion entry point on a proposal card: a quiet ghost button,
    // styled like the share button, that opens the proposal's detail
    // screen where the thread lives.
    var DISCUSS_IDLE_HTML = '<svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>Discuss</span>';

    function discussButton(p) {
      return '<button data-open-detail data-session="' + esc(p.sessionId) + '"'
        + ' aria-label="Open discussion for this proposal" title="Discuss"'
        + ' class="inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium text-zinc-500 transition-colors hover:text-zinc-700 dark:text-zinc-400 dark:hover:text-zinc-200">'
        + DISCUSS_IDLE_HTML + '</button>';
    }

    // Change-summary row: what the proposal does (one grey line under the
    // title) and how many files it touches, both as the server normalised
    // them off the platform response. Summary-only cards render just the
    // line, count-only cards just the count; a card with neither renders
    // nothing, exactly as before this row existed. The line is a tap target
    // that expands to the full summary in place and collapses again —
    // display only, no other action on it.
    // Tag chips row: what the proposal is (bug, feature, copy, ux), from the
    // server's normalized fixed-list `tags`. At most two chips render — the
    // tag the current filter asks for first, when set, so a filtered-to card
    // keeps showing why it is on screen — and a card carrying no tags renders
    // nothing at all. Each chip also shows the tag's open count, the same
    // number the filter option shows (hidden proposals do not count; see
    // tagCounts). Display only: no tap action on a chip.
    function tagChipsRow(p) {
      var tags = (Array.isArray(p.tags) ? p.tags : [])
        .filter(function (t) { return TAG_VALUES.indexOf(t) !== -1; });
      if (!tags.length) return '';
      if (state.tagFilter && tags.indexOf(state.tagFilter) !== -1) {
        tags.splice(tags.indexOf(state.tagFilter), 1);
        tags.unshift(state.tagFilter);
      }
      var shown = tags.slice(0, 2);
      var counts = tagCounts();
      var html = '';
      for (var i = 0; i < shown.length; i++) {
        var tag = shown[i];
        var n = counts[tag] || 0;
        html += '<span data-tag-chip="' + esc(tag) + '" class="' + TAG_CHIP + '">'
          + esc(tag)
          + ' <span data-tag-chip-count="' + n + '" class="' + TAG_CHIP_COUNT + '">(' + n + ')</span>'
          + '</span>';
      }
      // data-tag-count carries how many chips render, so the max-two cap is
      // assertable on a fixture that carries three tags.
      return '<div data-proposal-tags data-tag-count="' + shown.length
        + '" class="flex flex-wrap items-center gap-1.5">' + html + '</div>';
    }

    function changeSummaryRow(p) {
      // Compact density hides the description preview: the row is the
      // tallest optional part of a card, and dropping it is where the
      // compact layout saves most of its space.
      if (state.density === 'compact') return '';
      var summary = typeof p.summary === 'string' && p.summary.trim() ? p.summary : '';
      var count = typeof p.filesChanged === 'number' && Number.isFinite(p.filesChanged)
        && p.filesChanged >= 0 ? p.filesChanged : null;
      if (!summary && count == null) return '';
      var expanded = !!state.expandedSummaries[p.sessionId];
      return '<div data-change-summary class="flex items-start gap-2">'
        + (summary
          ? '<button type="button" data-summary-toggle data-session="' + esc(p.sessionId) + '"'
            + ' aria-expanded="' + (expanded ? 'true' : 'false') + '"'
            + ' class="' + (expanded ? SUMMARY_EXPANDED : SUMMARY_CLAMPED) + '">'
            + esc(summary) + '</button>'
          : '')
        + (count != null
          ? '<span data-files-changed="' + count + '" class="' + FILES_CHANGED_CLASS + '">'
            + count + (count === 1 ? ' file changed' : ' files changed') + '</span>'
          : '')
        + '</div>';
    }

    function proposalCard(p) {
      var voted = p.myVote === 'yes' || p.myVote === 'no';
      // Select-mode checkbox: only on cards a bulk action can still act on —
      // unvoted and not already merged or closed. Voted cards keep their
      // "You voted" banner and offer no checkbox, so a bulk pass never has
      // to skip anything mid-flight.
      var selectable = state.selectMode && !voted
        && p.status !== 'merged' && p.status !== 'closed';
      var isSelected = selectable && !!state.selected[p.sessionId];
      var selectBtn = selectable
        ? '<button data-select-toggle data-session="' + esc(p.sessionId) + '"'
          + ' aria-pressed="' + (isSelected ? 'true' : 'false') + '"'
          + ' aria-label="' + (isSelected ? 'Deselect proposal' : 'Select proposal') + '"'
          + ' class="' + (isSelected ? SELECT_TOGGLE_ON : SELECT_TOGGLE_OFF) + '">'
          + (isSelected ? SELECT_CHECK : '') + '</button>'
        : '';
      var titleExpanded = !!state.expandedTitles[p.sessionId];
      // data-needed lets the declared checks (and deep links) assert what the
      // votes-needed pill shows: omitted when the threshold is unknown.
      // data-selected carries the checkbox state in select mode (present on
      // every votable card there, 'true' or 'false') so checks can assert
      // what a tick and an untick do.
      // data-contested marks whether both sides hold at least one vote, the
      // split property the controversy sort ranks on.
      var contested = splitContested(p);
      // A snoozed card keeps everything a card has (votes stay votable) and
      // adds its wake line; its Snooze button yields to that line's Unsnooze.
      var snoozed = wakeActive(p);
      return '<article data-proposal-card data-session-id="' + esc(p.sessionId) + '"'
        + (p.needed != null ? ' data-needed="' + p.needed + '"' : '')
        + (snoozed ? ' data-snoozed="1"' : '')
        + (isRead(p) ? ' data-read="1"' : '')
        + (state.selectMode && !voted
          ? ' data-selected="' + (isSelected ? 'true' : 'false') + '"' : '')
        + ' data-contested="' + (contested ? 'true' : 'false') + '"'
        // data-density carries the layout a card rendered with, so the
        // checks (and the density menu's own preview promise) can assert
        // Comfortable vs Compact without comparing pixel values.
        + ' data-density="' + (state.density === 'compact' ? 'compact' : 'comfortable') + '"'
        + ' class="' + densityCardClass(isSelected) + '">'
        + '<div class="flex items-center justify-between gap-2">'
        + '<span class="flex min-w-0 items-center gap-1.5">'
        + selectBtn
        + appAvatar(p)
        + '<span class="truncate text-xs font-medium text-zinc-500 dark:text-zinc-400">' + esc(p.appName) + '</span>'
        + ageSpan(p)
        + '</span>'
        + neededPill(p)
        + '</div>'
        + proposedDateLine(p)
        + '<h2 data-proposal-title class="' + (titleExpanded ? TITLE_EXPANDED : TITLE_CLAMPED) + '">'
        // Unread dot: a small violet marker before the title, only on cards
        // this account has never opened. Read cards render the title alone.
        + (isRead(p) ? ''
          : '<span data-unread-dot aria-label="Unread" class="mr-1.5 inline-block h-2 w-2 rounded-full bg-violet-600 align-middle dark:bg-violet-400"></span>')
        // New badge: proposed since this device's last inbox load (see
        // isNewSince). A label, not a button — no click handling.
        + (isNewSince(p)
          ? '<span data-new-badge aria-label="New since your last visit" class="' + NEW_BADGE + '">New</span>'
          : '')
        + esc(p.title) + '</h2>'
        + tagChipsRow(p)
        + changeSummaryRow(p)
        + voteBar(p)
        + voterAvatarRow(p)
        + voterNamesRow(p)
        + '<div class="' + cardFooterRowClass() + '">'
        + '<p class="min-w-0 text-xs text-zinc-500 dark:text-zinc-400">'
        + (p.author ? 'by @' + esc(p.author) : '') + '</p>'
        + '<div class="' + cardFooterBtnsClass() + '">'
        + starToggleButton(p.sessionId, !!p.myStar, !!state.starPending['star:' + p.sessionId])
        + bookmarkToggleButton(p.sessionId, !!p.myBookmark,
          !!state.savedPending['bookmark:' + p.sessionId])
        + (!snoozed ? snoozeToggleButton(p.sessionId) : '')
        + discussButton(p)
        + compareButton(p)
        + (p.url ? shareLinkButton(p) : '')
        + '</div>'
        + '</div>'
        + (snoozed ? snoozeLine(p) : '')
        + snoozeMenuHtml(p)
        + statusProgress(p)
        + proposalActions(p)
        + '</article>';
    }

    // Long titles: every card title clamps to two lines, so a longer one
    // hides its tail behind the ellipsis. After each render, measure each
    // card title; one that overflows its clamp gets a "More" control
    // appended (an already-expanded one gets "Less", built with the card).
    // A title that fits on two lines gets nothing. Tapping toggles the
    // clamp in place, so nothing else on the card moves.
    function enhanceTitles() {
      var cards = document.querySelectorAll('#view [data-proposal-card]');
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var h2 = card.querySelector('[data-proposal-title]');
        if (!h2 || card.querySelector('[data-title-toggle]')) continue;
        var sessionId = card.getAttribute('data-session-id');
        var expanded = !!state.expandedTitles[sessionId];
        // Overflow check: with line-clamp-2 the element shows two lines
        // (clientHeight) while scrollHeight still reports the full text
        // height. The +1 slack ignores sub-pixel rounding.
        if (!expanded && h2.scrollHeight <= h2.clientHeight + 1) continue;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('data-title-toggle', '');
        btn.setAttribute('data-session', sessionId);
        btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        btn.className = TITLE_TOGGLE;
        btn.textContent = expanded ? 'Less' : 'More';
        h2.insertAdjacentElement('afterend', btn);
      }
    }

    // More/Less tap on a clamped title: flip the clamp on that one title in
    // place (no full re-render, so no scroll jump) and remember the choice
    // for the session so a later re-render keeps it expanded.
    function toggleTitle(btn) {
      var sessionId = btn.getAttribute('data-session');
      var card = btn.closest('[data-proposal-card]');
      var h2 = card ? card.querySelector('[data-proposal-title]') : null;
      if (!sessionId || !card || !h2) return;
      var expanded = !!state.expandedTitles[sessionId];
      if (expanded) delete state.expandedTitles[sessionId];
      else state.expandedTitles[sessionId] = true;
      expanded = !expanded;
      h2.className = expanded ? TITLE_EXPANDED : TITLE_CLAMPED;
      btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      btn.textContent = expanded ? 'Less' : 'More';
    }

    // Tap on a card's change-summary line: flip that one line between the
    // one-line clamp and the full summary in place (no full re-render, so
    // no scroll jump) and remember the choice per session, the way
    // toggleTitle does for titles.
    function toggleSummary(btn) {
      var sessionId = btn.getAttribute('data-session');
      if (!sessionId) return;
      var expanded = !!state.expandedSummaries[sessionId];
      if (expanded) delete state.expandedSummaries[sessionId];
      else state.expandedSummaries[sessionId] = true;
      expanded = !expanded;
      btn.className = expanded ? SUMMARY_EXPANDED : SUMMARY_CLAMPED;
      btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    }

    // ------------------------------------------------------------------
    // Proposal detail: the full proposal with the same vote buttons the
    // card has, plus the discussion thread. Opened from a card's Discuss
    // button or the ?proposal=<sessionId> deep link.
    // ------------------------------------------------------------------

    var COMMENT_FIELD_CLASS = 'w-full resize-none rounded-xl border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-800 placeholder:text-zinc-400 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder:text-zinc-500';
    var COMMENT_SUBMIT_CLASS = 'min-h-9 rounded-full bg-violet-600 px-4 text-sm font-semibold text-white shadow-sm transition-transform hover:bg-violet-500 active:scale-95 disabled:opacity-50';
    var COMMENT_CANCEL_CLASS = 'min-h-9 rounded-full px-3 text-sm font-semibold text-zinc-500 transition-colors hover:text-zinc-700 dark:text-zinc-400 dark:hover:text-zinc-200';

    function commentClass(isTop) {
      return isTop
        ? 'rounded-xl border border-zinc-200 bg-white p-3 dark:border-zinc-800 dark:bg-zinc-900/70'
        : 'rounded-lg bg-zinc-50 p-2.5 dark:bg-zinc-800/50';
    }

    function commentHtml(c, isTop) {
      return '<article data-comment data-comment-id="' + esc(c.id) + '"'
        + (isTop ? ' data-comment-top' : '')
        + ' class="' + commentClass(isTop) + '">'
        + '<div class="flex items-baseline justify-between gap-2">'
        + '<span class="min-w-0 truncate text-xs font-semibold text-zinc-700 dark:text-zinc-200">@' + esc(c.username) + '</span>'
        + '<span class="shrink-0 text-xs text-zinc-400 dark:text-zinc-500">' + esc(relTime(c.createdAt)) + '</span>'
        + '</div>'
        + '<p data-comment-body class="mt-1 whitespace-pre-wrap text-sm leading-snug text-zinc-800 dark:text-zinc-100">' + esc(c.body) + '</p>'
        // Every comment offers Reply. On a reply it targets the tapped
        // comment itself; the server files that under the reply's own
        // top-level parent, so the thread never nests deeper than one.
        + '<button data-reply-btn data-comment="' + esc(c.id) + '"'
        + ' aria-label="' + (isTop ? 'Reply to this comment' : 'Reply in this thread') + '"'
        + ' class="mt-1.5 rounded-full text-xs font-semibold text-violet-600 transition-colors hover:text-violet-500 dark:text-violet-400 dark:hover:text-violet-300">Reply</button>'
        + '</article>';
    }

    function replyFormHtml(parentId) {
      return '<div data-reply-form class="flex flex-col gap-2">'
        + '<textarea data-reply-input rows="2" maxlength="2000" placeholder="Write a reply"'
        + ' aria-label="Write a reply" class="' + COMMENT_FIELD_CLASS + '"></textarea>'
        + '<div class="flex items-center justify-end gap-1">'
        + '<button data-reply-cancel class="' + COMMENT_CANCEL_CLASS + '">Cancel</button>'
        + '<button data-reply-submit data-parent="' + esc(parentId) + '"'
        + ' class="' + COMMENT_SUBMIT_CLASS + '">Reply</button>'
        + '</div></div>';
    }

    // A top-level comment's replies, oldest first, indented under a left
    // rule so the one-level nesting reads at a glance. The reply form
    // opens at the end of this block when the tapped comment was the
    // parent itself or any reply inside it; it submits with the tapped
    // id, and the server files a reply-to-reply under the top parent.
    function repliesHtml(parent, replies) {
      var open = String(state.replyForm) === String(parent.id);
      for (var j = 0; !open && j < replies.length; j++) {
        open = String(state.replyForm) === String(replies[j].id);
      }
      if (!replies.length && !open) return '';
      var html = '<div data-replies data-replies-of="' + esc(parent.id) + '"'
        + ' class="ml-3 mt-2 flex flex-col gap-2 border-l-2 border-zinc-200 pl-3 dark:border-zinc-800">';
      for (var i = 0; i < replies.length; i++) html += commentHtml(replies[i], false);
      if (open) html += replyFormHtml(state.replyForm);
      html += '</div>';
      return html;
    }

    // Thread order, client-side: oldest first (time, then id), so the
    // newest comment renders last in every thread and reply block.
    function sortedComments(list) {
      return (list || []).slice().sort(function (a, b) {
        var ta = Date.parse(a.createdAt); if (isNaN(ta)) ta = 0;
        var tb = Date.parse(b.createdAt); if (isNaN(tb)) tb = 0;
        if (ta !== tb) return ta - tb;
        return a.id > b.id ? 1 : a.id < b.id ? -1 : 0;
      });
    }

    function commentFormHtml() {
      return '<div data-comment-form class="mt-1 flex flex-col gap-2 rounded-2xl border border-zinc-200 bg-white p-3 dark:border-zinc-800 dark:bg-zinc-900/70">'
        + '<textarea data-comment-input rows="2" maxlength="2000"'
        + ' placeholder="Add a comment" aria-label="Add a comment"'
        + ' class="' + COMMENT_FIELD_CLASS + '"></textarea>'
        + '<div class="flex justify-end">'
        + '<button data-comment-post class="' + COMMENT_SUBMIT_CLASS + '">Post</button>'
        + '</div></div>';
    }

    function renderThread() {
      var heading = '<h3 data-thread-heading class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">Discussion</h3>';
      if (state.commentsError) {
        return heading
          + '<div class="flex flex-col items-center gap-2 rounded-2xl border border-red-500/30 bg-red-500/5 px-6 py-8 text-center">'
          + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + esc(state.commentsError) + '</p>'
          + '<button data-action="reload-comments" class="mt-1 rounded-full bg-violet-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Try again</button>'
          + '</div>'
          + commentFormHtml();
      }
      if (state.commentsLoading && !state.detailComments.length) {
        // No post form while the thread is loading: posting before the
        // list settles would race the fetch that replaces it.
        return heading
          + '<p data-thread-loading class="text-xs text-zinc-500 dark:text-zinc-400">Loading comments…</p>';
      }
      var list = sortedComments(state.detailComments);
      var tops = [];
      var byParent = {};
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (c.parentId == null) tops.push(c);
        else {
          var key = String(c.parentId);
          if (!byParent[key]) byParent[key] = [];
          byParent[key].push(c);
        }
      }
      if (!tops.length) {
        return heading
          + '<div data-thread-empty class="flex flex-col items-center gap-1 rounded-2xl border border-dashed border-zinc-300 bg-white/60 px-6 py-8 text-center dark:border-zinc-700 dark:bg-zinc-900/40">'
          + '<svg viewBox="0 0 24 24" class="h-8 w-8 text-zinc-300 dark:text-zinc-600" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'
          + '<p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">No comments yet</p>'
          + '<p class="text-xs text-zinc-500 dark:text-zinc-400">Ask or answer a question before voting.</p>'
          + '</div>'
          + commentFormHtml();
      }
      var html = '<div data-thread-list class="flex flex-col gap-2">';
      for (var t = 0; t < tops.length; t++) {
        var top = tops[t];
        html += commentHtml(top, true);
        html += repliesHtml(top, byParent[String(top.id)] || []);
      }
      html += '</div>';
      return heading + html + commentFormHtml();
    }

    // ------------------------------------------------------------------
    // Proposal impact preview: what the change touches (apps, members,
    // target release), the automated checks it runs and a plain-language
    // summary of what changes for users, when the platform sent an impact
    // record. Anything missing shows an "Unknown" label instead of blank,
    // and the panel renders for merged proposals too, as a read-only
    // record. On small screens the body collapses behind a Show details
    // toggle; ?impact-mobile=1 (demo checks) forces that collapsed
    // presentation at any viewport width.
    // ------------------------------------------------------------------

    var IMPACT_TOGGLE_CLASS = 'rounded-full border border-zinc-300 px-2.5 py-1 text-xs font-semibold text-zinc-600 transition-colors hover:text-zinc-800 dark:border-zinc-600 dark:text-zinc-300 dark:hover:text-zinc-100';
    var IMPACT_LABEL_CLASS = 'text-xs text-zinc-500 dark:text-zinc-400';
    var IMPACT_VALUE_CLASS = 'min-w-0 text-right text-xs font-medium text-zinc-800 dark:text-zinc-100';
    var IMPACT_UNKNOWN_CLASS = ' min-w-0 text-right text-xs font-medium text-zinc-400 dark:text-zinc-500';
    // The body's display classes per state: open shows it everywhere;
    // closed collapses it on small screens and reveals it from Tailwind's
    // sm breakpoint up; the ?impact-mobile=1 demo hook collapses it at
    // every width so the toggle is reachable by checks at any viewport.
    function impactBodyClass(open) {
      if (open) return 'flex flex-col gap-2';
      return IMPACT_MOBILE ? 'hidden' : 'hidden flex-col gap-2 sm:flex';
    }

    function impactRow(label, attr, value) {
      return '<div class="flex items-baseline justify-between gap-3">'
        + '<dt class="shrink-0 ' + IMPACT_LABEL_CLASS + '">' + label + '</dt>'
        + '<dd' + (attr ? ' ' + attr : '')
        + ' class="' + (value ? IMPACT_VALUE_CLASS : IMPACT_UNKNOWN_CLASS) + '">'
        + (value ? esc(value) : 'Unknown') + '</dd></div>';
    }

    function impactCheckRow(c) {
      var mark;
      if (c.state === 'passed') {
        mark = '<span data-check-passed class="shrink-0 text-xs font-semibold text-emerald-600 dark:text-emerald-400" aria-label="Passed">✓</span>';
      } else if (c.state === 'failed') {
        mark = '<span data-check-failed class="shrink-0 text-xs font-semibold text-red-500 dark:text-red-400" aria-label="Failed">✗</span>';
      } else {
        mark = '<span class="shrink-0 text-xs text-zinc-300 dark:text-zinc-600" aria-label="Result not known yet">·</span>';
      }
      return '<li class="flex items-baseline gap-1.5 text-xs text-zinc-700 dark:text-zinc-200">'
        + mark
        + '<span class="min-w-0">' + esc(c.name) + '</span></li>';
    }

    function impactPanel(p) {
      var imp = (p && p.impact) || {};
      var open = !!state.impactOpen[p.sessionId];
      var apps = Array.isArray(imp.apps) && imp.apps.length
        ? imp.apps.join(', ')
        : (typeof imp.appsCount === 'number' ? String(imp.appsCount) : null);
      var members = typeof imp.members === 'number'
        ? imp.members + (imp.members === 1 ? ' member' : ' members') : null;
      var release = typeof imp.targetRelease === 'string' && imp.targetRelease
        ? imp.targetRelease : null;
      var checks = Array.isArray(imp.checks) && imp.checks.length ? imp.checks : null;
      var summary = typeof imp.summary === 'string' && imp.summary ? imp.summary : null;

        + ' aria-label="Impact of this change"'
        + ' class="flex flex-col gap-2 rounded-2xl border border-zinc-200 bg-white p-3 dark:border-zinc-800 dark:bg-zinc-900/70">'
        + '<div class="flex items-center justify-between gap-2">'
        + '<h3 class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">Impact</h3>'
        + '<button data-impact-toggle data-session="' + esc(p.sessionId) + '"'
        + ' aria-expanded="' + (open ? 'true' : 'false') + '"'
        + ' class="' + IMPACT_TOGGLE_CLASS + (IMPACT_MOBILE ? '' : ' sm:hidden') + '">'
        + (open ? 'Hide details' : 'Show details') + '</button>'
        + '</div>'
        + '<div data-impact-body class="' + impactBodyClass(open) + '">'
        + '<dl class="flex flex-col gap-1">'

        + '</div>'
        + '</section>';
    }

    // The toggle's tap flips the panel's remembered open state and the
    // body's classes in place, the way toggleSummary flips a card's

    // The proposal's full description on the detail screen, untruncated (the
    // card clamps the same text to one line; the detail never does). Falls
    // back to the proposal's title when the platform sent no description,
    // marked with data-description-fallback so that state is observable.
    function detailDescription(p) {
      var text = typeof p.summary === 'string' && p.summary.trim() ? p.summary : '';
      if (text) {
        return '<div data-proposal-description'
          + ' class="whitespace-pre-line break-words text-sm leading-relaxed text-zinc-700 dark:text-zinc-300">'
          + esc(text) + '</div>';
      }
      return '<div data-proposal-description data-description-fallback="1"'
        + ' class="whitespace-pre-line break-words text-sm leading-relaxed text-zinc-500 dark:text-zinc-400">'
        + esc(p.title) + '</div>';
    }

    // Vote progress ring for the detail screen: a circular gauge of the yes
    // count against the merge threshold, with the yes/no/needed counts and
    // the "x of y yes to merge" label beside it. Without a known threshold
    // the gauge fills by the yes share, and the label and needed count are
    // left out (optional fields are never invented); a merged proposal
    // fills the ring completely. Whole literals for the Tailwind compiler.
    var RING_CIRC = 2 * Math.PI * 19;
    function voteRing(p) {
      var merged = p.status === 'merged';
      var hasRequired = p.required != null && p.required > 0;
      var pct = merged ? 100
        : hasRequired ? Math.min(100, Math.round((p.yes * 100) / p.required))
        : (p.yes + p.no > 0 ? Math.round((p.yes * 100) / (p.yes + p.no)) : 0);
      var met = merged || (hasRequired && p.yes >= p.required);
      var fillCls = met ? 'stroke-emerald-500 dark:stroke-emerald-400'
        : 'stroke-violet-500 dark:stroke-violet-400';
      var label = hasRequired ? p.yes + ' of ' + p.required + ' yes to merge' : '';
      return '<div data-vote-ring class="flex items-center gap-3 rounded-xl border border-zinc-200 bg-zinc-50 p-3 dark:border-zinc-800 dark:bg-zinc-900/70">'
        + '<svg viewBox="0 0 44 44" class="h-16 w-16 shrink-0 -rotate-90" role="img"'
        + ' aria-label="' + esc(label || ('Yes ' + p.yes + ', No ' + p.no)) + '">'
        + '<circle cx="22" cy="22" r="19" fill="none" stroke-width="4" class="stroke-zinc-200 dark:stroke-zinc-700"></circle>'
        + '<circle data-ring-fill cx="22" cy="22" r="19" fill="none" stroke-width="4"'
        + ' stroke-linecap="round" class="' + fillCls + '"'
        + ' stroke-dasharray="' + ((pct / 100) * RING_CIRC).toFixed(1) + ' ' + RING_CIRC.toFixed(1) + '"></circle>'
        + '</svg>'
        + '<div class="flex min-w-0 flex-col gap-0.5">'
        + '<span data-ring-yes class="text-sm font-semibold text-zinc-800 dark:text-zinc-100">Yes ' + p.yes + '</span>'
        + '<span data-ring-no class="text-sm text-zinc-600 dark:text-zinc-300">No ' + p.no + '</span>'
        + (p.needed != null
          ? '<span data-ring-needed class="text-xs text-zinc-500 dark:text-zinc-400">'
            + (p.needed === 0 ? 'Threshold met' : p.needed + (p.needed === 1 ? ' vote needed' : ' votes needed'))
            + '</span>'
          : '')
        + (label ? '<p data-ring-label class="text-xs font-medium text-zinc-600 dark:text-zinc-300">' + esc(label) + '</p>' : '')
        + '</div>'
        + '</div>';
    }

    // Numbered timeline of the proposal's life so far: Opened first, then
    // one row per yes vote (display name, avatar chip and, when the
    // platform response carries per-vote timestamps, when the vote was
    // cast), then Threshold reached once the yes count meets the
    // requirement, then Merged with its date. Rows the data cannot support
    // (no proposedAt, no named voters, no mergedAt) simply do not render —
    // optional fields are never invented. The section itself renders empty
    // only when nothing at all can be placed on it.
    function timelineSection(p) {
      var items = [];
      var index = 0;
      function rowHtml(attrs, inner, timeHtml, ariaTitle) {
        index += 1;
        return '<li ' + attrs + ' data-timeline-index="' + index + '"'
          + ' class="flex items-start gap-2.5">'
          + '<span aria-hidden="true" class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-zinc-200 text-xs font-bold text-zinc-600 dark:bg-zinc-700 dark:text-zinc-200">' + index + '</span>'
          + '<div class="flex min-w-0 flex-col gap-0.5">'
          + '<span class="text-xs font-semibold text-zinc-800 dark:text-zinc-100">' + inner + '</span>'
          + (timeHtml
            ? '<span data-timeline-time class="text-xs text-zinc-500 dark:text-zinc-400"'
              + (ariaTitle ? ' title="' + esc(ariaTitle) + '"' : '')

          'data-timeline-event="opened"',

      var voteRows = 0;
      var lastVoteAt = null;
      for (var i = 0; i < voters.length; i++) {
        var voter = voters[i];
        var username = voter && typeof voter.username === 'string' ? voter.username : '';
        if (!username) continue;
        var label = (voter.name && typeof voter.name === 'string' && voter.name) || username;
        var initial = (label.trim().charAt(0) || '?').toUpperCase() || '?';
        var chip = '<span aria-hidden="true" class="' + VOTER_AVATAR_CLASS + avatarClass(username) + '">' + esc(initial) + '</span>';
        var time = typeof voter.votedAt === 'string' && voter.votedAt ? esc(relTime(voter.votedAt)) : '';

          'data-timeline-event="merged" data-timeline-merged="' + esc(mergedLabel) + '"',
          'Merged',

          'Merged ' + new Date(p.mergedAt).toLocaleString()));

      if (!items.length) return '';
      return '<section data-timeline data-timeline-votes="' + voteRows + '" class="' + CARD_CLASS + '">'
        + '<h3 class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">Timeline</h3>'
        + '<ol class="flex flex-col gap-2.5">' + items.join('') + '</ol>'
        + '</section>';
    }

    // Related proposals: other loaded proposals from the same app that are

    // openDetail the cards' Discuss button uses, so a related tap is a
    // normal detail navigation.
    function relatedSection(p) {
      var list = (state.inbox && state.inbox.proposals) || [];

      for (var i = 0; i < list.length; i++) {
        var q = list[i];

      for (var j = 0; j < related.length; j++) {
        var q2 = related[j];

          + '<button type="button" data-open-detail data-session="' + esc(q2.sessionId) + '"'
          + ' class="flex w-full items-center justify-between gap-2 rounded-xl border border-zinc-200 bg-white px-3 py-2 text-left transition-colors hover:bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900/70 dark:hover:bg-zinc-800/60">'
          + '<span class="min-w-0 truncate text-xs font-medium text-zinc-700 dark:text-zinc-200">' + esc(q2.title) + '</span>'
          + neededPill(q2)
          + '</button></li>';
      }
      return '<section data-related-proposals data-related-count="' + related.length + '" class="' + CARD_CLASS + '">'
        + '<h3 class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">More from ' + esc(p.appName) + '</h3>'
        + '<ul class="flex flex-col gap-1.5">' + rows + '</ul>'
        + '</section>';
    }

    // Sticky action bar for the detail screen: Yes, No and Share stay
    // reachable while the proposal scrolls (the bar pins to the bottom of
    // the screen and content slides under it). Yes and No disable once
    // voted — a pill names the way — and while a vote is in flight or the

    // pill here. Share runs the same native-sheet-or-copy decision as the
    // cards' share button. Whole literals for the Tailwind compiler.

    var DETAIL_SHARE_CLASS = 'inline-flex h-11 shrink-0 items-center gap-1.5 rounded-xl border border-zinc-300 bg-white px-3.5 text-sm font-semibold text-zinc-700 transition-transform active:scale-95 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-200';

    function detailActionBar(p) {
      var voted = p.myVote === 'yes' || p.myVote === 'no';

      var copy = resolveShareMode() === 'copy';
      return '<div data-detail-actions'
        + (detailStickyObserved ? ' data-sticky-observed="1"' : '')
        + ' class="' + DETAIL_BAR_CLASS + '">'
        + (voted

          : '')
        + '<div class="flex items-center gap-2">'
        + '<button data-vote="yes" data-session="' + esc(p.sessionId) + '"'
        + ' class="' + VOTE_YES_ROW + '"' + (disabled ? ' disabled' : '') + '>Yes</button>'
        + '<button data-vote="no" data-session="' + esc(p.sessionId) + '"'
        + ' class="' + VOTE_NO_ROW + '"' + (disabled ? ' disabled' : '') + '>No</button>'
        + bookmarkToggleButton(p.sessionId, !!p.myBookmark,

        + (p.url
          ? '<button data-share-link data-url="' + esc(p.url) + '"'
            + (copy ? ' data-share-mode="copy"' : ' data-share-mode="sheet"')
            + (copy ? ' aria-label="Copy link to this proposal" title="Copy link"' : ' aria-label="Share this proposal" title="Share"')
            + ' class="' + DETAIL_SHARE_CLASS + '">' + (copy ? COPY_IDLE_HTML : SHARE_IDLE_HTML) + '</button>'
          : '')

        + '</div>';
    }

    function renderDetail() {
      var p = findProposal(state.detail);
      if (!p) return '';
      return '<div data-proposal-detail data-session-id="' + esc(p.sessionId) + '" class="flex flex-col gap-3">'
        + '<button data-action="close-detail"'
        + ' aria-label="Back to the inbox" title="Back"'
        + ' class="self-start inline-flex items-center gap-1 rounded-full text-sm font-semibold text-violet-600 transition-colors hover:text-violet-500 dark:text-violet-400 dark:hover:text-violet-300">'
        + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back</button>'
        + '<article class="' + CARD_CLASS + '">'
        + '<div class="flex items-center justify-between gap-2">'
        + '<span class="flex min-w-0 items-center gap-1.5">'
        + appAvatar(p)
        + '<span data-detail-app="' + esc(p.appName) + '" class="truncate text-xs font-medium text-zinc-500 dark:text-zinc-400">' + esc(p.appName) + '</span>'
        + ageSpan(p)
        + '</span>'
        + neededPill(p)
        + '</div>'
        + proposedDateLine(p)
        + '<h2 data-proposal-title class="text-sm font-semibold leading-snug text-zinc-900 dark:text-zinc-100">' + esc(p.title) + '</h2>'
        + detailDescription(p)
        + voteRing(p)
        + statusProgress(p)
        + '<p class="min-w-0 text-xs text-zinc-500 dark:text-zinc-400">'
        + (p.author ? '<span data-detail-author>by @' + esc(p.author) + '</span>' : '') + '</p>'
        + '</article>'

    function voteRow(v) {

      var knownStatus = !!STATUS_STYLE[v.status];
      var date = '';
      if (v.created_at) {
        try { date = new Date(v.created_at).toLocaleDateString(); } catch (e) { date = ''; }
      }
      // Merged rows show when the proposal merged, next to the pill. The
      // recorded merged_at timestamp is the source; updated_at (the refresh
      // that first saw the merge) stands in when the platform never sent one.

      var mergedFull = '';

      if (v.votes_required != null && v.status === 'voting') {
        var needed = Math.max(0, v.votes_required - v.votes_for);

      }
      return '<article data-vote-row data-session-id="' + esc(v.session_id) + '"'
        + ' data-vote-status="' + esc(knownStatus ? v.status : 'closed') + '"'
        // The weekly digest's "matches the list" check reads this: rows
        // inside the current calendar week are marked.
        + (isThisWeek(v.created_at) ? ' data-this-week' : '')
        // Same density the Inbox cards use; My Votes rows carry the marker
        // so a check can assert the preference reached this tab too.
        + ' data-density="' + (state.density === 'compact' ? 'compact' : 'comfortable') + '"'
        + ' class="' + densityCardClass(false) + '">'
        + '<div class="flex items-start justify-between gap-2">'
        + '<h2 class="line-clamp-2 text-sm font-semibold leading-snug text-zinc-900 dark:text-zinc-100">' + esc(v.title) + '</h2>'
        + '<span class="whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-semibold ' + style[1] + '">' + style[0] + '</span>'
        + (mergedDate
           ? '<span data-merged-date class="whitespace-nowrap text-xs text-zinc-500 dark:text-zinc-400" title="Merged ' + esc(mergedFull) + '">· ' + esc(mergedDate) + '</span>'
           : '')
        + '</div>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + esc(v.app_name || v.app_slug)
        + ' · You voted ' + v.choice + ' · ' + esc(counts) + '</p>'
        + (date ? '<p class="text-xs text-zinc-500 dark:text-zinc-500">Voted ' + esc(date) + '</p>' : '')
        + '</article>';
    }

    // ------------------------------------------------------------------
    // Merge celebrations. When a proposal the user voted on merges, a
    // one-time card appears at the top of the inbox: what merged, where,
    // and that the user's vote was on the winning side. The cards come
    // from the server's pending list; each is rendered once and then
    // marked shown (or dismissed), so it never comes back on a later
    // load. Multiple merges stack as separate cards, newest first.
    // ------------------------------------------------------------------

    // Effective motion for the cards' entrance animation: reduced when the
    // viewer asked the device for reduced motion, or when a demo check

    // small-screen impact panel). The stylesheet animates only the 'full'
    // presentation and also guards with prefers-reduced-motion itself.

            && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {

        }
      } catch (e) { /* treat as full motion */ }
      return 'full';
    }

    function celebrationCardHtml(c) {
      var choice = c.choice === 'no' ? 'no' : 'yes';
      return '<article data-celebration data-session-id="' + esc(c.sessionId) + '"'
        + ' data-celebration-choice="' + choice + '"'
        + ' class="celebration-card flex flex-col gap-1.5 rounded-2xl border border-violet-500/40 bg-violet-600/10 p-4 shadow-sm">'
        + '<div class="flex items-start justify-between gap-2">'
        + '<p class="text-xs font-semibold text-violet-700 dark:text-violet-300">Merged</p>'
        + '<button data-action="dismiss-celebration" data-session="' + esc(c.sessionId) + '"'
        + ' aria-label="Dismiss celebration for ' + esc(c.title) + '"'
        + ' class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-zinc-400 hover:text-zinc-600 dark:text-zinc-500 dark:hover:text-zinc-300">'
        + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>'
        + '</button></div>'
        + '<h2 data-celebration-title class="line-clamp-2 text-sm font-semibold leading-snug text-zinc-900 dark:text-zinc-100">' + esc(c.title) + '</h2>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400"><span data-celebration-app>'
        + esc(c.appName || c.appSlug) + '</span> · <span data-celebration-choice>You voted '
        + choice + '</span></p>'
        + '<div class="mt-1"><button data-action="see-merged" data-session="' + esc(c.sessionId) + '"'
        + ' class="rounded-full bg-violet-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">See what merged</button></div>'
        + '</article>';
    }

    function celebrationCardsHtml() {
      if (!state.celebrations.length) return '';
      return '<div data-celebrations data-motion="' + celebrationMotion() + '"'
        + ' class="flex flex-col gap-3" aria-label="Merge celebrations">'
        + state.celebrations.map(celebrationCardHtml).join('') + '</div>';
    }

    // Mark the rendered cards shown so each proposal's celebration is a
    // one-time card: the next inbox load no longer returns them. The POST's
    // promise is kept so the ?celeb-reload=1 hook can wait for it to land
    // before reloading its marker page.
    function markCelebrationsShown() {
      if (!state.celebrations.length || state.celebShownPending) return;
      var ids = state.celebrations.map(function (c) { return c.sessionId; });
      state.celebShownPending = true;
      state.celebShownPromise = api('/api/celebrations/shown', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ ids: ids }),
      }).catch(function () {

        state.celebShownPending = false;

    // Polite announcement for the celebration cards, read by screen readers
    // when the set of cards changes (the region is aria-live="polite").
