        }).catch(function () {}).then(function () {
          hookProposal.myVote = null;
          render();
          var noBtn = document.querySelector(
            '[data-compare-col="' + hookSession + '"] [data-vote="no"]');
          if (!noBtn) return;
          noBtn.click();
          if (!CONFIRM_NO) return;
          var tries = 0;
          var timer = setInterval(function () {
            var confirmBtn = findButtonByText('No, reject');
            if (confirmBtn) {
              clearInterval(timer);
              confirmBtn.click();
            } else if (++tries > 40) {
              clearInterval(timer);
            }
          }, 100);
        });
      }
    }

    // ------------------------------------------------------------------
    // Events
    // ------------------------------------------------------------------

    // The tour lives in #tour-slot, outside #view, so its two buttons get
    // their own tiny delegation (the same data-action convention).
    document.getElementById('tour-slot').addEventListener('click', function (event) {
      var actionEl = event.target.closest ? event.target.closest('[data-action]') : null;
      if (!actionEl) return;
      var action = actionEl.getAttribute('data-action');
      if (action === 'tour-next') tourNext();
      else if (action === 'tour-skip') tourSkip();
    });

    document.getElementById('view').addEventListener('click', function (event) {
      var target = event.target;
      // Compose screen controls first: template chips, the Send pill, the
      // back chevron and the post-send reset.
      var tplChip = target.closest ? target.closest('[data-template-option]') : null;
      if (tplChip) {
        pickTemplate(tplChip.getAttribute('data-template-id'));
        return;
      }
      if (target.closest && target.closest('[data-send-proposal]')) {
        sendProposal();
        return;
      }
      if (target.closest && target.closest('[data-compose-back]')) {
        backToMain();
        return;
      }
      if (target.closest && target.closest('[data-compose-again]')) {
        resetComposeForm();
        return;
      }
      var actionEl = target.closest ? target.closest('[data-action]') : null;
      if (actionEl) {
        var action = actionEl.getAttribute('data-action');
        if (action === 'refresh') refreshCurrent();
        else if (action === 'reload-sent') {
          state.compose.sentError = false;
          state.compose.sentLoaded = false;
          sentRequested = false;
          render();
          loadSent();
        }
        else if (action === 'clear-filter') {
          state.filter = '';
          state.filterName = '';
          saveFilter(null);
          render();
        } else if (action === 'clear-tag') {
          state.tagFilter = '';
          saveTagFilter(null);
          render();
        } else if (action === 'clear-one-away') {
          state.oneAway = false;
          render();
        } else if (action === 'show-voted') {
          setHideVoted(false);
        } else if (action === 'show-merged') {
          setHideMerged(false);
        } else if (action === 'show-read') {
          setHideRead(false);
        } else if (action === 'show-snoozed') {
          state.snoozeView = true;
          render();
        } else if (action === 'clear-snooze-view') {
          state.snoozeView = false;
          render();
        } else if (action === 'clear-search') {
          state.search = '';
          var box = document.getElementById('inbox-search');
          if (box) box.value = '';
          render();
        } else if (action === 'browse-apps') {
          // Empty-inbox call to action: open the app filter dropdown, the
          // place where this app's loaded apps are browsed.
          openAppFilter();
        } else if (action === 'see-finished') {
          seeFinishedProposals();
        } else if (action === 'toggle-alerts') {
          setAlertsOn(!state.alertsOn);
        } else if (action === 'tour-next') {
          tourNext();
        } else if (action === 'tour-skip') {
          tourSkip();
        } else if (action === 'go-inbox') {
          state.tab = 'inbox';
          render();
          // Land at the top of the list so the pull-to-refresh gesture can
          // engage right away; the pull only fires at scroll offset 0.
          window.scrollTo(0, 0);
          loadInbox(!state.inbox);
        } else if (action === 'close-detail') {
          closeDetail();
        } else if (action === 'close-members') {
          closeMembers();
        } else if (action === 'reload-comments') {
          state.commentsKey = '';
          loadDetailComments();
        } else if (action === 'dismiss-celebration') {
          dismissCelebration(actionEl.getAttribute('data-session'));
        } else if (action === 'see-merged') {
          seeWhatMerged();
        } else if (action === 'show-all-votes') {
          setVotesMergedWeek(false);
        }
        return;
      }
      var titleBtn = target.closest ? target.closest('[data-title-toggle]') : null;
      if (titleBtn) {
        toggleTitle(titleBtn);
        return;
      }
      var summaryBtn = target.closest ? target.closest('[data-summary-toggle]') : null;
      if (summaryBtn) {
        toggleSummary(summaryBtn);
        return;
      }
      var impactBtn = target.closest ? target.closest('[data-impact-toggle]') : null;
      if (impactBtn) {
        toggleImpact(impactBtn);
        return;
      }
      var selToggle = target.closest ? target.closest('[data-select-toggle]') : null;
      if (selToggle) {
        toggleSelect(selToggle.getAttribute('data-session'));
        return;
      }
      var starBtn = target.closest ? target.closest('[data-star-toggle]') : null;
      if (starBtn) {
        toggleStar(starBtn.getAttribute('data-session'));
        return;
      }
      var bookmarkBtn = target.closest ? target.closest('[data-bookmark-toggle]') : null;
      if (bookmarkBtn) {
        toggleBookmark(bookmarkBtn.getAttribute('data-session'));
        return;
      }
      // The Snooze button opens (or closes) the little inline menu with the
      // one day and one week choices.
      var snoozeBtn = target.closest ? target.closest('[data-snooze-toggle]') : null;
      if (snoozeBtn) {
        var snoozeSession = snoozeBtn.getAttribute('data-session');
        state.snoozeMenu = state.snoozeMenu === snoozeSession ? null : snoozeSession;
        render();
        return;
      }
      var snoozeChoose = target.closest ? target.closest('[data-snooze-choose]') : null;
      if (snoozeChoose) {
        snoozeProposal(
          snoozeChoose.getAttribute('data-session'),
          Number(snoozeChoose.getAttribute('data-days')));
        return;
      }
      var unsnoozeBtn = target.closest ? target.closest('[data-unsnooze]') : null;
      if (unsnoozeBtn) {
        unsnoozeProposal(unsnoozeBtn.getAttribute('data-session'));
        return;
      }
      var discussBtn = target.closest ? target.closest('[data-open-detail]') : null;
      if (discussBtn) {
        openDetail(discussBtn.getAttribute('data-session'));
        return;
      }
      var replyBtn = target.closest ? target.closest('[data-reply-btn]') : null;
      if (replyBtn) {
        var replyId = replyBtn.getAttribute('data-comment');
        // Reply is a toggle: tapping it again closes the form.
        state.replyForm = String(state.replyForm) === String(replyId) ? null : String(replyId);
        render();
        var replyInput = document.querySelector('[data-reply-input]');
        if (replyInput) replyInput.focus();
        return;
      }
      var replyCancel = target.closest ? target.closest('[data-reply-cancel]') : null;
      if (replyCancel) {
        state.replyForm = null;
        render();
        return;
      }
      var replySubmit = target.closest ? target.closest('[data-reply-submit]') : null;
      if (replySubmit) {
        postThreadComment(replySubmit.getAttribute('data-parent'));
        return;
      }
      var postBtn = target.closest ? target.closest('[data-comment-post]') : null;
      if (postBtn) {
        postThreadComment(null);
        return;
      }
      var compareAdd = target.closest ? target.closest('[data-compare-add]') : null;
      if (compareAdd) {
        toggleCompare(compareAdd.getAttribute('data-session'));
        return;
      }
      if (target.closest && target.closest('[data-compare-open]')) {
        openCompareView();
        return;
      }
      if (target.closest && target.closest('[data-compare-clear]')) {
        clearCompare();
        return;
      }
      var voteBtn = target.closest ? target.closest('[data-vote]') : null;
      if (voteBtn) {
        var voteSession = voteBtn.getAttribute('data-session');
        var voteChoice = voteBtn.getAttribute('data-vote');
        // "No" asks first; "Yes" stays one-tap.
        if (voteChoice === 'no') openNoConfirm(voteSession);
        else castVote(voteSession, voteChoice);
        return;
      }
      var retryBtn = target.closest ? target.closest('[data-retry-vote]') : null;
      if (retryBtn) {
        retryVote(retryBtn.getAttribute('data-session'));
        return;
      }
      var copyBtn = target.closest ? target.closest('[data-share-link]') : null;
      if (copyBtn) {
        shareProposalLink(copyBtn);
        return;
      }
      // Tapping a proposal card anywhere that is not one of its controls
      // opens the proposal's detail screen, like tapping a list row. Every
      // control above returns before this, so it only catches the card
      // body itself.
      var cardEl = target.closest ? target.closest('[data-proposal-card]') : null;
      if (cardEl) {
        openDetail(cardEl.getAttribute('data-session-id') || '');
      }
    });

    // Compose fields: keep state and the derived bits in step without a
    // re-render (which would steal focus from the field being typed in).
    // The title's value attribute is mirrored so the checks, which read
    // markup, can assert on an edit; the description's character counter
    // carries its state the same way.
    document.getElementById('view').addEventListener('input', function (event) {
      if (state.screen !== 'compose') return;
      var t = event.target;
      if (t.matches && t.matches('#compose-title')) {
        state.compose.title = t.value;
        t.setAttribute('value', t.value);
        updateSendPill();
      } else if (t.matches && t.matches('#compose-body')) {
        state.compose.body = t.value;
        var count = document.querySelector('[data-compose-count]');
        if (count) count.textContent = t.value.length + ' characters';
        updateSendPill();
      }
    });

    document.getElementById('new-proposal-btn').addEventListener('click', function () {
      openCompose();
    });

    // Share-as-image: the open button and the preview panel sit above #view,
    // so they get their own listeners (the panel delegates, since its inner
    // HTML is re-rendered on every state change). The action buttons reuse
    // the same fallback pattern as the card share: sheet, download, copy.
    var shareImgOpenBtn = document.querySelector('[data-shareimg-open]');
    if (shareImgOpenBtn) shareImgOpenBtn.addEventListener('click', openShareImage);
    var shareImgPanel = document.getElementById('shareimg-panel');
    if (shareImgPanel) {
      shareImgPanel.addEventListener('click', function (event) {
        var target = event.target;
        if (target.closest && target.closest('[data-shareimg-close]')) {
          state.shareImage = null;
          renderShareImagePanel();
          return;
        }
        var shareBtn = target.closest ? target.closest('[data-shareimg-share]') : null;
        if (shareBtn) { startShareImageSheet(); return; }
        var downloadBtn = target.closest ? target.closest('[data-shareimg-download]') : null;
        if (downloadBtn) { downloadShareImage(); return; }
        var copyBtn = target.closest ? target.closest('[data-shareimg-copy]') : null;
        if (copyBtn) copyProposalLink(copyBtn);
      });
    }

    filterTrigger.addEventListener('click', function () {
      if (openFilter) closeFilter(); else openAppFilter();
    });

    // Weekly digest: the View details toggle lives outside #view, so it
    // gets its own delegated listener. Flipping the flag and re-rendering
    // keeps the card and its chart in one place.
    var votesDigestEl = document.getElementById('votes-digest');
    if (votesDigestEl) {
      votesDigestEl.addEventListener('click', function (event) {
        var toggle = event.target.closest ? event.target.closest('[data-digest-toggle]') : null;
        if (toggle) {
          state.digestOpen = !state.digestOpen;
          render();
        }
      });
    }

    // Saved views: tap a chip to switch, tap its "⋯" to rename or delete.
    var viewsChips = document.getElementById('views-chips');
    if (viewsChips) {
      viewsChips.addEventListener('click', function (event) {
        var target = event.target;
        var menuBtn = target.closest ? target.closest('[data-view-menu]') : null;
        if (menuBtn) {
          openViewMenu(menuBtn.getAttribute('data-view-name'), menuBtn);
          return;
        }
        var chip = target.closest ? target.closest('[data-view-chip]') : null;
        if (chip) {
          var view = findView(chip.getAttribute('data-view-name'));
          if (view) applyView(view);
        }
      });
    }
    var saveViewBtn = document.getElementById('save-view-btn');
    if (saveViewBtn) saveViewBtn.addEventListener('click', openSaveViewDialog);

    // Saved searches: tap a chip to run its search again, tap its × to
    // delete it (a saved search is cheap to make again, so no confirm).
    var savedSearchesChips = document.getElementById('saved-searches-chips');
    if (savedSearchesChips) {
      savedSearchesChips.addEventListener('click', function (event) {
        var target = event.target;
        var delBtn = target.closest ? target.closest('[data-saved-search-delete]') : null;
        if (delBtn) {
          var wrap = delBtn.closest('[data-saved-search]');
          deleteSavedSearch(wrap ? wrap.getAttribute('data-search-id') : '');
          return;
        }
        var openBtn = target.closest ? target.closest('[data-saved-search-open]') : null;
        if (openBtn) {
          var holder = openBtn.closest('[data-saved-search]');
          var row = holder && findSavedSearchRow(holder.getAttribute('data-search-id'));
          if (row) openSavedSearch(row);
        }
      });
    }
    var saveSearchBtn = document.getElementById('save-search-btn');
    if (saveSearchBtn) saveSearchBtn.addEventListener('click', openSaveSearchDialog);

    if (oneAwayChip) {
      oneAwayChip.addEventListener('click', function () {
        state.oneAway = !state.oneAway;
        render();
      });
    }

    if (snoozedChip) {
      snoozedChip.addEventListener('click', function () {
        state.snoozeView = !state.snoozeView;
        render();
      });
    }

    if (selectModeBtn) {
      selectModeBtn.addEventListener('click', function () {
        setSelectMode(!state.selectMode);
      });
    }

    // The bulk bar's own buttons: Approve and Hide cast over the selection,
    // Clear empties it while staying in select mode (Done, on the bar, is
    // the one that leaves select mode).
    var selectBarEl = document.getElementById('select-bar');
    if (selectBarEl) {
      selectBarEl.addEventListener('click', function (event) {
        var btn = event.target.closest ? event.target.closest('[data-bulk]') : null;
        if (!btn) return;
        var kind = btn.getAttribute('data-bulk');
        if (kind === 'approve') bulkApply('yes');
        else if (kind === 'hide') bulkApply('no');
        else if (kind === 'clear') {
          state.selected = {};
          render();
        }
      });
    }

    var selectExitBtn = document.getElementById('select-exit');
    if (selectExitBtn) {
      selectExitBtn.addEventListener('click', function () {
        setSelectMode(false);
      });
    }

    document.getElementById('hide-voted').addEventListener('change', function (event) {
      setHideVoted(event.target.checked);
    });

    document.getElementById('hide-merged').addEventListener('change', function (event) {
      setHideMerged(event.target.checked);
    });

    document.getElementById('hide-read').addEventListener('change', function (event) {
      setHideRead(event.target.checked);
    });

    // Mark all read sits in the header line (outside #view), so it carries
    // its own listener rather than riding the delegated one.
    var markAllReadBtn = document.querySelector('[data-mark-all-read]');
    if (markAllReadBtn) {
      markAllReadBtn.addEventListener('click', function () {
        markAllRead();
      });
    }

    // Title search filters the loaded cards live; the input sits outside
    // #view so re-rendering the list never steals its focus.
    document.getElementById('inbox-search').addEventListener('input', function (event) {
      state.search = event.target.value;
      render();
    });

    // Members search filters the loaded roster live; like the inbox search,
    // the input sits outside #view so re-rendering never steals its focus.
    document.getElementById('members-search').addEventListener('input', function (event) {
      state.memberQuery = event.target.value;
      render();
    });
    document.getElementById('members-btn').addEventListener('click', function () {
      if (state.membersView) closeMembers();
      else openMembers();
    });

    // Header menu (fallback panel path: dismiss on an outside tap or
    // Escape; the kit's menu handles its own dismissal).
    document.getElementById('menu-btn').addEventListener('click', function () {
      openHeaderMenu();
    });
    document.addEventListener('click', function (event) {
      var panel = document.getElementById('menu-panel');
      if (!panel || panel.hidden) return;
      if (panel.contains(event.target) || event.target.closest('#menu-btn')) return;
      panel.hidden = true;
      document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
    });
    document.getElementById('menu-panel').addEventListener('click', function (event) {
      var opt = event.target.closest('[data-density-option]');
      if (opt) {
        setDensity(opt.getAttribute('data-density-option') === 'compact' ? 'compact' : 'comfortable');
        closeHeaderMenuPanel();
        return;
      }
      var item = event.target.closest('[data-menu-item]');
      if (!item) return;
      var panel = document.getElementById('menu-panel');
      panel.hidden = true;
      document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
      if (item.getAttribute('data-menu-item') === 'tour') reopenTour();
    });

    var sortButtons = document.querySelectorAll('#sort-row [data-sort]');
    for (var si = 0; si < sortButtons.length; si++) {
      sortButtons[si].addEventListener('click', function (event) {
        setSort(event.currentTarget.getAttribute('data-sort'));
      });
    }

    var votesOrderButtons = document.querySelectorAll('#votes-order-row [data-votes-order]');
    for (var vo = 0; vo < votesOrderButtons.length; vo++) {
      votesOrderButtons[vo].addEventListener('click', function (event) {
        setVotesOrder(event.currentTarget.getAttribute('data-votes-order'));
      });
    }

    var lbRangeButtons = document.querySelectorAll('#lb-range-row [data-lb-range]');
    for (var lrb = 0; lrb < lbRangeButtons.length; lrb++) {
      lbRangeButtons[lrb].addEventListener('click', function (event) {
        setLbRange(event.currentTarget.getAttribute('data-lb-range'));
      });
    }

    // The merged-this-week chip on the My Votes tab (same row as the vote
    // order pill).
    var votesMergedChip = document.querySelector('[data-votes-merged-chip]');
    if (votesMergedChip) {
      votesMergedChip.addEventListener('click', function () {
        setVotesMergedWeek(!state.votesMergedWeek);
      });
    }

    document.getElementById('refresh-btn').addEventListener('click', function () {
      refreshCurrent();
    });

    var tabButtons = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabButtons.length; i++) {
      tabButtons[i].addEventListener('click', function (event) {
        var tab = event.currentTarget.getAttribute('data-tab');
        // Tapping a tab while the members directory is open goes back to
        // that tab, even when it is the one underneath: close the
        // directory and load the tab as if the switch had happened.
        var wasMembers = state.membersView;
        if (wasMembers) {
          state.membersView = false;
          syncMembersUrl();
        } else if (tab === state.tab) {
          return;
        }
        state.tab = tab;
        // Leaving the Inbox closes the compare view (the selection itself
        // survives; coming back shows the bar again, ready to re-open).
        if (tab !== 'inbox') state.compareView = false;
        var url = new URL(location.href);
        url.searchParams.set('tab', tab);
        history.replaceState(null, '', url.pathname + url.search + url.hash);
        render();
        // Land at the top of the newly opened tab so the pull-to-refresh
        // gesture can engage right away; the pull only fires at offset 0,
        // and a tab switch used to keep the previous tab's scroll offset.
        window.scrollTo(0, 0);
        if (tab === 'votes') loadVotes(!state.votes);
        else if (tab === 'saved') loadSaved(!state.saved);
        else if (tab === 'watchlist') loadWatchlist(!state.watchlist);
        else if (tab === 'leaderboard') loadLeaderboard(!state.leaderboard);
        // The Following tab reads the inbox data; it needs a load of its own
        // only when no inbox load has happened yet (e.g. deep-linked here).
        else if (tab === 'following' && !state.inbox) loadInbox(false);
      });
    }

    // Pull down on the list to refresh (native kit; no-op on desktop).
    if (window.unNative && unNative.attachPullToRefresh) {
      try {
        unNative.attachPullToRefresh(window, function () { return refreshCurrent(); });
      } catch (e) { /* kit unavailable; the Refresh button still works */ }
    }

    // ------------------------------------------------------------------
    // Boot: render the shell instantly, then fetch the active tab's data.
    // ------------------------------------------------------------------

    // Staging check hooks run before the first render, so the page shows
    // their result as if it had come from a tap.
    runViewsHooks();
    // Saved-search check hooks run first (before the first render, like the
    // views hooks); the list itself loads right after, alongside the active
    // tab's load below.
    runSavedSearchHooks().then(function () { return loadSavedSearches(); })
      .then(function () {
        savedSearchesSettled = true;
        maybeTapSearch();
      });
    render();
    // Tour check hooks need the first render's DOM (the tour panel), so
    // they run right after it, before the tab data fetch starts.
    runTourHooks();
    var hideVotedBox = document.getElementById('hide-voted');
    if (hideVotedBox) hideVotedBox.checked = state.hideVoted;
    var hideMergedBox = document.getElementById('hide-merged');
    if (hideMergedBox) hideMergedBox.checked = state.hideMerged;
    var hideReadBox = document.getElementById('hide-read');
    if (hideReadBox) hideReadBox.checked = state.hideRead;
    var searchBox = document.getElementById('inbox-search');
    if (searchBox && state.search) searchBox.value = state.search;
    var membersBox = document.getElementById('members-search');
    if (membersBox && state.memberQuery) membersBox.value = state.memberQuery;
    if (state.screen === 'compose') {
      // The ?compose=1 deep link opens the New proposal screen; the list
      // behind it is not shown, so its data loads when the user leaves
      // compose (backToMain), not on boot.
    } else if (state.membersView) loadMembers(true);
    else if (state.tab === 'votes') loadVotes(true);
    else if (state.tab === 'saved') loadSaved(true);
    else if (state.tab === 'watchlist') loadWatchlist(true);
    // The Following tab reads the inbox data, so its boot load is the same.
    else if (state.tab === 'following') loadInbox(true);
    else if (state.tab === 'leaderboard') {
      bootBoardLoad = loadLeaderboard(true);
      // A ?cast= check on the Leaderboard tab still needs the demo inbox:
      // the hook casts through the real vote path once the list arrives,
      // and the vote then refetches the board it just moved. Without the
      // hook the board alone loads.
      if (AUTO_CAST) loadInbox(true);
    }
    else loadInbox(true);

    // The pinned own-position chip follows the scroll: visible while the
    // own row is above or below the fold, gone while it is on screen.
    window.addEventListener('scroll', updateLbPin, { passive: true });
    window.addEventListener('resize', updateLbPin);
  })();
  </script>
</body>
</html>
