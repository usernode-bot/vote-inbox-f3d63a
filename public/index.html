  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css on every image build, so the stylesheet is
       regenerated from THIS commit's markup and can never drift behind the
       code. Class names must be written as whole literals (including ones
       inside JS strings) for the compiler to see them. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Not conditional on calling a bridge API: it is also how the app
       ANSWERS the shell, and how the shell learns this document's ground
       colour so the platform bar above the app takes the app's tone. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- The platform's light/dark choice, applied before first paint.
       usernode.theme is set synchronously when the bridge loads; the OS
       preference is the fallback when the app is opened standalone. -->
  <script>
  (function () {
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() {
      var theme = (window.usernode && window.usernode.theme)
        || (media.matches ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.style.colorScheme = theme;
    }
    applyTheme();
    window.addEventListener('usernode:theme-changed', applyTheme);
    if (media.addEventListener) media.addEventListener('change', applyTheme);
  })();
  </script>

  <script>
  (function () {
    'use strict';

    var params = new URLSearchParams(location.search);
    var TOKEN = params.get('token') || '';
    var DEMO = params.get('demo') === '1' ? '1' : '';
    // Staging-check fixture: ?allvoted=1 asks the demo inbox for a list where
    // every proposal is already voted on, so the "nothing left" state is
    // reachable by a check. Same idea for ?allmerged=1 and the Hide merged
    // toggle. Neither is ever sent without demo data.
    var ALL_VOTED = params.get('allvoted') === '1';
    // Staging-check fixture: ?openfilter=1 opens the app filter dropdown on
    // load, so a check can assert on the list without clicking. Never sent
    // without demo data.
    var OPEN_FILTER = params.get('openfilter') === '1';
    var ALL_MERGED = params.get('allmerged') === '1';
    // Staging-check fixture for the confirm-before-No flow: ?tap-no=1 asks
    // the demo inbox to click the demo-4 card's "No" button once loaded (the
    // real button, through the real delegated click handler), and
    // ?confirm-no=1 then presses "No, reject" in the dialog that opens.
    // Neither is ever sent without demo data.
    var TAP_NO = params.get('tap-no') === '1';
    var CONFIRM_NO = params.get('confirm-no') === '1';
    // ?failvote=1 (demo only) makes the NEXT vote cast on this load fail the
    // way an offline device does: the request never leaves the page, the
    // card keeps its vote mark and a Retry pill appears. Gives checks and
    // reviewers a deterministic URL for the offline-retry state; production
    // never honours it.
    var FAILVOTE = DEMO && params.get('failvote') === '1';
    // ?share=copy|sheet (demo only) forces which path the share button uses,
    // so the automated checks can pin either label without depending on
    // whether the headless browser exposes navigator.share.
    var SHARE_MODE = DEMO && (params.get('share') === 'copy' || params.get('share') === 'sheet')
      ? params.get('share') : '';
    // ?tap-share=<sessionId> (demo only) taps that card's share button once
    // the inbox has rendered, the way ?tap-no=1 taps a vote button.
    var TAP_SHARE = DEMO ? (params.get('tap-share') || '') : '';
    // ?compose=1 opens the New proposal screen on load. A real deep link,
    // not a demo fixture: the same screen the header + button opens, and it
    // works in every environment. The other compose fixture parameters
    // (template, switch-template, set-title, set-body, send) replay one
    // user path through the real controls, the way ?tap-no=1 does. Demo
    // gated like the other check fixtures.
    var COMPOSE = params.get('compose') === '1';
    var COMPOSE_TEMPLATE = DEMO ? (params.get('template') || '') : '';
    // ?switch-template=feature means: tap the Bugfix chip first (so there is
    // a prefill on screen), then switch to the named one — proving the
    // switch replaces the prefill rather than appending to it.
    var COMPOSE_SWITCH = DEMO ? (params.get('switch-template') || '') : '';
    var COMPOSE_TITLE = DEMO ? (params.get('set-title') || '') : '';
    var COMPOSE_BODY = DEMO ? (params.get('set-body') || '') : '';
    var COMPOSE_SEND = DEMO && params.get('send') === '1';
    // ?back=1 taps the compose screen's back chevron at the end of the
    // fixture chain, so a check can pin that leaving compose restores the
    // main list.
    var COMPOSE_BACK = DEMO && params.get('back') === '1';

    var state = {
      tab: params.get('tab') === 'votes' ? 'votes' : 'inbox',
      // Which top-level screen is showing: 'main' (the two tabs) or
      // 'compose' (the New proposal screen). Not persisted; the ?compose=
      // parameter opens compose for one load, the + button after that.
      screen: COMPOSE ? 'compose' : 'main',
      compose: {
        // Which template chip is selected: 'bugfix' | 'feature' | 'copy' |
        // 'blank' | null (nothing picked yet). null keeps both fields empty.
        template: null,
        title: '',
        body: '',
        sending: false,
        error: null,
        // Title of the last sent proposal, which switches the screen to the
        // confirmation block; null means the compose form is showing.
        sentTitle: null,
        sent: null,
        sentLoaded: false,
        sentError: false,
      },
      inbox: null,
      votes: null,
      inboxLoadedAt: null,
      filter: '',
      filterName: '',
      search: '',
      hideVoted: false,
      // "One vote away" chip: on when ?one-away=1 (a real deep link, also
      // how the staging checks activate it). Not persisted, unlike
      // hideVoted: it starts off on every fresh load.
      oneAway: params.get('one-away') === '1',
      hideMerged: false,
      sort: 'needed',
      // My Votes order: 'newest' | 'oldest'. Not persisted; the
      // ?votes-order= param is a one-load override, the same pattern as
      // ?sort= (the staging checks use it to reach the reversed order).
      votesOrder: params.get('votes-order') === 'oldest' ? 'oldest' : 'newest',
      loadingInbox: false,
      loadingVotes: false,
      errorInbox: null,
      errorVotes: null,
      pending: {},
      // In-memory retry queue for votes that failed offline: sessionId ->
      // { choice, payload, snapshot }. Never persisted; a page reload
      // clears it and the next inbox load shows the platform's truth.
      retryQueue: {},
      queuedInbox: false,
      queuedVotes: false,
      // Session ids whose card title the user expanded with More. A re-render
      // (a vote, a filter change) keeps those titles expanded; not persisted,
      // a reload starts collapsed again.
      expandedTitles: {},
    };

    // ------------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------------

    function headers(extra) {
      var h = { accept: 'application/json' };
      if (TOKEN) h['x-usernode-token'] = TOKEN;
      if (extra) for (var k in extra) h[k] = extra[k];
      return h;
    }

    function api(path, options) {
      options = options || {};
      options.headers = headers(options.headers);
      return fetch(path, options).then(function (res) {
        return res.json().catch(function () { return null; }).then(function (data) {
          if (!res.ok) {
            var err = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
            err.status = res.status;
            throw err;
          }
          return data;
        });
      });
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Relative age ("2h ago") for a proposal's proposed timestamp. Empty
    // string when the platform did not send one, so nothing renders.
    function relTime(iso) {
      if (!iso) return '';
      var t = new Date(iso).getTime();
      if (!isFinite(t)) return '';
      var mins = Math.floor((Date.now() - t) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      var hours = Math.floor(mins / 60);
      if (hours < 24) return hours + 'h ago';
      var days = Math.floor(hours / 24);
      if (days < 14) return days + 'd ago';
      return Math.floor(days / 7) + 'w ago';
    }

    function toast(message, opts) {
      try {
        if (window.unNative && unNative.toast) { return unNative.toast(message, opts); }
      } catch (e) { /* fall through */ }
      console.log(message);
      return null;
    }

    // ------------------------------------------------------------------
    // Hide-voted preference. Persists in localStorage so the choice
    // survives reloads; ?hide-voted=1|0 overrides it for one load (used by
    // the staging checks) without writing back. Storage can be refused in
    // an iframe — the toggle then just doesn't persist.
    // ------------------------------------------------------------------

    var HIDE_VOTED_KEY = 'vote-inbox:hide-voted';

    function loadHideVoted() {
      try { return localStorage.getItem(HIDE_VOTED_KEY) === '1'; } catch (e) { return false; }
    }

    function saveHideVoted(on) {
      try { localStorage.setItem(HIDE_VOTED_KEY, on ? '1' : '0'); } catch (e) { /* not persistable here */ }
    }

    var hideVotedParam = params.get('hide-voted');
    state.hideVoted = loadHideVoted();
    if (hideVotedParam === '1') state.hideVoted = true;
    else if (hideVotedParam === '0') state.hideVoted = false;

    // Title search, ?q= pre-fills it for one load so a deep link (and the
    // staging checks, which cannot type) land on the filtered list. The
    // same value the box would hold after typing it.
    state.search = params.get('q') || '';

    function setHideVoted(on) {
      state.hideVoted = on;
      saveHideVoted(on);
      var box = document.getElementById('hide-voted');
      if (box) box.checked = on;
      render();
    }

    function isVoted(p) {
      return p.myVote === 'yes' || p.myVote === 'no';
    }

    // ------------------------------------------------------------------
    // Hide-merged preference. Same shape as the hide-voted preference:
    // persists in localStorage, ?hide-merged=1|0 overrides it for one load
    // (used by the staging checks) without writing back. Default off.
    // ------------------------------------------------------------------

    var HIDE_MERGED_KEY = 'vote-inbox:hide-merged';

    function loadHideMerged() {
      try { return localStorage.getItem(HIDE_MERGED_KEY) === '1'; } catch (e) { return false; }
    }

    function saveHideMerged(on) {
      try { localStorage.setItem(HIDE_MERGED_KEY, on ? '1' : '0'); } catch (e) { /* not persistable here */ }
    }

    var hideMergedParam = params.get('hide-merged');
    state.hideMerged = loadHideMerged();
    if (hideMergedParam === '1') state.hideMerged = true;
    else if (hideMergedParam === '0') state.hideMerged = false;

    function setHideMerged(on) {
      state.hideMerged = on;
      saveHideMerged(on);
      var box = document.getElementById('hide-merged');
      if (box) box.checked = on;
      render();
    }

    // ------------------------------------------------------------------
    // Sort order preference. Same shape as the hide-voted preference:
    // persists in localStorage so the choice survives reloads, and
    // ?sort=needed|newest overrides it for one load (used by the staging
    // checks) without writing back. Storage can be refused in an iframe —
    // the choice then just doesn't persist.
    // ------------------------------------------------------------------

    var SORT_KEY = 'vote-inbox:sort';

    function loadSort() {
      try {
        var v = localStorage.getItem(SORT_KEY);
        return v === 'newest' || v === 'needed' ? v : 'needed';
      } catch (e) { return 'needed'; }
    }

    function saveSort(v) {
      try { localStorage.setItem(SORT_KEY, v); } catch (e) { /* not persistable here */ }
    }

    var sortParam = params.get('sort');
    state.sort = loadSort();
    if (sortParam === 'newest' || sortParam === 'needed') state.sort = sortParam;

    function setSort(v) {
      if (v !== 'needed' && v !== 'newest' || v === state.sort) return;
      state.sort = v;
      saveSort(v);
      render();
    }

    // My Votes order. Unlike the Inbox sort, this one is not persisted:
    // it resets to Newest first on reload. It only reorders the votes
    // already loaded; nothing new is fetched when it flips.
    function setVotesOrder(v) {
      if (v !== 'newest' && v !== 'oldest' || v === state.votesOrder) return;
      state.votesOrder = v;
      render();
    }

    // ------------------------------------------------------------------
    // App filter preference. Persists in localStorage so the chosen app
    // (and its display name, for the trigger label before the inbox loads)
    // is restored when the app is next opened. Storage can be refused in
    // an iframe — the filter then just doesn't persist. A saved slug the
    // inbox no longer lists is dropped by syncFilter once data arrives.
    // ------------------------------------------------------------------

    var FILTER_KEY = 'vote-inbox:filter';

    function loadFilter() {
      try {
        var v = JSON.parse(localStorage.getItem(FILTER_KEY) || 'null');
        if (v && typeof v.slug === 'string' && v.slug) return v;
      } catch (e) { /* fall through */ }
      return null;
    }

    function saveFilter(v) {
      try {
        if (v && v.slug) localStorage.setItem(FILTER_KEY, JSON.stringify(v));
        else localStorage.removeItem(FILTER_KEY);
      } catch (e) { /* not persistable here */ }
