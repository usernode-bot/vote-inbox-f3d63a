    // Density hooks (demo only), through the REAL controls:
    //   ?tap-menu=1           opens the header menu once after render, so a
    //                         check can assert the Density rows and their
    //                         previews while the menu is open
    //   ?tap-density=<value>  opens the menu and taps that option (the real
    //                         click path, so storage is written the way a
    //                         person's tap writes it), then reloads at a
    //                         ?density-set=<value> marker whose load renders
    //                         from the persisted preference — and whose
    //                         clear-set-density cleanup empties it again, so
    //                         check runs don't leak the choice into later
    //                         routes (the same pattern as set-tag)
    //   ?density-fit=1        stamps the fit markers on <body>: the first
    //                         card's height and padding measured at both
    //                         densities, and every card's fit inside a 390px
    //                         probe (phone width)
    // ?density=<value> and ?density-clear=1 are the one-load override and
    // forced-default described at the preference above.
    var TAP_MENU = DEMO && params.get('tap-menu') === '1';
    var TAP_DENSITY = DEMO ? (params.get('tap-density') || '') : '';
    var DENSITY_FIT = DEMO && params.get('density-fit') === '1';

    var state = {
      tab: params.get('tab') === 'votes' ? 'votes'
        : params.get('tab') === 'saved' ? 'saved'
        : params.get('tab') === 'watchlist' ? 'watchlist'
        : params.get('tab') === 'following' ? 'following'
        : params.get('tab') === 'leaderboard' ? 'leaderboard' : 'inbox',
      // Which top-level screen is showing: 'main' (the two tabs) or
      // 'compose' (the New proposal screen). Not persisted; the ?compose=
      // parameter opens compose for one load, the + button after that.
      screen: COMPOSE ? 'compose' : 'main',
      compose: {
        // Which template chip is selected: 'bugfix' | 'feature' | 'copy' |
        // 'blank' | null (nothing picked yet). null keeps both fields empty.
        template: null,
        title: '',
        body: '',
        sending: false,
        error: null,
        // Title of the last sent proposal, which switches the screen to the
        // confirmation block; null means the compose form is showing.
        sentTitle: null,
        sent: null,
        sentLoaded: false,
        sentError: false,
      },
      inbox: null,
      votes: null,
      watchlist: null,
      // Saved tab: the signed-in user's bookmarked proposals (one load,
      // same shape as watchlist.rows). savedPending mirrors starPending for
      // the bookmark buttons' in-flight state.
      saved: null,
      savedPending: {},
      // Pending merge celebrations, from the inbox payload (one row per
      // merged proposal the user voted on). Each card is rendered once and
      // then marked shown server-side, so the next load no longer returns
      // it; dismissing marks it dismissed. The two promises remember the
      // shown/dismiss POSTs in flight so the demo reload hooks can wait for
      // them to land before reloading their marker pages.
      celebrations: [],
      celebShownPending: false,
      celebShownPromise: null,
      celebDismissPromise: null,
      inboxLoadedAt: null,
      // Baseline time (ms) for the "New" badges on this load, set once per
      // successful fetch by applyNewSince (see NEWEST_SEEN_KEY). null =
      // no baseline (first visit, blocked storage): nothing shows as New.
      newSinceMs: null,
      filter: '',
      filterName: '',
      // Tag filter, one of the fixed list or '' for all. Persisted like the
      // app filter (see the TAG_FILTER_KEY block); the restored value is
      // validated there, so a stale storage entry falls back to ''.
      tagFilter: '',
      search: '',
      // Onboarding tour: the step being shown (0 to 2) and whether the
      // tour is open from the header menu's "Show the tour" item. Neither
      // is persisted; whether the tour was finished or skipped lives in
      // localStorage (see TOUR_KEY).
      tourStep: 0,
      tourOpen: false,
      tourClosed: false,
      hideVoted: false,
      // "One vote away" chip: on when ?one-away=1 (a real deep link, also
      // how the staging checks activate it). Not persisted, unlike
      // hideVoted: it starts off on every fresh load.
      oneAway: params.get('one-away') === '1',
      // Snoozed filter: on when ?snoozed=1 (a real deep link, also how the
      // staging checks open it). Not persisted, like oneAway: a fresh load
      // starts on the main inbox. The snoozed cards live in the same loaded
      // payload, so the header summary keeps counting them.
      snoozeView: SNOOZED_VIEW,
      // The card whose snooze menu is open (one at a time). Transient, like
      // the reply form: a re-render or a reload closes it.
      snoozeMenu: null,
      hideMerged: false,
      // Hide-read switch, loaded from localStorage right below (same shape
      // as hideVoted/hideMerged). Not part of saved views or saved searches.
      hideRead: false,
      // Inbox order: 'needed' | 'newest' | 'controversy'.
      sort: 'needed',
      // My Votes order: 'newest' | 'oldest'. Not persisted; the
      // ?votes-order= param is a one-load override, the same pattern as
      // ?sort= (the staging checks use it to reach the reversed order).
      votesOrder: params.get('votes-order') === 'oldest' ? 'oldest' : 'newest',
      // My Votes "merged this week" filter: on when ?votes-merged=1 (a real
      // deep link — the celebration card's See-what-merged link lands on
      // it), toggled by the chip on the tab. Not persisted, like the order:
      // a fresh load starts unfiltered.
      votesMergedWeek: params.get('votes-merged') === '1',
      loadingInbox: false,
      loadingVotes: false,
      loadingWatchlist: false,
      loadingSaved: false,
      errorInbox: null,
      errorVotes: null,
      // Share-as-image preview on My Votes: the drawn card record
      // { stats, dataUrl, blob, file, mode, error, status, width, height }.
      // Frontend memory only; Close or a reload clears it.
      shareImage: null,
      errorWatchlist: null,
      errorSaved: null,
      pending: {},
      // Star toggles in flight, per session and per watchlist row.
      starPending: {},
      // The watchlist tab's rows are marked seen once per load of its data,
      // right after they render, so the next visit only badges new changes.
      watchSeenMarked: false,
      // In-memory retry queue for votes that failed offline: sessionId ->
      // { choice, payload, snapshot }. Never persisted; a page reload
      // clears it and the next inbox load shows the platform's truth.
      retryQueue: {},
      queuedInbox: false,
      queuedVotes: false,
      queuedWatchlist: false,
      queuedSaved: false,
      // Session ids whose card title the user expanded with More. A re-render
      // (a vote, a filter change) keeps those titles expanded; not persisted,
      // a reload starts collapsed again.
      expandedTitles: {},
      // Cards whose change-summary line the user tapped open. Keyed by
      // session id and remembered the same way expandedTitles is: a
      // re-render keeps them open, a reload starts closed again. Not
      // persisted.
      expandedSummaries: {},
      // Proposal details whose impact panel the user expanded with the
      // Show details toggle (small screens only). Keyed by session id and
      // remembered like expandedSummaries: a re-render keeps them open, a
      // reload starts collapsed again. Not persisted.
      impactOpen: {},
      // Whether the My Votes weekly digest's chart is open. In-memory only:
      // a reload starts closed again.
      digestOpen: false,
      // Bulk triage: select mode (checkbox on each votable card) and the
      // selected session ids. Selection is in-memory only and keyed by
      // session id, so it survives filter, search and sort changes —
      // filtering only hides cards, it never clears what is ticked. A
      // reload starts with nothing selected and select mode off.
      selectMode: false,
      selected: {},
      bulkBusy: false,
      // Proposal detail (?proposal=<sessionId> deep link, or a card's
      // Discuss button): while open it replaces the inbox list. Comments
      // are fetched per proposal; commentsKey remembers which thread is
      // loaded so a re-render (a vote, a reply) never refetches it.
      detail: params.get('proposal') || '',
      // Read POSTs in flight, per session id, kept so the check hooks (and
      // nothing else) can wait for the server to have the row before they
      // reload. The promise always resolves (failures are swallowed in
      // markRead), so an await on it can never hang.
      readPosts: {},
      // Where the inbox was scrolled when the detail opened, so Back can
      // restore it instead of dropping the reader at the top. Not persisted:
      // a reload starts at the top like any fresh visit.
      detailScroll: 0,
      detailComments: [],
      commentsKey: '',
      commentsLoading: false,
      commentsError: null,
      // Stringified id of the comment whose reply form is open; null when
      // none is. One reply form at a time.
      replyForm: null,
      // Saved views, loaded from localStorage right after the state object
      // (see the saved-views section below).
      views: [],
      // Saved searches, the user's own rows from the server (staging:private
      // table, like the watchlist). loaded flips true once the GET settled
      // (successfully or not) so the check hooks know the list is current.
      savedSearches: [],
      savedSearchesLoaded: false,
      // Compare selection: up to two session ids picked from the inbox via
      // the cards' Compare buttons, plus whether the dedicated side-by-side
      // view is open. Transient, like oneAway: a reload starts empty unless
      // a ?compare= / ?pick= fixture re-seeds it.
      compare: [],
      compareView: false,
      // Members directory: open when ?members=1 (the header Members button
      // toggles it). The roster, its load state and the current handle
      // search live here; the search text is not persisted, a reload
      // starts empty unless a ?member-query= fixture presets it.
      membersView: params.get('members') === '1',
      members: null,
      loadingMembers: false,
      errorMembers: null,
      queuedMembers: false,
      memberQuery: MEMBER_QUERY,
      // Voters leaderboard tab: the ranked board (rows carry both ranges'
      // counts, so the range toggle re-ranks without a refetch), its load
      // state and the current range. The range is not persisted; a reload
      // starts on This week unless ?lb-range= presets it.
      leaderboard: null,
      loadingLeaderboard: false,
      errorLeaderboard: null,
      queuedLeaderboard: false,
      lbRange: LB_RANGE,
      // Inbox stat cards: the caller's vote history and the ranked board,
      // fetched beside the inbox through the same /api/my-votes and
      // /api/leaderboard routes the My Votes and Leaderboard tabs use, but
      // kept apart from state.votes / state.leaderboard so those tabs' own
      // load and hook flow is untouched. null until the first answer.
      inboxStats: null,
      loadingInboxStats: false,
    };

    // ------------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------------

    function headers(extra) {
      var h = { accept: 'application/json' };
      if (TOKEN) h['x-usernode-token'] = TOKEN;
      if (extra) for (var k in extra) h[k] = extra[k];
      return h;
    }

    function api(path, options) {
      options = options || {};
      options.headers = headers(options.headers);
      return fetch(path, options).then(function (res) {
        return res.json().catch(function () { return null; }).then(function (data) {
          if (!res.ok) {
            var err = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
            err.status = res.status;
            throw err;
          }
          return data;
        });
      });
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Relative age ("2h ago") for a proposal's proposed timestamp. Empty
    // string when the platform did not send one, so nothing renders.
    function relTime(iso) {
      if (!iso) return '';
      var t = new Date(iso).getTime();
      if (!isFinite(t)) return '';
      var mins = Math.floor((Date.now() - t) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      var hours = Math.floor(mins / 60);
      if (hours < 24) return hours + 'h ago';
      var days = Math.floor(hours / 24);
      if (days < 14) return days + 'd ago';
      return Math.floor(days / 7) + 'w ago';
    }

    // Ordinal for the merge-queue badge: 1st, 2nd, 3rd, then 4th… with the
    // 11th/12th/13th exception.
    function ordinal(n) {
      var rem10 = n % 10;
      var rem100 = n % 100;
      if (rem10 === 1 && rem100 !== 11) return n + 'st';
      if (rem10 === 2 && rem100 !== 12) return n + 'nd';
      if (rem10 === 3 && rem100 !== 13) return n + 'rd';
      return n + 'th';
    }

    function toast(message, opts) {
      try {
        if (window.unNative && unNative.toast) { return unNative.toast(message, opts); }
      } catch (e) { /* fall through */ }
      console.log(message);
      return null;
    }

    // ------------------------------------------------------------------
    // Hide-voted preference. Persists in localStorage so the choice
    // survives reloads; ?hide-voted=1|0 overrides it for one load (used by
    // the staging checks) without writing back. Storage can be refused in
    // an iframe — the toggle then just doesn't persist.
    // ------------------------------------------------------------------

    var HIDE_VOTED_KEY = 'vote-inbox:hide-voted';

    function loadHideVoted() {
      try { return localStorage.getItem(HIDE_VOTED_KEY) === '1'; } catch (e) { return false; }
    }

    function saveHideVoted(on) {
      try { localStorage.setItem(HIDE_VOTED_KEY, on ? '1' : '0'); } catch (e) { /* not persistable here */ }
    }

    var hideVotedParam = params.get('hide-voted');
    state.hideVoted = loadHideVoted();
    if (hideVotedParam === '1') state.hideVoted = true;
    else if (hideVotedParam === '0') state.hideVoted = false;

    // Title search, ?q= pre-fills it for one load so a deep link (and the
    // staging checks, which cannot type) land on the filtered list. The
    // same value the box would hold after typing it.
    state.search = params.get('q') || '';

    function setHideVoted(on) {
      state.hideVoted = on;
      saveHideVoted(on);
      var box = document.getElementById('hide-voted');
      if (box) box.checked = on;
      render();
    }

    function isVoted(p) {
      return p.myVote === 'yes' || p.myVote === 'no';
    }

    // ------------------------------------------------------------------
    // New-since-last-visit badges. localStorage remembers the newest
    // proposal seen on this device ({ id, at }) and applyNewSince turns it
    // into a baseline time once per successful inbox load: cards proposed
    // after that baseline show a small "New" badge beside the title until
    // the next fetch. Per device and browser, like the hide-voted switch.
    // Storage can be refused in an iframe — then nothing shows as New.
    // ------------------------------------------------------------------

    var NEWEST_SEEN_KEY = 'vote-inbox:newest-seen';

    function loadNewestSeen() {
      try {
        var raw = localStorage.getItem(NEWEST_SEEN_KEY);
        if (!raw) return null;
        var rec = JSON.parse(raw);
        return rec && rec.id ? rec : null;
      } catch (e) { return null; }
    }

    function saveNewestSeen(rec) {
      try { localStorage.setItem(NEWEST_SEEN_KEY, JSON.stringify(rec)); } catch (e) { /* not persistable here */ }
    }

    // Called once per successful load, right after reanchorDemo. Re-renders
    // (votes, filters, tab switches) never call this, so badges persist
    // until the next fetch; a failed fetch leaves the baseline and the key
    // alone.
    function applyNewSince(data) {
      // ?newbadge=1 (demo only) swaps the remembered record for an older
      // fixture so the badge is check-reachable; the rest runs the real code.
      var baseline = NEWBADGE ? { id: 'demo-6' } : loadNewestSeen();
      var list = Array.isArray(data && data.proposals) ? data.proposals : [];
      // Newest proposal on this load, from everything loaded (unfiltered),
      // so filters or hide toggles can never make something look new later.
      var newest = null;
      for (var i = 0; i < list.length; i++) {
        var t = list[i].proposedAt ? Date.parse(list[i].proposedAt) : NaN;
        if (!isNaN(t) && (!newest || t > newest.t)) newest = { id: list[i].sessionId, at: list[i].proposedAt, t: t };
      }
      // Baseline time: the remembered proposal's own time when it is still
      // loaded (keeps plain ?demo=1 loads deterministic even though
      // reanchorDemo moves fixture times forward), else the stored at stamp
      // (the proposal has left the inbox). No record or an unparseable time
      // means no badges — a first visit marks nothing New.
      state.newSinceMs = null;
      if (baseline) {
        var bt = NaN;
        for (var j = 0; j < list.length; j++) {
          if (list[j].sessionId === baseline.id) {
            bt = list[j].proposedAt ? Date.parse(list[j].proposedAt) : NaN;
            break;
          }
        }
        if (isNaN(bt)) bt = baseline.at ? Date.parse(baseline.at) : NaN;
        if (!isNaN(bt)) state.newSinceMs = bt;
      }
      // Overwritten after every successful load; an empty inbox writes
      // nothing, so the previous baseline is kept.
      if (newest) saveNewestSeen({ id: newest.id, at: newest.at });
    }

    function isNewSince(p) {
      if (state.newSinceMs == null) return false;
      var t = p.proposedAt ? Date.parse(p.proposedAt) : NaN;
      return !isNaN(t) && t > state.newSinceMs;
    }

    // ------------------------------------------------------------------
    // Hide-merged preference. Same shape as the hide-voted preference:
    // persists in localStorage, ?hide-merged=1|0 overrides it for one load
    // (used by the staging checks) without writing back. Default off.
    // ------------------------------------------------------------------

    var HIDE_MERGED_KEY = 'vote-inbox:hide-merged';

    function loadHideMerged() {
      try { return localStorage.getItem(HIDE_MERGED_KEY) === '1'; } catch (e) { return false; }
    }

    function saveHideMerged(on) {
      try { localStorage.setItem(HIDE_MERGED_KEY, on ? '1' : '0'); } catch (e) { /* not persistable here */ }
    }

    var hideMergedParam = params.get('hide-merged');
    state.hideMerged = loadHideMerged();
    if (hideMergedParam === '1') state.hideMerged = true;
    else if (hideMergedParam === '0') state.hideMerged = false;

    function setHideMerged(on) {
      state.hideMerged = on;
      saveHideMerged(on);
      var box = document.getElementById('hide-merged');
      if (box) box.checked = on;
      render();
    }

    // ------------------------------------------------------------------
    // Hide-read preference. Same shape as the hide-voted and hide-merged
    // preferences: persists in localStorage, ?hide-read=1|0 overrides it
    // for one load (used by the staging checks) without writing back.
    // Default off. Saved views and saved searches neither capture nor
    // clear it.
    // ------------------------------------------------------------------

    var HIDE_READ_KEY = 'vote-inbox:hide-read';

    function loadHideRead() {
      try { return localStorage.getItem(HIDE_READ_KEY) === '1'; } catch (e) { return false; }
    }

    function saveHideRead(on) {
      try { localStorage.setItem(HIDE_READ_KEY, on ? '1' : '0'); } catch (e) { /* not persistable here */ }
    }

    var hideReadParam = params.get('hide-read');
    state.hideRead = loadHideRead();
    if (hideReadParam === '1') state.hideRead = true;
    else if (hideReadParam === '0') state.hideRead = false;

    function setHideRead(on) {
      state.hideRead = on;
      saveHideRead(on);
      var box = document.getElementById('hide-read');
      if (box) box.checked = on;
      render();
    }

    // True when the caller has opened this proposal (the server stamps the
    // caller's persisted read set onto every inbox payload).
    function isRead(p) {
      return p.read === true;
    }

    // ------------------------------------------------------------------
    // Density preference: how tall the Inbox and My Votes cards are.
    // Comfortable (the default) keeps today's padding and shows the
    // change-summary row; Compact tightens card padding and hides that
    // description preview, so more proposals fit per screen. Persists in
    // localStorage so the choice survives reloads, and ?density=comfortable|
    // compact overrides it for one load (used by the staging checks)
    // without writing back — the same shape as the hide-voted preference.
    // ------------------------------------------------------------------

    var DENSITY_KEY = 'vote-inbox:density';
    var DENSITY_VALUES = ['comfortable', 'compact'];

    function loadDensity() {
      try {
        var v = localStorage.getItem(DENSITY_KEY);
        return DENSITY_VALUES.indexOf(v) !== -1 ? v : 'comfortable';
      } catch (e) { return 'comfortable'; }
    }

    function saveDensity(v) {
      try {
        if (DENSITY_VALUES.indexOf(v) !== -1) localStorage.setItem(DENSITY_KEY, v);
        else localStorage.removeItem(DENSITY_KEY);
      } catch (e) { /* not persistable here */ }
    }

    state.density = loadDensity();

    // One-load cleanup for the set-density hook below: the reloaded page
    // has restored the preference into state, then empties it again, so
    // the hook leaves storage the way it found it (the same reasoning as
    // clear-set-filter above).
    if (params.get('clear-set-density') === '1') saveDensity(null);

    // Staging-check fixture: ?density-clear=1 empties the stored density
    // and loads with the default, so a check can assert Comfortable with
    // no stored value (a check run shares one browser profile across
    // routes; earlier routes must not decide what the default looks like).
    if (DEMO && params.get('density-clear') === '1') {
      saveDensity(null);
      state.density = 'comfortable';
    }

    // ?density=<value> overrides for one load without writing back.
    var densityParam = DEMO ? params.get('density') : '';
    if (DENSITY_VALUES.indexOf(densityParam) !== -1) state.density = densityParam;

    function setDensity(v) {
      state.density = v;
      saveDensity(v);
      render();
    }

    // ------------------------------------------------------------------

    // ------------------------------------------------------------------
    // Sort order preference. Same shape as the hide-voted preference:
    // persists in localStorage so the choice survives reloads, and
    // ?sort=needed|newest|controversy overrides it for one load (used by
    // the staging checks) without writing back. Storage can be refused in
    // an iframe — the choice then just doesn't persist.
    // ------------------------------------------------------------------

    var SORT_KEY = 'vote-inbox:sort';
    var SORT_VALUES = ['needed', 'newest', 'controversy'];

    function loadSort() {
      try {
        var v = localStorage.getItem(SORT_KEY);
        return SORT_VALUES.indexOf(v) !== -1 ? v : 'needed';
      } catch (e) { return 'needed'; }
    }

    function saveSort(v) {
      try { localStorage.setItem(SORT_KEY, v); } catch (e) { /* not persistable here */ }
    }

    var sortParam = params.get('sort');
    state.sort = loadSort();
    if (SORT_VALUES.indexOf(sortParam) !== -1) state.sort = sortParam;

    function setSort(v) {
      if (SORT_VALUES.indexOf(v) === -1 || v === state.sort) return;
      state.sort = v;
      saveSort(v);
      render();
    }

    // My Votes order. Unlike the Inbox sort, this one is not persisted:
    // it resets to Newest first on reload. It only reorders the votes
    // already loaded; nothing new is fetched when it flips.
    function setVotesOrder(v) {
      if (v !== 'newest' && v !== 'oldest' || v === state.votesOrder) return;
      state.votesOrder = v;
      render();
    }

    // ------------------------------------------------------------------
    // App filter preference. Persists in localStorage so the chosen app
    // (and its display name, for the trigger label before the inbox loads)
    // is restored when the app is next opened. Storage can be refused in
    // an iframe — the filter then just doesn't persist. A saved slug the
    // inbox no longer lists is dropped by syncFilter once data arrives.
    // ------------------------------------------------------------------

    var FILTER_KEY = 'vote-inbox:filter';

    function loadFilter() {
      try {
        var v = JSON.parse(localStorage.getItem(FILTER_KEY) || 'null');
        if (v && typeof v.slug === 'string' && v.slug) return v;
      } catch (e) { /* fall through */ }
      return null;
    }

    function saveFilter(v) {
      try {
        if (v && v.slug) localStorage.setItem(FILTER_KEY, JSON.stringify(v));
        else localStorage.removeItem(FILTER_KEY);
      } catch (e) { /* not persistable here */ }
    }

    var savedFilter = loadFilter();
    if (savedFilter) {
      state.filter = savedFilter.slug;
      state.filterName = savedFilter.name || '';
    }

    // One-load cleanup for the set-filter hook below: the reloaded page has
    // restored the preference into state, then empties it again, so the
    // hook leaves storage the way it found it (a check run shares one
    // browser profile across routes; later routes must not inherit it).
    if (params.get('clear-set-filter') === '1') saveFilter(null);

    // Staging-check hook: ?set-filter=<slug> writes the filter preference
    // the way a pick in the dropdown would, then reloads without the
    // parameter, so one check URL observes set → reload → restore.
    // ?set-filter-name= optionally supplies the display name to save (a
    // real pick knows it from the app list; a check URL passes it along so
    // the restored trigger label reads the same with and without data).
    // The plain routes never touch the preference from a parameter.
    var setFilterParam = params.get('set-filter');
    if (setFilterParam) {
      saveFilter({ slug: setFilterParam, name: params.get('set-filter-name') || '' });
      var remainingParams = new URLSearchParams(params);
      remainingParams.delete('set-filter');
      remainingParams.delete('set-filter-name');
      remainingParams.set('clear-set-filter', '1');
      var remainingQ = remainingParams.toString();
      location.replace(location.pathname + (remainingQ ? '?' + remainingQ : '') + location.hash);
      return;
    }

    // ------------------------------------------------------------------
    // Followed apps. A set of slugs persisted in localStorage; the app
    // filter rows carry a follow star for each and the Following tab lists
    // the followed apps' open proposals. The Inbox never changes shape
    // because of a follow — the set only adds a tab. Storage can be
    // refused in an iframe — follows then just don't persist.
    // ------------------------------------------------------------------

    var FOLLOW_KEY = 'vote-inbox:follows';

    function loadFollows() {
      try {
        var v = JSON.parse(localStorage.getItem(FOLLOW_KEY) || '[]');
        if (!Array.isArray(v)) return [];
        var out = [];
        for (var i = 0; i < v.length; i++) {
          if (typeof v[i] === 'string' && v[i] && out.indexOf(v[i]) === -1) out.push(v[i]);
        }
        return out;
      } catch (e) { return []; }
    }

    function saveFollows(list) {
      try { localStorage.setItem(FOLLOW_KEY, JSON.stringify(list)); } catch (e) { /* not persistable here */ }
    }

    state.follows = loadFollows();

    // One-load cleanup for the set-follow hook below: the reloaded page has
    // restored the follows into state, then empties them again, so the hook
    // leaves storage the way it found it (a check run shares one browser
    // profile across routes; later routes must not inherit the set).
    if (params.get('clear-set-follow') === '1') saveFollows([]);

    // Staging-check hook: ?set-follow=<slug,slug> writes the follow set the
    // way taps on the rows' stars would, then reloads without the
    // parameter, so one check URL observes follow → reload → still followed
    // (behavior 7). The plain routes never touch the set from a parameter.
    var setFollowParam = params.get('set-follow');
    if (setFollowParam && DEMO) {
      var seededFollows = state.follows.slice();
      setFollowParam.split(',').forEach(function (slug) {
        var s = slug.trim();
        if (s && seededFollows.indexOf(s) === -1) seededFollows.push(s);
      });
      saveFollows(seededFollows);
      var remainingFollowParams = new URLSearchParams(params);
      remainingFollowParams.delete('set-follow');
      remainingFollowParams.set('clear-set-follow', '1');
      var remainingFollowQ = remainingFollowParams.toString();
      location.replace(location.pathname + (remainingFollowQ ? '?' + remainingFollowQ : '') + location.hash);
      return;
    }

    // Staging-check hook: ?clear-follows=1 empties the follow set for one
    // load (no reload), so the Following tab's no-follows empty state is
    // reachable by checks regardless of what earlier routes stored. Demo only.
    if (params.get('clear-follows') === '1' && DEMO) {
      state.follows = [];
      saveFollows([]);
    }

    // Staging-check hooks: ?tap-follow=<slug> and ?tap-unfollow=<slug> tap
    // that app row's follow star through the real delegated click handler
    // once the filter has rendered (pair with ?openfilter=1). localStorage
    // is synchronous, so the stored set is adjusted right here before any
    // render: a tap-follow URL always acts from an unfollowed row and a
    // tap-unfollow URL from a followed one, whatever earlier checks left
    // behind. Demo only.
    var tapFollowParam = params.get('tap-follow');
    var tapUnfollowParam = params.get('tap-unfollow');
    if (tapFollowParam && DEMO) {
      var unfollowed = state.follows.slice();
      var at = unfollowed.indexOf(tapFollowParam);
      if (at !== -1) { unfollowed.splice(at, 1); saveFollows(unfollowed); state.follows = unfollowed; }
    }
    if (tapUnfollowParam && DEMO) {
      var refollowed = state.follows.slice();
      if (refollowed.indexOf(tapUnfollowParam) === -1) {
        refollowed.push(tapUnfollowParam);
        saveFollows(refollowed);
        state.follows = refollowed;
      }
    }

    // ------------------------------------------------------------------
    // Tag filter: fixed-list tags (bug, feature, copy, ux) served as the
    // proposal's normalized `tags`. The chosen tag persists like the app
    // filter, in its own key; the saved value is validated against the
    // fixed list, so a stale entry falls back to "all tags" rather than
    // filtering everything out.
    // ------------------------------------------------------------------

    var TAG_FILTER_KEY = 'vote-inbox:tag-filter';
    var TAG_VALUES = ['bug', 'feature', 'copy', 'ux'];

    function loadTagFilter() {
      try {
        var v = localStorage.getItem(TAG_FILTER_KEY);
        return TAG_VALUES.indexOf(v) !== -1 ? v : '';
      } catch (e) { return ''; }
    }

    function saveTagFilter(v) {
      try {
        if (v && TAG_VALUES.indexOf(v) !== -1) localStorage.setItem(TAG_FILTER_KEY, v);
        else localStorage.removeItem(TAG_FILTER_KEY);
      } catch (e) { /* not persistable here */ }
    }

    state.tagFilter = loadTagFilter();

    // One-load cleanup for the set-tag hook below: the reloaded page has
    // restored the preference into state, then empties it again, so the
    // hook leaves storage the way it found it (the same reasoning as
    // clear-set-filter above).
    if (params.get('clear-set-tag') === '1') saveTagFilter(null);

    // Staging-check hook: ?set-tag=<tag> writes the tag preference the way a
    // pick in the dropdown would, then reloads without the parameter, so one
    // check URL observes set → reload → restore. The plain routes never
    // touch the preference from a parameter.
    var setTagParam = params.get('set-tag');
    if (setTagParam && TAG_VALUES.indexOf(setTagParam) !== -1) {
      saveTagFilter(setTagParam);
      var remainingTagParams = new URLSearchParams(params);
      remainingTagParams.delete('set-tag');
      remainingTagParams.set('clear-set-tag', '1');
      var remainingTagQ = remainingTagParams.toString();
      location.replace(location.pathname + (remainingTagQ ? '?' + remainingTagQ : '') + location.hash);
      return;
    }

    // Staging-check hook: ?tap-star=<sessionId> taps that card's star button
    // through the real delegated click handler after the list has rendered.
    // Because checks share one database and one account, ?tap-star= first
    // clears any stored star for that proposal (one unstar POST, then a
    // reload with ?tap-ensured=1) so the tap always acts from an unstarred
    // card and the outcome never depends on earlier checks. Demo only.
    // Pair ?tap-star= with ?preset-star=<same id> (display-only) to reach
    // the unstar direction instead: the card renders starred, the tap
    // unstars, and no stored row is needed either way.
    if (TAP_STAR && DEMO && !params.has('tap-ensured')) {
      api('/api/watchlist/unstar', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ demo: true, sessionId: TAP_STAR }),
      }).catch(function () {}).then(function () {
        var remainingTapParams = new URLSearchParams(params);
        remainingTapParams.set('tap-ensured', '1');
        var remainingTapQ = remainingTapParams.toString();
        location.replace(location.pathname + (remainingTapQ ? '?' + remainingTapQ : '') + location.hash);
      });
      return;
    }

    // Staging-check hook: ?set-star=<sessionId> stars that demo proposal for
    // real (a demo star records the row for the signed-in account, the same
    // way a demo vote is recorded), then reloads without the parameter, so
    // one check URL observes star → reload → still starred from the server.
    // Opening it on the Watchlist tab also turns on ?watch-mine= for the
    // reloaded page, so the persisted row is listed there. Demo only.
    var setStarParam = params.get('set-star');
    if (setStarParam && DEMO) {
      api('/api/watchlist/star', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ demo: true, sessionId: setStarParam }),
      }).catch(function () {}).then(function () {
        var remainingStarParams = new URLSearchParams(params);
        remainingStarParams.delete('set-star');
        if (remainingStarParams.get('tab') === 'watchlist') {
          remainingStarParams.set('watch-mine', '1');
        }
        var remainingStarQ = remainingStarParams.toString();
        location.replace(location.pathname + (remainingStarQ ? '?' + remainingStarQ : '') + location.hash);
      });
      return;
    }

    // Staging-check hook: ?tap-bookmark=<sessionId> taps that card's bookmark
    // button through the real delegated click handler after the list has
    // rendered. Because checks share one database and one account, it first
    // clears any stored bookmark for that proposal (one unsave POST, then a
    // reload with ?bookmark-ensured=1) so the tap always acts from an
    // unsaved card. Demo only. Pair ?tap-unbookmark=<same id> with
    // ?preset-bookmark=<same id> (display-only) to reach the unsave
    // direction instead: the card renders bookmarked, the tap unsaves, and
    // no stored row is needed either way.
    if (TAP_BOOKMARK && DEMO && !params.has('bookmark-ensured')) {
      api('/api/bookmarks/unsave', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ demo: true, sessionId: TAP_BOOKMARK }),
      }).catch(function () {}).then(function () {
        var remainingTapParams = new URLSearchParams(params);
        remainingTapParams.set('bookmark-ensured', '1');
        var remainingTapQ = remainingTapParams.toString();
        location.replace(location.pathname + (remainingTapQ ? '?' + remainingTapQ : '') + location.hash);
      });
      return;
    }

    // Staging-check hook: ?set-bookmark=<sessionId> bookmarks that demo
    // proposal for real (a demo save records the row for the signed-in
    // account, the same way a demo star or vote is recorded), then reloads
    // without the parameter, so one check URL observes bookmark → reload →
    // still bookmarked from the server. Opening it on the Saved tab also
    // turns on ?saved-mine= for the reloaded page, so the persisted row is
    // listed there. Demo only.
    var setBookmarkParam = params.get('set-bookmark');
    if (setBookmarkParam && DEMO) {
      api('/api/bookmarks/save', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ demo: true, sessionId: setBookmarkParam }),
      }).catch(function () {}).then(function () {
        var remainingBmParams = new URLSearchParams(params);
        remainingBmParams.delete('set-bookmark');
        if (remainingBmParams.get('tab') === 'saved') {
          remainingBmParams.set('saved-mine', setBookmarkParam);
        }
        var remainingBmQ = remainingBmParams.toString();
        location.replace(location.pathname + (remainingBmQ ? '?' + remainingBmQ : '') + location.hash);
      });
      return;
    }

    // ------------------------------------------------------------------
    // Saved views. A view is a named snapshot of the current filter + sort
    // (plus the one-away chip and the hide toggles), shown as a switcher
    // row of chips under the tabs. Views live in localStorage so they
    // survive reloads; the proposals themselves stay on the platform.
    // Each chip's count answers "how many loaded proposals would this
    // view match", from the inbox already in memory, no extra request.
    // ------------------------------------------------------------------

    var VIEWS_KEY = 'vote-inbox:views';

    function loadViews() {
      try {
        var v = JSON.parse(localStorage.getItem(VIEWS_KEY) || '[]');
        if (!Array.isArray(v)) return [];
        return v.filter(function (x) {
          return x && typeof x.name === 'string' && x.name.trim();
        }).map(function (x) {
          var view = normalizeViewConfig(x);
          view.name = x.name.trim();
          return view;
        });
      } catch (e) { return []; }
    }

    function saveViews() {
      try { localStorage.setItem(VIEWS_KEY, JSON.stringify(state.views)); }
      catch (e) { /* not persistable here */ }
    }
    state.views = loadViews();

    // A view's configuration with every field normalised, so a stored view
    // and the live state compare cleanly (the storage may hold an older
    // shape from a previous version of the app).
    function normalizeViewConfig(v) {
      return {
        filter: v && typeof v.filter === 'string' ? v.filter : '',
        filterName: v && typeof v.filterName === 'string' ? v.filterName : '',
        sort: v && v.sort === 'newest' ? 'newest' : 'needed',
        oneAway: !!(v && v.oneAway),
        hideVoted: !!(v && v.hideVoted),
        hideMerged: !!(v && v.hideMerged),
        search: v && typeof v.search === 'string' ? v.search.trim() : '',
      };
    }

    // What the screen shows right now, in the same shape as a view.
    function currentViewConfig() {
      return {
        filter: state.filter, filterName: state.filterName, sort: state.sort,
        oneAway: state.oneAway, hideVoted: state.hideVoted,
        hideMerged: state.hideMerged, search: state.search.trim(),
      };
    }

    function sameViewConfig(a, b) {
      return a.filter === b.filter && a.sort === b.sort
        && a.oneAway === b.oneAway && a.hideVoted === b.hideVoted
        && a.hideMerged === b.hideMerged && a.search === b.search;
    }

    function findView(name) {
      for (var i = 0; i < state.views.length; i++) {
        if (state.views[i].name === name) return state.views[i];
      }
      return null;
    }

    // The saved view whose configuration the screen currently shows, or
    // '' when nothing matches (a manual change deactivates the chip on
    // its own, no bookkeeping needed).
    function activeViewName() {
      var cfg = currentViewConfig();
      for (var i = 0; i < state.views.length; i++) {
        if (state.views[i].name && sameViewConfig(normalizeViewConfig(state.views[i]), cfg)) {
          return state.views[i].name;
        }
      }
      return '';
    }

    // Whether one loaded proposal matches a view's configuration: the
    // same rules renderInbox applies, in the same order.
    function matchesViewConfig(p, cfg) {
      if (cfg.filter && p.appSlug !== cfg.filter) return false;
      if (cfg.hideVoted && isVoted(p)) return false;
      if (cfg.hideMerged && p.status === 'merged') return false;
      if (cfg.search) {
        var q = cfg.search.toLowerCase();
        if (String(p.title || '').toLowerCase().indexOf(q) === -1) return false;
      }
      if (cfg.oneAway && p.needed !== 1) return false;
      return true;
    }

    function viewCount(view) {
      var proposals = state.inbox && state.inbox.proposals;
      if (!proposals) return null;
      var cfg = normalizeViewConfig(view);
      var n = 0;
      for (var i = 0; i < proposals.length; i++) {
        if (matchesViewConfig(proposals[i], cfg)) n++;
      }
      return n;
    }

    // Save the current configuration under a name. Saving over an
    // existing name updates that view in place (no duplicate chips).
    function saveView(name) {
      name = String(name == null ? '' : name).trim();
      if (!name) return false;
      var view = Object.assign({ name: name }, currentViewConfig());
      var replaced = false;
      for (var i = 0; i < state.views.length; i++) {
        if (state.views[i].name === name) { state.views[i] = view; replaced = true; break; }
      }
      if (!replaced) state.views.push(view);
      saveViews();
      render();
      toast(replaced ? 'View updated' : 'View saved');
      return true;
    }

    // Apply a saved view: the screen takes on its filter, sort and
    // toggles, persisted exactly as if they had been set by hand.
    // ephemeral skips that persistence (used by the staging check hooks,
    // so a check URL leaves the browser's preferences the way it found
    // them); a real tap always persists.
    function applyView(view, ephemeral) {
      var cfg = normalizeViewConfig(view);
      state.filter = cfg.filter;
      state.filterName = cfg.filterName;
      state.sort = cfg.sort;
      state.oneAway = cfg.oneAway;
      state.hideVoted = cfg.hideVoted;
      state.hideMerged = cfg.hideMerged;
      state.search = cfg.search;
      if (!ephemeral) {
        saveSort(cfg.sort);
        saveHideVoted(cfg.hideVoted);
        saveHideMerged(cfg.hideMerged);
        saveFilter(cfg.filter ? { slug: cfg.filter, name: cfg.filterName } : null);
      }
      render();
    }

    function renameView(oldName, newName) {
      newName = String(newName == null ? '' : newName).trim();
      var view = findView(oldName);
      if (!view || !newName || newName === oldName) return false;
      if (findView(newName)) { toast('That name is already in use'); return false; }
      view.name = newName;
      saveViews();
      render();
      toast('View renamed');
      return true;
    }

    function deleteView(name) {
      var kept = state.views.filter(function (v) { return v.name !== name; });
      if (kept.length === state.views.length) return false;
      state.views = kept;
      saveViews();
      render();
      toast('View deleted');
      return true;
    }

    // ------------------------------------------------------------------
    // Saved views: rendering and dialogs.
    // ------------------------------------------------------------------

    var VIEW_CHIP_IDLE = 'flex min-w-0 max-w-full items-center gap-1 whitespace-nowrap rounded-full border border-zinc-300 bg-white px-3 py-1.5 text-xs font-semibold text-zinc-700 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200';
    var VIEW_CHIP_ACTIVE = 'flex min-w-0 max-w-full items-center gap-1 whitespace-nowrap rounded-full border border-violet-500/60 bg-white px-3 py-1.5 text-xs font-semibold text-violet-700 dark:text-violet-300';
    var VIEW_COUNT_CLASS = 'shrink-0 text-[10px] font-normal tabular-nums text-zinc-500 dark:text-zinc-400';
    var VIEW_MENU_CLASS = 'flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-zinc-400 hover:text-zinc-600 dark:text-zinc-500 dark:hover:text-zinc-300';
    var VIEW_MENU_ICON = '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';
    var VIEWS_EMPTY_CLASS = 'shrink-0 whitespace-nowrap text-xs text-zinc-400 dark:text-zinc-500';

    // Plain-words description for a chip's tooltip: which app and sort the
    // view holds, and which of the toggles it turns on.
    function viewDescription(view) {
      var cfg = normalizeViewConfig(view);
      var bits = [];
      bits.push((cfg.filterName || cfg.filter) ? 'App: ' + (cfg.filterName || cfg.filter) : 'All apps');
      bits.push(cfg.sort === 'newest' ? 'Sort: newest' : 'Sort: votes needed');
      if (cfg.oneAway) bits.push('One vote away');
      if (cfg.hideVoted) bits.push('Hides voted');
      if (cfg.hideMerged) bits.push('Hides merged');
      if (cfg.search) bits.push('Search: "' + cfg.search + '"');
      return bits.join(' · ');
    }

    function renderViews() {
      var chips = document.getElementById('views-chips');
      if (!chips) return;
      if (!state.views.length) {
        chips.innerHTML = '<span data-views-empty class="' + VIEWS_EMPTY_CLASS + '">No saved views yet</span>';
        return;
      }
      var active = activeViewName();
      var html = '';
      for (var i = 0; i < state.views.length; i++) {
        var view = state.views[i];
        var on = view.name === active;
        var count = viewCount(view);
        html += '<span class="flex shrink-0 items-center gap-0.5">'
          + '<button type="button" data-view-chip data-view-name="' + esc(view.name) + '"'
          + ' data-view-index="' + i + '" aria-pressed="' + (on ? 'true' : 'false') + '"'
          + ' title="' + esc(viewDescription(view)) + '"'
          + ' class="' + (on ? VIEW_CHIP_ACTIVE : VIEW_CHIP_IDLE) + '">'
          + '<span class="truncate">' + esc(view.name) + '</span>'
          + (count != null ? '<span data-view-count class="' + VIEW_COUNT_CLASS + '">(' + count + ')</span>' : '')
          + '</button>'
          + '<button type="button" data-view-menu data-view-name="' + esc(view.name) + '"'
          + ' aria-label="Options for view ' + esc(view.name) + '" class="' + VIEW_MENU_CLASS + '">'
          + VIEW_MENU_ICON + '</button>'
          + '</span>';
      }
      chips.innerHTML = html;
    }

    // Name prompt for Save view / Rename. The native kit's alert carries
    // the text field where it is available; loads without the kit get a
    // plain in-app dialog with the same field and answers. The kit both
    // invokes the button's handler and resolves its promise, so submit is
    // guarded against firing twice.
    function promptViewName(title, message, initial, onOk, opts) {
      opts = opts || {};
      var done = false;
      var submit = function (value) {
        if (done) return;
        done = true;
        var v = String(value == null ? '' : value).trim();
        // Saved views ignore an empty answer; a saved search allows one (it
        // then falls back to the search text as the name).
        if (v || opts.allowEmpty) onOk(v);
      };
      if (window.unNative && unNative.alert) {
        try {
          var answered = unNative.alert({
            title: title,
            message: message,
            field: { placeholder: opts.placeholder || 'View name', value: initial || '', submitOnEnter: true },
            buttons: [
              // The kit passes the field's value as the handler's argument.
              { label: 'Save', style: 'default', handler: function (value) { submit(typeof value === 'string' ? value : undefined); } },
              { label: 'Cancel', style: 'cancel' },
            ],
          });
          if (answered && typeof answered.then === 'function') {
            answered.then(function (res) {
              var label = res && res.button;
              if (label && typeof label === 'object') label = label.label;
              if (label === 'Save') submit(res && res.value);
            }).catch(function () { /* dismissed; nothing to save */ });
          }
          return;
        } catch (e) { /* fall through to the plain dialog */ }
      }
      fallbackPromptDialog(title, message, initial, submit, opts);
    }

    function fallbackPromptDialog(title, message, initial, submit, opts) {
      var overlay = document.createElement('div');
      overlay.setAttribute('data-view-prompt', '');
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', title);
      overlay.className = 'fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-6';
      overlay.innerHTML = '<div class="w-72 rounded-2xl bg-white p-4 shadow-xl dark:bg-zinc-900">'
        + '<p class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + esc(title) + '</p>'
        + (message ? '<p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">' + esc(message) + '</p>' : '')
        + '<input data-view-name-input type="text" autocomplete="off" placeholder="' + esc((opts && opts.placeholder) || 'View name') + '" aria-label="' + esc((opts && opts.placeholder) || 'View name') + '"'
        + ' class="mt-3 w-full rounded-xl border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-800 placeholder:text-zinc-400 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 dark:placeholder:text-zinc-500">'
        + '<div class="mt-3 flex flex-col gap-2">'
        + '<button data-view-prompt-save class="min-h-9 rounded-xl bg-violet-600 py-2 text-sm font-semibold text-white active:scale-95">Save</button>'
        + '<button data-view-prompt-cancel class="min-h-9 rounded-xl bg-zinc-100 py-2 text-sm font-semibold text-zinc-700 active:scale-95 dark:bg-zinc-800 dark:text-zinc-200">Cancel</button>'
        + '</div></div>';
      var input = overlay.querySelector('[data-view-name-input]');
      input.value = initial || '';
      var close = function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); };
      overlay.addEventListener('click', function (event) {
        if (event.target.closest('[data-view-prompt-save]')) { var v = input.value; close(); submit(v); }
        else if (event.target.closest('[data-view-prompt-cancel]') || event.target === overlay) close();
      });
      overlay.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') close();
        else if (event.key === 'Enter' && (input.value.trim() || (opts && opts.allowEmpty))) { var v = input.value; close(); submit(v); }
      });
      document.body.appendChild(overlay);
      input.focus();
    }

    function confirmDeleteView(name) {
      var title = 'Delete view';
      var message = 'Deletes "' + name + '". Your filters stay as they are.';
      var confirmed = false;
      var confirmDelete = function () {
        if (confirmed) return;
        confirmed = true;
        deleteView(name);
      };
      if (window.unNative && unNative.alert) {
        try {
          var answered = unNative.alert({
            title: title,
            message: message,
            buttons: [
              { label: 'Delete', style: 'destructive', handler: confirmDelete },
              { label: 'Cancel', style: 'cancel' },
            ],
          });
          if (answered && typeof answered.then === 'function') {
            answered.then(function (res) {
              var label = res && res.button;
              if (label && typeof label === 'object') label = label.label;
              if (label === 'Delete') confirmDelete();
            }).catch(function () { /* dismissed */ });
          }
          return;
        } catch (e) { /* fall through to the plain dialog */ }
      }
      fallbackConfirmDialog(title, message, 'Delete', confirmDelete);
    }

    function fallbackConfirmDialog(title, message, okLabel, onOk) {
      var overlay = document.createElement('div');
      overlay.setAttribute('data-view-confirm', '');
      overlay.setAttribute('role', 'alertdialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', title);
      overlay.className = 'fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-6';
      overlay.innerHTML = '<div class="w-64 rounded-2xl bg-white p-4 text-center shadow-xl dark:bg-zinc-900">'
        + '<p class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + esc(title) + '</p>'
        + '<p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">' + esc(message) + '</p>'
        + '<div class="mt-3 flex flex-col gap-2">'
        + '<button data-view-confirm-ok class="min-h-9 rounded-xl bg-red-600 py-2 text-sm font-semibold text-white active:scale-95">' + esc(okLabel) + '</button>'
        + '<button data-view-confirm-cancel class="min-h-9 rounded-xl bg-zinc-100 py-2 text-sm font-semibold text-zinc-700 active:scale-95 dark:bg-zinc-800 dark:text-zinc-200">Cancel</button>'
        + '</div></div>';
      var close = function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); };
      overlay.addEventListener('click', function (event) {
        if (event.target.closest('[data-view-confirm-ok]')) { close(); onOk(); }
        else if (event.target.closest('[data-view-confirm-cancel]') || event.target === overlay) close();
      });
      document.body.appendChild(overlay);
    }

    // Rename / delete live behind a small "⋯" button beside each chip, so
    // the chip itself stays a one-tap switch. The kit's menu is an action
    // sheet on touch and an anchored popover on desktop; standalone loads
    // get a plain in-app menu with the same two answers.
    function openViewMenu(name, anchorEl) {
      if (!findView(name)) return;
      var items = [
        { label: 'Rename', handler: function () {
          promptViewName('Rename view', 'A new name for "' + name + '".', name,
            function (next) { renameView(name, next); });
        } },
        { label: 'Delete', destructive: true, handler: function () { confirmDeleteView(name); } },
      ];
      if (window.unNative && unNative.menu) {
        try {
          unNative.menu({ anchorEl: anchorEl, title: name, items: items, cancelLabel: 'Cancel' });
          return;
        } catch (e) { /* fall through to the plain menu */ }
      }
      fallbackViewMenu(name, items);
    }

    function fallbackViewMenu(name, items) {
      var overlay = document.createElement('div');
      overlay.setAttribute('data-view-menu-fallback', '');
      overlay.setAttribute('role', 'menu');
      overlay.setAttribute('aria-label', 'Options for view ' + name);
      overlay.className = 'fixed inset-0 z-50 flex items-end justify-center bg-zinc-900/40 p-6 sm:items-center';
      var rows = '';
      for (var i = 0; i < items.length; i++) {
        rows += '<button data-view-menu-item="' + i + '"'
          + ' class="min-h-11 w-full rounded-xl py-2.5 text-sm font-semibold active:scale-95 '
          + (items[i].destructive
            ? 'bg-red-50 text-red-600 dark:bg-red-500/10 dark:text-red-400'
            : 'bg-zinc-100 text-zinc-800 dark:bg-zinc-800 dark:text-zinc-100')
          + '">' + esc(items[i].label) + '</button>';
      }
      overlay.innerHTML = '<div class="flex w-full max-w-xs flex-col gap-2">'
        + '<div class="flex flex-col gap-2 rounded-2xl bg-white p-3 shadow-xl dark:bg-zinc-900">'
        + rows
        + '<button data-view-menu-cancel class="min-h-11 w-full rounded-xl bg-white py-2.5 text-sm font-semibold text-zinc-700 active:scale-95 dark:bg-zinc-800 dark:text-zinc-200">Cancel</button>'
        + '</div></div>';
      var close = function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); };
      overlay.addEventListener('click', function (event) {
        var row = event.target.closest ? event.target.closest('[data-view-menu-item]') : null;
        if (row) { var item = items[Number(row.getAttribute('data-view-menu-item'))]; close(); if (item && item.handler) item.handler(); }
        else if (event.target.closest('[data-view-menu-cancel]') || event.target === overlay) close();
      });
      document.body.appendChild(overlay);
    }

    function openSaveViewDialog() {
      promptViewName('Save view', 'Saves the current filters and sort as a view.',
        state.filterName || 'New view',
        function (name) { saveView(name); });
    }

    // Staging check hooks for saved views (?demo=1 only). Each hook drives
    // the real function the tap would, at boot, before the first render:
    //   seed-views=A,B   replaces the stored views with fixed demo views
    //   rename-view=A:B  renames through renameView()
    //   delete-view=A    deletes through deleteView()
    //   add-view=A       saves the screen as it currently stands (no reload)
    //   apply-view=A,B   applies views in order through applyView()
    //   save-view=A      saves, then reloads a clean URL (persistence)
    //   save-reload=1    reloads a clean URL after the other hooks
    // The reload drops every hook parameter, so the page after it shows
    // only what storage restored on its own. The apply hook runs
    // applyView's ephemeral mode so a check URL leaves the browser's
    // stored preferences the way it found them. Production never reads
    // these parameters.
    var VIEW_SEEDS = {
      'All open': { filter: '', filterName: '', sort: 'needed' },
      'My apps': { filter: 'staging-demo-app', filterName: 'Staging Demo App', sort: 'needed' },
      'Needs one vote': { filter: '', filterName: '', sort: 'needed', oneAway: true },
      'Unmerged': { filter: '', filterName: '', sort: 'needed', hideMerged: true },
    };

    function runViewsHooks() {
      if (!DEMO) return;
      var seedParam = params.get('seed-views');
      if (seedParam) {
        state.views = [];
        seedParam.split(',').forEach(function (name) {
          name = name.trim();
          var seed = VIEW_SEEDS[name];
          if (seed) state.views.push(Object.assign({ name: name }, seed));
        });
        saveViews();
      }
      var renameMatch = (params.get('rename-view') || '').match(/^(.+):(.+)$/);
      if (renameMatch) renameView(renameMatch[1], renameMatch[2]);
      var deleteParam = params.get('delete-view');
      if (deleteParam) deleteView(deleteParam.trim());
      var addParam = params.get('add-view');
      if (addParam) saveView(addParam.trim());
      var applyParam = params.get('apply-view');
      if (applyParam) {
        applyParam.split(',').forEach(function (name) {
          var view = findView(name.trim());
          if (view) applyView(view, true);
        });
      }
      var reload = false;
      var saveParam = params.get('save-view');
      if (saveParam) { saveView(saveParam.trim()); reload = true; }
      if (params.get('save-reload') === '1') reload = true;
      if (reload) {
        // Reload a clean URL, dropping the view-hook parameters but keeping
        // the rest (token, theme, preview-now), the way ?set-filter= does.
        var remaining = new URLSearchParams(params);
        ['seed-views', 'rename-view', 'delete-view', 'add-view',
          'apply-view', 'save-view', 'save-reload'].forEach(function (k) { remaining.delete(k); });
        var restQ = remaining.toString();
        location.replace(location.pathname + (restQ ? '?' + restQ : '') + location.hash);
      }
    }

    // ------------------------------------------------------------------
    // Onboarding tour check hooks (demo only, see the TOUR_* params up
    // top). All of them drive the real buttons through the real delegated
    // handler; the run happens once at boot, after the first render, so
    // the panel is in the DOM. ?finish-tour=1 and ?skip-tour=1 end by
    // reloading a clean ?tour-done=1 marker URL (every tour parameter
    // dropped, the rest kept), where the persisted "never show again"
    // state is what a check observes.
    // ------------------------------------------------------------------

    var tourHooksRun = false;

    function reloadTourMarker() {
      var remaining = new URLSearchParams(params);
      ['tour', 'tour-reset', 'finish-tour', 'skip-tour', 'tap-tour-next',
        'tap-tour-skip', 'tap-tour-open'].forEach(function (k) { remaining.delete(k); });
      remaining.set('tour-done', '1');
      location.replace(location.pathname + '?' + remaining.toString() + location.hash);
    }

    function runTourHooks() {
      if (!DEMO || tourHooksRun) return;
      tourHooksRun = true;
      // ?tour-reset=1: clear the done flag, so this load is a first visit
      // again no matter what earlier check runs left in localStorage.
      if (TOUR_RESET) {
        try { localStorage.removeItem(TOUR_KEY); } catch (e) {}
        render();
      }
      // ?finish-tour=1 / ?skip-tour=1: force the tour up, drive it to done
      // through the real buttons (three Next taps, or one Skip tap), then
      // reload the marker URL so the check sees the later visits.
      if (FINISH_TOUR || SKIP_TOUR) {
        state.tourOpen = true;
        state.tourStep = 0;
        render();
        var actionName = SKIP_TOUR ? 'tour-skip' : 'tour-next';
        var targetTaps = SKIP_TOUR ? 1 : 3;
        var taps = 0;
        var driver = setInterval(function () {
          var btn = document.querySelector('[data-action="' + actionName + '"]');
          if (!btn) { clearInterval(driver); reloadTourMarker(); return; }
          btn.click();
          if (++taps >= targetTaps) {
            clearInterval(driver);
            setTimeout(reloadTourMarker, 150);
          }
        }, 120);
        return;
      }
      // ?tap-tour-open=1: mark the tour done first (so the menu path is
      // the only thing that can bring it back), then tap the header menu
      // and its "Show the tour" item.
      if (TAP_TOUR_OPEN) {
        markTourDone();
        state.tourOpen = false;
        render();
        var menuBtn = document.getElementById('menu-btn');
        if (menuBtn) {
          menuBtn.click();
          var tries = 0;
          var finder = setInterval(function () {
            var item = findButtonByText('Show the tour');
            if (item) {
              clearInterval(finder);
              item.click();
            } else if (++tries > 40) {
              clearInterval(finder);
            }
          }, 100);
        }
        return;
      }
      // ?tap-tour-next=<n> then optionally ?tap-tour-skip=1: taps in
      // sequence, each waiting for the previous tap's re-render.
      if (TAP_TOUR_NEXT || TAP_TOUR_SKIP) {
        var left = TAP_TOUR_NEXT;
        var stepper = function () {
          if (left > 0) {
            var next = document.querySelector('[data-action="tour-next"]');
            if (!next) return;
            next.click();
            left--;
            setTimeout(stepper, 120);
            return;
          }
          if (TAP_TOUR_SKIP) {
            var skip = document.querySelector('[data-action="tour-skip"]');
            if (skip) skip.click();
          }
        };
        stepper();
      }
    }


    // ------------------------------------------------------------------
    // Saved searches: chips under the search box. Each holds a search text
    // plus the filters in force when it was saved, and shows how many
    // loaded proposals match it AND went up for vote since it was last
    // opened AND are not voted on. Stored per person on the server (like
    // the watchlist), so the list survives reloads and other devices. The
    // counts are tallied from the inbox the page already loaded; no extra
    // platform calls.
    // ------------------------------------------------------------------

    var SEARCH_UNREAD_CLASS = 'shrink-0 rounded-full bg-violet-600 px-1.5 text-[10px] font-bold text-white';

    function normalizeSavedRow(r) {
      return {
        id: r && r.id != null ? r.id : '',
        name: r && typeof r.name === 'string' ? r.name : '',
        query: r && typeof r.query === 'string' ? r.query : '',
        filters: r && r.filters && typeof r.filters === 'object' ? r.filters : {},
        lastSeenAt: r && typeof r.lastSeenAt === 'string' ? r.lastSeenAt : '',
      };
    }

    function savedSearchConfig(row) {
      // The row's filters plus its search text, in the view-config shape the
      // existing matcher understands (sort is deliberately not kept).
      return normalizeViewConfig(Object.assign({}, row.filters || {}, { search: row.query }));
    }

    function findSavedSearch(name) {
      var needle = String(name == null ? '' : name).toLowerCase();
      for (var i = 0; i < state.savedSearches.length; i++) {
        if (state.savedSearches[i].name.toLowerCase() === needle) return state.savedSearches[i];
      }
      return null;
    }

    function findSavedSearchRow(id) {
      for (var i = 0; i < state.savedSearches.length; i++) {
        if (String(state.savedSearches[i].id) === String(id)) return state.savedSearches[i];
      }
      return null;
    }

    // How many loaded proposals are new for this saved search, or null while
    // the inbox is not loaded (no badges then, and the chips still work).
    // A proposal counts when it matches the saved query and filters, has not
    // been voted on, and went up for vote after the search was last opened.
    // A proposal with no known start date is never counted as new.
    function searchUnread(row) {
      var proposals = state.inbox && state.inbox.proposals;
      if (!proposals) return null;
      var cfg = savedSearchConfig(row);
      var seen = Date.parse(row.lastSeenAt);
      var n = 0;
      for (var i = 0; i < proposals.length; i++) {
        var p = proposals[i];
        if (!matchesViewConfig(p, cfg)) continue;
        if (isVoted(p)) continue;
        var t = p.proposedAt ? Date.parse(p.proposedAt) : NaN;
        if (!isFinite(t) || !isFinite(seen) || t <= seen) continue;
        n++;
      }
      return n;
    }

    // Plain-words tooltip, like viewDescription but without a sort (a saved
    // search does not keep one).
    function savedSearchDescription(row) {
      var cfg = savedSearchConfig(row);
      var bits = [];
      bits.push((cfg.filterName || cfg.filter) ? 'App: ' + (cfg.filterName || cfg.filter) : 'All apps');
      if (cfg.oneAway) bits.push('One vote away');
      if (cfg.hideVoted) bits.push('Hides voted');
      if (cfg.hideMerged) bits.push('Hides merged');
      if (cfg.search) bits.push('Search: "' + cfg.search + '"');
      return bits.join(' · ');
    }

    // The saved search whose query and filters the screen currently shows,
    // or null (a manual change deactivates the chip on its own).
    function activeSavedSearchRow() {
      var cur = currentViewConfig();
      for (var i = 0; i < state.savedSearches.length; i++) {
        var cfg = savedSearchConfig(state.savedSearches[i]);
        if (cfg.search === cur.search && cfg.filter === cur.filter
          && cfg.oneAway === cur.oneAway && cfg.hideVoted === cur.hideVoted
          && cfg.hideMerged === cur.hideMerged) {
          return state.savedSearches[i];
        }
      }
      return null;
    }

    function renderSavedSearches() {
      var chips = document.getElementById('saved-searches-chips');
      if (!chips) return;
      var active = activeSavedSearchRow();
      var html = '';
      for (var i = 0; i < state.savedSearches.length; i++) {
        var row = state.savedSearches[i];
        var cfg = savedSearchConfig(row);
        var count = searchUnread(row);
        html += '<span data-saved-search data-search-id="' + esc(String(row.id)) + '"'
          + ' data-search-name="' + esc(row.name) + '"'
          + ' data-search-query="' + esc(row.query) + '"'
          + ' data-search-app="' + esc(cfg.filter) + '"'
          + ' class="flex shrink-0 items-center gap-0.5">'
          + '<button type="button" data-saved-search-open aria-pressed="' + (row === active ? 'true' : 'false') + '"'
          + ' title="' + esc(savedSearchDescription(row)) + '"'
          + ' class="' + (row === active ? VIEW_CHIP_ACTIVE : VIEW_CHIP_IDLE) + '">'
          + '<span class="truncate">' + esc(row.name) + '</span>'
          + (count != null && count > 0
            ? '<span data-search-unread class="' + SEARCH_UNREAD_CLASS + '">' + count + '</span>'
            : '')
          + '</button>'
          + '<button type="button" data-saved-search-delete'
          + ' aria-label="Delete saved search ' + esc(row.name) + '"'
          + ' class="' + VIEW_MENU_CLASS + '">'
          + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>'
          + '</button>'
          + '</span>';
      }
      chips.innerHTML = html;
    }

    // Run a saved search again: its text goes back in the box and its
    // filters come back on, for this visit only (the same way typed search
    // text is not remembered after a reload), then the chip counts as
    // opened and its badge clears at once.
    function openSavedSearch(row) {
      var cfg = savedSearchConfig(row);
      state.search = cfg.search;
      state.filter = cfg.filter;
      state.filterName = cfg.filterName;
      state.oneAway = cfg.oneAway;
      state.hideVoted = cfg.hideVoted;
      state.hideMerged = cfg.hideMerged;
      var box = document.getElementById('inbox-search');
      if (box) box.value = state.search;
      var hv = document.getElementById('hide-voted');
      if (hv) hv.checked = state.hideVoted;
      var hm = document.getElementById('hide-merged');
      if (hm) hm.checked = state.hideMerged;
      row.lastSeenAt = new Date().toISOString();
      render();
      api('/api/saved-searches/seen', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: row.id }),
      }).catch(function () { /* stays cleared locally */ });
    }

    // Save the current search text and filters under a name. An empty name
    // falls back to the search text; a name that already exists (case
    // ignored) saves nothing and says so. Saving counts as opening: a fresh
    // chip starts with no unread count.
    function saveSearch(name) {
      var query = state.search.trim();
      if (!query) {
        toast('Type a search first');
        return Promise.resolve(false);
      }
      name = String(name == null ? '' : name).trim();
      if (!name) name = query;
      if (name.length > 60) name = name.slice(0, 60);
      if (findSavedSearch(name)) {
        toast('You already have a saved search with that name');
        return Promise.resolve(false);
      }
      var cur = currentViewConfig();
      var filters = {
        filter: cur.filter, filterName: cur.filterName,
        oneAway: cur.oneAway, hideVoted: cur.hideVoted, hideMerged: cur.hideMerged,
      };
      return api('/api/saved-searches/save', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: name, query: query, filters: filters }),
      }).then(function (data) {
        if (data && data.created && data.row) {
          state.savedSearches.push(normalizeSavedRow(data.row));
          render();
          toast('Search saved');
          return true;
        }
        // Name taken (e.g. another device won the race): keep the first one.
        toast('You already have a saved search with that name');
        return loadSavedSearches().then(function () { return false; });
      }).catch(function (err) {
        toast('Could not save the search: ' + (err.message || 'try again'));
        return false;
      });
    }

    // Delete a saved search by id or name: the chip goes away at once, the
    // server row follows. The search text and filters on screen stay put.
    function deleteSavedSearch(x) {
      var row = findSavedSearchRow(x) || findSavedSearch(x);
      if (!row) return Promise.resolve(false);
      state.savedSearches = state.savedSearches.filter(function (r) { return r !== row; });
      render();
      toast('Saved search deleted');
      return api('/api/saved-searches/delete', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: row.id }),
      }).catch(function (err) {
        // Put the truth back before saying anything went wrong.
        return loadSavedSearches().then(function () {
          toast('Could not delete the saved search: ' + (err.message || 'try again'));
          return false;
        });
      });
    }

    function loadSavedSearches() {
      return api('/api/saved-searches')
        .then(function (data) {
          state.savedSearches = ((data && data.rows) || []).map(normalizeSavedRow);
        })
        .catch(function () { /* the bar then shows only Save search */ })
        .then(function () {
          state.savedSearchesLoaded = true;
          // The chip bar is all this fetch can change, so re-render just
          // that: a full render() here can land after the tap-share demo
          // hook has shown a card's Copied! state and would wipe it.
          renderSavedSearches();
          maybeTapSearch();
        });
    }

    function openSaveSearchDialog() {
      if (!state.search.trim()) {
        toast('Type a search first');
        return;
      }
      promptViewName('Save search',
        'Saves the search text and filters. Leave the name empty to use the search text.',
        '',
        function (name) { saveSearch(name); },
        { placeholder: 'Search name', allowEmpty: true });
    }

    // ------------------------------------------------------------------
    // Staging check hooks for saved searches (?demo=1 only), in the same
    // spirit as the saved-views hooks: each drives the real function the
    // tap would.
    //   seed-searches=A,B  POSTs /seed first, replacing the caller's rows
    //                      with fixtures ('none' empties the list)
    //   savesearch=<name>  saves the current screen through saveSearch(),
    //                      once per value, in order (an empty value tests
    //                      the name fallback)
    //   delsearch=<name>   deletes through deleteSavedSearch()
    //   tap-search=<name>  once the inbox AND the saved list have loaded,
    //                      clicks that chip's real open button
    //   search-reload=1    reloads a clean URL after the hooks (persistence)
    // Production never reads these parameters.
    // ------------------------------------------------------------------

    var TAP_SEARCH = DEMO ? (params.get('tap-search') || '') : '';
    var tapSearchDone = false;
    // The tap waits until the boot chain has fully settled (hooks, then the
    // saved-search list itself): an earlier tap could be followed by the
    // boot's final GET, which would restore the pre-open last-seen stamp
    // and bring the badge straight back.
    var savedSearchesSettled = false;

    function maybeTapSearch() {
      if (!TAP_SEARCH || tapSearchDone) return;
      if (!state.inbox || !state.inbox.proposals) return;
      if (!state.savedSearchesLoaded || !savedSearchesSettled) return;
      var row = findSavedSearch(TAP_SEARCH);
      if (!row) return;
      tapSearchDone = true;
      var btn = document.querySelector('[data-saved-search][data-search-id="' + esc(String(row.id)) + '"] [data-saved-search-open]');
      if (btn) btn.click();
    }

    function runSavedSearchHooks() {
      if (!DEMO) return Promise.resolve();
      var p = Promise.resolve();
      var seedParam = (params.get('seed-searches') || '').trim();
      if (seedParam) {
        var names = seedParam.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        p = api('/api/saved-searches/seed', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ demo: true, names: names }),
        }).then(function () { return loadSavedSearches(); })
          .catch(function () { return loadSavedSearches(); });
      }
      var saveValues = params.getAll ? params.getAll('savesearch') : [];
      for (var i = 0; i < saveValues.length; i++) {
        (function (value) {
          p = p.then(function () { return saveSearch(value); });
        })(saveValues[i]);
      }
      var delParam = (params.get('delsearch') || '').trim();
      if (delParam) {
        p = p.then(function () { return deleteSavedSearch(delParam); });
      }
      if (params.get('search-reload') === '1') {
        p = p.then(function () {
          // Reload a clean URL, dropping the saved-search hook parameters
          // AND the search text (q), keeping the rest (token, theme), the
          // way the saved-views hooks do.
          var remaining = new URLSearchParams(params);
          ['seed-searches', 'savesearch', 'delsearch', 'tap-search',
            'search-reload', 'q'].forEach(function (k) { remaining.delete(k); });
          var restQ = remaining.toString();
          location.replace(location.pathname + (restQ ? '?' + restQ : '') + location.hash);
        });
      }
      return p;
    }

    // ------------------------------------------------------------------
    // Rendering. Class strings are whole literals so the Tailwind compiler
    // extracts them from this file.
    // ------------------------------------------------------------------

    var TAB_ACTIVE = 'bg-violet-600 text-white shadow-sm';
    var TAB_IDLE = 'text-zinc-500 dark:text-zinc-400';

    var BADGE_IDLE = 'bg-zinc-200 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300';
