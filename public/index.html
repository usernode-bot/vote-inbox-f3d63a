        var busy = state.pending[p.sessionId];
        actions = '<div class="flex gap-2">'
          + '<button data-vote="yes" data-session="' + esc(p.sessionId) + '"'
          + ' class="min-h-11 flex-1 rounded-xl bg-violet-600 py-3 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95 disabled:opacity-50"'
          + (busy ? ' disabled' : '') + '>Yes</button>'
          + '<button data-vote="no" data-session="' + esc(p.sessionId) + '"'
          + ' class="min-h-11 flex-1 rounded-xl border border-zinc-300 bg-white py-3 text-sm font-semibold text-zinc-800 hover:bg-zinc-100 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700 transition-transform active:scale-95 disabled:opacity-50"'
          + (busy ? ' disabled' : '') + '>No</button>'
          + '</div>';
      }
      // data-needed lets the declared checks (and deep links) assert what the
      // votes-needed pill shows: omitted when the threshold is unknown.
      return '<article data-proposal-card data-session-id="' + esc(p.sessionId) + '"'
        + (p.needed != null ? ' data-needed="' + p.needed + '"' : '')
        + ' class="' + CARD_CLASS + '">'
        + '<div class="flex items-center justify-between gap-2">'
        + '<span class="flex min-w-0 items-center gap-1.5">'
        + appAvatar(p)
        + '<span class="truncate text-xs font-medium text-zinc-500 dark:text-zinc-400">' + esc(p.appName) + '</span>'
        + ageHtml
        + '</span>'
        + neededPill(p)
        + '</div>'
        + proposedDateHtml
        + '<h2 data-proposal-title class="' + (titleExpanded ? TITLE_EXPANDED : TITLE_CLAMPED) + '">' + esc(p.title) + '</h2>'
        + voteBar(p)
        + voterAvatarRow(p)
        + voterNamesRow(p)
        + '<div class="flex items-center justify-between gap-2">'
        + '<p class="min-w-0 text-xs text-zinc-500 dark:text-zinc-400">'
        + (p.author ? 'by @' + esc(p.author) : '') + '</p>'
        + (p.url ? shareLinkButton(p) : '')
        + '</div>'
        + statusProgress(p)
        + actions
        + '</article>';
    }

    // Long titles: every card title clamps to two lines, so a longer one
    // hides its tail behind the ellipsis. After each render, measure each
    // card title; one that overflows its clamp gets a "More" control
    // appended (an already-expanded one gets "Less", built with the card).
    // A title that fits on two lines gets nothing. Tapping toggles the
    // clamp in place, so nothing else on the card moves.
    function enhanceTitles() {
      var cards = document.querySelectorAll('#view [data-proposal-card]');
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var h2 = card.querySelector('[data-proposal-title]');
        if (!h2 || card.querySelector('[data-title-toggle]')) continue;
        var sessionId = card.getAttribute('data-session-id');
        var expanded = !!state.expandedTitles[sessionId];
        // Overflow check: with line-clamp-2 the element shows two lines
        // (clientHeight) while scrollHeight still reports the full text
        // height. The +1 slack ignores sub-pixel rounding.
        if (!expanded && h2.scrollHeight <= h2.clientHeight + 1) continue;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('data-title-toggle', '');
        btn.setAttribute('data-session', sessionId);
        btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        btn.className = TITLE_TOGGLE;
        btn.textContent = expanded ? 'Less' : 'More';
        h2.insertAdjacentElement('afterend', btn);
      }
    }

    // More/Less tap on a clamped title: flip the clamp on that one title in
    // place (no full re-render, so no scroll jump) and remember the choice
    // for the session so a later re-render keeps it expanded.
    function toggleTitle(btn) {
      var sessionId = btn.getAttribute('data-session');
      var card = btn.closest('[data-proposal-card]');
      var h2 = card ? card.querySelector('[data-proposal-title]') : null;
      if (!sessionId || !card || !h2) return;
      var expanded = !!state.expandedTitles[sessionId];
      if (expanded) delete state.expandedTitles[sessionId];
      else state.expandedTitles[sessionId] = true;
      expanded = !expanded;
      h2.className = expanded ? TITLE_EXPANDED : TITLE_CLAMPED;
      btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      btn.textContent = expanded ? 'Less' : 'More';
    }

    function voteRow(v) {
      var style = STATUS_STYLE[v.status] || STATUS_STYLE.closed;
      var knownStatus = !!STATUS_STYLE[v.status];
      var date = '';
      if (v.created_at) {
        try { date = new Date(v.created_at).toLocaleDateString(); } catch (e) { date = ''; }
      }
      // Merged rows show when the proposal merged, next to the pill. The
      // recorded merged_at timestamp is the source; updated_at (the refresh
      // that first saw the merge) stands in when the platform never sent one.
      var mergedDate = '';
      var mergedFull = '';
      if (v.status === 'merged') {
        var stamp = v.merged_at || v.updated_at;
        if (stamp && isFinite(new Date(stamp).getTime())) {
          mergedDate = new Date(stamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          mergedFull = new Date(stamp).toLocaleString();
        }
      }
      var counts = 'Yes ' + v.votes_for + ' · No ' + v.votes_against;
      if (v.votes_required != null && v.status === 'voting') {
        var needed = Math.max(0, v.votes_required - v.votes_for);
        if (needed > 0) counts += ' · ' + needed + ' still needed';
      }
      return '<article data-vote-row data-session-id="' + esc(v.session_id) + '"'
        + ' data-vote-status="' + esc(knownStatus ? v.status : 'closed') + '"'
        + ' class="' + CARD_CLASS + '">'
        + '<div class="flex items-start justify-between gap-2">'
        + '<h2 class="line-clamp-2 text-sm font-semibold leading-snug text-zinc-900 dark:text-zinc-100">' + esc(v.title) + '</h2>'
        + '<span class="whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-semibold ' + style[1] + '">' + style[0] + '</span>'
        + (mergedDate
           ? '<span data-merged-date class="whitespace-nowrap text-xs text-zinc-500 dark:text-zinc-400" title="Merged ' + esc(mergedFull) + '">· ' + esc(mergedDate) + '</span>'
           : '')
        + '</div>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + esc(v.app_name || v.app_slug)
        + ' · You voted ' + v.choice + ' · ' + esc(counts) + '</p>'
        + (date ? '<p class="text-xs text-zinc-500 dark:text-zinc-500">Voted ' + esc(date) + '</p>' : '')
        + '</article>';
    }

    function skeletonCard() {
      return '<div class="animate-pulse rounded-2xl border border-zinc-200 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900/70">'
        + '<div class="flex items-center justify-between gap-2">'
        + '<div class="h-6 w-28 rounded-md bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<div class="h-5 w-20 rounded-full bg-zinc-200 dark:bg-zinc-800"></div>'
        + '</div>'
        + '<div class="mt-3 h-3 w-full rounded bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<div class="mt-2 h-3 w-2/3 rounded bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<div class="mt-4 flex items-center gap-2">'
        + '<div class="h-1.5 w-full rounded-full bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<div class="h-3 w-16 rounded bg-zinc-200 dark:bg-zinc-800"></div>'
        + '</div>'
        + '<div class="mt-4 h-10 w-full rounded-xl bg-zinc-200 dark:bg-zinc-800"></div>'
        + '</div>';
    }

    function skeletons() {
      return skeletonCard() + skeletonCard() + skeletonCard();
    }

    function emptyHtml(title, body, cta) {
      return '<div class="flex flex-col items-center gap-2 rounded-2xl border border-dashed border-zinc-300 bg-white/60 px-6 py-10 text-center dark:border-zinc-700 dark:bg-zinc-900/40">'
        + '<svg viewBox="0 0 24 24" class="h-10 w-10 text-zinc-300 dark:text-zinc-600" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>'
        + '<p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">' + title + '</p>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + body + '</p>'
        + cta
        + '</div>';
    }

    var REFRESH_CTA = '<button data-action="refresh" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Refresh</button>';
    var CLEAR_FILTER_CTA = '<button data-action="clear-filter" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show all apps</button>';
    var CLEAR_ONE_AWAY_CTA = '<button data-action="clear-one-away" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show all proposals</button>';
    var SHOW_VOTED_CTA = '<button data-action="show-voted" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show voted proposals</button>';
    var SHOW_MERGED_CTA = '<button data-action="show-merged" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show merged proposals</button>';
    var CLEAR_SEARCH_CTA = '<button data-action="clear-search" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Clear search</button>';
    var BROWSE_CTA = '<button data-action="go-inbox" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Browse the Inbox</button>';

    function errorHtml(message) {
      return '<div class="flex flex-col items-center gap-2 rounded-2xl border border-red-500/30 bg-red-500/5 px-6 py-10 text-center">'
        + '<svg viewBox="0 0 24 24" class="h-10 w-10 text-red-400" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>'
        + '<p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">Something went wrong</p>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + esc(message) + '</p>'
        + '<button data-action="refresh" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Try again</button>'
        + '</div>';
    }

    // ------------------------------------------------------------------
    // New proposal screen: template picker, prefilled (and fully
    // editable) title and description, Send, and the Sent list.
    //
    // A template only FILLS the two fields: the prefill lands in ordinary
    // inputs the user edits freely before sending, and what is sent is
    // whatever the fields hold at that moment. Picking another template
    // refills both fields, so switching is an undoable-by-typing choice,
    // not a merge.
    // ------------------------------------------------------------------

    var TEMPLATES = [
      { id: 'bugfix', label: 'Bugfix',
        title: 'Fix: [what is broken]',
        body: 'Problem\n[What is broken and where it shows up.]\n\nSteps to reproduce\n1. [First step]\n2. [Second step]\n\nExpected\n[What should happen instead.]\n\nFix\n[What you propose changing.]' },
      { id: 'feature', label: 'Feature',
        title: 'Add [feature name]',
        body: 'What\n[The feature in one sentence.]\n\nWhy\n[The problem it solves or the value it adds.]\n\nHow it works\n[What a person sees, step by step.]\n\nScope\n[What is included, and what is left out.]' },
      { id: 'copy', label: 'Copy change',
        title: 'Copy change: [where]',
        body: 'Where\n[The screen or text that changes.]\n\nCurrent text\n[What it says today.]\n\nNew text\n[What it should say.]\n\nReason\n[Why the new wording is better.]' },
      { id: 'blank', label: 'Blank', title: '', body: '' },
    ];

    // Whole-literal class strings for the Tailwind compiler. The back
    // button mirrors the header's circular icon buttons; the fields mirror
    // the inbox search box's look.
    var COMPOSE_BACK_CLASS = 'flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-zinc-300 bg-white text-zinc-500 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-400';
    var COMPOSE_CHIP_ACTIVE = 'rounded-full bg-violet-600 px-3.5 py-1.5 text-sm font-semibold text-white shadow-sm transition-transform active:scale-95';
    var COMPOSE_CHIP_IDLE = 'rounded-full border border-zinc-300 bg-white px-3.5 py-1.5 text-sm font-semibold text-zinc-700 transition-transform active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200';
    var COMPOSE_FIELD = 'w-full rounded-xl border border-zinc-300 bg-white py-2.5 pl-3 pr-3 text-sm text-zinc-900 placeholder:text-zinc-400 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder:text-zinc-500';
    var SEND_PILL_CLASS = 'shrink-0 rounded-full bg-violet-600 px-4 py-1.5 text-sm font-semibold text-white shadow-sm transition-transform active:scale-95 disabled:opacity-50';
    var SENT_ROW_CLASS = 'rounded-xl border border-zinc-200 bg-white p-3 dark:border-zinc-800 dark:bg-zinc-900/70';

    function templateLabel(id) {
      for (var i = 0; i < TEMPLATES.length; i++) {
        if (TEMPLATES[i].id === id) return TEMPLATES[i].label;
      }
      return 'Blank';
    }

    function composeChipsHtml() {
      var html = '';
      for (var i = 0; i < TEMPLATES.length; i++) {
        var t = TEMPLATES[i];
        var on = state.compose.template === t.id;
        html += '<button type="button" data-template-option data-template-id="' + t.id + '"'
          + ' aria-pressed="' + (on ? 'true' : 'false') + '"'
          + ' class="' + (on ? COMPOSE_CHIP_ACTIVE : COMPOSE_CHIP_IDLE) + '">'
          + esc(t.label) + '</button>';
      }
      return '<div class="flex flex-wrap gap-2">' + html + '</div>';
    }

    // The compose form: template chips on top, then the two fields the
    // prefill lands in. The title's current value is mirrored onto the
    // value attribute (kept in step by the input handler) so the staging
    // checks, which read markup rather than input properties, can assert
    // on an edit; the description's state is visible in its character
    // counter the same way.
    function composeFormHtml() {
      var c = state.compose;
      return '<section class="flex flex-col gap-2">'
        + '<p class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Start from a template</p>'
        + composeChipsHtml()
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">A template fills the title and description. Everything stays editable before you send.</p>'
        + '</section>'
        + '<section class="flex flex-col gap-1.5">'
        + '<label for="compose-title" class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Title</label>'
        + '<input id="compose-title" data-compose-title type="text" autocomplete="off"'
        + ' value="' + esc(c.title) + '" class="' + COMPOSE_FIELD + '">'
        + '</section>'
        + '<section class="flex flex-col gap-1.5">'
        + '<label for="compose-body" class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Description</label>'
        + '<textarea id="compose-body" data-compose-body rows="10" class="' + COMPOSE_FIELD + ' resize-y">' + esc(c.body) + '</textarea>'
        + '<p data-compose-count class="text-xs tabular-nums text-zinc-400 dark:text-zinc-500">' + c.body.length + ' characters</p>'
        + '</section>'
        + (c.error
          ? '<p data-compose-error class="rounded-xl border border-red-500/30 bg-red-500/5 px-3 py-2 text-xs font-medium text-red-700 dark:text-red-300">' + esc(c.error) + '</p>'
          : '');
    }

    // The sent state: confirmation block instead of the form, with the sent
    // title echoed. Send records the proposal in this app (see the Sent
    // list note below); the copy says so plainly.
    function composeConfirmationHtml() {
      var c = state.compose;
      return '<div data-send-confirmation class="flex flex-col gap-2 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-4">'
        + '<p class="flex items-center gap-1.5 text-sm font-semibold text-emerald-700 dark:text-emerald-300">'
        + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>'
        + 'Proposal sent</p>'
        + '<p class="text-xs text-zinc-600 dark:text-zinc-300">"' + esc(c.sentTitle) + '" is in your Sent list below.</p>'
        + '<button type="button" data-compose-again class="self-start rounded-full bg-violet-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-transform active:scale-95">Compose another</button>'
        + '</div>';
    }

    function sentListHtml() {
      var c = state.compose;
      if (c.sentError) {
        return '<p class="text-xs text-zinc-500 dark:text-zinc-400">Could not load sent proposals.</p>'
          + '<button type="button" data-action="reload-sent" class="self-start rounded-full border border-zinc-300 bg-white px-3 py-1.5 text-xs font-semibold text-zinc-700 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200">Try again</button>';
      }
      if (!c.sentLoaded) return '<p class="text-xs text-zinc-400 dark:text-zinc-500">Loading…</p>';
      var rows = c.sent || [];
      if (!rows.length) {
        return '<p data-sent-empty class="text-xs text-zinc-500 dark:text-zinc-400">Nothing sent yet</p>';
      }
      var html = '';
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var when = '';
        if (r.created_at) {
          try { when = new Date(r.created_at).toLocaleDateString(); } catch (e) { when = ''; }
        }
        html += '<article data-sent-row class="' + SENT_ROW_CLASS + '">'
          + '<p class="line-clamp-2 text-sm font-medium text-zinc-900 dark:text-zinc-100">' + esc(r.title) + '</p>'
          + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + esc(templateLabel(r.template))
          + (when ? ' · ' + esc(when) : '') + '</p>'
          + '</article>';
      }
      return html;
    }

    function composeHtml() {
      var c = state.compose;
      var sent = c.sentTitle != null;
      var canSend = !!c.title.trim() && !!c.body.trim() && !c.sending && !sent;
      // Back and Send share the top row, iOS-compose style: the primary
      // action stays visible above the keyboard while the description is
      // being typed.
      return '<div data-compose-screen class="flex flex-col gap-4 pt-1">'
        + '<div class="flex items-center justify-between gap-2">'
        + '<div class="flex min-w-0 items-center gap-2">'
        + '<button type="button" data-compose-back aria-label="Back to the list"'
        + ' class="' + COMPOSE_BACK_CLASS + '">'
        + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>'
        + '</button>'
        + '<h2 class="truncate text-lg font-bold tracking-tight">New proposal</h2>'
        + '</div>'
        + (sent ? '' : '<button type="button" data-send-proposal class="' + SEND_PILL_CLASS + '"'
          + (canSend ? '' : ' disabled') + '>Send</button>')
        + '</div>'
        + (sent ? composeConfirmationHtml() : composeFormHtml())
        + '<section class="flex flex-col gap-2 pt-2">'
        + '<h3 class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Sent</h3>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">Kept in this app. Paste a proposal into the app&#39;s dev chat to open it for a vote.</p>'
        + '<div id="sent-list" class="flex flex-col gap-2">' + sentListHtml() + '</div>'
        + '</section>'
        + '</div>';
    }

    function renderTabs() {
      var buttons = document.querySelectorAll('.tab-btn');
      var inboxCount = state.inbox && state.inbox.proposals ? state.inbox.proposals.length : null;
      var votesCount = state.votes && state.votes.votes ? state.votes.votes.length : null;
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        var active = btn.getAttribute('data-tab') === state.tab;
        var badge = btn.querySelector('.tab-badge');
        var count = btn.getAttribute('data-tab') === 'inbox' ? inboxCount : votesCount;
        btn.className = 'tab-btn flex-1 rounded-full py-1.5 text-sm font-semibold transition-colors '
          + (active ? TAB_ACTIVE : TAB_IDLE);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
        if (badge) {
          badge.className = 'tab-badge ml-1.5 hidden rounded-full px-1.5 py-0.5 text-xs font-bold '
            + (active ? BADGE_ACTIVE : BADGE_IDLE);
          if (count != null && count > 0) {
            badge.textContent = count;
            badge.classList.remove('hidden');
          }
        }
      }
      document.getElementById('filter-row').className =
        'mt-2' + (state.tab === 'inbox' ? '' : ' hidden');
      document.getElementById('search-row').className =
        'mt-2' + (state.tab === 'inbox' ? '' : ' hidden');
      var sortRow = document.getElementById('sort-row');
      if (sortRow) sortRow.className =
        'flex items-center gap-2 pt-1' + (state.tab === 'inbox' ? '' : ' hidden');
      var votesOrderRow = document.getElementById('votes-order-row');
      if (votesOrderRow) votesOrderRow.className =
        'flex items-center gap-2 pt-1' + (state.tab === 'votes' ? '' : ' hidden');
    }

    // The segmented sort pill: keep each option's fill and aria-checked in
    // step with state.sort. Same active treatment as the section tabs.
    function renderSort() {
      var buttons = document.querySelectorAll('#sort-row [data-sort]');
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        var on = btn.getAttribute('data-sort') === state.sort;
        btn.className = 'rounded-full px-3 py-1 text-xs font-semibold transition-colors '
          + (on ? TAB_ACTIVE : TAB_IDLE);
        btn.setAttribute('aria-checked', on ? 'true' : 'false');
      }
    }

    // My Votes order pill: same treatment as the Inbox sort pill, driven
    // by state.votesOrder.
    function renderVotesOrder() {
      var buttons = document.querySelectorAll('#votes-order-row [data-votes-order]');
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        var on = btn.getAttribute('data-votes-order') === state.votesOrder;
        btn.className = 'rounded-full px-3 py-1 text-xs font-semibold transition-colors '
          + (on ? TAB_ACTIVE : TAB_IDLE);
        btn.setAttribute('aria-checked', on ? 'true' : 'false');
      }
    }

    function renderRefreshButton() {
      var busy = state.loadingInbox || state.loadingVotes;
      var icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.toggle('animate-spin', busy);
      document.getElementById('refresh-btn').setAttribute('aria-busy', busy ? 'true' : 'false');
    }

    function renderDemoBanner() {
      var demo = (state.inbox && state.inbox.demo) || (state.votes && state.votes.demo);
      document.getElementById('demo-banner').className = demo
        ? 'mb-3 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-1.5 text-xs font-medium text-amber-700 dark:text-amber-300'
        : 'hidden';
    }

    function renderInbox() {
      if (state.errorInbox) return errorHtml(state.errorInbox);
      if (!state.inbox || state.loadingInbox && !state.inbox.proposals) return skeletons();
      var proposals = state.inbox.proposals || [];
      var filtered = state.filter
        ? proposals.filter(function (p) { return p.appSlug === state.filter; })
        : proposals;
      if (state.hideVoted) {
        filtered = filtered.filter(function (p) { return !isVoted(p); });
      }
      // Hide merged filters the loaded list too, no refetch. Runs after the
      // app and hide-voted filters, alongside them.
      if (state.hideMerged) {
        filtered = filtered.filter(function (p) { return p.status !== 'merged'; });
      }
      // Title search over the loaded cards only: case-insensitive substring,
      // no refetch. Filters run after the app and hide-voted ones, so the
      // search narrows whatever is already on screen.
      var query = state.search.trim().toLowerCase();
      if (query) {
        filtered = filtered.filter(function (p) {
          return String(p.title || '').toLowerCase().indexOf(query) !== -1;
        });
      }
      if (state.sort === 'newest') {
        // Newest proposed first; a proposal without a usable timestamp keeps
        // its loaded order at the end (stable sort). A copy: the loaded
        // array's order stays canonical for the default sort and the
        // server's caches.
        filtered = filtered.slice().sort(function (a, b) {
          var ta = a.proposedAt ? Date.parse(a.proposedAt) : NaN;
          var tb = b.proposedAt ? Date.parse(b.proposedAt) : NaN;
          if (isNaN(ta) && isNaN(tb)) return 0;
          if (isNaN(ta)) return 1;
          if (isNaN(tb)) return -1;
          return tb - ta;
        });
      }
      // One-vote-away chip: keep only proposals exactly one yes short of
      // their threshold (the same number the "1 vote needed" pill shows).
      // Unknown thresholds and "Count met" proposals drop out.
      if (state.oneAway) {
        filtered = filtered.filter(function (p) { return p.needed === 1; });
      }
      if (!filtered.length) {
        // The chip is the most specific filter, so its empty state wins over
        // the others when it is on.
        if (proposals.length && state.oneAway) {
          return emptyHtml(
            'Nothing is one vote away',
            'No open proposal needs exactly one more yes vote right now.',
            CLEAR_ONE_AWAY_CTA);
        }
        if (proposals.length && query) {
          return emptyHtml(
            'No proposals match',
            'No loaded proposal title contains "' + esc(state.search.trim()) + '". Clear the search to see everything.',
            CLEAR_SEARCH_CTA);
        }
        if (proposals.length && state.hideVoted) {
          return emptyHtml(
            'Nothing left to vote on',
            'You already voted on every open proposal here. Show voted proposals to see them again.',
            SHOW_VOTED_CTA);
        }
        if (proposals.length && state.hideMerged) {
          return emptyHtml(
            'Merged proposals hidden',
            'Every proposal here has already merged. Show merged proposals to see them again.',
            SHOW_MERGED_CTA);
        }
        return emptyHtml(
          proposals.length ? 'Nothing from this app' : "You're all caught up",
          proposals.length
            ? 'No open proposals for this app right now.'
            : 'No open proposals to vote on. New ones show up here.',
          proposals.length ? CLEAR_FILTER_CTA : REFRESH_CTA);
      }
      // Age groups: small section headers over the same filtered, sorted
      // cards. Bucketed on the proposal's proposed date in the viewer's own
      // calendar days (Today, the six before it, then Older); a proposal the
      // platform sent no usable timestamp for lands in Older. Cards keep the
      // existing sort order inside each group.
      return groupedInboxHtml(filtered);
    }

    var AGE_GROUPS = [
      { key: 'today', label: 'Today' },
      { key: 'week', label: 'This week' },
      { key: 'older', label: 'Older' },
    ];

    // Which group a proposal belongs to: whole calendar days back from
    // today, in the viewer's local time. 0 = Today, 1..6 = This week,
    // anything further (or an unreadable/missing timestamp) = Older. A
    // future timestamp (clock skew) reads as Today.
    function ageBucket(p) {
      var t = p.proposedAt ? Date.parse(p.proposedAt) : NaN;
      if (isNaN(t)) return 'older';
      var now = new Date();
      var d = new Date(t);
      var startOfDay = function (x) {
        return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      };
      var daysBack = Math.floor((startOfDay(now) - startOfDay(d)) / (24 * 3600 * 1000));
      if (daysBack <= 0) return 'today';
      if (daysBack <= 6) return 'week';
      return 'older';
    }

    // The grouped list: one section per non-empty age group, the group's
    // header followed by its cards in a plain flex column (the same spacing
    // the flat list had). Cards stay direct children of a card container so
    // the first card in a group is still that container's :first-child.
    function groupedInboxHtml(filtered) {
      var buckets = { today: [], week: [], older: [] };
      for (var i = 0; i < filtered.length; i++) buckets[ageBucket(filtered[i])].push(filtered[i]);
      var html = '';
      for (var g = 0; g < AGE_GROUPS.length; g++) {
        var group = AGE_GROUPS[g];
        var items = buckets[group.key];
        if (!items.length) continue;
        html += '<section data-age-group="' + group.key + '" class="flex flex-col gap-3">'
          + '<h2 data-age-header class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">' + group.label + '</h2>'
          + '<div data-age-cards class="flex flex-col gap-3">';
        for (var j = 0; j < items.length; j++) html += proposalCard(items[j]);
        html += '</div></section>';
      }
      return html;
    }

    function renderVotes() {
      if (state.errorVotes) return errorHtml(state.errorVotes);
      if (!state.votes || state.loadingVotes && !state.votes.votes) return skeletons();
      var votes = state.votes.votes || [];
      if (!votes.length) {
        return emptyHtml(
          'No votes yet',
          'Votes you cast in the Inbox show up here with their outcome.',
          BROWSE_CTA);
      }
      // Oldest first reorders the already-loaded rows by their Voted
      // date: ascending, rows without a usable timestamp kept at the end,
      // ties and missing pairs in loaded order (stable). Newest first is
      // the loaded order, which /api/my-votes already returns DESC.
      if (state.votesOrder === 'oldest') {
        votes = votes.slice().sort(function (a, b) {
          var ta = a && a.created_at ? Date.parse(a.created_at) : NaN;
          var tb = b && b.created_at ? Date.parse(b.created_at) : NaN;
          if (isNaN(ta) && isNaN(tb)) return 0;
          if (isNaN(ta)) return 1;
          if (isNaN(tb)) return -1;
          return ta - tb;
        });
      }
      var html = '';
      for (var i = 0; i < votes.length; i++) html += voteRow(votes[i]);
      return html;
    }

    // One-line summary under the header, computed from the loaded inbox
    // list (no extra request): how many proposals are open and how many
    // yes votes they still need in total. Proposals without a known
    // threshold contribute nothing to the needed count.
    function renderSummary() {
      var el = document.getElementById('inbox-summary');
      if (!el) return;
      var proposals = state.inbox && state.inbox.proposals;
      var open = proposals ? proposals.length : 0;
      if (state.tab !== 'inbox' || state.errorInbox || !open) {
        el.hidden = true;
        return;
      }
      var needed = 0;
      for (var i = 0; i < proposals.length; i++) {
        var n = proposals[i].needed;
        if (n != null && n > 0) needed += n;
      }
      el.textContent = open + ' open, ' + needed
        + (needed === 1 ? ' vote needed' : ' votes needed');
      el.hidden = false;
    }

    // One-line summary under the header on the My Votes tab, computed from
    // the loaded history (no extra request): how many votes are recorded
    // and how many of their proposals ended up merged.
    function renderVotesSummary() {
      var el = document.getElementById('votes-summary');
      if (!el) return;
      var votes = state.votes && state.votes.votes;
      var total = votes ? votes.length : 0;
      if (state.tab !== 'votes' || state.errorVotes || !total) {
        el.hidden = true;
        return;
      }
      var merged = 0;
      for (var i = 0; i < votes.length; i++) {
        if (votes[i].status === 'merged') merged++;
      }
      el.textContent = total + ' voted, ' + merged + ' merged';
      el.hidden = false;
    }

    // "Updated X ago" under the header, stamped on every successful inbox
    // load so it always reflects the most recent data fetch. Uses the same
    // relative-time wording as the proposal age chips.
    function renderUpdated() {
      var el = document.getElementById('inbox-updated');
      if (!el) return;
      if (state.tab !== 'inbox' || !state.inboxLoadedAt) {
        el.hidden = true;
        return;
      }
      el.textContent = 'Updated ' + relTime(state.inboxLoadedAt);
      el.hidden = false;
    }

    // Top-level rows that belong to the two-tab list screens only. The
    // compose screen hides them (it has its own header row and controls)
    // and the main render shows them again.
    var MAIN_CHROME_IDS = ['list-controls', 'sort-row', 'votes-order-row',
      'inbox-updated', 'inbox-summary', 'votes-summary', 'demo-banner'];

    function renderCompose() {
      for (var i = 0; i < MAIN_CHROME_IDS.length; i++) {
        var el = document.getElementById(MAIN_CHROME_IDS[i]);
        if (el) el.classList.add('hidden');
      }
      document.getElementById('view').innerHTML = composeHtml();
      if (!state.compose.sentLoaded) loadSent();
      runComposeFixtures();
    }

    function render() {
      if (state.screen === 'compose') { renderCompose(); return; }
      for (var ci = 0; ci < MAIN_CHROME_IDS.length; ci++) {
        var chrome = document.getElementById(MAIN_CHROME_IDS[ci]);
        if (chrome) chrome.classList.remove('hidden');
      }
      syncFilter();
      syncOneAway();
      renderTabs();
      renderSort();
      renderVotesOrder();
      renderDemoBanner();
      renderRefreshButton();
      renderSummary();
      renderUpdated();
      renderVotesSummary();
      document.getElementById('view').innerHTML =
        state.tab === 'inbox' ? renderInbox() : renderVotes();
      enhanceTitles();
    }

    // ------------------------------------------------------------------
    // Compose data + actions
    // ------------------------------------------------------------------

    // The Sent list fills on the compose screen's first render and updates
    // its own container only (a full re-render here would reset the
    // caret in whatever field the user is typing in).
    var sentRequested = false;

    function loadSent() {
      if (sentRequested) return;
      sentRequested = true;
      api('/api/proposals').then(function (data) {
        state.compose.sent = (data && data.proposals) || [];
        state.compose.sentLoaded = true;
        state.compose.sentError = false;
        var list = document.getElementById('sent-list');
        if (list) list.innerHTML = sentListHtml();
      }).catch(function () {
        state.compose.sentLoaded = true;
        state.compose.sentError = true;
        var list = document.getElementById('sent-list');
        if (list) list.innerHTML = sentListHtml();
      });
    }

    function openCompose() {
      state.screen = 'compose';
      state.compose.error = null;
      render();
      window.scrollTo(0, 0);
    }

    function backToMain() {
      state.screen = 'main';
      state.compose.error = null;
      render();
      window.scrollTo(0, 0);
    }

    // Picking a template refills both fields with its prefill. Switching
    // replaces whatever is there: the prefill is a starting point the user
    // edits, not something to merge.
    function pickTemplate(id) {
      var tpl = null;
      for (var i = 0; i < TEMPLATES.length; i++) {
        if (TEMPLATES[i].id === id) tpl = TEMPLATES[i];
      }
      if (!tpl) return;
      state.compose.template = tpl.id;
      state.compose.title = tpl.title;
      state.compose.body = tpl.body;
      state.compose.error = null;
      render();
    }

    function resetComposeForm() {
      state.compose.template = null;
      state.compose.title = '';
      state.compose.body = '';
      state.compose.sending = false;
      state.compose.error = null;
      state.compose.sentTitle = null;
      render();
    }

    // Keep the Send pill's disabled state in step without a re-render
    // (which would steal focus from the field being typed in).
    function updateSendPill() {
      var btn = document.querySelector('[data-send-proposal]');
      if (!btn) return;
      var c = state.compose;
      var ok = !!c.title.trim() && !!c.body.trim() && !c.sending && c.sentTitle == null;
      btn.disabled = !ok;
    }

    // Send records the composed proposal (the platform's app-facing API is
    // read-only, so the app keeps what its users compose here). Client side
    // first: both fields must be non-empty, mirroring the server.
    function sendProposal() {
      var c = state.compose;
      if (c.sending) return;
      var title = c.title.trim();
      var body = c.body.trim();
      if (!title || !body) {
        c.error = !title ? 'A title is required' : 'A description is required';
        render();
        return;
      }
      c.sending = true;
      c.error = null;
      render();
      api('/api/proposals', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ template: c.template || 'blank', title: title, body: body }),
      }).then(function (data) {
        c.sending = false;
        var row = data && data.proposal;
        c.sent = [{
          id: row ? row.id : null,
          template: row ? row.template : (c.template || 'blank'),
          title: title,
          created_at: row ? row.created_at : null,
        }].concat(c.sent || []);
        c.sentLoaded = true;
        c.sentError = false;
        c.sentTitle = title;
        render();
      }).catch(function (err) {
        c.sending = false;
        c.error = err && err.message ? err.message : 'Sending failed. Try again.';
        render();
      });
    }

    // ------------------------------------------------------------------
    // Compose check fixtures: replay one user path through the real
    // controls, the way ?tap-no=1 votes through the real vote button.
    // Demo only; runs once, at the first compose render.
    // ------------------------------------------------------------------

    var composeFixturesRan = false;

    function tapTemplateChip(id) {
      var chip = document.querySelector(
        '[data-template-option][data-template-id="' + id + '"]');
      if (!chip) return;
      chip.click(); // the real chip, through the real delegated handler
    }

    // Type into a field the way typing would: set the value, then fire the
    // input event the real keyboard produces, so state and the derived
    // bits (value mirror, counter, Send pill) update through the real path.
    function typeIntoField(el, value) {
      if (!el) return;
      el.value = value;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function runComposeFixtures() {
      if (composeFixturesRan) return;
      composeFixturesRan = true;
      if (state.screen !== 'compose' || state.compose.sentTitle != null) return;
      // Switching fixture: land on Bugfix first so there is a prefill to
      // switch away from.
      if (COMPOSE_SWITCH) tapTemplateChip('bugfix');
      if (COMPOSE_TEMPLATE) tapTemplateChip(COMPOSE_TEMPLATE);
      if (COMPOSE_TITLE) typeIntoField(document.getElementById('compose-title'), COMPOSE_TITLE);
      if (COMPOSE_BODY) typeIntoField(document.getElementById('compose-body'), COMPOSE_BODY);
      if (COMPOSE_SWITCH) tapTemplateChip(COMPOSE_SWITCH);
      if (COMPOSE_SEND) {
        var sendBtn = document.querySelector('[data-send-proposal]');
        // An empty form leaves Send disabled and does nothing here; the
        // checks use that to pin the disabled state.
        if (sendBtn && !sendBtn.disabled) sendBtn.click();
      }
      if (COMPOSE_BACK) {
        var backBtn = document.querySelector('[data-compose-back]');
        if (backBtn) backBtn.click();
      }
    }

    // ------------------------------------------------------------------
    // Data
    // ------------------------------------------------------------------

    // ------------------------------------------------------------------
    // App filter: trigger + searchable dropdown list.
    // ------------------------------------------------------------------

    var filterTrigger = document.getElementById('app-filter-trigger');
    var filterPanelEl = document.getElementById('app-filter-panel');
    var openFilter = null; // { dismiss } from the native kit, or a plain fallback

    function filterApps() {
      return (state.inbox && state.inbox.apps) || [];
    }

    // Per-app open counts for the filter list, tallied from the loaded
    // inbox proposals (no extra request). Counts every loaded proposal,
    // regardless of the current filter or the Hide voted switch: voted
    // proposals are still open.
    function filterCounts() {
      var counts = {};
      var proposals = (state.inbox && state.inbox.proposals) || [];
      for (var i = 0; i < proposals.length; i++) {
        var slug = proposals[i].appSlug;
        counts[slug] = (counts[slug] || 0) + 1;
      }
      return counts;
    }

    function findFilterApp(slug) {
      var apps = filterApps();
      for (var i = 0; i < apps.length; i++) {
        if (apps[i].slug === slug) return apps[i];
      }
      return null;
    }

    // Keep the trigger label in step with state.filter; drop a filter whose
    // app is no longer in the inbox (the old select did the same on fill).
    // Validation waits for inbox data: mid-refresh (state.inbox null) the
    // chosen filter survives, as it did before.
    function syncFilter() {
      var app = state.filter ? findFilterApp(state.filter) : null;
      if (state.filter && state.inbox && !app) {
        state.filter = '';
        state.filterName = '';
      } else if (state.filter && !app) {
        app = { name: state.filterName || state.filter };
      }
      document.getElementById('app-filter-label').textContent = app ? app.name : 'All apps';
      filterTrigger.className = app ? FILTER_TRIGGER_ACTIVE : FILTER_TRIGGER_IDLE;
      filterTrigger.setAttribute('aria-expanded', openFilter ? 'true' : 'false');
    }

    // Keep the chip's look in step with state.oneAway: same idle/active
    // colours as the app filter trigger, plus aria-pressed for the toggle.
    var oneAwayChip = document.getElementById('one-away-chip');

    function syncOneAway() {
      if (!oneAwayChip) return;
      oneAwayChip.className = state.oneAway ? ONE_AWAY_ACTIVE : ONE_AWAY_IDLE;
      oneAwayChip.setAttribute('aria-pressed', state.oneAway ? 'true' : 'false');
    }

    function filterRowEl(app, selected, count) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('role', 'option');
      btn.setAttribute('aria-selected', selected ? 'true' : 'false');
      btn.setAttribute('data-app-option', app ? app.slug : '');
      btn.className = 'flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-sm '
        + (selected
          ? 'bg-violet-600/10 font-semibold text-violet-700 dark:bg-violet-500/20 dark:text-violet-300'
          : 'text-zinc-700 hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800');
      if (app) {
        btn.innerHTML = appAvatar({ appSlug: app.slug, appName: app.name, icon: app.icon })
          + '<span class="min-w-0 flex-1 truncate">' + esc(app.name) + '</span>'
          // Muted count of the app's loaded proposals; font-normal and the
          // zinc colour keep it quiet on the selected (semibold, violet) row.
          + (count > 0
            ? '<span data-app-count class="shrink-0 text-xs font-normal tabular-nums text-zinc-500 dark:text-zinc-400">('
              + count + ')</span>'
            : '')
          + (selected ? FILTER_CHECK : '');
      } else {
        btn.innerHTML = FILTER_ALL_ICON
          + '<span class="min-w-0 flex-1 truncate">All apps</span>'
          + (selected ? FILTER_CHECK : '');
      }
      return btn;
    }

    // The dropdown body: a small search box on top, then the app list. The
    // search narrows the list by case-insensitive substring on the app name;
    // empty input shows the full list, "All apps" first.
    function buildFilterContent() {
      var content = document.createElement('div');
      content.setAttribute('data-app-filter-panel', '');
      content.className = 'flex flex-col';

      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Search apps';
      input.setAttribute('aria-label', 'Search apps');
      input.autocomplete = 'off';
      input.className = 'w-full border-b border-zinc-200 bg-transparent px-3 py-2.5 text-sm text-zinc-800 placeholder:text-zinc-400 focus:outline-none dark:border-zinc-700 dark:text-zinc-100 dark:placeholder:text-zinc-500';
      content.appendChild(input);

      var list = document.createElement('div');
      list.setAttribute('role', 'listbox');
      list.setAttribute('aria-label', 'Apps');
      list.className = 'max-h-60 overflow-y-auto p-1';
      content.appendChild(list);

      function renderList() {
        var query = input.value.trim().toLowerCase();
        var apps = filterApps();
        var counts = filterCounts();
        list.innerHTML = '';
        var shown = 0;
        if (!query) list.appendChild(filterRowEl(null, state.filter === ''));
        for (var i = 0; i < apps.length; i++) {
          if (query && apps[i].name.toLowerCase().indexOf(query) === -1) continue;
          list.appendChild(filterRowEl(apps[i], apps[i].slug === state.filter, counts[apps[i].slug] || 0));
          shown++;
        }
        if (query && !shown) {
          var empty = document.createElement('div');
          empty.className = 'px-3 py-4 text-center text-xs text-zinc-500 dark:text-zinc-400';
          empty.textContent = 'No apps match';
          list.appendChild(empty);
        }
      }

      content.addEventListener('click', function (event) {
        var btn = event.target.closest ? event.target.closest('[data-app-option]') : null;
        if (!btn) return;
        var slug = btn.getAttribute('data-app-option');
        pickFilter(slug ? findFilterApp(slug) : null);
      });
      input.addEventListener('input', renderList);
      renderList();
      return content;
    }

    function onDocClickClose(event) {
      if (!openFilter) return;
      if (filterPanelEl.contains(event.target) || filterTrigger.contains(event.target)) return;
      closeFilter();
    }

    function onFilterKeydown(event) {
      if (event.key === 'Escape') closeFilter();
    }

    function closeFilter() {
      if (!openFilter) return;
      var f = openFilter;
      openFilter = null;
      filterTrigger.setAttribute('aria-expanded', 'false');
      if (f.dismiss) {
        try { f.dismiss(); } catch (e) { /* already gone */ }
      } else {
        filterPanelEl.className = 'hidden';
        filterPanelEl.innerHTML = '';
        document.removeEventListener('click', onDocClickClose);
        document.removeEventListener('keydown', onFilterKeydown);
      }
    }

    function openAppFilter() {
      if (openFilter) return;
      var content = buildFilterContent();
      // Width is set before presentation: the kit measures the content to
      // place and size the popover.
      content.className = 'flex w-72 max-w-full flex-col';
      if (window.unNative && unNative.popover) {
        var handle = null;
        try {
          handle = unNative.popover({
            anchorEl: filterTrigger,
            contentEl: content,
            placement: 'bottom-start',
            onDismiss: function () { openFilter = null; syncFilter(); },
          });
        } catch (e) { handle = null; }
        if (handle) {
          openFilter = handle;
          filterTrigger.setAttribute('aria-expanded', 'true');
          requestAnimationFrame(function () {
            var input = content.querySelector('input');
            if (input) input.focus();
          });
          return;
        }
      }
      // Fallback (kit unavailable, e.g. standalone): a plain panel under the
      // trigger with the same content.
      content.className = 'flex w-full flex-col';
      filterPanelEl.innerHTML = '';
      filterPanelEl.appendChild(content);
      filterPanelEl.className = 'absolute left-0 right-0 top-full z-30 mt-2 overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-lg dark:border-zinc-800 dark:bg-zinc-900';
      openFilter = { fallback: true };
      filterTrigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', onDocClickClose);
      document.addEventListener('keydown', onFilterKeydown);
      content.querySelector('input').focus();
    }

    function pickFilter(app) {
      state.filter = app ? app.slug : '';
      state.filterName = app ? app.name : '';
      saveFilter(app ? { slug: state.filter, name: state.filterName } : null);
      closeFilter();
      render();
    }


    // Demo fixtures carry an anchor hint (days back from today; for day 0 how
    // many hours ago, plus a floor in minutes past local midnight). Recompute
    // proposedAt against the viewer's own calendar so "Today" and "This week"
    // hold no matter what hour the page is opened at: a sub-day fixture served
    // just after local midnight would otherwise land on yesterday's calendar
    // day and vanish from the Today group. Day-N rows are pinned to hour 12
    // local so their "Xd ago" reading stays exactly N days.
    function reanchorDemo(data) {
      if (!data || !data.demo) return;
      var now = new Date();
      var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      (data.proposals || []).forEach(function (p) {
        var a = p.demoAnchor;
        if (!a) return;
        var t;
        if (a.days === 0) {
          t = now.getTime() - (a.hoursAgo || 0) * 3600000;
          if (a.clampMin && t < midnight + a.clampMin * 60000) {
            t = midnight + a.clampMin * 60000;
          }
        } else {
          t = new Date(now.getFullYear(), now.getMonth(), now.getDate() - a.days, 12).getTime();
        }
        p.proposedAt = new Date(t).toISOString();
      });
    }

    function loadInbox(force) {
      if (state.loadingInbox) {
        // A pull or Refresh tap while a load is still in flight must still
        // end in a fresh fetch, not a silent no-op: queue one behind it.
        if (force) state.queuedInbox = true;
        return Promise.resolve();
      }
      state.loadingInbox = true;
      state.errorInbox = null;
      if (force) state.inbox = null;
      render();
      var query = [];
      if (DEMO) query.push('demo=1');
      if (ALL_VOTED) query.push('allvoted=1');
      if (ALL_MERGED) query.push('allmerged=1');
      return api('/api/inbox' + (query.length ? '?' + query.join('&') : ''))
        .then(function (data) {
          state.inbox = data;
          if (data.demo) reanchorDemo(data);
          state.inboxLoadedAt = new Date().toISOString();
          reapplyRetryQueue();
          maybeAutoCast();
          maybeAutoExpand();
        })
        .catch(function (err) {
          state.errorInbox = err.message || 'Could not load proposals.';
        })
        .then(function () {
          state.loadingInbox = false;
          render();
          maybeAutoOpenFilter();
          maybeTapNo();
          maybeTapShare();
          if (state.queuedInbox) {
            state.queuedInbox = false;
            loadInbox(true);
          }
        });
    }

    function loadVotes(force) {
      if (state.loadingVotes) {
        // Same as loadInbox: a pull while the tab-switch fetch is still
        // running queues one fresh refetch instead of doing nothing.
        if (force) state.queuedVotes = true;
        return Promise.resolve();
      }
      state.loadingVotes = true;
      state.errorVotes = null;
      if (force) state.votes = null;
      render();
      return api('/api/my-votes' + (DEMO ? '?demo=1' : ''))
        .then(function (data) { state.votes = data; })
        .catch(function (err) {
          state.errorVotes = err.message || 'Could not load your votes.';
        })
        .then(function () {
          state.loadingVotes = false;
          render();
          if (state.queuedVotes) {
            state.queuedVotes = false;
            loadVotes(true);
          }
        });
    }

    function refreshCurrent() {
      return state.tab === 'inbox' ? loadInbox(true) : loadVotes(true);
    }

    // ------------------------------------------------------------------
    // Voting
    // ------------------------------------------------------------------

    function findProposal(sessionId) {
      var proposals = (state.inbox && state.inbox.proposals) || [];
      for (var i = 0; i < proposals.length; i++) {
        if (proposals[i].sessionId === sessionId) return proposals[i];
      }
      return null;
    }

    // Classify a failed vote request. "Offline" means the request never got
    // an HTTP answer: the browser reports the device offline, or the fetch
    // itself rejected (an error carrying no HTTP .status — airplane mode,
    // no connection, the request never leaving the page). A refusal the
    // server DID send (4xx/5xx) is not an offline failure and rolls back
    // exactly as before.
    function isOfflineFailure(err) {
      if (navigator.onLine === false) return true;
      return !err || typeof err.status !== 'number';
    }

    // ?failvote=1 simulation: reject exactly the way a fetch does when the
    // device is offline — no HTTP status at all.
    function simulatedOfflineError() {
      var err = new Error('Failed to fetch');
      err.name = 'TypeError';
      return err;
    }

    function votePayload(sessionId, choice, p, snapshot) {
      return {
        sessionId: sessionId,
        choice: choice,
        appSlug: p.appSlug,
        appName: p.appName,
        title: p.title,
        proposalId: p.proposalId,
        yes: snapshot.yes,
        no: snapshot.no,
        required: p.required,
        demo: !!(state.inbox && state.inbox.demo),
      };
    }

    function castVote(sessionId, choice) {
      var p = findProposal(sessionId);
      if (!p || state.pending[sessionId]) return;
      var snapshot = { myVote: p.myVote, yes: p.yes, no: p.no };
      state.pending[sessionId] = true;
      // Optimistic: show the vote immediately, roll back on failure.
      p.myVote = choice;
      if (choice === 'yes') p.yes += 1; else p.no += 1;
      render();
      var payload = votePayload(sessionId, choice, p, snapshot);
      var request;
      if (FAILVOTE && state.inbox && state.inbox.demo) {
        // Demo fixture only: one simulated offline failure per load.
        FAILVOTE = false;
        request = Promise.reject(simulatedOfflineError());
      } else {
        request = api('/api/vote', {
          method: 'POST',
          headers: headers({ 'content-type': 'application/json' }),
          body: JSON.stringify(payload),
        });
      }
      request.then(function () {
        state.votes = null; // history refetches next time the tab opens
        toast('Vote recorded', {
          duration: 5000,
          action: {
            label: 'Undo',
            handler: function () { undoVote(sessionId, choice, snapshot); },
          },
        });
      }).catch(function (err) {
        if (isOfflineFailure(err)) {
          // Offline: keep the card marked and queue an in-memory retry.
          // The vote never reached the platform, so My Votes stays without
          // it until a retry succeeds.
          state.retryQueue[sessionId] = { choice: choice, payload: payload, snapshot: snapshot };
          toast('Vote not sent: you seem offline. Tap Retry on the card.');
        } else {
          p.myVote = snapshot.myVote;
          p.yes = snapshot.yes;
          p.no = snapshot.no;
          toast('Vote failed: ' + (err.message || 'try again'));
        }
      }).then(function () {
        delete state.pending[sessionId];
        render();
      });
    }

    // Retry a vote that failed offline: resend the exact same request. On
    // success the card's optimistic state is now the platform's truth, the
    // pill goes away and My Votes refetches. Still offline: the card stays
    // marked and queued. A server refusal (the platform answered and said
    // no) rolls the card back like any other failed vote.
    function retryVote(sessionId) {
      var entry = state.retryQueue[sessionId];
      var p = findProposal(sessionId);
      if (!entry || !p || state.pending[sessionId]) return;
      state.pending[sessionId] = true;
      render();
      api('/api/vote', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify(entry.payload),
      }).then(function () {
        delete state.retryQueue[sessionId];
        state.votes = null; // history refetches next time the tab opens
        toast('Vote recorded', {
          duration: 5000,
          action: {
            label: 'Undo',
            handler: function () { undoVote(sessionId, entry.choice, entry.snapshot); },
          },
        });
      }).catch(function (err) {
        if (isOfflineFailure(err)) {
          toast('Still offline. Your vote stays on the card to retry.');
        } else {
          delete state.retryQueue[sessionId];
          p.myVote = entry.snapshot.myVote;
          p.yes = entry.snapshot.yes;
          p.no = entry.snapshot.no;
          toast('Vote failed: ' + (err.message || 'try again'));
        }
      }).then(function () {
        delete state.pending[sessionId];
        render();
      });
    }

    // Reapply the in-memory retry queue to a freshly loaded inbox: a card
    // whose vote never reached the platform stays marked voted, with its
    // optimistic count restored, until a retry succeeds. Entries whose
    // proposal is no longer listed are dropped: there is no card left to
    // retry them on.
    function reapplyRetryQueue() {
      for (var sessionId in state.retryQueue) {
        var entry = state.retryQueue[sessionId];
        var p = findProposal(sessionId);
        if (!p) { delete state.retryQueue[sessionId]; continue; }
        p.myVote = entry.choice;
        if (entry.choice === 'yes') p.yes += 1; else p.no += 1;
      }
    }

    // Undo a just-cast vote: drop this app's record of it and roll the card
    // back to its pre-vote counts so the user can vote again. The platform's
    // own tally stays authoritative and is refetched on the next inbox load.
    function undoVote(sessionId, choice, snapshot) {
      var p = findProposal(sessionId);
      api('/api/unvote', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ sessionId: sessionId }),
      }).then(function () {
        if (p && p.myVote === choice) {
          p.myVote = snapshot.myVote;
          p.yes = snapshot.yes;
          p.no = snapshot.no;
        }
        state.votes = null; // history refetches next time the tab opens
        toast('Vote undone');
      }).catch(function (err) {
        toast('Undo failed: ' + (err.message || 'try again'));
      }).then(render);
    }

    // Confirm before a No vote: rejecting is the direction worth a second
    // look (it can sink a proposal), so the card's "No" button opens a small
    // confirm first; "Yes" stays one-tap. The native kit's alert carries the
    // dialog where it is available (native styling, keyboard avoidance);
    // standalone or kit-less loads get a plain in-app dialog with the same
    // two answers. The kit both invokes the button's handler and resolves
    // its promise, so confirmNo guards against casting twice.
    function openNoConfirm(sessionId) {
      var p = findProposal(sessionId);
      if (!p) return;
      var title = 'Reject this proposal?';
      var message = 'Your No vote on "' + p.title + '" will be recorded right away.';
      var confirmed = false;
      var confirmNo = function () {
        if (confirmed) return;
        confirmed = true;
        castVote(sessionId, 'no');
      };
      if (window.unNative && unNative.alert) {
        try {
          var answered = unNative.alert({
            title: title,
            message: message,
            buttons: [
              { label: 'No, reject', style: 'destructive', handler: confirmNo },
              { label: 'Cancel', style: 'cancel' },
            ],
          });
          if (answered && typeof answered.then === 'function') {
            answered.then(function (res) {
              var label = res && res.button;
              if (label && typeof label === 'object') label = label.label;
              if (label === 'No, reject') confirmNo();
            }).catch(function () { /* dismissed; nothing to cast */ });
          }
          return;
        } catch (e) { /* fall through to the plain dialog */ }
      }
      fallbackNoConfirm(title, message, confirmNo);
    }

    // Plain in-app confirm for loads without the native kit. Same two
    // answers, same wording; the backdrop tap and Cancel both dismiss.
    function fallbackNoConfirm(title, message, confirmNo) {
      var overlay = document.createElement('div');
      overlay.setAttribute('data-no-confirm', '');
      overlay.setAttribute('role', 'alertdialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', title);
      overlay.className = 'fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-6';
      overlay.innerHTML = '<div class="w-64 rounded-2xl bg-white p-4 text-center shadow-xl dark:bg-zinc-900">'
        + '<p class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + esc(title) + '</p>'
        + '<p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">' + esc(message) + '</p>'
        + '<div class="mt-3 flex flex-col gap-2">'
        + '<button data-no-confirm-reject class="min-h-9 rounded-xl bg-red-600 py-2 text-sm font-semibold text-white active:scale-95">No, reject</button>'
        + '<button data-no-confirm-cancel class="min-h-9 rounded-xl bg-zinc-100 py-2 text-sm font-semibold text-zinc-700 active:scale-95 dark:bg-zinc-800 dark:text-zinc-200">Cancel</button>'
        + '</div></div>';
      var close = function () {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      };
      overlay.addEventListener('click', function (event) {
        if (event.target.closest('[data-no-confirm-reject]')) { close(); confirmNo(); }
        else if (event.target.closest('[data-no-confirm-cancel]') || event.target === overlay) close();
      });
      document.body.appendChild(overlay);
    }

    // First button whose visible text matches exactly, whatever surface
    // rendered it (kit alert or fallback dialog). Used by the staging tap
    // hook below to press the dialog's answer.
    function findButtonByText(text) {
      var buttons = document.querySelectorAll('button');
      for (var i = 0; i < buttons.length; i++) {
        if (buttons[i].textContent.trim() === text) return buttons[i];
      }
      return null;
    }

    // Staging demo hook: ?demo=1&tap-share=<sessionId> clicks that card's
    // share button once the demo inbox has rendered — the real button,
    // through the real delegated click handler — so the copy confirmation
    // is reachable by a check (pair it with &share=copy so the copy path
    // is deterministic in the check browser). Demo only; one-shot.
    var tapShareDone = false;
    function maybeTapShare() {
      if (!DEMO || !TAP_SHARE || tapShareDone) return;
      tapShareDone = true;
      var btn = document.querySelector(
        '[data-proposal-card][data-session-id="' + TAP_SHARE + '"] [data-share-link]');
      if (!btn) return;
      btn.click();
    }

    // Staging demo hook: ?demo=1&tap-no=1 clicks the demo-4 card's "No"
    // button once the demo inbox has rendered — the real button, through the
    // real delegated click handler — so the confirm-before-No dialog is
    // reachable by a check. ?confirm-no=1 then presses "No, reject" in the
    // dialog that opens, casting the vote for real through the demo-mode
    // POST. Any earlier demo vote on demo-4 is cleared first so repeated
    // check runs always reach the dialog. Demo only.
    var TAP_NO_SESSION = 'demo-4';
    var tapNoDone = false;
    function maybeTapNo() {
      if (!DEMO || !TAP_NO || tapNoDone) return;
      tapNoDone = true;
      var p = findProposal(TAP_NO_SESSION);
      if (!p) return;
      api('/api/unvote', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ sessionId: TAP_NO_SESSION }),
      }).catch(function () {}).then(function () {
        p.myVote = null;
        render();
        var buttons = document.querySelectorAll('[data-vote="no"]');
        for (var i = 0; i < buttons.length; i++) {
          if (buttons[i].getAttribute('data-session') === TAP_NO_SESSION) {
            buttons[i].click();
            break;
          }
        }
        if (!CONFIRM_NO) return;
        var tries = 0;
        var timer = setInterval(function () {
          var confirmBtn = findButtonByText('No, reject');
          if (confirmBtn) {
            clearInterval(timer);
            confirmBtn.click();
          } else if (++tries > 40) {
            clearInterval(timer);
          }
        }, 100);
      });
    }

    // Staging demo hook: ?demo=1&cast=<sessionId>:<choice> casts one vote
    // automatically once the demo inbox is loaded, giving checks and
    // reviewers a stable URL for the vote → toast → Undo flow. Demo only.
    // Any earlier demo vote on that session is cleared first so repeated
    // loads (and repeated check runs) always reach the toast.
    function maybeAutoCast() {
      if (!DEMO) return;
      var m = (params.get('cast') || '').match(/^(.+):(yes|no)$/);
      if (!m) return;
      var p = findProposal(m[1]);
      if (!p) return;
      api('/api/unvote', {
        method: 'POST',
        headers: headers({ 'content-type': 'application/json' }),
        body: JSON.stringify({ sessionId: m[1] }),
      }).catch(function () {})
        .then(function () {
          p.myVote = null;
          castVote(m[1], m[2]);
        });
    }

    // Staging check fixture: ?demo=1&openfilter=1 opens the app filter
    // dropdown automatically once the demo inbox has loaded, so a check can
    // assert on the app list (and its counts) without clicking. Demo only;
    // one-shot, and only when the inbox loaded without error.
    var openFilterSet = OPEN_FILTER;
    function maybeAutoOpenFilter() {
      if (!openFilterSet) return;
      if (!DEMO || !OPEN_FILTER || state.errorInbox || !state.inbox) return;
      openFilterSet = false;
      openAppFilter();
    }

    // Staging demo hook: ?demo=1&expand=<sessionId> expands one proposal's
    // clamped title automatically once the demo inbox is loaded, the same
    // trick ?cast= uses for the vote flow: it gives the checks (which read
    // the page but cannot tap) and reviewers a stable URL for the expanded
    // More/Less state. Demo only; a session id not in the list does nothing.
    function maybeAutoExpand() {
      if (!DEMO) return;
      var id = params.get('expand');
      if (!id) return;
      if (!findProposal(id)) return;
      state.expandedTitles[String(id)] = true;
    }

    // ------------------------------------------------------------------
    // Events
    // ------------------------------------------------------------------

    document.getElementById('view').addEventListener('click', function (event) {
      var target = event.target;
      // Compose screen controls first: template chips, the Send pill, the
      // back chevron and the post-send reset.
      var tplChip = target.closest ? target.closest('[data-template-option]') : null;
      if (tplChip) {
        pickTemplate(tplChip.getAttribute('data-template-id'));
        return;
      }
      if (target.closest && target.closest('[data-send-proposal]')) {
        sendProposal();
        return;
      }
      if (target.closest && target.closest('[data-compose-back]')) {
        backToMain();
        return;
      }
      if (target.closest && target.closest('[data-compose-again]')) {
        resetComposeForm();
        return;
      }
      var actionEl = target.closest ? target.closest('[data-action]') : null;
      if (actionEl) {
        var action = actionEl.getAttribute('data-action');
        if (action === 'refresh') refreshCurrent();
        else if (action === 'reload-sent') {
          state.compose.sentError = false;
          state.compose.sentLoaded = false;
          sentRequested = false;
          render();
          loadSent();
        }
        else if (action === 'clear-filter') {
          state.filter = '';
          state.filterName = '';
          saveFilter(null);
          render();
        } else if (action === 'clear-one-away') {
          state.oneAway = false;
          render();
        } else if (action === 'show-voted') {
          setHideVoted(false);
        } else if (action === 'show-merged') {
          setHideMerged(false);
        } else if (action === 'clear-search') {
          state.search = '';
          var box = document.getElementById('inbox-search');
          if (box) box.value = '';
          render();
        } else if (action === 'go-inbox') {
          state.tab = 'inbox';
          render();
          // Land at the top of the list so the pull-to-refresh gesture can
          // engage right away; the pull only fires at scroll offset 0.
          window.scrollTo(0, 0);
          loadInbox(!state.inbox);
        }
        return;
      }
      var titleBtn = target.closest ? target.closest('[data-title-toggle]') : null;
      if (titleBtn) {
        toggleTitle(titleBtn);
        return;
      }
      var voteBtn = target.closest ? target.closest('[data-vote]') : null;
      if (voteBtn) {
        var voteSession = voteBtn.getAttribute('data-session');
        var voteChoice = voteBtn.getAttribute('data-vote');
        // "No" asks first; "Yes" stays one-tap.
        if (voteChoice === 'no') openNoConfirm(voteSession);
        else castVote(voteSession, voteChoice);
      }
      var retryBtn = target.closest ? target.closest('[data-retry-vote]') : null;
      if (retryBtn) retryVote(retryBtn.getAttribute('data-session'));
      var copyBtn = target.closest ? target.closest('[data-share-link]') : null;
      if (copyBtn) shareProposalLink(copyBtn);
    });

    // Compose fields: keep state and the derived bits in step without a
    // re-render (which would steal focus from the field being typed in).
    // The title's value attribute is mirrored so the checks, which read
    // markup, can assert on an edit; the description's character counter
    // carries its state the same way.
    document.getElementById('view').addEventListener('input', function (event) {
      if (state.screen !== 'compose') return;
      var t = event.target;
      if (t.matches && t.matches('#compose-title')) {
        state.compose.title = t.value;
        t.setAttribute('value', t.value);
        updateSendPill();
      } else if (t.matches && t.matches('#compose-body')) {
        state.compose.body = t.value;
        var count = document.querySelector('[data-compose-count]');
        if (count) count.textContent = t.value.length + ' characters';
        updateSendPill();
      }
    });

    document.getElementById('new-proposal-btn').addEventListener('click', function () {
      openCompose();
    });

    filterTrigger.addEventListener('click', function () {
      if (openFilter) closeFilter(); else openAppFilter();
    });

    if (oneAwayChip) {
      oneAwayChip.addEventListener('click', function () {
        state.oneAway = !state.oneAway;
        render();
      });
    }

    document.getElementById('hide-voted').addEventListener('change', function (event) {
      setHideVoted(event.target.checked);
    });

    document.getElementById('hide-merged').addEventListener('change', function (event) {
      setHideMerged(event.target.checked);
    });

    // Title search filters the loaded cards live; the input sits outside
    // #view so re-rendering the list never steals its focus.
    document.getElementById('inbox-search').addEventListener('input', function (event) {
      state.search = event.target.value;
      render();
    });

    var sortButtons = document.querySelectorAll('#sort-row [data-sort]');
    for (var si = 0; si < sortButtons.length; si++) {
      sortButtons[si].addEventListener('click', function (event) {
        setSort(event.currentTarget.getAttribute('data-sort'));
      });
    }

    var votesOrderButtons = document.querySelectorAll('#votes-order-row [data-votes-order]');
    for (var vo = 0; vo < votesOrderButtons.length; vo++) {
      votesOrderButtons[vo].addEventListener('click', function (event) {
        setVotesOrder(event.currentTarget.getAttribute('data-votes-order'));
      });
    }

    document.getElementById('refresh-btn').addEventListener('click', function () {
      refreshCurrent();
    });

    var tabButtons = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabButtons.length; i++) {
      tabButtons[i].addEventListener('click', function (event) {
        var tab = event.currentTarget.getAttribute('data-tab');
        if (tab === state.tab) return;
        state.tab = tab;
        var url = new URL(location.href);
        url.searchParams.set('tab', tab);
        history.replaceState(null, '', url.pathname + url.search + url.hash);
        render();
        // Land at the top of the newly opened tab so the pull-to-refresh
        // gesture can engage right away; the pull only fires at offset 0,
        // and a tab switch used to keep the previous tab's scroll offset.
        window.scrollTo(0, 0);
        if (tab === 'votes') loadVotes(!state.votes);
      });
    }

    // Pull down on the list to refresh (native kit; no-op on desktop).
    if (window.unNative && unNative.attachPullToRefresh) {
      try {
        unNative.attachPullToRefresh(window, function () { return refreshCurrent(); });
      } catch (e) { /* kit unavailable; the Refresh button still works */ }
    }

    // ------------------------------------------------------------------
    // Boot: render the shell instantly, then fetch the active tab's data.
    // ------------------------------------------------------------------

    render();
    var hideVotedBox = document.getElementById('hide-voted');
    if (hideVotedBox) hideVotedBox.checked = state.hideVoted;
    var hideMergedBox = document.getElementById('hide-merged');
    if (hideMergedBox) hideMergedBox.checked = state.hideMerged;
    var searchBox = document.getElementById('inbox-search');
    if (searchBox && state.search) searchBox.value = state.search;
    if (state.tab === 'votes') loadVotes(true); else loadInbox(true);
  })();
  </script>
</body>
</html>
