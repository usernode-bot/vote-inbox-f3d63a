        return;
      }
      var text = state.celebrations.map(function (c) {
        return c.title + ' on ' + (c.appName || c.appSlug) + ' merged. You voted '
          + (c.choice === 'no' ? 'no' : 'yes') + '.';
      }).join(' ');
      if (el.textContent !== text) el.textContent = text;
    }

    // Dismiss one celebration card: it leaves the inbox at once and the row
    // is marked dismissed server-side, so the proposal never celebrates
    // again. A failed POST (an offline device) puts the card back.
    function dismissCelebration(sessionId) {
      var kept = state.celebrations;
      state.celebrations = kept.filter(function (c) {
        return String(c.sessionId) !== String(sessionId);
      });
      render();
      state.celebDismissPromise = api('/api/celebrations/dismiss', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId: sessionId }),
      }).catch(function () {
        state.celebrations = kept;
        render();
        toast('Could not dismiss. Try again.');
      });
      return state.celebDismissPromise;
    }

    // The celebration card's "See what merged" link: My Votes, filtered to
    // proposals that merged this week — the same seven-day span the cards
    // celebrate. The filter is a real deep link (?votes-merged=1), so the
    // state lands in the URL and a reload keeps it.
    function seeWhatMerged() {
      state.tab = 'votes';
      state.votesMergedWeek = true;
      state.compareView = false;
      var url = new URL(location.href);
      url.searchParams.set('tab', 'votes');
      url.searchParams.set('votes-merged', '1');
      history.replaceState(null, '', url.pathname + url.search + url.hash);
      render();
      window.scrollTo(0, 0);
      loadVotes(!state.votes);
    }

    // ?celeb-reload=1: once the cards have rendered and the shown-mark has
    // landed, reload a clean ?demo=1&celeb=1 URL so a check can observe that
    // a shown celebration does not come back.
    function maybeCelebrationReload() {
      if (!DEMO || !CELEB_RELOAD) return;
      var settle = function () {
        var url = new URL(location.href);
        // The marker page reads the persisted state back: drop the fixture
        // knobs (including celeb-clear, so the reload cannot wipe the very
        // rows it is checking) and keep only the ?celeb=1 opt-in.
        url.searchParams.delete('celebvote');
        url.searchParams.delete('celeb-clear');
        url.searchParams.delete('celeb-reload');
        location.replace(url.toString());
      };
      Promise.resolve(state.celebShownPromise).then(settle, settle);
    }

    // ?celeb-tap-dismiss=<id>: tap that card's Dismiss button once it has
    // rendered (the real button, through the real delegated click handler).
    var celebDismissDone = false;
    function maybeCelebrationDismiss() {
      if (!DEMO || !CELEB_TAP_DISMISS || celebDismissDone) return;
      if (state.errorInbox || !state.inbox) return;
      waitFor(
        '[data-celebration][data-session-id="' + CELEB_TAP_DISMISS + '"]'
        + ' [data-action="dismiss-celebration"]',
        function (btn) {
          celebDismissDone = true;
          btn.click();
        });
    }

    // ?celeb-tap-see=1: tap the celebration card's "See what merged" link
    // once it has rendered, so the check walks the real path to the My
    // Votes "merged this week" filter.
    function maybeCelebrationSeeMerged() {
      if (!DEMO || !CELEB_TAP_SEE) return;
      if (state.errorInbox || !state.inbox) return;
      waitFor('[data-action="see-merged"]', function (btn) { btn.click(); });
    }

    // One Watchlist row: the app name, the proposal title, the row's current
    // status pill and — when the status differs from the one recorded at the
    // last look — an amber "New: <status>" change badge. The star button is
    // pressed here; tapping it unstars and drops the row.
    function watchRow(r) {
      var key = r.status === 'proposed' ? 'voting' : (r.status || 'voting');
      var style = STATUS_STYLE[key] || STATUS_STYLE.closed;
      var changeHtml = '';
      if (r.changed) {
        var label = WATCH_CHANGE_LABEL[key] || ('New: ' + style[0]);
        changeHtml = '<span data-watch-change="' + esc(key) + '" class="' + WATCH_CHANGE_CLASS + '">'
          + esc(label) + '</span>';
      }
      var starredDate = '';
      if (r.starredAt && isFinite(new Date(r.starredAt).getTime())) {
        starredDate = new Date(r.starredAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }
      return '<article data-watch-row data-session-id="' + esc(r.sessionId) + '"'
        + ' data-watch-status="' + esc(key) + '"'
        + ' class="' + CARD_CLASS + '">'
        + '<div class="flex items-start justify-between gap-2">'
        + '<span class="flex min-w-0 items-center gap-1.5">'
        + appAvatar({ appSlug: r.appSlug, appName: r.appName, icon: r.icon })
        + '<span class="truncate text-xs font-medium text-zinc-500 dark:text-zinc-400">' + esc(r.appName || r.appSlug) + '</span>'
        + '</span>'
        + changeHtml
        + '<span class="whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-semibold ' + style[1] + '">' + style[0] + '</span>'
        + '</div>'
        + '<h2 class="line-clamp-2 text-sm font-semibold leading-snug text-zinc-900 dark:text-zinc-100">' + esc(r.title) + '</h2>'
        + '<div class="flex items-center justify-between gap-2">'
        + (starredDate
          ? '<p data-starred-date class="min-w-0 text-xs text-zinc-500 dark:text-zinc-400">Starred ' + esc(starredDate) + '</p>'
          : '<span></span>')
        + starToggleButton(r.sessionId, true, !!state.starPending['star:' + r.sessionId])
        + '</div>'
        + '</article>';
    }

    // One Saved row: the app name, the proposal title, the row's current
    // status pill (from the inbox data when it holds the proposal, so a
    // merged save shows Merged) and the date it was saved. The bookmark
    // button is pressed here; tapping it unsaves and drops the row at once.
    function savedRow(r) {
      var statusPill = '';
      var key = null;
      // The server supplies a status when it has one (demo rows); otherwise
      // fall back to the loaded inbox data (no extra platform calls).
      if (r.status) {
        key = r.status === 'proposed' ? 'voting' : (r.status || 'voting');
      } else if (state.inbox && state.inbox.proposals) {
        for (var i = 0; i < state.inbox.proposals.length; i++) {
          if (state.inbox.proposals[i].sessionId === r.sessionId) {
            key = state.inbox.proposals[i].status === 'proposed'
              ? 'voting' : (state.inbox.proposals[i].status || 'voting');
            break;
          }
        }
      }
      if (key) {
        var style = STATUS_STYLE[key] || STATUS_STYLE.closed;
        statusPill = '<span class="whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-semibold '
          + style[1] + '">' + style[0] + '</span>';
      }
      var savedDate = '';
      if (r.savedAt && isFinite(new Date(r.savedAt).getTime())) {
        savedDate = new Date(r.savedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }
      return '<article data-saved-row data-session-id="' + esc(r.sessionId) + '"'
        + ' class="' + CARD_CLASS + '">'
        + '<div class="flex items-start justify-between gap-2">'
        + '<span class="flex min-w-0 items-center gap-1.5">'
        + appAvatar({ appSlug: r.appSlug, appName: r.appName, icon: r.icon })
        + '<span class="truncate text-xs font-medium text-zinc-500 dark:text-zinc-400">' + esc(r.appName || r.appSlug) + '</span>'
        + '</span>'
        + statusPill
        + '</div>'
        + '<h2 class="line-clamp-2 text-sm font-semibold leading-snug text-zinc-900 dark:text-zinc-100">' + esc(r.title) + '</h2>'
        + '<div class="flex items-center justify-between gap-2">'
        + (savedDate
          ? '<p data-saved-date class="min-w-0 text-xs text-zinc-500 dark:text-zinc-400">Saved ' + esc(savedDate) + '</p>'
          : '<span></span>')
        + bookmarkToggleButton(r.sessionId, true,
          !!state.savedPending['bookmark:' + r.sessionId])
        + '</div>'
        + '</article>';
    }

    function skeletonCard() {
      return '<div class="animate-pulse rounded-2xl border border-zinc-200 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900/70">'
        + '<div class="flex items-center justify-between gap-2">'
        + '<div class="h-6 w-28 rounded-md bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<div class="h-5 w-20 rounded-full bg-zinc-200 dark:bg-zinc-800"></div>'
        + '</div>'
        + '<div class="mt-3 h-3 w-full rounded bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<div class="mt-2 h-3 w-2/3 rounded bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<div class="mt-4 flex items-center gap-2">'
        + '<div class="h-1.5 w-full rounded-full bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<div class="h-3 w-16 rounded bg-zinc-200 dark:bg-zinc-800"></div>'
        + '</div>'
        + '<div class="mt-4 h-10 w-full rounded-xl bg-zinc-200 dark:bg-zinc-800"></div>'
        + '</div>';
    }

    function skeletons() {
      return skeletonCard() + skeletonCard() + skeletonCard();
    }

    function emptyHtml(title, body, cta) {
      return '<div class="flex flex-col items-center gap-2 rounded-2xl border border-dashed border-zinc-300 bg-white/60 px-6 py-10 text-center dark:border-zinc-700 dark:bg-zinc-900/40">'
        + '<svg viewBox="0 0 24 24" class="h-10 w-10 text-zinc-300 dark:text-zinc-600" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>'
        + '<p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">' + title + '</p>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + body + '</p>'
        + cta
        + '</div>';
    }

    var CLEAR_FILTER_CTA = '<button data-action="clear-filter" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show all apps</button>';
    var CLEAR_ONE_AWAY_CTA = '<button data-action="clear-one-away" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show all proposals</button>';
    var CLEAR_TAG_CTA = '<button data-action="clear-tag" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show all tags</button>';
    var SHOW_VOTED_CTA = '<button data-action="show-voted" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show voted proposals</button>';
    var SHOW_MERGED_CTA = '<button data-action="show-merged" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show merged proposals</button>';
    var SHOW_READ_CTA = '<button data-action="show-read" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show read proposals</button>';
    var CLEAR_SEARCH_CTA = '<button data-action="clear-search" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Clear search</button>';
    var SHOW_SNOOZED_CTA = '<button data-action="show-snoozed" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">See snoozed</button>';
    var BACK_TO_INBOX_CTA = '<button data-action="clear-snooze-view" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Back to the inbox</button>';
    var BROWSE_CTA = '<button data-action="go-inbox" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Browse the Inbox</button>';
    var BROWSE_APPS_CTA = '<button data-action="browse-apps" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Browse apps</button>';
    var EMPTY_SECONDARY_BTN = 'rounded-full border border-zinc-300 bg-white px-4 py-1.5 text-xs font-semibold text-zinc-600 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300';

    // ------------------------------------------------------------------
    // The genuinely empty inbox: a way in rather than a dead end. Besides
    // Browse apps it offers the finished proposals (My Votes, where the
    // outcomes live), in-app alerts for new proposals, and an estimate of
    // when the next one is likely, from the server's nextEstimate (recent
    // arrival times; see estimateNextProposal in server.js).
    // ------------------------------------------------------------------

    // "about 2 days" / "about 5 hours" / "under an hour".
    function aboutDuration(ms) {
      var H = 3600 * 1000;
      if (ms < H) return 'under an hour';
      if (ms < 36 * H) {
        var h = Math.round(ms / H);
        return 'about ' + h + (h === 1 ? ' hour' : ' hours');
      }
      var d = Math.round(ms / (24 * H));
      return 'about ' + d + (d === 1 ? ' day' : ' days');
    }

    function nextEstimateHtml() {
      var est = state.inbox && state.inbox.nextEstimate;
      if (!est) return '';
      var line;
      var sub = '';
      var kind;
      if (!est.known) {
        kind = 'unknown';
        line = 'Not enough recent proposals to estimate when the next one arrives.';
      } else {
        var left = Date.parse(est.nextAt) - Date.now();
        kind = left > 0 ? 'soon' : 'due';
        line = left > 0
          ? 'Next proposal likely in ' + aboutDuration(left)
          : 'Next proposal could arrive any time now';
        sub = 'Lately a new one has arrived every ' + aboutDuration(est.avgGapMs).replace(/^about /, '') + ' or so.';
      }
      return '<div data-next-estimate="' + kind + '" class="mt-1 flex flex-col items-center gap-0.5 text-xs text-zinc-500 dark:text-zinc-400">'
        + '<span class="inline-flex items-center gap-1.5 font-semibold text-zinc-700 dark:text-zinc-200">'
        + '<svg viewBox="0 0 24 24" class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'
        + esc(line) + '</span>'
        + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>';
    }

    function alertsControlHtml() {
      if (state.alertsOn) {
        return '<span data-alerts-state="on" class="inline-flex items-center gap-1.5 text-xs text-zinc-600 dark:text-zinc-300">'
          + '<span class="font-semibold text-violet-600 dark:text-violet-400">Alerts on</span>'
          + '<button data-action="toggle-alerts" class="rounded-full px-2 py-1 text-xs font-semibold text-zinc-500 underline active:scale-95 dark:text-zinc-400">Turn off</button>'
          + '</span>';
      }
      return '<button data-action="toggle-alerts" data-alerts-state="off" class="' + EMPTY_SECONDARY_BTN + '">Turn on new proposal alerts</button>';
    }

    function emptyInboxHtml() {
      var extra = nextEstimateHtml()
        + BROWSE_APPS_CTA
        + '<div class="mt-1 flex flex-wrap items-center justify-center gap-2">'
        + '<button data-action="see-finished" class="' + EMPTY_SECONDARY_BTN + '">See finished proposals</button>'
        + alertsControlHtml()
        + '</div>'
        + (state.alertsOn
          ? '<p data-alerts-note class="text-xs text-zinc-500 dark:text-zinc-400">You will get a heads-up here when a new proposal arrives while Vote Inbox is open.</p>'
          : '');
      return emptyHtml(
        'Nothing to vote on yet',
        'No open proposals right now. New ones show up here as apps propose changes.',
        extra);
    }

    // ------------------------------------------------------------------
    // New proposal alerts. Homeroom gives apps no push notifications, so
    // these are in-app: while the switch is on and Vote Inbox is open and
    // visible, the inbox re-checks every ALERTS_POLL_MS and a toast names
    // any proposal it has not seen before. The choice persists in
    // localStorage like the hide toggles.
    // ------------------------------------------------------------------

    var ALERTS_KEY = 'vote-inbox:new-alerts';
    var ALERTS_POLL_MS = 2 * 60 * 1000;

    function loadAlertsOn() {
      try { return localStorage.getItem(ALERTS_KEY) === '1'; } catch (e) { return false; }
    }

    function saveAlertsOn(on) {
      try { localStorage.setItem(ALERTS_KEY, on ? '1' : '0'); } catch (e) { /* not persistable here */ }
    }

    state.alertsOn = loadAlertsOn();
    // Session ids the inbox has already shown, so a poll can tell what is new.
    var alertsKnownIds = null;
    var alertsPolling = false;
    var alertsHidden = false;
    var alertsTimer = null;

    function rememberInboxIds() {
      var list = (state.inbox && state.inbox.proposals) || [];
      alertsKnownIds = {};
      for (var i = 0; i < list.length; i++) alertsKnownIds[list[i].sessionId] = true;
    }

    // Runs after a poll's load: toast the proposals that were not in the
    // previous load. Merged or closed ones are not news.
    function announceNewProposals() {
      var list = (state.inbox && state.inbox.proposals) || [];
      var fresh = [];
      if (alertsKnownIds) {
        for (var i = 0; i < list.length; i++) {
          var p = list[i];
          if (alertsKnownIds[p.sessionId] || p.status === 'merged' || p.status === 'closed') continue;
          fresh.push(p);
        }
      }
      rememberInboxIds();
      if (!fresh.length) return;
      document.body.setAttribute('data-alerts-new', String(fresh.length));
      var msg = fresh.length === 1
        ? 'New proposal: ' + fresh[0].title
        : fresh.length + ' new proposals to vote on';
      toast(msg, {
        action: {
          label: 'View',
          handler: function () {
            state.tab = 'inbox';
            render();
            window.scrollTo(0, 0);
          },
        },
      });
    }

    function pollForNewProposals() {
      if (!state.alertsOn || alertsHidden || document.hidden) return;
      if (state.loadingInbox) return;
      if (!alertsKnownIds) rememberInboxIds();
      alertsPolling = true;
      loadInbox(false);
    }

    function syncAlertsTimer() {
      if (state.alertsOn && !alertsTimer) {
        alertsTimer = setInterval(pollForNewProposals, ALERTS_POLL_MS);
      } else if (!state.alertsOn && alertsTimer) {
        clearInterval(alertsTimer);
        alertsTimer = null;
      }
    }

    function setAlertsOn(on) {
      state.alertsOn = on;
      saveAlertsOn(on);
      if (on) rememberInboxIds();
      syncAlertsTimer();
      render();
      toast(on ? 'Alerts on' : 'Alerts off');
    }

    syncAlertsTimer();

    // Hidden by the shell (another app in front) or a background tab: no
    // polling until the app is visible again.
    window.addEventListener('usernode:visibility-changed', function (e) {
      alertsHidden = !!(e && e.detail && e.detail.hidden);
    });

    // See finished proposals: My Votes, where proposals end up with their
    // outcome (merged or closed). The plain tab, no filter.
    function seeFinishedProposals() {
      state.tab = 'votes';
      state.votesMergedWeek = false;
      state.compareView = false;
      render();
      window.scrollTo(0, 0);
      loadVotes(!state.votes);
    }

    // Empty-inbox demo hooks (staging + ?demo=1 only, through the real
    // buttons): ?tap-finished=1 taps See finished proposals;
    // ?tap-alerts=1 clears the stored choice then taps the alerts button;
    // ?alerts-arrive=1 (with ?tap-alerts=1) then runs one alerts poll whose
    // fetch drops ?empty=1, so the full fixture "arrives" and the new
    // proposal toast is observable (body[data-alerts-new]).
    var TAP_FINISHED = DEMO && params.get('tap-finished') === '1';
    var TAP_ALERTS = DEMO && params.get('tap-alerts') === '1';
    var ALERTS_ARRIVE = DEMO && params.get('alerts-arrive') === '1';
    var alertsArrived = false;
    function maybeEmptyInboxHooks() {
      if (!DEMO || state.errorInbox || !state.inbox) return;
      if (TAP_FINISHED) {
        TAP_FINISHED = false;
        var fin = document.querySelector('[data-action="see-finished"]');
        if (fin) fin.click();
        return;
      }
      if (TAP_ALERTS) {
        TAP_ALERTS = false;
        state.alertsOn = false;
        saveAlertsOn(false);
        render();
        var btn = document.querySelector('[data-action="toggle-alerts"]');
        if (btn) btn.click();
        if (ALERTS_ARRIVE) {
          ALERTS_ARRIVE = false;
          alertsArrived = true;
          pollForNewProposals();
        }
      }
    }

    // ------------------------------------------------------------------
    // Onboarding tour: a three-step intro for first-time visitors, rendered
    // as a panel above the inbox cards (never an overlay, so the first
    // card's vote buttons stay tappable the whole time). Next advances,
    // Skip dismisses at any step, and both mark the tour done in
    // localStorage so it never shows again on a later visit. The header
    // menu's "Show the tour" item brings it back on demand.
    // ------------------------------------------------------------------

    var TOUR_KEY = 'vote-inbox:tour-done';

    var TOUR_STEPS = [
      {
        title: 'What a proposal is',
        body: 'Each card is a change an app wants to make, up for a group vote. The counts show how the vote is trending.',
      },
      {
        title: 'How to vote',
        body: 'Tap Yes or No on a card to cast your vote. The card updates as the counts come in.',
      },
      {
        title: 'Where your votes live',
        body: 'Every vote you cast is kept under the My Votes tab, with each proposal’s outcome.',
      },
    ];

    function tourDone() {
      try {
        return localStorage.getItem(TOUR_KEY) === '1';
      } catch (e) {
        return false;
      }
    }

    function markTourDone() {
      try {
        localStorage.setItem(TOUR_KEY, '1');
      } catch (e) { /* storage unavailable; the tour just reappears */ }
    }

    // The tour shows on the inbox when it has not been finished or skipped.
    // ?tour=1 (demo only) forces it up even when the flag is set, so checks
    // can reach every step from a stable URL.
    function tourVisible() {
      if (state.tourOpen) return true;
      // Closed this load (skipped or finished) stays closed, forced URL or
      // not: the skip-any-step check observes the dismissal on ?tour=1.
      if (state.tourClosed) return false;
      if (TOUR_FORCE) return true;
      return !tourDone();
    }

    function tourHtml() {
      var step = TOUR_STEPS[state.tourStep] || TOUR_STEPS[0];
      var last = state.tourStep === TOUR_STEPS.length - 1;
      return '<div data-tour class="rounded-2xl border border-violet-200 bg-violet-50 px-4 py-3 dark:border-violet-500/40 dark:bg-violet-500/10">'
        + '<p class="text-xs font-semibold text-violet-700 dark:text-violet-300">'
        + (state.tourStep + 1) + ' of ' + TOUR_STEPS.length + '</p>'
        + '<p class="mt-0.5 text-sm font-semibold text-zinc-800 dark:text-zinc-100">' + esc(step.title) + '</p>'
        + '<p class="mt-1 text-xs text-zinc-600 dark:text-zinc-300">' + esc(step.body) + '</p>'
        + '<div class="mt-3 flex items-center gap-2">'
        + '<button data-action="tour-next" class="rounded-full bg-violet-600 px-4 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">'
        + (last ? 'Done' : 'Next') + '</button>'
        + '<button data-action="tour-skip" class="rounded-full px-3 py-1.5 text-xs font-semibold text-zinc-500 hover:text-zinc-700 dark:text-zinc-400 dark:hover:text-zinc-200">Skip tour</button>'
        + '</div>'
        + '</div>';
    }

    function tourNext() {
      if (state.tourStep < TOUR_STEPS.length - 1) {
        state.tourStep++;
        render();
        return;
      }
      markTourDone();
      state.tourOpen = false;
      state.tourClosed = true;
      render();
    }

    function tourSkip() {
      markTourDone();
      state.tourOpen = false;
      state.tourClosed = true;
      render();
    }

    // Reopen from the header menu: restart at step 1 on the inbox tab. The
    // done flag stays set, so skipping or finishing the replay does not
    // change anything for later visits.
    function reopenTour() {
      state.tourOpen = true;
      state.tourStep = 0;
      if (state.membersView) closeMembers();
      if (state.tab !== 'inbox') {
        state.tab = 'inbox';
        var url = new URL(location.href);
        url.searchParams.set('tab', 'inbox');
        history.replaceState(null, '', url.pathname + url.search + url.hash);
      }
      render();
      window.scrollTo(0, 0);
    }

    // The header's overflow menu: the Density control (Comfortable and
    // Compact, each with a small preview of the card spacing it gives) and
    // "Show the tour". The hosted kit renders it as an anchored popover
    // with custom content, with a small fallback panel when the kit is
    // unavailable (standalone). Both paths render the same rows.
    function densityPreviewHtml(kind) {
      // A tiny card mock: Comfortable shows roomy padding and a clear gap
      // between the two lines, Compact shows both tightened. Pure
      // decoration; the row's label carries the meaning for screen readers.
      if (kind === 'compact') {
        return '<span data-density-preview="compact" aria-hidden="true" class="flex shrink-0 flex-col gap-0.5 rounded-md border border-zinc-300 bg-white p-1 dark:border-zinc-600 dark:bg-zinc-800">'
          + '<span class="h-0.5 w-10 rounded bg-zinc-400 dark:bg-zinc-500"></span>'
          + '<span class="h-0.5 w-6 rounded bg-zinc-300 dark:bg-zinc-600"></span>'
          + '</span>';
      }
      return '<span data-density-preview="comfortable" aria-hidden="true" class="flex shrink-0 flex-col gap-1 rounded-md border border-zinc-300 bg-white p-1.5 dark:border-zinc-600 dark:bg-zinc-800">'
        + '<span class="h-0.5 w-10 rounded bg-zinc-400 dark:bg-zinc-500"></span>'
        + '<span class="h-0.5 w-6 rounded bg-zinc-300 dark:bg-zinc-600"></span>'
        + '</span>';
    }

    function densityOptionHtml(kind) {
      var label = kind === 'compact' ? 'Compact' : 'Comfortable';
      var active = (state.density === 'compact') === (kind === 'compact');
      return '<button type="button" data-density-option="' + kind + '"'
        + ' aria-pressed="' + (active ? 'true' : 'false') + '"'
        + ' class="flex w-full items-center gap-2.5 rounded-lg px-2 py-2 text-left hover:bg-zinc-100 dark:hover:bg-zinc-800">'
        + densityPreviewHtml(kind)
        + '<span class="min-w-0 flex-1">'
        + '<span class="block text-sm font-medium ' + (active ? 'text-violet-600 dark:text-violet-400' : 'text-zinc-700 dark:text-zinc-200') + '">' + label + '</span>'
        + (active ? '<span class="block text-xs text-zinc-500 dark:text-zinc-400">Current</span>' : '')
        + '</span>'
        + (active
          ? '<svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 text-violet-600 dark:text-violet-400" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>'
          : '')
        + '</button>';
    }

    function headerMenuHtml() {
      return '<div data-density-menu class="w-56 rounded-xl p-1">'
        + '<p class="px-2 pb-0.5 pt-1.5 text-xs font-semibold text-zinc-500 dark:text-zinc-400">Density</p>'
        + densityOptionHtml('comfortable')
        + densityOptionHtml('compact')
        + '</div>'
        + '<div class="my-1 h-px bg-zinc-200 dark:bg-zinc-800"></div>'
        + '<button data-menu-item="tour" class="flex w-full items-center rounded-lg px-3 py-2 text-left text-sm font-medium text-zinc-700 hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">Show the tour</button>';
    }

    // Dismisses the open header menu, whichever path opened it. Set while
    // the menu is open, cleared on close.
    var closeHeaderMenu = null;

    function closeHeaderMenuPanel() {
      var panel = document.getElementById('menu-panel');
      if (panel) panel.hidden = true;
      var btn = document.getElementById('menu-btn');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }

    function openHeaderMenu() {
      var btn = document.getElementById('menu-btn');
      if (!btn) return;
      if (window.unNative && unNative.popover) {
        try {
          var content = document.createElement('div');
          content.innerHTML = headerMenuHtml();
          content.addEventListener('click', function (event) {
            var opt = event.target.closest ? event.target.closest('[data-density-option]') : null;
            if (opt) {
              setDensity(opt.getAttribute('data-density-option') === 'compact' ? 'compact' : 'comfortable');
              if (closeHeaderMenu) closeHeaderMenu();
              return;
            }
            var item = event.target.closest ? event.target.closest('[data-menu-item]') : null;
            if (item && item.getAttribute('data-menu-item') === 'tour') {
              if (closeHeaderMenu) closeHeaderMenu();
              reopenTour();
            }
          });
          var handle = unNative.popover({
            anchorEl: btn,
            contentEl: content,
            placement: 'bottom-end',
            onDismiss: function () { closeHeaderMenu = null; btn.setAttribute('aria-expanded', 'false'); },
          });
          closeHeaderMenu = function () {
            closeHeaderMenu = null;
            try { handle.dismiss(); } catch (e) { /* already gone */ }
            btn.setAttribute('aria-expanded', 'false');
          };
          btn.setAttribute('aria-expanded', 'true');
          return;
        } catch (e) { /* fall through to the plain panel */ }
      }
      var panel = document.getElementById('menu-panel');
      if (!panel) return;
      var showing = !panel.hidden;
      panel.hidden = true;
      if (showing) return;
      var rect = btn.getBoundingClientRect();
      panel.style.top = (rect.bottom + 6) + 'px';
      panel.style.right = (window.innerWidth - rect.right) + 'px';
      panel.innerHTML = headerMenuHtml();
      panel.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
    }

    var SHOW_ALL_VOTES_CTA = '<button data-action="show-all-votes" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Show all votes</button>';

    function errorHtml(message) {
      return '<div class="flex flex-col items-center gap-2 rounded-2xl border border-red-500/30 bg-red-500/5 px-6 py-10 text-center">'
        + '<svg viewBox="0 0 24 24" class="h-10 w-10 text-red-400" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>'
        + '<p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">Something went wrong</p>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + esc(message) + '</p>'
        + '<button data-action="refresh" class="mt-2 rounded-full bg-violet-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-violet-500 transition-transform active:scale-95">Try again</button>'
        + '</div>';
    }

    // ------------------------------------------------------------------
    // New proposal screen: template picker, prefilled (and fully
    // editable) title and description, Send, and the Sent list.
    //
    // A template only FILLS the two fields: the prefill lands in ordinary
    // inputs the user edits freely before sending, and what is sent is
    // whatever the fields hold at that moment. Picking another template
    // refills both fields, so switching is an undoable-by-typing choice,
    // not a merge.
    // ------------------------------------------------------------------

    var TEMPLATES = [
      { id: 'bugfix', label: 'Bugfix',
        title: 'Fix: [what is broken]',
        body: 'Problem\n[What is broken and where it shows up.]\n\nSteps to reproduce\n1. [First step]\n2. [Second step]\n\nExpected\n[What should happen instead.]\n\nFix\n[What you propose changing.]' },
      { id: 'feature', label: 'Feature',
        title: 'Add [feature name]',
        body: 'What\n[The feature in one sentence.]\n\nWhy\n[The problem it solves or the value it adds.]\n\nHow it works\n[What a person sees, step by step.]\n\nScope\n[What is included, and what is left out.]' },
      { id: 'copy', label: 'Copy change',
        title: 'Copy change: [where]',
        body: 'Where\n[The screen or text that changes.]\n\nCurrent text\n[What it says today.]\n\nNew text\n[What it should say.]\n\nReason\n[Why the new wording is better.]' },
      { id: 'blank', label: 'Blank', title: '', body: '' },
    ];

    // Whole-literal class strings for the Tailwind compiler. The back
    // button mirrors the header's circular icon buttons; the fields mirror
    // the inbox search box's look.
    var COMPOSE_BACK_CLASS = 'flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-zinc-300 bg-white text-zinc-500 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-400';
    var COMPOSE_CHIP_ACTIVE = 'rounded-full bg-violet-600 px-3.5 py-1.5 text-sm font-semibold text-white shadow-sm transition-transform active:scale-95';
    var COMPOSE_CHIP_IDLE = 'rounded-full border border-zinc-300 bg-white px-3.5 py-1.5 text-sm font-semibold text-zinc-700 transition-transform active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200';
    var COMPOSE_FIELD = 'w-full rounded-xl border border-zinc-300 bg-white py-2.5 pl-3 pr-3 text-sm text-zinc-900 placeholder:text-zinc-400 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/40 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder:text-zinc-500';
    var SEND_PILL_CLASS = 'shrink-0 rounded-full bg-violet-600 px-4 py-1.5 text-sm font-semibold text-white shadow-sm transition-transform active:scale-95 disabled:opacity-50';
    var SENT_ROW_CLASS = 'rounded-xl border border-zinc-200 bg-white p-3 dark:border-zinc-800 dark:bg-zinc-900/70';

    function templateLabel(id) {
      for (var i = 0; i < TEMPLATES.length; i++) {
        if (TEMPLATES[i].id === id) return TEMPLATES[i].label;
      }
      return 'Blank';
    }

    function composeChipsHtml() {
      var html = '';
      for (var i = 0; i < TEMPLATES.length; i++) {
        var t = TEMPLATES[i];
        var on = state.compose.template === t.id;
        html += '<button type="button" data-template-option data-template-id="' + t.id + '"'
          + ' aria-pressed="' + (on ? 'true' : 'false') + '"'
          + ' class="' + (on ? COMPOSE_CHIP_ACTIVE : COMPOSE_CHIP_IDLE) + '">'
          + esc(t.label) + '</button>';
      }
      return '<div class="flex flex-wrap gap-2">' + html + '</div>';
    }

    // The compose form: template chips on top, then the two fields the
    // prefill lands in. The title's current value is mirrored onto the
    // value attribute (kept in step by the input handler) so the staging
    // checks, which read markup rather than input properties, can assert
    // on an edit; the description's state is visible in its character
    // counter the same way.
    function composeFormHtml() {
      var c = state.compose;
      return '<section class="flex flex-col gap-2">'
        + '<p class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Start from a template</p>'
        + composeChipsHtml()
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">A template fills the title and description. Everything stays editable before you send.</p>'
        + '</section>'
        + '<section class="flex flex-col gap-1.5">'
        + '<label for="compose-title" class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Title</label>'
        + '<input id="compose-title" data-compose-title type="text" autocomplete="off"'
        + ' value="' + esc(c.title) + '" class="' + COMPOSE_FIELD + '">'
        + '</section>'
        + '<section class="flex flex-col gap-1.5">'
        + '<label for="compose-body" class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Description</label>'
        + '<textarea id="compose-body" data-compose-body rows="10" class="' + COMPOSE_FIELD + ' resize-y">' + esc(c.body) + '</textarea>'
        + '<p data-compose-count class="text-xs tabular-nums text-zinc-400 dark:text-zinc-500">' + c.body.length + ' characters</p>'
        + '</section>'
        + (c.error
          ? '<p data-compose-error class="rounded-xl border border-red-500/30 bg-red-500/5 px-3 py-2 text-xs font-medium text-red-700 dark:text-red-300">' + esc(c.error) + '</p>'
          : '');
    }

    // The sent state: confirmation block instead of the form, with the sent
    // title echoed. Send records the proposal in this app (see the Sent
    // list note below); the copy says so plainly.
    function composeConfirmationHtml() {
      var c = state.compose;
      return '<div data-send-confirmation class="flex flex-col gap-2 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-4">'
        + '<p class="flex items-center gap-1.5 text-sm font-semibold text-emerald-700 dark:text-emerald-300">'
        + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>'
        + 'Proposal sent</p>'
        + '<p class="text-xs text-zinc-600 dark:text-zinc-300">"' + esc(c.sentTitle) + '" is in your Sent list below.</p>'
        + '<button type="button" data-compose-again class="self-start rounded-full bg-violet-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-transform active:scale-95">Compose another</button>'
        + '</div>';
    }

    function sentListHtml() {
      var c = state.compose;
      if (c.sentError) {
        return '<p class="text-xs text-zinc-500 dark:text-zinc-400">Could not load sent proposals.</p>'
          + '<button type="button" data-action="reload-sent" class="self-start rounded-full border border-zinc-300 bg-white px-3 py-1.5 text-xs font-semibold text-zinc-700 active:scale-95 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200">Try again</button>';
      }
      if (!c.sentLoaded) return '<p class="text-xs text-zinc-400 dark:text-zinc-500">Loading…</p>';
      var rows = c.sent || [];
      if (!rows.length) {
        return '<p data-sent-empty class="text-xs text-zinc-500 dark:text-zinc-400">Nothing sent yet</p>';
      }
      var html = '';
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var when = '';
        if (r.created_at) {
          try { when = new Date(r.created_at).toLocaleDateString(); } catch (e) { when = ''; }
        }
        html += '<article data-sent-row class="' + SENT_ROW_CLASS + '">'
          + '<p class="line-clamp-2 text-sm font-medium text-zinc-900 dark:text-zinc-100">' + esc(r.title) + '</p>'
          + '<p class="text-xs text-zinc-500 dark:text-zinc-400">' + esc(templateLabel(r.template))
          + (when ? ' · ' + esc(when) : '') + '</p>'
          + '</article>';
      }
      return html;
    }

    function composeHtml() {
      var c = state.compose;
      var sent = c.sentTitle != null;
      var canSend = !!c.title.trim() && !!c.body.trim() && !c.sending && !sent;
      // Back and Send share the top row, iOS-compose style: the primary
      // action stays visible above the keyboard while the description is
      // being typed.
      return '<div data-compose-screen class="flex flex-col gap-4 pt-1">'
        + '<div class="flex items-center justify-between gap-2">'
        + '<div class="flex min-w-0 items-center gap-2">'
        + '<button type="button" data-compose-back aria-label="Back to the list"'
        + ' class="' + COMPOSE_BACK_CLASS + '">'
        + '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>'
        + '</button>'
        + '<h2 class="truncate text-lg font-bold tracking-tight">New proposal</h2>'
        + '</div>'
        + (sent ? '' : '<button type="button" data-send-proposal class="' + SEND_PILL_CLASS + '"'
          + (canSend ? '' : ' disabled') + '>Send</button>')
        + '</div>'
        + (sent ? composeConfirmationHtml() : composeFormHtml())
        + '<section class="flex flex-col gap-2 pt-2">'
        + '<h3 class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Sent</h3>'
        + '<p class="text-xs text-zinc-500 dark:text-zinc-400">Kept in this app. Paste a proposal into the app&#39;s dev chat to open it for a vote.</p>'
        + '<div id="sent-list" class="flex flex-col gap-2">' + sentListHtml() + '</div>'
        + '</section>'
        + '</div>';
    }

    function renderTabs() {
      var buttons = document.querySelectorAll('.tab-btn');
      var inboxCount = state.inbox && state.inbox.proposals ? state.inbox.proposals.length : null;
      var votesCount = state.votes && state.votes.votes ? state.votes.votes.length : null;
      var watchlistCount = state.watchlist && state.watchlist.rows ? state.watchlist.rows.length : null;
      var followingCount = followingNeededCount();
      var savedCount = state.saved && state.saved.rows ? state.saved.rows.length : null;
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        var tab = btn.getAttribute('data-tab');
        var active = tab === state.tab;
        var badge = btn.querySelector('.tab-badge');
        var count = tab === 'inbox' ? inboxCount
          : tab === 'saved' ? savedCount
          : tab === 'watchlist' ? watchlistCount
          : tab === 'following' ? followingCount
          : tab === 'votes' ? votesCount : null;
        btn.className = 'tab-btn flex-1 rounded-full py-1.5 text-sm font-semibold transition-colors '
          + (active ? TAB_ACTIVE : TAB_IDLE);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
        if (badge) {
          badge.className = 'tab-badge ml-1.5 hidden rounded-full px-1.5 py-0.5 text-xs font-bold '
            + (active ? BADGE_ACTIVE : BADGE_IDLE);
          if (tab !== 'votes' && count != null && count > 0) {
            badge.textContent = count;
            badge.classList.remove('hidden');
          }
        }
        // The My Votes tab shows its count in the title, "My Votes (N)",
        // instead of a pill badge, so the number appears only once.
        if (tab === 'votes') {
          var tabCount = btn.querySelector('[data-tab-count]');
          if (tabCount) {
            tabCount.textContent = count != null ? ' (' + count + ')' : '';
            tabCount.setAttribute('data-tab-count', count != null ? String(count) : '');
          }
        }
      }
      // The inbox list's filter/search/sort controls belong to the list;
      // hide them while a proposal detail is open.
      var inDetail = state.tab === 'inbox'
        && !!(state.detail && findProposal(state.detail));
      // The Members directory replaces the tab's own list and controls.
      var inMembers = !!state.membersView;
      document.getElementById('filter-row').className =
        'mt-2' + (state.tab === 'inbox' && !state.compareView && !inDetail && !inMembers ? '' : ' hidden');
      document.getElementById('search-row').className =
        'mt-2' + (state.tab === 'inbox' && !state.compareView && !inDetail && !inMembers ? '' : ' hidden');
      // The saved searches bar sits under the search box and shows exactly
      // where it does.
      var savedSearchesRow = document.getElementById('saved-searches-row');
      if (savedSearchesRow) {
        var showSearches = state.tab === 'inbox' && !state.compareView && !inDetail && !inMembers;
        savedSearchesRow.className = 'mt-2 flex items-center gap-2' + (showSearches ? '' : ' hidden');
        savedSearchesRow.setAttribute('data-hidden', showSearches ? '0' : '1');
      }
      var membersRow = document.getElementById('members-row');
      if (membersRow) membersRow.className = 'mt-2' + (inMembers ? '' : ' hidden');
      var sortRow = document.getElementById('sort-row');
      if (sortRow) sortRow.className =
        'flex items-center gap-2 pt-1' + (state.tab === 'inbox' && !state.compareView && !inDetail && !inMembers ? '' : ' hidden');
      var votesOrderRow = document.getElementById('votes-order-row');
      if (votesOrderRow) votesOrderRow.className =
        'flex items-center gap-2 pt-1' + (state.tab === 'votes' && !inMembers ? '' : ' hidden');
      var lbRangeRow = document.getElementById('lb-range-row');
      if (lbRangeRow) lbRangeRow.className =
        'flex items-center gap-2 pt-1' + (state.tab === 'leaderboard' && !inMembers ? '' : ' hidden');
      var viewsRow = document.getElementById('views-row');
      if (viewsRow) {
        var showViews = state.tab === 'inbox' && !inMembers;
        viewsRow.className = 'mt-2 flex items-center gap-2' + (showViews ? '' : ' hidden');
        viewsRow.setAttribute('data-hidden', showViews ? '0' : '1');
      }
    }

    // The segmented sort pill: keep each option's fill and aria-checked in
    // step with state.sort. Same active treatment as the section tabs.
    function renderSort() {
      var buttons = document.querySelectorAll('#sort-row [data-sort]');
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        var on = btn.getAttribute('data-sort') === state.sort;
        btn.className = 'rounded-full px-3 py-1 text-xs font-semibold transition-colors '

        btn.setAttribute('aria-checked', on ? 'true' : 'false');
      }

    // My Votes order pill: same treatment as the Inbox sort pill, driven

    // Leaderboard range pill: same treatment, driven by state.lbRange.
    function renderLbRange() {

        var btn = buttons[i];

    function renderRefreshButton() {
      var busy = state.loadingInbox || state.loadingVotes || state.loadingSaved;

      if (icon) icon.classList.toggle('animate-spin', busy);
